                                <p className="text-[10px] text-slate-400 uppercase tracking-wide mb-1">Cost per Hour (₹)</p>
                                <div className="relative">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400">₹</span>
                                    <input type="number" min="0" step="10" placeholder="Not set"
                                        value={costDrafts[driverDetail.id] !== undefined ? costDrafts[driverDetail.id] : (driverDetail.costPerHour ?? '')}
                                        onChange={e => setCostDrafts(d => ({ ...d, [driverDetail.id]: e.target.value }))}
                                        onBlur={() => requestCostChange(driverDetail)}
                                        onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                                        className="w-full pl-6 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                                </div>
                            </div>
                        </div>

                        <div>
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Documents</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                <DocRow label="Driver's License" accept=".pdf,image/*" fileName={driverDetail.licenseFile}
                                    onSelect={name => updateDriverDoc(driverDetail.id, 'licenseFile', name)}
                                    onRemove={() => updateDriverDoc(driverDetail.id, 'licenseFile', null)} />
                                <DocRow label="Driver Photo" accept="image/*" fileName={driverDetail.photo}
                                    onSelect={name => updateDriverDoc(driverDetail.id, 'photo', name)}
                                    onRemove={() => updateDriverDoc(driverDetail.id, 'photo', null)} />
                            </div>
                        </div>

                        <div className="flex justify-between items-center gap-2 pt-4 border-t border-slate-100">
                            <button type="button" onClick={() => setConfirmRemoveDriver(driverDetail)}
                                className="inline-flex items-center gap-1.5 text-sm font-medium text-red-600 hover:text-red-700 hover:underline">
                                <Icon name="trash" size={14} />Remove Driver
                            </button>
                            <Btn variant="outline" onClick={() => setDriverDetailId(null)}>Close</Btn>
                        </div>
                    </div>
                )}
            </Modal>

            <Modal open={!!confirmRemoveDriver} onClose={() => setConfirmRemoveDriver(null)} title="Remove Driver">
                {confirmRemoveDriver && (
                    <div className="space-y-4">
                        <div className="bg-red-50 border border-red-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-red-500 shrink-0 mt-0.5" />
                            <p className="text-sm text-red-800">
                                Remove <strong>{confirmRemoveDriver.name}</strong> ({confirmRemoveDriver.id}) from {confirmRemoveDriver.vendor}?
                                {confirmRemoveDriver.vehicleId ? ' Their assigned vehicle will become unpaired.' : ''} This can't be undone.
                            </p>
                        </div>
                        <div className="flex gap-2">
                            <Btn variant="danger" onClick={removeDriver}>Remove Driver</Btn>
                            <Btn variant="outline" onClick={() => setConfirmRemoveDriver(null)}>Cancel</Btn>
                        </div>
                    </div>
                )}
            </Modal>

            {/* Vehicle Management detail modal - the vehicle-side mirror of Driver Management's:
                full profile, the same pairing control the Fleet Assets table offers (kept in sync via
                the same shared pendingPairing state), documents, and removal. */}
            <Modal open={!!vehicleDetail} onClose={() => setVehicleDetailId(null)} title="Vehicle Management">
                {vehicleDetail && (
                    <div className="space-y-5">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-full bg-blue-50 text-brandAccent flex items-center justify-center shrink-0 ring-1 ring-black/5">
                                <Icon name="fleet" size={20} />
                            </div>
                            <div className="flex-1 min-w-0">
                                <p className="font-semibold text-slate-800 truncate">{vehicleModelLabel(vehicleDetail)}</p>
                                <p className="text-xs text-slate-400 truncate">{vehicleDetail.id} · {vehicleDetail.vendorName}</p>
                            </div>
                            <Badge status={vehicleDetail.status} />
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                            <div>
                                <p className="text-[10px] text-slate-400 uppercase tracking-wide">Registration No.</p>
                                <p className="text-sm text-slate-700 font-mono">{vehicleDetail.regNo || '—'}</p>
                            </div>
                            <div>
                                <p className="text-[10px] text-slate-400 uppercase tracking-wide">Capacity</p>
                                <p className="text-sm text-slate-700">{vehicleDetail.capacity} seats</p>
                            </div>
                            <div>
                                <p className="text-[10px] text-slate-400 uppercase tracking-wide">Fuel Type</p>
                                <p className="text-sm text-slate-700">{vehicleFuelProfile(vehicleDetail, data)?.fuelType || '—'}</p>
                            </div>
                        </div>

                        <div>
                            <p className="text-[10px] text-slate-400 uppercase tracking-wide mb-1">Assigned Driver</p>
                            <select className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brandAccent/30"
                                value={driverForVehicle(vehicleDetail.id)?.id || ''}
                                onChange={e => requestPairing(vehicleDetail.id, e.target.value)}>
                                <option value="">Unassigned</option>
                                {data.drivers.filter(dr => dr.vendor === vehicleDetail.vendorName).map(dr => (
                                    <option key={dr.id} value={dr.id}>{dr.name}</option>
                                ))}
                            </select>
                        </div>

                        <div>
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Documents</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                <DocRow label="PUC Certificate" accept=".pdf,image/*" fileName={vehicleDetail.pucFile}
                                    onSelect={name => updateVehicleDoc(vehicleDetail.vendorId, vehicleDetail.id, 'pucFile', name)}
                                    onRemove={() => updateVehicleDoc(vehicleDetail.vendorId, vehicleDetail.id, 'pucFile', null)} />
                                <DocRow label="Insurance Certificate" accept=".pdf,image/*" fileName={vehicleDetail.insuranceFile}
                                    onSelect={name => updateVehicleDoc(vehicleDetail.vendorId, vehicleDetail.id, 'insuranceFile', name)}
                                    onRemove={() => updateVehicleDoc(vehicleDetail.vendorId, vehicleDetail.id, 'insuranceFile', null)} />
                            </div>
                        </div>

                        <div className="flex justify-between items-center gap-2 pt-4 border-t border-slate-100">
                            <button type="button" onClick={() => setConfirmRemoveVehicle(vehicleDetail)}
                                className="inline-flex items-center gap-1.5 text-sm font-medium text-red-600 hover:text-red-700 hover:underline">
                                <Icon name="trash" size={14} />Remove Vehicle
                            </button>
                            <Btn variant="outline" onClick={() => setVehicleDetailId(null)}>Close</Btn>
                        </div>
                    </div>
                )}
            </Modal>

            <Modal open={!!confirmRemoveVehicle} onClose={() => setConfirmRemoveVehicle(null)} title="Remove Vehicle">
                {confirmRemoveVehicle && (
                    <div className="space-y-4">
                        <div className="bg-red-50 border border-red-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-red-500 shrink-0 mt-0.5" />
                            <p className="text-sm text-red-800">
                                Remove <strong>{vehicleModelLabel(confirmRemoveVehicle)} · {confirmRemoveVehicle.id}</strong> from {confirmRemoveVehicle.vendorName}?
                                {driverForVehicle(confirmRemoveVehicle.id) ? ` ${driverForVehicle(confirmRemoveVehicle.id).name} will become unassigned.` : ''} This can't be undone.
                            </p>
                        </div>
                        <div className="flex gap-2">
                            <Btn variant="danger" onClick={removeVendorVehicle}>Remove Vehicle</Btn>
                            <Btn variant="outline" onClick={() => setConfirmRemoveVehicle(null)}>Cancel</Btn>
                        </div>
                    </div>
                )}
            </Modal>

            {/* Auto-Assign's follow-up prompt - drivers Auto-Assign matched to a vehicle but held back
                because they have no Cost/Hour on file yet, same rule the manual pairing confirm above
                enforces one-at-a-time. Anyone left blank here simply stays unassigned. */}
            <Modal open={!!pendingAutoAssignCosts} onClose={cancelAutoAssignCosts} title="Set Driver Cost to Finish Auto-Assign" wide>
                {pendingAutoAssignCosts && (
                    <div className="space-y-4">
                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-blue-600 shrink-0 mt-0.5" />
                            <p className="text-sm text-blue-800">
                                {pendingAutoAssignCosts.items.length} driver{pendingAutoAssignCosts.items.length > 1 ? 's' : ''} matched a vacant vehicle but{' '}
                                {pendingAutoAssignCosts.items.length > 1 ? "don't" : "doesn't"} have a Cost/Hour on file yet.
                                Set one for each to complete their assignment - anyone left blank stays unassigned.
                            </p>
                        </div>
                        <div className="space-y-2">
                            {pendingAutoAssignCosts.items.map(item => (
                                <div key={item.driverId} className="flex items-center gap-3 p-3 border border-slate-200 rounded-lg">
                                    <div className="flex-1 min-w-0">
                                        <p className="text-sm font-medium text-slate-800 truncate">{item.driverName}</p>
                                        <p className="text-xs text-slate-400 truncate">{item.vehicleLabel}</p>
                                    </div>
                                    <div className="relative w-32 shrink-0">
                                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400">₹</span>
                                        <input type="number" min="0" step="10" placeholder="Cost/hr"
                                            value={autoAssignCostDrafts[item.driverId] ?? ''}
                                            onChange={e => setAutoAssignCostDrafts(d => ({ ...d, [item.driverId]: e.target.value }))}
                                            className="w-full pl-6 pr-3 py-1.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-2">
                            <Btn onClick={confirmAutoAssignCosts}>Confirm & Assign</Btn>
                            <Btn variant="outline" onClick={cancelAutoAssignCosts}>Leave Unassigned</Btn>
                        </div>
                    </div>
                )}
            </Modal>
        </div>
    );
};

</script>
<script type="text/babel">
/* global React, Card, Badge, Btn, Modal, Icon, TabBar, VendorCard, vehicleModelLabel, vehicleAllocationStatus, vehicleAllocationContext, vehicleFuelProfile, driverAllocationStatus, avatarGradientFor, initialsOf, INVENTORY_STATUSES, DRIVER_INVENTORY_STATUSES, VEHICLE_STATUS_TILE, DRIVER_STATUS_TILE, VEHICLE_STATUS_ICON, DRIVER_STATUS_ICON */
const { useState, useMemo } = React;

window.InventoryManagementTab = ({ data, setData, setActiveTab }) => {
    // Vendors are the entry point here too, same as Vendors & Fleet - a big card per vendor showing
    // live availability at a glance, click through to that vendor's own Vehicles/Drivers inventory.
    // This tab's own Drivers view is read-only monitoring (live availability) - actually managing
    // drivers (add, remove, documents, cost, pairing, and Auto-Assign Drivers to Vehicles) all live
    // in Vendors & Fleet's Driver Management instead, one vendor at a time. Auto-Assign Vehicles to
    // Trips stays fleet-wide here on the card grid page, since a Draft plan isn't tied to one vendor.
    const [subview, setSubview] = useState('list');
    const [selected, setSelected] = useState(null);
    // Array of { plan, vehicle, driver } from the most recent Auto-Assign Vehicles to Trips run, or
    // null when no summary popup is open - lets the admin see exactly what got paired with what
    // instead of just a bare count.
    const [autoAssignSummary, setAutoAssignSummary] = useState(null);

    // --- Vehicles (scoped to `selected` once inside a vendor's detail page) ---
    const [view, setView] = useState('Vehicles');
    const [search, setSearch] = useState('');
    const [statusFilter, setStatusFilter] = useState('All');

    // Same flatten-with-vendor-context pattern as Vendors & Fleet - vehicles still physically live
    // inside vendor.fleet, this is just the independent cross-vendor view of them.
    const inventory = useMemo(() =>
        data.vendors.flatMap(v => v.fleet.map(f => ({
            ...f, vendorId: v.id, vendorName: v.name,
            allocationStatus: vehicleAllocationStatus(f, data),
        }))),
        [data.vendors, data.assignments, data.travelPlans, data.shuttlePlans]
    );

    const vendorFleet = useMemo(() => selected ? inventory.filter(v => v.vendorId === selected.id) : [], [inventory, selected]);

    const statusCounts = useMemo(() => {
        const counts = { Available: 0, Reserved: 0, 'In Transit': 0, Maintenance: 0 };
        vendorFleet.forEach(v => { counts[v.allocationStatus] = (counts[v.allocationStatus] || 0) + 1; });
        return counts;
    }, [vendorFleet]);

    const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        return vendorFleet.filter(v => {
            const matchesSearch = !q || v.id.toLowerCase().includes(q) || (v.model || '').toLowerCase().includes(q) || (v.regNo || '').toLowerCase().includes(q);
            const matchesStatus = statusFilter === 'All' || v.allocationStatus === statusFilter;
            return matchesSearch && matchesStatus;
        });
    }, [vendorFleet, search, statusFilter]);

    // Fills the "Unassigned" vehicle slot on Draft plans with the smallest Available vehicle that
    // still fits the plan's headcount (so a 40-seat bus isn't burned on a 3-passenger trip when a
    // sedan would do), preferring a vehicle that already has a driver paired over one that doesn't -
    // that's the payoff for running Auto-Assign Drivers to Vehicles first. Sorted so the plans most
    // likely to already have a good fit go first. Never touches plans that already have a vehicle,
    // and never double-books - each vehicle claimed in this pass comes out of the pool before the
    // next plan is considered. Fleet-wide by design - a Draft plan isn't tied to one vendor.
    const autoAssignToTrips = () => {
        const pool = inventory
            .filter(v => v.allocationStatus === 'Available')
            .sort((a, b) => {
                if (a.capacity !== b.capacity) return a.capacity - b.capacity;
                const aHasDriver = data.drivers.some(dr => dr.vehicleId === a.id) ? 0 : 1;
                const bHasDriver = data.drivers.some(dr => dr.vehicleId === b.id) ? 0 : 1;
                return aHasDriver - bHasDriver;
            });
        const claimed = new Set();

        const needingVehicle = data.travelPlans
            .filter(p => p.status === 'Draft' && (!p.vehicle || p.vehicle === 'Unassigned'))
            .sort((a, b) => a.passengers - b.passengers);

        const picks = {}; // planId -> vehicleId
        needingVehicle.forEach(p => {
            const fit = pool.find(v => !claimed.has(v.id) && v.capacity >= p.passengers);
            if (fit) { claimed.add(fit.id); picks[p.id] = fit.id; }
        });

        const count = Object.keys(picks).length;
        if (count === 0) {
            alert('No Draft plans have a matching Available vehicle right now.');
            return;
        }
        setData(d => ({
            ...d,
            travelPlans: d.travelPlans.map(p => picks[p.id] ? { ...p, vehicle: picks[p.id], status: 'Active' } : p),
        }));

        // A bare "assigned N trips" alert doesn't say which vehicle (or driver) actually landed on
        // which trip - resolved from the same pool/needingVehicle snapshot the picks themselves came
        // from, since setData hasn't applied yet by this point anyway.
        const summary = needingVehicle
            .filter(p => picks[p.id])
            .map(p => ({
                plan: p,
                vehicle: inventory.find(v => v.id === picks[p.id]),
                driver: data.drivers.find(dr => dr.vehicleId === picks[p.id]),
            }));
        setAutoAssignSummary(summary);
    };

    // The only field an admin can actually set by hand - Active vs Maintenance. Everything else
    // (Reserved/In Transit/Available) is derived from live bookings and can't be hand-picked; setting
    // Maintenance is really "take this vehicle out of service regardless of what it's booked to",
    // and setting Active is "put it back in service" (its Available/Reserved/In Transit split then
    // falls out of whatever it's actually tied to).
    const commitStatusChange = (vehicle, newStatus) => {
        setData(d => ({
            ...d,
            vendors: d.vendors.map(v => v.id !== vehicle.vendorId ? v : {
                ...v,
                fleet: v.fleet.map(f => f.id === vehicle.id ? { ...f, status: newStatus } : f),
            }),
        }));
    };

    // Pulling a vehicle out of service while it's Reserved or In Transit can strand whatever it's
    // committed to, so that case stages the change behind a confirm instead of applying it straight
    // off the button (same reasoning as the driver<->vehicle reassignment flow in Vendors & Fleet).
    // Returning a vehicle to Active is always safe - it can only free something up, never take it
    // away - so that direction stays instant.
    const [pendingStatusChange, setPendingStatusChange] = useState(null); // { vehicle, newStatus }

    const requestStatusChange = (vehicle, newStatus) => {
        if (newStatus === 'Maintenance' && (vehicle.allocationStatus === 'Reserved' || vehicle.allocationStatus === 'In Transit')) {
            setPendingStatusChange({ vehicle, newStatus });
            return;
        }
        commitStatusChange(vehicle, newStatus);
    };

    const confirmStatusChange = () => {
        if (!pendingStatusChange) return;
        commitStatusChange(pendingStatusChange.vehicle, pendingStatusChange.newStatus);
        setPendingStatusChange(null);
    };

    // --- Drivers (also scoped to `selected`) ---
    const [driverSearch, setDriverSearch] = useState('');
    const [driverStatusFilter, setDriverStatusFilter] = useState('All');

    const driverInventory = useMemo(() =>
        data.drivers.map(dr => ({ ...dr, allocationStatus: driverAllocationStatus(dr) })),
        [data.drivers]
    );

    const vendorDriverInventory = useMemo(() => selected ? driverInventory.filter(dr => dr.vendor === selected.name) : [], [driverInventory, selected]);

    const driverStatusCounts = useMemo(() => {
        const counts = { Available: 0, Booked: 0, Inactive: 0 };
        vendorDriverInventory.forEach(dr => { counts[dr.allocationStatus] = (counts[dr.allocationStatus] || 0) + 1; });
        return counts;
    }, [vendorDriverInventory]);

    // Fleet-wide totals for the info-only glance strip above the vendor cards - the same
    // INVENTORY_STATUSES/DRIVER_INVENTORY_STATUSES buckets each vendor card and vendor detail page
    // already use, just summed across every vendor at once instead of scoped to `selected`.
    const overallVehicleCounts = useMemo(() => {
        const counts = { Available: 0, Reserved: 0, 'In Transit': 0, Maintenance: 0 };
        inventory.forEach(v => { counts[v.allocationStatus] = (counts[v.allocationStatus] || 0) + 1; });
        return counts;
    }, [inventory]);

    const overallDriverCounts = useMemo(() => {
        const counts = { Available: 0, Booked: 0, Inactive: 0 };
        driverInventory.forEach(dr => { counts[dr.allocationStatus] = (counts[dr.allocationStatus] || 0) + 1; });
        return counts;
    }, [driverInventory]);

    const filteredDrivers = useMemo(() => {
        const q = driverSearch.trim().toLowerCase();
        return vendorDriverInventory.filter(dr => {
            const matchesSearch = !q || dr.name.toLowerCase().includes(q) || (dr.licenseId || '').toLowerCase().includes(q);
            const matchesStatus = driverStatusFilter === 'All' || dr.allocationStatus === driverStatusFilter;
            return matchesSearch && matchesStatus;
        });
    }, [vendorDriverInventory, driverSearch, driverStatusFilter]);

    // Auto-Assign Drivers to Vehicles used to live here - it's now in Vendors & Fleet's Driver
    // Management (see window.VendorsTab), alongside every other driver-facing action (add, remove,
    // documents, cost). This tab's own Drivers view below stays read-only monitoring.

    const openVendor = (v) => {
        setSelected(v);
        setSubview('detail');
        setView('Vehicles');
        setSearch(''); setStatusFilter('All');
        setDriverSearch(''); setDriverStatusFilter('All');
    };

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Inventory Management</h2>
                    <p className="text-sm text-slate-500">
                        {subview === 'list' ? 'Live vehicle & driver availability by vendor - open a vendor to drill in' : `${selected.name} - live vehicle & driver availability`}
                    </p>
                </div>
                {subview === 'list' && (
                    <div className="flex gap-2 flex-wrap">
                        <Btn onClick={autoAssignToTrips}><Icon name="travel" size={14} className="inline mr-1" />Auto-Assign Vehicles to Trips</Btn>
                    </div>
                )}
            </div>

            {subview === 'list' && (
                /* Sidebar + main layout, per the reference mockup - a persistent "Global Fleet
                   Status" panel on the left (purely informational, nothing in it is clickable or a
                   filter) instead of a horizontal strip above the cards, with the vendor grid
                   narrowed to 2 columns so it doesn't compete with the sidebar for width. */
                <div className="grid grid-cols-1 lg:grid-cols-[280px_1fr] gap-6 items-start">
                    <Card title="Global Fleet Status" className="lg:sticky lg:top-6">
                        <div className="p-4 space-y-5">
                            <div>
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Vehicles ({inventory.length} Total)</p>
                                <div className="grid grid-cols-2 gap-2.5">
                                    {INVENTORY_STATUSES.map(s => (
                                        <div key={s} className={`rounded-xl p-3 text-center ${VEHICLE_STATUS_TILE[s].bg}`}>
                                            <Icon name={VEHICLE_STATUS_ICON[s]} size={16} className={`mx-auto mb-1 ${VEHICLE_STATUS_TILE[s].text}`} />
                                            <p className={`text-xl font-extrabold ${VEHICLE_STATUS_TILE[s].text}`}>{overallVehicleCounts[s] || 0}</p>
                                            <p className="text-[9px] font-semibold text-slate-500 uppercase tracking-wide mt-0.5">{s}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Drivers ({driverInventory.length} Total)</p>
                                <div className="grid grid-cols-3 gap-2">
                                    {DRIVER_INVENTORY_STATUSES.map(s => (
                                        <div key={s} className={`rounded-xl p-2.5 text-center ${DRIVER_STATUS_TILE[s].bg}`}>
                                            <Icon name={DRIVER_STATUS_ICON[s]} size={15} className={`mx-auto mb-1 ${DRIVER_STATUS_TILE[s].text}`} />
                                            <p className={`text-lg font-extrabold ${DRIVER_STATUS_TILE[s].text}`}>{overallDriverCounts[s] || 0}</p>
                                            <p className="text-[8px] font-semibold text-slate-500 uppercase tracking-wide mt-0.5 leading-tight">{s}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </Card>

                    {data.vendors.length === 0 ? (
                        <Card><p className="px-5 py-10 text-center text-slate-400 text-sm">No vendors onboarded yet.</p></Card>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {data.vendors.map(v => {
                                const vFleet = v.fleet.map(f => vehicleAllocationStatus(f, data));
                                const vehiclesAvailable = vFleet.filter(s => s === 'Available').length;
                                const vehiclesBooked = vFleet.filter(s => s === 'Reserved' || s === 'In Transit').length;
                                const vDrivers = data.drivers.filter(dr => dr.vendor === v.name).map(dr => driverAllocationStatus(dr));
                                const driversAvailable = vDrivers.filter(s => s === 'Available').length;
                                const driversBooked = vDrivers.filter(s => s === 'Booked').length;
                                return (
                                    <VendorCard key={v.id} vendor={v} contract={v.contract === 'Active' ? 'Active' : 'Pending'}
                                        vehicleStat={{
                                            label: 'Vehicles', value: vehiclesAvailable, sub: `${vehiclesBooked} booked`,
                                            percent: (vehiclesAvailable + vehiclesBooked) > 0 ? (vehiclesBooked / (vehiclesAvailable + vehiclesBooked)) * 100 : 0,
                                        }}
                                        driverStat={{
                                            label: 'Drivers', value: driversAvailable, sub: `${driversBooked} booked`,
                                            percent: (driversAvailable + driversBooked) > 0 ? (driversBooked / (driversAvailable + driversBooked)) * 100 : 0,
                                        }}
                                        footerLeft={{ label: 'Point of Contact', value: v.contact }}
                                        footerRight={{ label: 'Phone', value: v.phone }}
                                        onClick={() => openVendor(v)} />
                                );
                            })}
                        </div>
                    )}
                </div>
            )}

            {subview === 'detail' && selected && (
                <>
                    <Btn variant="outline" className="mb-4" onClick={() => { setSubview('list'); setSelected(null); }}>{'<- Back to vendors'}</Btn>

                    <TabBar tabs={['Vehicles', 'Drivers']} active={view} onChange={setView} />

                    {view === 'Vehicles' && (
                        <>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                                {INVENTORY_STATUSES.map(s => (
                                    <button key={s} type="button" onClick={() => setStatusFilter(statusFilter === s ? 'All' : s)}
                                        className={`bg-white border rounded-xl p-4 text-center shadow-card transition ${statusFilter === s ? 'border-brandAccent ring-2 ring-brandAccent/20' : 'border-slate-200 hover:border-slate-400'}`}>
                                        <p className="text-2xl font-bold text-slate-800">{statusCounts[s] || 0}</p>
                                        <p className="text-xs text-slate-500 mt-1">{s}</p>
                                    </button>
                                ))}
                            </div>

                            <div className="flex flex-wrap gap-3 mb-4">
                                <div className="relative flex-1 min-w-[220px]">
                                    <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input type="text" placeholder="Search by vehicle or reg no..." value={search}
                                        onChange={e => setSearch(e.target.value)}
                                        className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                                </div>
                                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
                                    className="px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                                    <option value="All">All Statuses</option>
                                    {INVENTORY_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>

                            <Card>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead className="bg-slate-50 text-slate-500 text-xs"><tr>
                                            <th className="px-5 py-3 text-left">Vehicle</th>
                                            <th className="px-5 py-3 text-left">Reg No</th><th className="px-5 py-3 text-left">Capacity</th>
                                            <th className="px-5 py-3 text-left">Fuel</th>
                                            <th className="px-5 py-3 text-left">Currently On</th><th className="px-5 py-3 text-left">Status</th>
                                            <th className="px-5 py-3 text-right">Action</th>
                                        </tr></thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {filtered.length === 0 && (
                                                <tr><td colSpan={7} className="px-5 py-10 text-center text-slate-400 text-sm">No vehicles match your search or filters.</td></tr>
                                            )}
                                            {filtered.map(v => (
                                                <tr key={v.id} className="hover:bg-slate-50">
                                                    <td className="px-5 py-3"><div className="font-medium">{vehicleModelLabel(v)}</div><div className="text-xs text-slate-400">{v.id}</div></td>
                                                    <td className="px-5 py-3 font-mono text-xs">{v.regNo}</td>
                                                    <td className="px-5 py-3">{v.capacity} seats</td>
                                                    <td className="px-5 py-3 text-xs text-slate-500">{vehicleFuelProfile(v, data)?.fuelType || '—'}</td>
                                                    <td className="px-5 py-3 text-slate-500">{vehicleAllocationContext(v, data) || '—'}</td>
                                                    <td className="px-5 py-3"><Badge status={v.allocationStatus} /></td>
                                                    <td className="px-5 py-3 text-right">
                                                        {v.status === 'Maintenance' ? (
                                                            <button onClick={() => requestStatusChange(v, 'Active')}
                                                                className="inline-flex items-center gap-1 text-xs font-medium text-emerald-600 hover:text-emerald-700 hover:underline whitespace-nowrap">
                                                                <Icon name="check" size={12} />Return to Service
                                                            </button>
                                                        ) : (
                                                            <button onClick={() => requestStatusChange(v, 'Maintenance')}
                                                                className="inline-flex items-center gap-1 text-xs font-medium text-amber-600 hover:text-amber-700 hover:underline whitespace-nowrap">
                                                                <Icon name="wrench" size={12} />Send to Maintenance
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </>
                    )}

                    {view === 'Drivers' && (
                        <>
                            <div className="flex justify-end mb-3">
                                <button type="button" onClick={() => setActiveTab('Vendors & Fleet')}
                                    className="inline-flex items-center gap-1 text-sm font-medium text-brandAccent hover:underline">
                                    Manage drivers (add, remove, documents, cost, auto-assign) in Vendors & Fleet
                                    <Icon name="arrowRight" size={14} />
                                </button>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
                                {DRIVER_INVENTORY_STATUSES.map(s => (
                                    <button key={s} type="button" onClick={() => setDriverStatusFilter(driverStatusFilter === s ? 'All' : s)}
                                        className={`bg-white border rounded-xl p-4 text-center shadow-card transition ${driverStatusFilter === s ? 'border-brandAccent ring-2 ring-brandAccent/20' : 'border-slate-200 hover:border-slate-400'}`}>
                                        <p className="text-2xl font-bold text-slate-800">{driverStatusCounts[s] || 0}</p>
                                        <p className="text-xs text-slate-500 mt-1">{s}</p>
                                    </button>
                                ))}
                            </div>

                            <div className="flex flex-wrap gap-3 mb-4">
                                <div className="relative flex-1 min-w-[220px]">
                                    <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input type="text" placeholder="Search by driver or license ID..." value={driverSearch}
                                        onChange={e => setDriverSearch(e.target.value)}
                                        className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                                </div>
                                <select value={driverStatusFilter} onChange={e => setDriverStatusFilter(e.target.value)}
                                    className="px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                                    <option value="All">All Statuses</option>
                                    {DRIVER_INVENTORY_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>

                            <Card>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead className="bg-slate-50 text-slate-500 text-xs"><tr>
                                            <th className="px-5 py-3 text-left">Driver</th>
                                            <th className="px-5 py-3 text-left">Cost/Hour</th>
                                            <th className="px-5 py-3 text-left">Assigned Vehicle</th><th className="px-5 py-3 text-right">Status</th>
                                        </tr></thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {filteredDrivers.length === 0 && (
                                                <tr><td colSpan={4} className="px-5 py-10 text-center text-slate-400 text-sm">No drivers match your search or filters.</td></tr>
                                            )}
                                            {filteredDrivers.map(dr => {
                                                const vehicle = dr.vehicleId ? inventory.find(v => v.id === dr.vehicleId) : null;
                                                return (
                                                    <tr key={dr.id} className="hover:bg-slate-50">
                                                        <td className="px-5 py-3"><div className="font-medium">{dr.name}</div><div className="text-xs text-slate-400">{dr.id}</div></td>
                                                        <td className="px-5 py-3">{dr.costPerHour != null ? `₹${dr.costPerHour}` : '—'}</td>
                                                        <td className="px-5 py-3 text-slate-500">{vehicle ? `${vehicleModelLabel(vehicle)} · ${vehicle.id}` : '—'}</td>
                                                        <td className="px-5 py-3 text-right"><Badge status={dr.allocationStatus} /></td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </>
                    )}
                </>
            )}

            {/* Confirm before pulling a Reserved/In Transit vehicle out of service - it can strand
                whatever that vehicle is currently committed to, so it's never applied straight off
                the button the way an Available vehicle's status change is. */}
            <Modal open={!!pendingStatusChange} onClose={() => setPendingStatusChange(null)} title="Confirm Send to Maintenance">
                {pendingStatusChange && (
                    <div className="space-y-4">
                        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                            <p className="text-sm text-amber-800">
                                <strong>{vehicleModelLabel(pendingStatusChange.vehicle)}</strong> is currently <strong>{pendingStatusChange.vehicle.allocationStatus}</strong>
                                {vehicleAllocationContext(pendingStatusChange.vehicle, data) ? ` (${vehicleAllocationContext(pendingStatusChange.vehicle, data)})` : ''}.
                                Sending it to Maintenance won't reassign or cancel that on its own - you'll need to manually assign a replacement vehicle afterwards.
                            </p>
                        </div>
                        <div className="flex gap-2">
                            <Btn variant="danger" onClick={confirmStatusChange}>Confirm - Send to Maintenance</Btn>
                            <Btn variant="outline" onClick={() => setPendingStatusChange(null)}>Cancel</Btn>
                        </div>
                    </div>
                )}
            </Modal>

            {/* What Auto-Assign Vehicles to Trips actually did - always shown after a successful run
                (never silent), so an admin can see exactly which vehicle (and, if one's already
                paired to it, which driver) landed on which trip instead of trusting a bare count.
                Each result is a full-width card, not a fixed-width grid row - "Force Traveller
                (Minibus) · VH-5501" wrapped mid-ID the first time this was a 190px column, and a
                bare name next to a small icon read as "whose name is that?" rather than clearly "the
                driver". Same gradient-avatar-plus-labeled-icon-badge language as a Travel Plans card
                and the single-result Auto-Assign popup, so every "here's who/what got assigned"
                surface in this app looks and reads the same way. */}
            <Modal open={!!autoAssignSummary} onClose={() => setAutoAssignSummary(null)} title="Vehicles Auto-Assigned" wide>
                {autoAssignSummary && (
                    <div className="space-y-3">
                        <p className="text-sm text-slate-500">
                            {autoAssignSummary.length} trip{autoAssignSummary.length > 1 ? 's' : ''} matched with an Available vehicle:
                        </p>
                        <div className="space-y-2 max-h-[55vh] overflow-y-auto -mx-1 px-1">
                            {autoAssignSummary.map(({ plan, vehicle, driver }) => (
                                <div key={plan.id} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-9 h-9 rounded-full bg-gradient-to-br ${avatarGradientFor(plan.stakeholder)} flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-sm ring-1 ring-black/5`}>
                                            {initialsOf(plan.stakeholder)}
                                        </div>
                                        <div className="min-w-0">
                                            <p className="font-semibold text-slate-800 text-sm truncate">{plan.stakeholder}</p>
                                            <p className="text-xs text-slate-400">{plan.tmsRef} &middot; {plan.passengers} pax</p>
                                        </div>
                                    </div>
                                    <div className="mt-3 pt-3 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div className="flex items-center gap-2.5 min-w-0">
                                            <span className="w-8 h-8 rounded-lg bg-blue-50 text-brandAccent flex items-center justify-center shrink-0">
                                                <Icon name="fleet" size={14} />
                                            </span>
                                            <div className="min-w-0">
                                                <p className="text-[9px] font-semibold text-slate-400 uppercase tracking-wide">Vehicle</p>
                                                <p className="text-sm font-medium text-slate-700 truncate">{vehicle ? `${vehicleModelLabel(vehicle)} · ${vehicle.id}` : '—'}</p>
                                                {/* Which vendor this came from - the whole point of
                                                    auto-assigning across every vendor at once is that
                                                    it isn't obvious otherwise, and it's worth tracking. */}
                                                {vehicle && <p className="text-xs text-slate-400 truncate">{vehicle.vendorName}</p>}
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2.5 min-w-0">
                                            <span className="w-8 h-8 rounded-lg bg-violet-50 text-violet-600 flex items-center justify-center shrink-0">
                                                <Icon name="users" size={14} />
                                            </span>
                                            <div className="min-w-0">
                                                <p className="text-[9px] font-semibold text-slate-400 uppercase tracking-wide">Driver</p>
                                                {driver ? (
                                                    <p className="text-sm font-medium text-slate-700 truncate">{driver.name}</p>
                                                ) : (
                                                    <p className="text-sm text-slate-400">No driver paired yet</p>
                                                )}
                                                {driver && <p className="text-xs text-slate-400 truncate">{driver.vendor}</p>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <Btn className="w-full" onClick={() => setAutoAssignSummary(null)}>Done</Btn>
                    </div>
                )}
            </Modal>
        </div>
    );
};

</script>
<script type="text/babel">
/* global React, Card, Badge, Btn, Modal, Icon, ExportImport, TabBar, exportCSV, importCSV, vehicleModelLabel */
const { useState, useMemo } = React;

// Shared by both actions: approving a vehicle means every item checks out, so all boxes are
// mandatory; rejecting only needs the specific item(s) that failed, so a single box will do.
const INSPECTION_CHECKLIST = ['PUC', 'Insurance', 'Physical Inspection', 'Driver ID', "Driver's License"];

window.ComplianceTab = ({ data, setData }) => {
    const [filter, setFilter] = useState('All');
    const filters = ['All', 'Pending', 'Approved', 'Rejected'];
    const [search, setSearch] = useState('');
    const [vendorFilter, setVendorFilter] = useState('All');

    const [actionModal, setActionModal] = useState(null); // { id, actionType }
    const [selectedChecklist, setSelectedChecklist] = useState([]);
    const [modalNotes, setModalNotes] = useState('');
    // Which inspection's full detail view (documents, vehicle/driver info) is open. Approve/Reject
    // only ever fire from inside that view now - never straight off the table row - so an inspector
    // can't act on a request without having actually seen what they're approving or rejecting.
    const [detailId, setDetailId] = useState(null);

    // Cross-reference an inspection's vehicleId/vendor against the vendor fleet records to surface
    // the vehicle, driver, and uploaded documents that actually belong to this inspection. Vehicles
    // and drivers are independent records now (see Vendors & Fleet), so the driver for an inspection
    // is found via the inspection's own driverId when present, falling back to whichever driver is
    // currently paired with the vehicle (driver.vehicleId) for older vehicle-only inspections.
    const findVehicle = (vehicleId) => {
        if (!vehicleId || vehicleId === 'N/A') return null;
        for (const v of data.vendors) {
            const f = v.fleet.find(x => x.id === vehicleId);
            if (f) return f;
        }
        return null;
    };
    const findVendor = (vendorName) => data.vendors.find(v => v.name === vendorName) || null;
    const findDriver = (inspection) => {
        if (inspection.driverId) return data.drivers.find(d => d.id === inspection.driverId) || null;
        if (!inspection.vehicleId || inspection.vehicleId === 'N/A') return null;
        return data.drivers.find(d => d.vehicleId === inspection.vehicleId) || null;
    };
    const vehicleTypeOf = (inspection) => findVehicle(inspection.vehicleId)?.type || null;

    // The logged-in admin's own live record (not the login-time snapshot on data.currentAdmin -
    // Admin Management can change someone's Vehicle Type Scope mid-session, and that should take
    // effect immediately). Master Admin is never scoped, full stop, regardless of what's on the record.
    const myAdmin = data.admins.find(a => a.id === data.currentAdmin?.id) || null;
    const myScope = (myAdmin && myAdmin.role !== 'Master Admin') ? (myAdmin.vehicleTypeScope || null) : null;

    // Who should be shown as the inspector for a given inspection - the active Compliance Officer(s)
    // scoped to its vehicle's type, since assignment is no longer a manual per-inspection pick (see
    // window.AdminTab's Vehicle Scope column). Vendor-level inspections with no vehicle at all
    // (GSTIN/Trade Cert/POC Identity) and any type nobody's specifically scoped to both fall back to
    // the unscoped "All Vehicle Types" Compliance Officer(s), so there's still someone to show instead
    // of a dead end.
    const inspectorsFor = (inspection) => {
        const type = vehicleTypeOf(inspection);
        const pool = data.admins.filter(a => a.status === 'Active' && a.role === 'Compliance Officer');
        const scoped = type ? pool.filter(a => a.vehicleTypeScope === type) : [];
        return scoped.length ? scoped : pool.filter(a => !a.vehicleTypeScope);
    };

    const buildDocuments = (inspection) => {
        const vehicle = findVehicle(inspection.vehicleId);
        const vendor = findVendor(inspection.vendor);
        const driver = findDriver(inspection);
        const type = inspection.type.toLowerCase();
        const docs = [];
        if (type.includes('puc')) docs.push({ label: 'PUC Certificate', fileName: vehicle?.pucFile || null });
        if (type.includes('insurance')) docs.push({ label: 'Insurance Certificate', fileName: vehicle?.insuranceFile || null });
        if (type.includes('driver')) docs.push({ label: "Driver's License", fileName: driver?.licenseFile || null });
        if (type.includes('gstin')) docs.push({ label: 'GSTIN Certificate', fileName: vendor?.gstinFile || null });
        if (type.includes('trade certificate')) docs.push({ label: 'Trade Certificate', fileName: vendor?.tradeCertFile || null });
        if (type.includes('poc identity')) docs.push({ label: 'POC Identity Document', fileName: vendor?.pocImage || null });
        if (docs.length === 0) docs.push({ label: inspection.type, fileName: null });
        return docs;
    };

    const vendorOptions = useMemo(() =>
        ['All', ...new Set(data.inspections.map(i => i.vendor))],
        [data.inspections]
    );

    const items = useMemo(() => {
        const q = search.trim().toLowerCase();
        return data.inspections.filter(i => {
            // A vehicle-type-scoped admin never even sees inspections outside their scope, not just
            // "can't act on them" - out of scope means out of the list entirely, before any of the
            // status/vendor/search filters below get a say.
            if (myScope && vehicleTypeOf(i) !== myScope) return false;
            const matchesStatus = filter === 'All' || i.status === filter;
            const matchesVendor = vendorFilter === 'All' || i.vendor === vendorFilter;
            const matchesSearch = !q
                || i.vehicleId.toLowerCase().includes(q)
                || i.vendor.toLowerCase().includes(q)
                || i.type.toLowerCase().includes(q)
                || i.id.toLowerCase().includes(q);
            return matchesStatus && matchesVendor && matchesSearch;
        });
    }, [data.inspections, data.vendors, filter, vendorFilter, search, myScope]);

    // Derived from the live id rather than a snapshot, so e.g. its status changing while the
    // detail view is open is reflected immediately instead of showing stale data.
    const detailInspection = data.inspections.find(i => i.id === detailId) || null;

    const openActionModal = (id, actionType) => {
        setActionModal({ id, actionType });
        setSelectedChecklist([]);
        setModalNotes('');
    };

    const closeActionModal = () => {
        setActionModal(null);
        setSelectedChecklist([]);
        setModalNotes('');
    };

    const toggleChecklistItem = (item) => {
        setSelectedChecklist(list => list.includes(item) ? list.filter(x => x !== item) : [...list, item]);
    };

    // Master Admin can switch this off in Admin Management - defaults to on (required) whenever the
    // setting hasn't been saved yet, so older/imported data behaves the same as a fresh install.
    const checklistRequired = data.settings?.requireInspectionChecklist !== false;

    // Approving requires every item checked (the vehicle only clears once PUC, Insurance and the
    // physical inspection all pass); rejecting only requires at least one checked reason. Both are
    // bypassed entirely when the admin-side "Require Inspection Checklist" setting is off.
    const isChecklistSatisfied = !checklistRequired || (actionModal?.actionType === 'Approved'
        ? selectedChecklist.length === INSPECTION_CHECKLIST.length
        : selectedChecklist.length > 0);

    const updateStatus = (id, status, checklist = [], extraNotes = '') => {
        setData(d => ({
            ...d,
            inspections: d.inspections.map(i => {
                if (i.id !== id) return i;
                const parts = [];
                if (checklist.length) parts.push(`Checklist: ${checklist.join('; ')}.`);
                if (extraNotes.trim()) parts.push(`Notes: ${extraNotes.trim()}`);
                const newNotes = [i.notes, parts.join(' ')].filter(Boolean).join(' ').trim();
                return { ...i, status, notes: newNotes };
            }),
        }));
    };

    const confirmAction = () => {
        if (!actionModal || !isChecklistSatisfied) return;
        updateStatus(actionModal.id, actionModal.actionType, selectedChecklist, modalNotes);
        closeActionModal();
    };

    const handleImport = (file) => importCSV(file, rows => {
        const imported = rows.map(r => ({
            id: r.id || `INS-${Date.now()}`, vehicleId: r.vehicleId, vendor: r.vendor,
            type: r.type, date: r.date, status: r.status || 'Pending', inspector: r.inspector, notes: r.notes || '',
        }));
        setData(d => ({ ...d, inspections: [...d.inspections, ...imported] }));
        alert(`Imported ${imported.length} inspections.`);
    });

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Compliance & Inspection</h2>
                    <p className="text-sm text-slate-500">Physical and compliance inspection approval workflow</p>
                </div>
                <ExportImport label="Inspections" onExport={() => exportCSV('inspections.csv', data.inspections)} onImport={handleImport}
                    sampleHeaders={['id', 'vehicleId', 'vendor', 'type', 'date', 'status', 'inspector', 'notes']} />
            </div>

            {/* A vehicle-type-scoped Compliance Officer only ever sees their own type's inspections
                (window.AdminTab's Vehicle Scope column sets this) - called out explicitly rather than
                leaving them to wonder why the list looks short compared to what an unscoped colleague sees. */}
            {myScope && (
                <div className="bg-blue-50 border border-blue-100 rounded-lg px-4 py-2.5 mb-4 flex items-center gap-2 text-sm text-blue-800">
                    <Icon name="lock" size={14} className="shrink-0" />
                    You're scoped to <strong>{myScope}</strong> inspections only, across every vendor - set from Admin Management.
                </div>
            )}

            <TabBar tabs={filters} active={filter} onChange={setFilter} />

            <div className="flex flex-wrap gap-3 mb-4">
                <div className="relative flex-1 min-w-[220px]">
                    <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input type="text" placeholder="Search by vehicle, vendor, or type..." value={search}
                        onChange={e => setSearch(e.target.value)}
                        className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                </div>
                <select value={vendorFilter} onChange={e => setVendorFilter(e.target.value)}
                    className="px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                    {vendorOptions.map(o => <option key={o} value={o}>{o === 'All' ? 'All Vendors' : o}</option>)}
                </select>
            </div>

            {items.length === 0 ? (
                <Card><p className="px-5 py-10 text-center text-slate-400 text-sm">No inspections match your search or filters.</p></Card>
            ) : (
                /* One row-card per inspection, not a table - IDs, dates, and vehicle IDs kept squeezing
                   into fixed table columns wrapped mid-value ("VH-" / "5502", "2026-08-" / "09") on
                   anything less than a very wide viewport. Every row (and the header labels above them)
                   shares one CSS grid template with fixed-width columns for Date/Inspector/Status/Review,
                   so those fields line up in a straight column down the list regardless of how long the
                   inspection type/vehicle/vendor text in the first column runs - a flex-based row can't
                   guarantee that (each row's leftover space differs with its content, so fixed-width
                   siblings after it drift left/right row to row). Status-colored left accent so
                   Pending/Approved/Rejected reads at a glance down a long list. */
                <div className="space-y-2">
                    <div className="hidden lg:grid grid-cols-[minmax(0,1fr)_120px_170px_100px_76px] gap-x-4 px-4 pb-1 text-[10px] font-semibold text-slate-400 uppercase tracking-wide">
                        <span>Inspection</span><span>Date</span><span>Inspector</span><span>Status</span><span className="text-right">Review</span>
                    </div>
                    {items.map(i => {
                        const accent = i.status === 'Approved' ? 'border-l-emerald-400'
                            : i.status === 'Rejected' ? 'border-l-red-400' : 'border-l-amber-400';
                        return (
                            <div key={i.id} onClick={() => setDetailId(i.id)}
                                className={`grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_120px_170px_100px_76px] gap-x-4 gap-y-2 lg:items-center bg-white border border-slate-300 border-l-4 ${accent} rounded-xl px-4 py-3.5 shadow-sm hover:shadow-md hover:border-slate-400 transition-all cursor-pointer`}>
                                <div className="flex items-center gap-3 min-w-0">
                                    <span className="w-9 h-9 rounded-lg bg-blue-50 text-brandAccent flex items-center justify-center shrink-0">
                                        <Icon name="compliance" size={16} />
                                    </span>
                                    <div className="min-w-0">
                                        <p className="font-semibold text-slate-800 text-sm truncate">{i.type}</p>
                                        <p className="text-xs text-slate-400 truncate">
                                            {i.id}{i.vehicleId !== 'N/A' ? `  ·  ${i.vehicleId}` : ''}  ·  {i.vendor}
                                        </p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-1.5 text-xs text-slate-500 whitespace-nowrap">
                                    <Icon name="calendar" size={13} className="text-slate-300 shrink-0 lg:hidden" />{i.date}
                                </div>

                                <div>
                                    <span className="lg:hidden text-[10px] font-semibold text-slate-400 uppercase tracking-wide block mb-0.5">Inspector</span>
                                    {/* No longer a reassignment control - who inspects this is decided
                                        by Admin Management's Vehicle Scope, not picked per inspection. */}
                                    <p className="text-xs text-slate-600 truncate">
                                        {inspectorsFor(i).length ? inspectorsFor(i).map(a => a.name).join(', ') : <span className="text-slate-300">Unassigned</span>}
                                    </p>
                                </div>

                                <div><Badge status={i.status} /></div>

                                <button className="justify-self-start lg:justify-self-end shrink-0 text-xs font-medium text-brandAccent hover:underline inline-flex items-center gap-1"
                                    onClick={() => setDetailId(i.id)}>
                                    Review<Icon name="arrowRight" size={12} />
                                </button>
                            </div>
                        );
                    })}
                </div>
            )}

            {/* Inspection detail - the only place Approve/Reject can be triggered from, so an
                inspector always sees the vehicle/driver info and uploaded documents first. */}
            <Modal open={!!detailInspection} onClose={() => setDetailId(null)} title="Inspection Details" wide>
                {detailInspection && (() => {
                    const vehicle = findVehicle(detailInspection.vehicleId);
                    const driver = findDriver(detailInspection);
                    const documents = buildDocuments(detailInspection);
                    return (
                        <div className="space-y-5">
                            <div className="flex flex-wrap items-start justify-between gap-3">
                                <div>
                                    <p className="text-xs text-slate-400">{detailInspection.id}</p>
                                    <h4 className="font-semibold text-slate-800 text-base">{detailInspection.type}</h4>
                                    <p className="text-sm text-slate-500 mt-0.5">
                                        {detailInspection.vendor}{detailInspection.vehicleId !== 'N/A' ? `  ·  ${detailInspection.vehicleId}` : ''}
                                    </p>
                                </div>
                                <Badge status={detailInspection.status} />
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div className="border border-slate-200 rounded-lg p-3">
                                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Submitted</p>
                                    <p className="text-sm text-slate-700">{detailInspection.date}</p>
                                </div>
                                <div className="border border-slate-200 rounded-lg p-3">
                                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Inspector</p>
                                    <p className="text-sm text-slate-700">
                                        {inspectorsFor(detailInspection).map(a => a.name).join(', ') || 'Unassigned'}
                                    </p>
                                </div>
                                {vehicle && (
                                    <div className="border border-slate-200 rounded-lg p-3">
                                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Vehicle</p>
                                        <p className="text-sm text-slate-700">{vehicleModelLabel(vehicle)}  ·  {vehicle.capacity} seats  ·  {vehicle.regNo}</p>
                                    </div>
                                )}
                                {/* Vehicles and drivers are independent records now - a vehicle
                                    inspection may have no driver assigned yet, and a driver
                                    inspection may have no vehicle assigned yet, so each card
                                    renders off its own lookup rather than assuming both exist. */}
                                {(driver || vehicle) && (
                                    <div className="border border-slate-200 rounded-lg p-3">
                                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Driver</p>
                                        <p className="text-sm text-slate-700">
                                            {driver ? driver.name : 'Not assigned'}{driver?.licenseId ? `  ·  ${driver.licenseId}` : ''}
                                        </p>
                                    </div>
                                )}
                            </div>

                            <div>
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Submitted Documents</p>
                                <div className="space-y-2">
                                    {documents.map((doc, idx) => (
                                        <div key={idx} className={`flex items-center gap-3 p-3 border rounded-lg ${doc.fileName ? 'border-slate-200 bg-slate-50' : 'border-amber-200 bg-amber-50'}`}>
                                            <div className={`shrink-0 w-9 h-9 rounded-lg flex items-center justify-center ${doc.fileName ? 'bg-blue-50 text-brandAccent' : 'bg-amber-100 text-amber-600'}`}>
                                                {doc.fileName ? (
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                                        <path d="M14 2v6h6" />
                                                    </svg>
                                                ) : (
                                                    <Icon name="alert" size={16} />
                                                )}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <p className="text-sm font-medium text-slate-800">{doc.label}</p>
                                                {doc.fileName ? (
                                                    <button type="button" onClick={() => alert(`Preview: ${doc.fileName}`)}
                                                        className="text-xs text-brandAccent font-medium hover:underline truncate">
                                                        {doc.fileName}  ·  Preview
                                                    </button>
                                                ) : (
                                                    <p className="text-xs text-amber-700">Not uploaded - factor this into your decision below.</p>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {detailInspection.notes && (
                                <div>
                                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Notes / History</p>
                                    <p className="text-sm text-slate-600 bg-slate-50 border border-slate-100 rounded-lg p-3">{detailInspection.notes}</p>
                                </div>
                            )}

                            {detailInspection.status === 'Pending' ? (
                                <div className="flex gap-2 pt-3 border-t border-slate-100">
                                    <Btn variant="success" className="flex-1" onClick={() => { setDetailId(null); openActionModal(detailInspection.id, 'Approved'); }}>
                                        Approve
                                    </Btn>
                                    <Btn variant="danger" className="flex-1" onClick={() => { setDetailId(null); openActionModal(detailInspection.id, 'Rejected'); }}>
                                        Reject
                                    </Btn>
                                </div>
                            ) : (
                                <div className="pt-3 border-t border-slate-100 text-sm text-slate-500">
                                    This inspection has already been <strong>{detailInspection.status.toLowerCase()}</strong>.
                                </div>
                            )}
                        </div>
                    );
                })()}
            </Modal>

            <Modal open={!!actionModal} onClose={closeActionModal}
                title={actionModal?.actionType === 'Approved' ? 'Confirm Approval' : 'Confirm Rejection'}>
                <div className="space-y-4">
                    {!checklistRequired && (
                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="lock" size={15} className="text-slate-400 shrink-0 mt-0.5" />
                            <p className="text-xs text-slate-600">
                                Checklist requirement is currently <strong>disabled</strong> in Admin Management - you can confirm below
                                without completing it. Checked items are still recorded on the record if you fill any in.
                            </p>
                        </div>
                    )}
                    <p className="text-sm text-slate-500">
                        {actionModal?.actionType === 'Approved'
                            ? 'Check off every item below to confirm this vehicle has cleared inspection.'
                            : 'Check the item(s) that failed to explain why this is being rejected.'}
                    </p>
                    <div className="space-y-2">
                        {INSPECTION_CHECKLIST.map(item => (
                            <label key={item} className="flex items-start gap-2 text-sm text-slate-700">
                                <input type="checkbox" className="mt-0.5" checked={selectedChecklist.includes(item)}
                                    onChange={() => toggleChecklistItem(item)} />
                                <span>{item}</span>
                            </label>
                        ))}
                    </div>
                    {checklistRequired && !isChecklistSatisfied && (
                        <p className="text-xs text-amber-600">
                            {actionModal?.actionType === 'Approved'
                                ? 'All items must be checked before you can approve.'
                                : 'Check at least one item to explain the rejection.'}
                        </p>
                    )}
                    <label className="block">
                        <span className="text-xs font-medium text-slate-500 mb-1 block">Additional Notes (Optional)</span>
                        <textarea rows={3} value={modalNotes} onChange={e => setModalNotes(e.target.value)}
                            className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                    </label>
                    <div className="flex gap-2">
                        <Btn variant={actionModal?.actionType === 'Approved' ? 'success' : 'danger'} onClick={confirmAction}
                            disabled={!isChecklistSatisfied} className={!isChecklistSatisfied ? 'opacity-50 cursor-not-allowed' : ''}>
                            Confirm & Save
                        </Btn>
                        <Btn variant="outline" onClick={closeActionModal}>Cancel</Btn>
                    </div>
                </div>
            </Modal>
        </div>
    );
};

</script>
<script type="text/babel">
/* global React, Card, Btn, Modal, TabBar, PaginatedListPage, Icon, posAlongRoute, VENDOR_COLORS, vehicleFuelProfile, statusColor, google */
const { useState, useEffect, useRef, useMemo } = React;

const TYPE_SHORT = (t) => (t || '').split('(')[0].trim();

// Which vehicle-type icon shows on an assignment card's header badge - Bus gets its own boxy
// silhouette (ICONS.bus), everything else (Sedan/SUV/Minibus) shares the existing generic `fleet`
// glyph rather than adding three more near-identical car/van silhouettes.
const vehicleTypeIcon = (type) => (TYPE_SHORT(type) === 'Bus' ? 'bus' : 'fleet');

// A location's name splits into a bold "main" line + a lighter "sub" line only when it already has a
// ' - ' separator in the data (e.g. "IGI Airport - Terminal 3", "Athletes Village - Block A") - a
// name with no separator (e.g. "Hotel Lakeside Residency") stays one label and just wraps naturally
// within the card's narrow origin/destination columns instead of being force-split at some arbitrary
// word boundary.
const splitLocationLabel = (name) => {
    const parts = (name || '').split(' - ');
    return { main: parts[0], sub: parts.length > 1 ? parts.slice(1).join(' - ') : null };
};

// Airport locations get the plane glyph on their origin/destination pin, everything else (hotels,
// venues, villages, stations alike) gets the generic building glyph - simple enough to cover this
// dataset's actual location names without a full per-location lookup table.
const locationGlyph = (name) => (/airport/i.test(name || '') ? 'plane' : 'building');

// The left-border stripe + icon-badge tint an assignment card takes on - SOS overrides everything
// else (a card that's both Delayed and SOS still reads as the more urgent state), same priority order
// the map's own marker coloring already uses.
const cardAccent = (a) => {
    if (a.sos) return { border: 'border-l-red-500', chip: 'bg-red-100 text-red-600' };
    if (a.status === 'Delayed') return { border: 'border-l-amber-500', chip: 'bg-amber-100 text-amber-600' };
    if (a.status === 'In Transit') return { border: 'border-l-emerald-500', chip: 'bg-emerald-100 text-emerald-600' };
    return { border: 'border-l-slate-300', chip: 'bg-slate-100 text-slate-500' };
};

// A stronger, more prominent pill than the shared neutral Badge chip - reuses the exact same
// statusColor hue lookup Badge itself does, just as a solid pastel fill instead of a neutral chip
// with just the dot colored, to match this card's own bolder visual language (colored icon badges,
// colored border) rather than the plainer treatment Badge uses everywhere else in the app.
function StatusPill({ status }) {
    const classes = statusColor[status] || 'bg-slate-100 text-slate-600';
    const textClass = (classes.match(/text-\S+/) || ['text-slate-600'])[0];
    const dotClass = textClass.replace('text-', 'bg-');
    return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide whitespace-nowrap shrink-0 ${classes}`}>
            <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${dotClass}`} />
            {status}
        </span>
    );
}

// A dependency-free custom-HTML map pin: google.maps.marker.AdvancedMarkerElement can do this too,
// but only once the map has a Map ID configured (a Google Cloud Console setting this prototype has
// no reason to need otherwise) - plain OverlayView renders arbitrary DOM at a lat/lng with nothing
// extra to set up, so the exact same colored-dot-plus-label markup Leaflet's divIcon used to render
// still works unchanged. `onClick` fires with the DOM event swallowed so it doesn't also trigger
// whatever the map itself is listening for at that pixel.
function makeHtmlOverlayClass() {
