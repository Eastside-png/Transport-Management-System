window.DashboardTab = ({ data, setData, setActiveTab }) => {
    const [isSyncing, setIsSyncing] = useState(false);
    const [lastSynced, setLastSynced] = useState('Just now');

    const greeting = useMemo(() => {
        const h = new Date().getHours();
        return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    }, []);
    const firstName = (data.currentAdmin.name || '').split(' ')[0];

    // The Dashboard's hero pair - a live map glance and a live arrivals/departures glance, each just
    // a summary of its own full page (Live Fleet Tracking / Travel Plans) with a "View" action through
    // to it, not a second copy of everything that page already does in full.
    const ongoingCount = data.assignments.filter(a => a.phase === 'ongoing').length;
    const upcomingCount = data.assignments.filter(a => a.phase === 'upcoming').length;
    const activeSOSCount = data.sosAlerts.filter(s => s.status === 'Active').length;
    const recentManualPlans = useMemo(() => [...data.manualPlans].reverse().slice(0, 4), [data.manualPlans]);

    // Global Fleet Status - same counts Inventory Management's own sidebar shows (same
    // window.vehicleAllocationStatus/driverAllocationStatus, same fixed status lists), computed fresh
    // here rather than read off that tab's state, since the two components don't share anything else.
    const globalVehicleCounts = useMemo(() => {
        const counts = { Available: 0, Reserved: 0, 'In Transit': 0, Maintenance: 0 };
        data.vendors.forEach(v => v.fleet.forEach(f => {
            const status = vehicleAllocationStatus(f, data);
            counts[status] = (counts[status] || 0) + 1;
        }));
        return counts;
    }, [data]);
    const totalVehicles = Object.values(globalVehicleCounts).reduce((a, b) => a + b, 0);
    const globalDriverCounts = useMemo(() => {
        const counts = { Available: 0, Booked: 0, Inactive: 0 };
        data.drivers.forEach(dr => {
            const status = driverAllocationStatus(dr);
            counts[status] = (counts[status] || 0) + 1;
        });
        return counts;
    }, [data.drivers]);
    const totalDrivers = Object.values(globalDriverCounts).reduce((a, b) => a + b, 0);
    // One shared nonce for every record shown here (unlike Travel Plans' own per-row refresh) - this
    // preview is meant to be glanced at as a whole, so a single "Refresh Live Status" re-polls
    // everything currently visible at once rather than one row at a time. See mockTransportStatus.
    const [statusNonce, setStatusNonce] = useState(0);
    const [isRefreshingStatus, setIsRefreshingStatus] = useState(false);
    const refreshAllLiveStatus = () => {
        setIsRefreshingStatus(true);
        setTimeout(() => {
            setStatusNonce(n => n + 1);
            setIsRefreshingStatus(false);
        }, 900);
    };

    const handleSync = () => {
        setIsSyncing(true);
        setTimeout(() => {
            setIsSyncing(false);
            setLastSynced(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            setData(d => ({
                ...d,
                notifications: [{
                    id: uid('NTF'), type: 'info', title: 'System Sync Complete',
                    message: 'Successfully synced latest data from TMS and Accommodation modules.',
                    time: 'Just now', read: false, priority: 'low',
                }, ...d.notifications],
            }));
        }, 2000);
    };

    return (
        <div className="max-w-7xl mx-auto space-y-6 animate-in">
            {/* Welcome header + sync capsule, side by side */}
            <div className="flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h1 className="text-2xl font-bold text-slate-800">{greeting}, {firstName} 👋</h1>
                    <p className="text-sm text-slate-500 mt-1">Here's what's happening across the fleet right now.</p>
                </div>
                <button onClick={handleSync} disabled={isSyncing} title="Sync data with Accommodation and TMS"
                    className={`group flex items-center gap-2.5 bg-white border border-slate-200 rounded-full pl-2 pr-4 py-2 shadow-card hover:shadow-cardHover hover:border-brandAccent/30 transition shrink-0 ${isSyncing ? 'cursor-not-allowed opacity-70' : ''}`}>
                    <span className={`w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-brandAccent shrink-0 ${isSyncing ? 'animate-spin' : ''}`}>
                        <span className="text-base leading-none" style={{ display: 'inline-block' }}>↻</span>
                    </span>
                    <span className="text-left">
                        <span className="block text-xs font-semibold text-slate-700">{isSyncing ? 'Syncing...' : 'Sync Accommodation & TMS'}</span>
                        <span className="block text-[10px] text-slate-400">Last synced: {lastSynced}</span>
                    </span>
                </button>
            </div>

            {/* Hero pair - Live Fleet Tracking (a real, compact live map) and Arrivals & Departures
                (the most recent Live Status records), side by side. Each is a glance at its own full
                page, not a duplicate of it - "View" hands off to the real thing in Live Fleet Tracking
                / Travel Plans rather than trying to cram either page's full functionality in here. */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
                <div className="bg-white rounded-2xl border border-slate-200 shadow-card overflow-hidden flex flex-col">
                    {/* Dark hero header - same visual language as the full Live Fleet Tracking page's
                        own command header (bg-slate-900, glow, red Live pill), so this preview reads as
                        the same kind of "live/important" section rather than just another white card. */}
                    <div className="relative overflow-hidden bg-slate-900 shrink-0">
                        <div className="absolute -top-12 -right-10 w-40 h-40 bg-brandAccent/20 rounded-full blur-3xl pointer-events-none" />
                        <div className="relative px-5 py-4 flex items-center justify-between gap-3">
                            <div className="flex items-center gap-3 min-w-0">
                                <span className="w-10 h-10 rounded-xl bg-white/5 border border-white/10 text-brandAccent flex items-center justify-center shrink-0">
                                    <Icon name="tracking" size={18} />
                                </span>
                                <div className="min-w-0">
                                    <p className="font-semibold text-white text-sm">Live Fleet Tracking</p>
                                    <p className="text-xs text-slate-400 truncate">{ongoingCount} ongoing &middot; {upcomingCount} upcoming</p>
                                </div>
                            </div>
                            <span className="inline-flex items-center gap-1.5 bg-red-500/15 text-red-400 text-[10px] font-bold uppercase tracking-wide px-2 py-1 rounded-full shrink-0">
                                <span className="w-1.5 h-1.5 rounded-full bg-red-400 sos-pulse" />Live
                            </span>
                        </div>
                    </div>

                    {/* A plain clickable div, not a <button> - FleetMap renders real interactive Google
                        Maps controls (the zoom buttons are real <button> elements) even with
                        pointer-events-none silencing them, and nesting those inside a <button> is
                        invalid HTML. role="button" + onKeyDown keeps it keyboard-accessible without
                        that nesting problem. */}
                    {/* flex-1/min-h (not a fixed height) so this stretches to match whatever height
                        the Arrivals & Departures card next to it ends up needing - both cards' middle
                        sections grow together off the grid's items-stretch, instead of leaving a gap
                        under a short, fixed-height map when the other card is taller. */}
                    <div onClick={() => setActiveTab('Live Fleet Tracking')} role="button" tabIndex={0}
                        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') setActiveTab('Live Fleet Tracking'); }}
                        className="relative flex-1 min-h-[256px] w-full cursor-pointer group" aria-label="Open Live Fleet Tracking">
                        <div className="pointer-events-none h-full">
                            <FleetMap assignments={data.assignments} selectedId={null} onSelect={() => {}} showPhase="All Active" heightClassName="h-full" showLegend={false} />
                        </div>
                        <div className="absolute inset-0 bg-slate-900/0 group-hover:bg-slate-900/5 transition-colors" />
                    </div>

                    <div className="px-5 py-3 border-t border-slate-200 flex items-center justify-between gap-3">
                        <p className="text-xs text-slate-500">
                            {activeSOSCount > 0
                                ? <span className="text-red-600 font-semibold">{activeSOSCount} active SOS alert{activeSOSCount === 1 ? '' : 's'}</span>
                                : 'No active SOS alerts'}
                        </p>
                        <button onClick={() => setActiveTab('Live Fleet Tracking')} className="shrink-0 text-sm font-semibold text-brandAccent hover:underline">
                            View Full Tracking &rarr;
                        </button>
                    </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-card overflow-hidden flex flex-col">
                    {/* Same dark hero header treatment as the Fleet Tracking card next to it - this
                        data is polled the same live way, so it reads as the same kind of section. */}
                    <div className="relative overflow-hidden bg-slate-900 shrink-0">
                        <div className="absolute -bottom-12 -left-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none" />
                        <div className="relative px-5 py-4 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3 min-w-0">
                                <span className="w-10 h-10 rounded-xl bg-white/5 border border-white/10 text-emerald-400 flex items-center justify-center shrink-0">
                                    <Icon name="travel" size={18} />
                                </span>
                                <div className="min-w-0">
                                    <p className="font-semibold text-white text-sm">Arrivals & Departures</p>
                                    <p className="text-xs text-slate-400 truncate">{data.manualPlans.length} record{data.manualPlans.length === 1 ? '' : 's'} tracked</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                <span className="inline-flex items-center gap-1.5 bg-red-500/15 text-red-400 text-[10px] font-bold uppercase tracking-wide px-2 py-1 rounded-full">
                                    <span className="w-1.5 h-1.5 rounded-full bg-red-400 sos-pulse" />Live
                                </span>
                                {/* One button refreshes every record shown here at once - unlike Travel
                                    Plans' own per-row refresh, this preview is meant to be glanced at as a whole. */}
                                <button onClick={refreshAllLiveStatus} disabled={isRefreshingStatus}
                                    className="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 bg-white/5 hover:bg-white/10 text-slate-200 border border-white/10 rounded-full transition disabled:opacity-50">
                                    <span className={`inline-block leading-none ${isRefreshingStatus ? 'animate-spin' : ''}`}>&#8635;</span>
                                    {isRefreshingStatus ? 'Refreshing...' : 'Refresh Live Status'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 min-h-[256px] divide-y divide-slate-100">
                        {recentManualPlans.length === 0 ? (
                            <div className="h-full flex items-center justify-center px-5 py-10">
                                <p className="text-sm text-slate-400 text-center">No arrival/departure records yet - add one from Travel Plans.</p>
                            </div>
                        ) : recentManualPlans.map(plan => {
                            const status = mockTransportStatus(plan.transportMode, plan.transportNumber, plan.pnrNumber, statusNonce);
                            return (
                                <button key={plan.id} onClick={() => setActiveTab('Travel Plans')}
                                    className="w-full text-left px-5 py-4 hover:bg-slate-50 transition-colors">
                                    <div className="flex items-start justify-between gap-3">
                                        <div className="flex items-center gap-3 min-w-0">
                                            <span className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 text-[11px] font-bold uppercase ${plan.planType === 'Arrival' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-brandAccent'}`}>
                                                {plan.transportMode.slice(0, 2)}
                                            </span>
                                            <div className="min-w-0">
                                                <p className="text-sm font-semibold text-slate-800 truncate">
                                                    {plan.departmentName}{plan.federation && <span className="text-slate-400 font-normal"> &middot; {plan.federation}</span>}
                                                </p>
                                                <p className="text-xs text-slate-400 truncate">{plan.role || 'Unspecified role'} &middot; {plan.memberSize || plan.people.length || 0} member{Number(plan.memberSize) === 1 ? '' : 's'}</p>
                                            </div>
                                        </div>
                                        <Badge status={plan.planType} />
                                    </div>

                                    <div className="mt-3 grid grid-cols-2 gap-2.5 text-xs">
                                        <div className="min-w-0">
                                            <p className="font-semibold text-slate-400 uppercase tracking-wide">{plan.transportMode}</p>
                                            <p className="text-slate-700 font-medium truncate">{plan.transportNumber || '—'}</p>
                                        </div>
                                        <div className="min-w-0">
                                            <p className="font-semibold text-slate-400 uppercase tracking-wide">PNR</p>
                                            <p className="text-slate-700 font-mono truncate">{plan.pnrNumber || '—'}</p>
                                        </div>
                                        <div className="min-w-0">
                                            <p className="font-semibold text-slate-400 uppercase tracking-wide">{plan.planType} Time</p>
                                            <p className="text-slate-700 truncate">{plan.date || '—'} {plan.time}</p>
                                        </div>
                                        <div className="min-w-0">
                                            <p className="font-semibold text-slate-400 uppercase tracking-wide">{plan.location ? 'Location' : 'City'}</p>
                                            <p className="text-slate-700 truncate">{plan.location || plan.city || '—'}</p>
                                        </div>
                                    </div>

                                    <div className="mt-3 pt-3 border-t border-slate-100">
                                        {plan.transportMode === 'Flight' || plan.transportMode === 'Train' ? (
                                            status ? (
                                                <div className="flex items-center gap-2 min-w-0">
                                                    <Badge status={status.status} />
                                                    <p className="text-xs text-slate-400 truncate">{status.detail} &middot; as of {status.updatedAt}</p>
                                                </div>
                                            ) : (
                                                <p className="text-xs text-slate-400">Enter a {plan.transportMode.toLowerCase()} number and PNR to check Live Status.</p>
                                            )
                                        ) : (
                                            <p className="text-xs text-slate-400">Live status isn't tracked for {plan.transportMode}.</p>
                                        )}
                                    </div>
                                </button>
                            );
                        })}
                    </div>

                    <div className="px-5 py-3 border-t border-slate-200 text-right">
                        <button onClick={() => setActiveTab('Travel Plans')} className="text-sm font-semibold text-brandAccent hover:underline">
                            View All Arrivals & Departures &rarr;
                        </button>
                    </div>
                </div>
            </div>

            {/* Global Fleet Status - the same counts Inventory Management's own sidebar shows, as a
                horizontal capsule rather than that tab's tall vertical panel, since here it's just a
                glance rather than the page's whole reason for being. "View Details" hands off to the
                real thing (Inventory Management), same pattern as the hero pair above. */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-card overflow-hidden">
                <div className="flex flex-wrap items-center gap-4 sm:gap-6 px-5 py-4">
                    <div className="flex items-center gap-3 shrink-0">
                        <span className="w-9 h-9 rounded-lg bg-slate-900 text-brandAccent flex items-center justify-center shrink-0">
                            <Icon name="inventory" size={16} />
                        </span>
                        <div>
                            <p className="text-sm font-semibold text-slate-800">Global Fleet Status</p>
                            <p className="text-[11px] text-slate-400">{totalVehicles} vehicles &middot; {totalDrivers} drivers</p>
                        </div>
                    </div>

                    <div className="hidden sm:block w-px self-stretch bg-slate-200 shrink-0" />

                    {/* Vehicles and drivers as two separate rows (not one wrapping strip) - each is
                        its own count of things, and mixing them into a single row that wraps
                        unpredictably read as one confusing jumble rather than two clear groups. */}
                    <div className="flex-1 min-w-0 space-y-2">
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide w-16 shrink-0">Vehicles</span>
                            {INVENTORY_STATUSES.map(s => (
                                <div key={s} className={`flex items-center gap-2 px-3 py-2 rounded-xl shrink-0 ${VEHICLE_STATUS_TILE[s].bg}`}>
                                    <Icon name={VEHICLE_STATUS_ICON[s]} size={14} className={VEHICLE_STATUS_TILE[s].text} />
                                    <span className={`text-base font-bold leading-none ${VEHICLE_STATUS_TILE[s].text}`}>{globalVehicleCounts[s] || 0}</span>
                                    <span className="text-[10px] font-semibold text-slate-500 uppercase tracking-wide">{s}</span>
                                </div>
                            ))}
                        </div>
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide w-16 shrink-0">Drivers</span>
                            {DRIVER_INVENTORY_STATUSES.map(s => (
                                <div key={s} className={`flex items-center gap-2 px-3 py-2 rounded-xl shrink-0 ${DRIVER_STATUS_TILE[s].bg}`}>
                                    <Icon name={DRIVER_STATUS_ICON[s]} size={14} className={DRIVER_STATUS_TILE[s].text} />
                                    <span className={`text-base font-bold leading-none ${DRIVER_STATUS_TILE[s].text}`}>{globalDriverCounts[s] || 0}</span>
                                    <span className="text-[10px] font-semibold text-slate-500 uppercase tracking-wide">{s}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <button onClick={() => setActiveTab('Inventory Management')}
                        className="shrink-0 inline-flex items-center gap-1.5 text-sm font-semibold text-brandAccent hover:underline">
                        View Details &rarr;
                    </button>
                </div>
            </div>

            {/* Upcoming Events + Smart Suggestions side by side - Admins Online/Unread Alerts used to
                sit here; that space now goes to Smart Suggestions instead, since a proactive "here's
                what needs attention" card earns the spot more than a roster/alert list already
                reachable from the header bell and Admin Management. Deliberately uneven (35/65, not an
                even split) - Upcoming Events is a short reference list, Smart Suggestions' cards carry
                a lot more text (fact + a whole suggestion callout each) and earn the extra room. `fr`
                units (not %) so the gap between them doesn't get counted twice. */}
            <div className="grid grid-cols-1 lg:grid-cols-[35fr_65fr] gap-6">
                <UpcomingEventsCard events={data.calendarEvents} />
                <SmartSuggestionsCard data={data} />
            </div>
        </div>
    );
};

</script>
<script type="text/babel">
/* global React, Card, Badge, Btn, Modal, Input, Select, ExportImport, ImportButton, VendorCard, Icon, exportCSV, importCSV, uid, VEHICLE_CATEGORIES, vehicleCategoryOf, vehicleModelLabel, vehicleFuelProfile, vehicleAllocationStatus, driverAllocationStatus, avatarGradientFor, initialsOf */
const { useState, useRef, useMemo } = React;

const DEFAULT_FORM = {
    name: '',
    gstin: '', gstinFile: null,
    tradeCert: '', tradeCertFile: null,
    contact: '', phone: '', email: '', aadhaar: '', pocImage: null,
    fleet: [{ type: 'Bus', model: 'Ashok Leyland Viking', capacity: 40, avgConsumption: vehicleCategoryOf('Bus').avgConsumption, fuelType: vehicleCategoryOf('Bus').fuelType, regNo: '', pucFile: null, insuranceFile: null, status: 'Active' }],
    // Drivers captured at onboarding time are unassigned (no vehicleId yet, no vendorId field either
    // since the vendor itself is what's being created) - pairing a driver to one of this vendor's
    // vehicles is still a separate, deliberate step done afterward from the vendor's detail page, same
    // as a driver added there one at a time. This just lets a whole starting roster be entered (or
    // imported) alongside the fleet instead of one-by-one after the vendor exists.
    drivers: [],
};

const BLANK_VEHICLE = { type: 'Bus', model: 'Ashok Leyland Viking', capacity: 40, avgConsumption: vehicleCategoryOf('Bus').avgConsumption, fuelType: vehicleCategoryOf('Bus').fuelType, regNo: '', pucFile: null, insuranceFile: null, status: 'Active' };
const BLANK_ONBOARD_DRIVER = { name: '', licenseId: '', phone: '', licenseExpiry: '', costPerHour: '' };
const VEHICLE_TYPE_OPTIONS = VEHICLE_CATEGORIES.map(c => c.type);
const FUEL_TYPE_OPTIONS = ['Petrol', 'Diesel'];

// Vehicles and drivers are onboarded independently now - these are the blank-slate shapes for the
// standalone Create Vehicle and Add Driver forms (as opposed to BLANK_VEHICLE above, which is only
// for the initial fleet rows inside vendor onboarding). avgConsumption ("Average Mileage" in the
// form) and fuelType ("Fuel Type") both start at the picked category's default and stay editable - a
// specific vehicle's real mileage/fuel can differ, and both feed window.estimateTripCost's fuel-cost
// half (fuelType picks which of Admin Management's Petrol/Diesel prices applies). vendorId now comes
// from whichever vendor's detail page the form was opened from - both modals live inside that page.
const BLANK_NEW_VEHICLE = { vendorId: '', type: 'Sedan', model: 'Swift Dzire', capacity: 3, avgConsumption: vehicleCategoryOf('Sedan').avgConsumption, fuelType: vehicleCategoryOf('Sedan').fuelType, regNo: '', pucFile: null, insuranceFile: null, status: 'Active' };
// costPerHour feeds the driver half of window.estimateTripCost in Travel Plans - left blank (null)
// until set, rather than defaulted to some flat number, since drivers are typically paid different
// rates and there's no sensible one-size-fits-all guess.
const BLANK_DRIVER = { vendorId: '', name: '', licenseId: '', phone: '', licenseExpiry: '', costPerHour: '', licenseFile: null, photo: null, vehicleId: '' };

// Vehicle name entry: pick a common Indian make/model for the chosen category from the dropdown,
// or just type one that isn't listed - a native <input list> combobox gives both without a custom
// dropdown widget. useId keeps the <datalist> id unique even with several of these open at once
// (e.g. one per row in the onboarding form's Vehicle Assets list).
function ModelInput({ value, onChange, models }) {
    const listId = `model-list-${React.useId()}`;
    return (
        <label className="block">
            <span className="text-xs font-medium text-slate-500 mb-1 block">Model</span>
            <input list={listId} value={value} onChange={e => onChange(e.target.value)}
                placeholder="Pick or type a model..."
                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
            <datalist id={listId}>
                {models.map(m => <option key={m} value={m} />)}
            </datalist>
        </label>
    );
}

function FileUploadField({ label, fileName, onSelect, onClear, accept }) {
    const inputRef = useRef(null);
    return (
        <div>
            <span className="text-xs font-medium text-slate-500 mb-1 block">{label}</span>
            {fileName ? (
                <div className="flex items-center gap-2 px-3 py-2 border border-slate-200 rounded-lg bg-slate-50 text-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-brandAccent shrink-0">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <path d="M14 2v6h6" />
                    </svg>
                    <span className="flex-1 min-w-0 truncate text-slate-700">{fileName}</span>
                    <button type="button" onClick={onClear} aria-label={`Remove ${label}`} className="text-slate-400 hover:text-red-500 shrink-0">
                        <Icon name="close" size={14} />
                    </button>
                </div>
            ) : (
                <>
                    <Btn variant="outline" type="button" className="w-full" onClick={() => inputRef.current?.click()}>
                        <Icon name="upload" size={14} className="inline mr-1" />Upload File
                    </Btn>
                    <input ref={inputRef} type="file" accept={accept} className="hidden"
                        onChange={e => { const f = e.target.files[0]; if (f) onSelect(f.name); e.target.value = ''; }} />
                </>
            )}
        </div>
    );
}

// A single document on the Driver/Vehicle Management detail modals - same labeled-icon-badge
// treatment (blue file icon + Preview link, or amber alert + "Not uploaded") a vendor's own Uploaded
// Documents grid already uses, but editable in place: Replace re-opens the file picker even when a
// file is already on record (FileUploadField only offers that once the existing one is cleared
// first), and Remove clears it straight away - full add/remove/replace lifecycle for an existing
// driver or vehicle's paperwork without having to redo the Add Driver/Create Vehicle flow.
function DocRow({ label, fileName, accept, onSelect, onRemove }) {
    const inputRef = useRef(null);
    return (
        <div className={`flex items-center gap-3 p-3 border rounded-lg ${fileName ? 'border-slate-200 bg-slate-50' : 'border-amber-200 bg-amber-50'}`}>
            <div className={`shrink-0 w-9 h-9 rounded-lg flex items-center justify-center ${fileName ? 'bg-blue-50 text-brandAccent' : 'bg-amber-100 text-amber-600'}`}>
                {fileName ? (
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <path d="M14 2v6h6" />
                    </svg>
                ) : (
                    <Icon name="alert" size={16} />
                )}
            </div>
            <div className="flex-1 min-w-0">
                <p className="text-sm font-medium text-slate-800">{label}</p>
                {fileName ? (
                    <button type="button" onClick={() => alert(`Preview: ${fileName}`)}
                        className="text-xs text-brandAccent font-medium hover:underline truncate">
                        {fileName}  ·  Preview
                    </button>
                ) : (
                    <p className="text-xs text-amber-700">Not uploaded</p>
                )}
            </div>
            <div className="flex items-center gap-1 shrink-0">
                <button type="button" onClick={() => inputRef.current?.click()}
                    className="p-1.5 text-slate-400 hover:text-brandAccent hover:bg-white rounded-lg transition"
                    aria-label={`${fileName ? 'Replace' : 'Upload'} ${label}`} title={fileName ? 'Replace' : 'Upload'}>
                    <Icon name="upload" size={14} />
                </button>
                {fileName && (
                    <button type="button" onClick={onRemove}
                        className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-white rounded-lg transition"
                        aria-label={`Remove ${label}`} title="Remove">
                        <Icon name="trash" size={14} />
                    </button>
                )}
                <input ref={inputRef} type="file" accept={accept} className="hidden"
                    onChange={e => { const f = e.target.files[0]; if (f) onSelect(f.name); e.target.value = ''; }} />
            </div>
        </div>
    );
}

window.VendorsTab = ({ data, setData }) => {
    // Vendors are the single entry point now - a big card per vendor, click through to that
    // vendor's own fleet/driver/compliance detail. The old flat cross-vendor Vehicles and Drivers
    // sub-tabs are gone; every vehicle/driver is reached through its vendor's card instead.
    const [subview, setSubview] = useState('list');
    const [selected, setSelected] = useState(null);
    const [modal, setModal] = useState(false);
    const [form, setForm] = useState({ ...DEFAULT_FORM, fleet: [{ ...BLANK_VEHICLE }] });
    const [vendorSearch, setVendorSearch] = useState('');
    const [contractFilter, setContractFilter] = useState('All');
    const [fleetSearch, setFleetSearch] = useState('');
    const [fleetStatusFilter, setFleetStatusFilter] = useState('All');

    // --- Create Vehicle / Add Driver, both scoped to whichever vendor's detail page they're opened from ---
    const [vehicleModal, setVehicleModal] = useState(false);
    const [vehicleForm, setVehicleForm] = useState({ ...BLANK_NEW_VEHICLE });
    const [driverModal, setDriverModal] = useState(false);
    const [driverForm, setDriverForm] = useState({ ...BLANK_DRIVER });

    const filteredVendors = useMemo(() => {
        const q = vendorSearch.trim().toLowerCase();
        return data.vendors.filter(v => {
            const matchesSearch = !q || v.name.toLowerCase().includes(q) || v.contact.toLowerCase().includes(q) || v.id.toLowerCase().includes(q);
            const matchesFilter = contractFilter === 'All' || v.contract === contractFilter;
            return matchesSearch && matchesFilter;
        });
    }, [data.vendors, vendorSearch, contractFilter]);

    const filteredFleet = useMemo(() => {
        if (!selected) return [];
        const q = fleetSearch.trim().toLowerCase();
        return selected.fleet.filter(f => {
            const matchesSearch = !q || f.id.toLowerCase().includes(q) || f.type.toLowerCase().includes(q) || (f.regNo || '').toLowerCase().includes(q);
            const matchesFilter = fleetStatusFilter === 'All' || f.status === fleetStatusFilter;
            return matchesSearch && matchesFilter;
        });
    }, [selected, fleetSearch, fleetStatusFilter]);

    // Every vehicle across every vendor, flattened with vendor context attached - still needed for
    // the pairing-confirm modal (it can reference a driver's *previous* vehicle, which by the
    // same-vendor pairing rule always belongs to this vendor too, but is easiest to resolve from one
    // flat list) and for the Add Driver form's vehicle-assign dropdown.
    const allVehicles = useMemo(() =>
        data.vendors.flatMap(v => v.fleet.map(f => ({ ...f, vendorId: v.id, vendorName: v.name }))),
        [data.vendors]
    );

    const driverForVehicle = (vehicleId) => data.drivers.find(d => d.vehicleId === vehicleId) || null;

    const viewFleet = (v) => {
        setSelected(v);
        setSubview('detail');
        setFleetSearch('');
        setFleetStatusFilter('All');
    };

    const addVehicle = () => {
        setForm(f => ({ ...f, fleet: [...f.fleet, { ...BLANK_VEHICLE }] }));
    };

    const removeVehicle = (index) => {
        setForm(f => ({ ...f, fleet: f.fleet.filter((_, i) => i !== index) }));
    };

    const updateVehicle = (index, field, value) => {
        setForm(f => ({
            ...f,
            fleet: f.fleet.map((v, i) => {
                if (i !== index) return v;
                // Picking a category auto-fills its default capacity, first model, average mileage,
                // and fuel type (all still editable) instead of leaving them to silently mismatch
                // what was picked before.
                if (field === 'type') {
                    const cat = vehicleCategoryOf(value);
                    return { ...v, type: value, capacity: cat ? cat.capacity : v.capacity, model: cat ? cat.models[0] : '', avgConsumption: cat ? cat.avgConsumption : v.avgConsumption, fuelType: cat ? cat.fuelType : v.fuelType };
                }
                return { ...v, [field]: value };
            }),
        }));
    };

    // Imported CSV rows land straight in form.fleet, same shape/defaults as a manually-added row -
    // they show up as ordinary editable rows in Vehicle Assets, so anything the sheet got wrong (or
    // left out) can still be fixed before Onboard Vendor is actually submitted.
    const importVehiclesToForm = (file) => importCSV(file, rows => {
        const imported = rows.map(r => {
            const cat = vehicleCategoryOf(r.type) || vehicleCategoryOf('Bus');
            return {
                type: r.type || cat.type, model: r.model || cat.models[0],
                capacity: Number(r.capacity) || cat.capacity,
                avgConsumption: Number(r.avgConsumption) || cat.avgConsumption,
                fuelType: r.fuelType || cat.fuelType, regNo: r.regNo || '',
                pucFile: null, insuranceFile: null, status: r.status || 'Active',
            };
        });
        setForm(f => ({ ...f, fleet: [...f.fleet, ...imported] }));
        alert(`Imported ${imported.length} vehicle(s) into the form - review them in Vehicle Assets before submitting.`);
    });

    // --- Driver roster, same "editable rows, import fills them in" pattern as Vehicle Assets above.
    // Unlike the fleet rows, these have no vendorId/vehicleId to set here - the vendor is whatever this
    // whole form becomes, and vehicle pairing is a separate step from the vendor's detail page afterward.
    const addDriverRow = () => setForm(f => ({ ...f, drivers: [...f.drivers, { ...BLANK_ONBOARD_DRIVER }] }));
    const removeDriverRow = (index) => setForm(f => ({ ...f, drivers: f.drivers.filter((_, i) => i !== index) }));
    const updateDriverRow = (index, field, value) => setForm(f => ({
        ...f,
        drivers: f.drivers.map((dr, i) => i === index ? { ...dr, [field]: value } : dr),
    }));
    const importDriversToForm = (file) => importCSV(file, rows => {
        const imported = rows.map(r => ({
            name: r.name || '', licenseId: r.licenseId || '', phone: r.phone || '',
            licenseExpiry: r.licenseExpiry || '', costPerHour: r.costPerHour || '',
        }));
        setForm(f => ({ ...f, drivers: [...f.drivers, ...imported] }));
        alert(`Imported ${imported.length} driver(s) into the form - review them in the Driver Roster before submitting.`);
    });

    const saveVendor = () => {
        const fleet = form.fleet.map(v => ({
            id: uid('VH'),
            type: v.type,
            model: v.model,
            capacity: Number(v.capacity) || 0,
            avgConsumption: Number(v.avgConsumption) || vehicleCategoryOf(v.type)?.avgConsumption,
            fuelType: v.fuelType || vehicleCategoryOf(v.type)?.fuelType,
            regNo: v.regNo,
            pucFile: v.pucFile,
            insuranceFile: v.insuranceFile,
            status: 'Active',
        }));
        const v = {
            id: uid('VND'),
            name: form.name,
            gstin: form.gstin,
            gstinFile: form.gstinFile,
            tradeCert: form.tradeCert,
            tradeCertFile: form.tradeCertFile,
            contact: form.contact,
            phone: form.phone,
            email: form.email,
            aadhaar: form.aadhaar,
            pocImage: form.pocImage,
            contract: 'Pending',
            fleetCount: fleet.length,
            fleet,
        };

        // Manually-entered or imported roster rows, turned into real driver records the moment the
        // vendor itself is created - unassigned (vehicleId: null) since pairing one of this vendor's
        // vehicles to a driver is still its own deliberate step from the vendor's detail page, exactly
        // like a driver added there one at a time. No license-verification inspection is raised here
        // (unlike Add Driver's) since onboarding never collects a license file to actually verify.
        const drivers = form.drivers.filter(dr => dr.name.trim()).map(dr => ({
            id: uid('DRV'), name: dr.name, vendor: form.name,
            licenseId: dr.licenseId, phone: dr.phone, licenseExpiry: dr.licenseExpiry,
            costPerHour: dr.costPerHour === '' ? null : Number(dr.costPerHour),
            licenseFile: null, photo: null, status: 'Active', vehicleId: null,
        }));

        // Every uploaded compliance document becomes a Pending entry for review in Compliance & Inspection.
        const today = new Date().toISOString().slice(0, 10);
        let n = 0;
        const mkInspection = (vehicleId, type) => ({
            id: `${uid('INS')}-${n++}`,
            vehicleId, vendor: form.name, type, date: today, status: 'Pending',
            inspector: 'Unassigned', notes: 'Submitted with new vendor onboarding - awaiting review.',
        });
        const newInspections = [];
        if (form.gstinFile) newInspections.push(mkInspection('N/A', 'GSTIN Certificate'));
        if (form.tradeCertFile) newInspections.push(mkInspection('N/A', 'Trade Certificate'));
        if (form.pocImage) newInspections.push(mkInspection('N/A', 'POC Identity Document'));
        // One consolidated row per vehicle - covers PUC, Insurance & the physical inspection together
        // instead of splitting them into separate rows.
        fleet.forEach(veh => newInspections.push(mkInspection(veh.id, 'PUC, Insurance & Physical Inspection')));

        setData(d => ({
            ...d,
            vendors: [...d.vendors, v],
            drivers: [...d.drivers, ...drivers],
            inspections: [...d.inspections, ...newInspections],
        }));
        setModal(false);
        setForm({ ...DEFAULT_FORM, fleet: [{ ...BLANK_VEHICLE }] });
    };

    // gstinFile/tradeCertFile/pocImage are set explicitly to null (not just left off the object) so
    // a freshly-imported vendor is never in a different shape than one created through Onboard Vendor -
    // CSV is text-only, so these always start unset regardless of what (if anything) a sheet has in
    // those columns; attaching them is a one-at-a-time action from the vendor's own detail page.
    const handleImport = (file) => importCSV(file, rows => {
        const imported = rows.map(r => ({
            id: r.id || uid('VND'), name: r.name, contact: r.contact, phone: r.phone,
            email: r.email, contract: r.contract || 'Active', fleetCount: Number(r.fleetCount) || 0, fleet: [],
            gstinFile: null, tradeCertFile: null, pocImage: null,
        }));
        setData(d => ({ ...d, vendors: [...d.vendors, ...imported] }));
        alert(`Imported ${imported.length} vendors. Documents (GSTIN, trade certificate, POC image) aren't part of CSV - attach each one from the vendor's detail page.`);
    });

    // --- Create Vehicle - opened either from a vendor's detail page (vendorId pre-filled from
    // context) or as an independent action from the vendor list itself (vendorId starts blank and
    // must be picked - see the Vendor field in the modal below, which only appears in this second case).
    const openVehicleModal = () => {
        setVehicleForm({ ...BLANK_NEW_VEHICLE, vendorId: selected ? selected.id : '' });
        setVehicleModal(true);
    };

    const updateVehicleForm = (field, value) => {
        setVehicleForm(f => {
            if (field === 'type') {
                const cat = vehicleCategoryOf(value);
                return { ...f, type: value, capacity: cat ? cat.capacity : f.capacity, model: cat ? cat.models[0] : '', avgConsumption: cat ? cat.avgConsumption : f.avgConsumption, fuelType: cat ? cat.fuelType : f.fuelType };
            }
            return { ...f, [field]: value };
        });
    };

    const createVehicle = () => {
        if (!vehicleForm.vendorId || !vehicleForm.regNo.trim()) return;
        const vendor = data.vendors.find(v => v.id === vehicleForm.vendorId);
        const vehicle = {
            id: uid('VH'), type: vehicleForm.type, model: vehicleForm.model,
            capacity: Number(vehicleForm.capacity) || 0,
            avgConsumption: Number(vehicleForm.avgConsumption) || vehicleCategoryOf(vehicleForm.type)?.avgConsumption,
            fuelType: vehicleForm.fuelType || vehicleCategoryOf(vehicleForm.type)?.fuelType,
            regNo: vehicleForm.regNo,
            pucFile: vehicleForm.pucFile, insuranceFile: vehicleForm.insuranceFile, status: vehicleForm.status,
        };
        const today = new Date().toISOString().slice(0, 10);
        const inspection = {
            id: uid('INS'), vehicleId: vehicle.id, vendor: vendor ? vendor.name : '',
            type: 'PUC, Insurance & Physical Inspection', date: today, status: 'Pending',
            inspector: 'Unassigned', notes: 'Submitted from Create Vehicle - awaiting review.',
        };
        setData(d => ({
            ...d,
            vendors: d.vendors.map(v => v.id === vehicleForm.vendorId
                ? { ...v, fleet: [...v.fleet, vehicle], fleetCount: v.fleet.length + 1 }
                : v),
            inspections: [...d.inspections, inspection],
        }));
        // Keep the detail page's `selected` vendor in sync so the new vehicle shows up immediately
        // instead of only after navigating back to the card grid and re-opening the vendor.
        setSelected(s => s && s.id === vehicleForm.vendorId ? { ...s, fleet: [...s.fleet, vehicle], fleetCount: s.fleet.length + 1 } : s);
        setVehicleModal(false);
        setVehicleForm({ ...BLANK_NEW_VEHICLE });
    };

    // Bulk version of Create Vehicle above, for a vendor's own Fleet card - every imported row becomes
    // a real vehicle straight away (unlike Onboard Vendor's import, which only fills editable form
    // rows), each raising the same Pending compliance inspection Create Vehicle raises one at a time.
    const importVehiclesToVendor = (vendorId, file) => importCSV(file, rows => {
        const vendor = data.vendors.find(v => v.id === vendorId);
        const today = new Date().toISOString().slice(0, 10);
        const vehicles = rows.map(r => {
            const cat = vehicleCategoryOf(r.type) || vehicleCategoryOf('Bus');
            return {
                id: uid('VH'), type: r.type || cat.type, model: r.model || cat.models[0],
                capacity: Number(r.capacity) || cat.capacity,
                avgConsumption: Number(r.avgConsumption) || cat.avgConsumption,
                fuelType: r.fuelType || cat.fuelType, regNo: r.regNo || '',
                pucFile: null, insuranceFile: null, status: r.status || 'Active',
            };
        });
        const newInspections = vehicles.map(veh => ({
            id: uid('INS'), vehicleId: veh.id, vendor: vendor ? vendor.name : '',
            type: 'PUC, Insurance & Physical Inspection', date: today, status: 'Pending',
            inspector: 'Unassigned', notes: 'Submitted from Import Vehicle - awaiting review.',
        }));
        setData(d => ({
            ...d,
            vendors: d.vendors.map(v => v.id === vendorId
                ? { ...v, fleet: [...v.fleet, ...vehicles], fleetCount: v.fleet.length + vehicles.length }
                : v),
            inspections: [...d.inspections, ...newInspections],
        }));
        setSelected(s => s && s.id === vendorId ? { ...s, fleet: [...s.fleet, ...vehicles], fleetCount: s.fleet.length + vehicles.length } : s);
        alert(`Imported ${vehicles.length} vehicle(s) into ${vendor ? vendor.name : 'this vendor'}'s fleet.`);
    });

    // Reassigns which driver a vehicle has. Exclusive both ways - claiming a vehicle for one driver
    // bumps whoever else had it, since a vehicle only ever has one driver at a time. This is the
    // single low-level committer both the Fleet table and Driver Details table pairing controls
    // funnel through - vehicleId/driverId can each be '' to mean "clear whichever side wasn't specified".
    const commitPairing = (vehicleId, driverId) => {
        setData(d => ({
            ...d,
            drivers: d.drivers.map(dr => {
                if (driverId && dr.id === driverId) return { ...dr, vehicleId: vehicleId || null };
                if (vehicleId && dr.vehicleId === vehicleId && dr.id !== driverId) return { ...dr, vehicleId: null };
                return dr;
            }),
        }));
    };

    // A manual, one-off driver<->vehicle change is a deliberate operational decision (it can bump
    // someone else off their vehicle, or move a driver off theirs) - so unlike a blur-only field, it
    // never applies straight off the dropdown's onChange. Picking a new value only stages it here;
    // the dropdown itself stays showing the *current* pairing until the confirm modal is accepted.
    const [pendingPairing, setPendingPairing] = useState(null); // { vehicleId, driverId }
    // Draft Cost/Hour typed into the confirm modal, only ever shown/required when the driver being
    // newly given a vehicle has no rate on file yet - reset every time a new pairing is staged so a
    // leftover draft from a previous confirm never carries over onto the next one.
    const [pairingCostDraft, setPairingCostDraft] = useState('');

    const requestPairing = (vehicleId, driverId) => { setPendingPairing({ vehicleId, driverId }); setPairingCostDraft(''); };

    // Live-derived (not snapshotted) so the confirm modal always reflects current data even if
    // something else changes data.drivers while it's open.
    const pendingVehicle = pendingPairing?.vehicleId ? allVehicles.find(v => v.id === pendingPairing.vehicleId) : null;
    const pendingNewDriver = pendingPairing?.driverId ? data.drivers.find(d => d.id === pendingPairing.driverId) : null;
    const pendingBumpedDriver = pendingPairing?.vehicleId ? driverForVehicle(pendingPairing.vehicleId) : null;
    const pendingDriverPrevVehicle = pendingNewDriver?.vehicleId && pendingNewDriver.vehicleId !== pendingPairing?.vehicleId
        ? allVehicles.find(v => v.id === pendingNewDriver.vehicleId) : null;

    // A driver can't be *given* a vehicle (as opposed to being unassigned from one) while they have
    // no Cost/Hour on file - every Travel/Shuttle Plan estimate built on them needs a rate to read, so
    // the confirm modal below folds "set a rate" and "confirm the assignment" into one required step
    // instead of letting an unrated driver quietly end up on a vehicle.
    const pairingCostRequired = !!pendingPairing?.vehicleId && !!pendingNewDriver && pendingNewDriver.costPerHour == null;
    const pairingCostValid = (() => {
        const n = Number(pairingCostDraft);
        return pairingCostDraft.trim() !== '' && Number.isFinite(n) && n >= 0;
    })();

    const confirmPairing = () => {
        if (!pendingPairing) return;
        if (pairingCostRequired) {
            if (!pairingCostValid) return; // guarded by the disabled Confirm button too
            setData(d => ({ ...d, drivers: d.drivers.map(dr => dr.id === pendingNewDriver.id ? { ...dr, costPerHour: Number(pairingCostDraft) } : dr) }));
        }
        commitPairing(pendingPairing.vehicleId, pendingPairing.driverId);
        setPendingPairing(null);
        setPairingCostDraft('');
    };

    // Bulk auto-assignment of vacant drivers to vacant vehicles (autoAssignDriversToVehicles, further
    // down near the Driver Management card) reuses this same pairingCostRequired rule via its own
    // follow-up prompt - this section stays the deliberate, one-at-a-time reassignment flow
    // (requestPairing/confirmPairing), which is the only way to change an *existing* pairing.

    // Changing an *existing* driver's hourly cost feeds straight into window.estimateTripCost - every
    // Travel Plan and Shuttle Plan estimate built on this driver shifts the moment it changes - so
    // this is a "serious flow" like the driver<->vehicle pairing above, not a fire-on-every-keystroke
    // field. The input tracks its own draft locally (costDrafts) while being typed into; only on blur
    // does a real, different value get staged behind a confirm. (Setting the rate for the first time
    // on a brand new driver, in the Add Driver modal below, has no existing estimates to disturb, so
    // that one stays instant.)
    const [costDrafts, setCostDrafts] = useState({}); // driverId -> string, only present while its field has an unconfirmed edit
    const [pendingCostChange, setPendingCostChange] = useState(null); // { driverId, driverName, oldValue, newValue }

    const clearCostDraft = (driverId) => setCostDrafts(d => {
        const next = { ...d };
        delete next[driverId];
        return next;
    });

    const requestCostChange = (driver) => {
        const draft = costDrafts[driver.id];
        if (draft === undefined) return; // blurred without editing - nothing to do
        const oldValue = driver.costPerHour ?? null;
        const newValue = draft === '' ? null : Number(draft);
        clearCostDraft(driver.id); // input falls back to showing the still-committed value until confirmed
        if (newValue === oldValue || (Number.isNaN(newValue) && draft.trim() !== '')) return; // no real change (or an unparsable one - just discard it)
        setPendingCostChange({ driverId: driver.id, driverName: driver.name, oldValue, newValue: Number.isFinite(newValue) ? newValue : null });
    };

    const confirmCostChange = () => {
        if (!pendingCostChange) return;
        const { driverId, newValue } = pendingCostChange;
        setData(d => ({
            ...d,
            drivers: d.drivers.map(dr => dr.id === driverId ? { ...dr, costPerHour: newValue } : dr),
        }));
        setPendingCostChange(null);
    };

    // --- Driver Management detail modal - end-to-end management for one existing driver (documents,
    // removal, and a shortcut into the same vehicle pairing/cost controls the table already offers),
    // opened from a "Manage" action on the Driver Management table below. Holds only the id, not a
    // snapshot of the driver object, so it always reflects whatever the table/other actions just did -
    // same live-derived pattern as pendingVehicle/pendingNewDriver above.
    const [driverDetailId, setDriverDetailId] = useState(null);
    const driverDetail = driverDetailId ? data.drivers.find(d => d.id === driverDetailId) || null : null;

    // Replaces or clears one uploaded document (License or Photo) on an existing driver record - the
    // post-creation equivalent of the Add Driver form's FileUploadField, committed straight to data.
    const updateDriverDoc = (driverId, field, value) => {
        setData(d => ({ ...d, drivers: d.drivers.map(dr => dr.id === driverId ? { ...dr, [field]: value } : dr) }));
    };

    // Permanently removing a driver is the one truly irreversible action in here (unlike reassignment
    // or a cost change, there's no "undo" by picking a different value), so it's confirm-gated behind
    // its own modal rather than a direct button in the detail view - same convention as API Management's
    // Delete Key. Closes the detail modal too, since its subject no longer exists once this commits.
    const [confirmRemoveDriver, setConfirmRemoveDriver] = useState(null); // the driver pending deletion, or null

    const removeDriver = () => {
        if (!confirmRemoveDriver) return;
        setData(d => ({ ...d, drivers: d.drivers.filter(dr => dr.id !== confirmRemoveDriver.id) }));
        setConfirmRemoveDriver(null);
        setDriverDetailId(null);
    };

    // --- Vehicle Management detail modal - the same end-to-end pattern as Driver Management above
    // (documents, removal, a shortcut into the same pairing control the Fleet Assets table already
    // offers), opened from a "Manage" action on that table. Live-derived from allVehicles (already
    // carries vendorId/vendorName) rather than snapshotted, same reasoning as driverDetail.
    const [vehicleDetailId, setVehicleDetailId] = useState(null);
    const vehicleDetail = vehicleDetailId ? allVehicles.find(f => f.id === vehicleDetailId) || null : null;

    // Replaces or clears one uploaded document (PUC or Insurance) on an existing vehicle - the
    // post-creation equivalent of Create Vehicle's FileUploadField. Vehicles live inside their
    // vendor's own fleet array (not a flat list), so this has to reach in by vendorId; `selected` is
    // kept in sync too, same as importVehiclesToVendor/createVehicle above, so the detail page's own
    // Fleet Assets table reflects the change immediately.
    const updateVehicleDoc = (vendorId, vehicleId, field, value) => {
        setData(d => ({
            ...d,
            vendors: d.vendors.map(v => v.id !== vendorId ? v : { ...v, fleet: v.fleet.map(f => f.id === vehicleId ? { ...f, [field]: value } : f) }),
        }));
        setSelected(s => s && s.id === vendorId ? { ...s, fleet: s.fleet.map(f => f.id === vehicleId ? { ...f, [field]: value } : f) } : s);
    };

    // Permanently removing a vehicle, same confirm-gated convention as removeDriver above. Whoever
    // was driving it becomes unassigned rather than left pointing at a vehicle that no longer exists;
    // its compliance inspection history is left alone, same as a removed driver's.
    const [confirmRemoveVehicle, setConfirmRemoveVehicle] = useState(null); // the vehicle (with vendorId/vendorName) pending deletion, or null

    const removeVendorVehicle = () => {
        if (!confirmRemoveVehicle) return;
        const { vendorId, id: vehicleId } = confirmRemoveVehicle;
        setData(d => ({
            ...d,
            vendors: d.vendors.map(v => v.id !== vendorId ? v : { ...v, fleet: v.fleet.filter(f => f.id !== vehicleId), fleetCount: v.fleet.filter(f => f.id !== vehicleId).length }),
            drivers: d.drivers.map(dr => dr.vehicleId === vehicleId ? { ...dr, vehicleId: null } : dr),
        }));
        setSelected(s => s && s.id === vendorId ? { ...s, fleet: s.fleet.filter(f => f.id !== vehicleId), fleetCount: s.fleet.filter(f => f.id !== vehicleId).length } : s);
        setConfirmRemoveVehicle(null);
        setVehicleDetailId(null);
    };

    // --- Add Driver - same two entry points as Create Vehicle above (vendor's detail page, or
    // independently from the vendor list with a mandatory Vendor field in the modal).
    const openDriverModal = () => {
        setDriverForm({ ...BLANK_DRIVER, vendorId: selected ? selected.id : '' });
        setDriverModal(true);
    };

    const updateDriverForm = (field, value) => setDriverForm(f => ({ ...f, [field]: value }));

    const createDriver = () => {
        if (!driverForm.name.trim() || !driverForm.vendorId) return;
        const vendor = data.vendors.find(v => v.id === driverForm.vendorId);
        const newId = uid('DRV');
        const driver = {
            id: newId, name: driverForm.name, vendor: vendor ? vendor.name : '',
            licenseId: driverForm.licenseId, phone: driverForm.phone, licenseExpiry: driverForm.licenseExpiry,
            costPerHour: driverForm.costPerHour === '' ? null : Number(driverForm.costPerHour),
            licenseFile: driverForm.licenseFile, photo: driverForm.photo, status: 'Active',
            vehicleId: driverForm.vehicleId || null,
        };

        const today = new Date().toISOString().slice(0, 10);
        const newInspections = [];
        if (driverForm.licenseFile) {
            newInspections.push({
                // driverId is carried explicitly (not just derived from vehicleId) so Compliance can
                // still find this driver's document even if they're unassigned or get reassigned later.
                id: uid('INS'), vehicleId: driver.vehicleId || 'N/A', driverId: newId, vendor: driver.vendor,
                type: 'Driver License Verification', date: today, status: 'Pending',
                inspector: 'Unassigned', notes: 'Submitted from Add Driver - awaiting review.',
            });
        }

        setData(d => ({
            ...d,
            drivers: [
                // Claiming a vehicle at creation time bumps whoever else had it, same as commitPairing.
                ...d.drivers.map(dr => (driver.vehicleId && dr.vehicleId === driver.vehicleId) ? { ...dr, vehicleId: null } : dr),
                driver,
            ],
            inspections: [...d.inspections, ...newInspections],
        }));
        setDriverModal(false);
        setDriverForm({ ...BLANK_DRIVER });
    };

    // Bulk version of Add Driver above, for a vendor's own Driver Details card - every imported row
    // becomes a real, unassigned driver straight away. No license-verification inspection is raised
    // (unlike Add Driver's, conditional on a license file) since a CSV row never carries an actual file.
    const importDriversToVendor = (vendorId, file) => importCSV(file, rows => {
        const vendor = data.vendors.find(v => v.id === vendorId);
        const drivers = rows.map(r => ({
            id: uid('DRV'), name: r.name || '', vendor: vendor ? vendor.name : '',
            licenseId: r.licenseId || '', phone: r.phone || '', licenseExpiry: r.licenseExpiry || '',
            costPerHour: r.costPerHour ? Number(r.costPerHour) : null,
            licenseFile: null, photo: null, status: 'Active', vehicleId: null,
        })).filter(dr => dr.name.trim());
        setData(d => ({ ...d, drivers: [...d.drivers, ...drivers] }));
        alert(`Imported ${drivers.length} driver(s) into ${vendor ? vendor.name : 'this vendor'}.`);
    });

    const vendorInspections = selected
        ? data.inspections.filter(i => i.vendor === selected.name)
        : [];

    const vendorDrivers = selected
        ? data.drivers.filter(dr => dr.vendor === selected.name)
        : [];

    // Holds the drivers a just-run Auto-Assign matched to a vehicle but couldn't pair immediately
    // because they have no Cost/Hour on file - { vendorName, readyCount, items: [{ driverId,
    // driverName, vehicleId, vehicleLabel }] }, or null when no follow-up prompt is open.
    const [pendingAutoAssignCosts, setPendingAutoAssignCosts] = useState(null);
    const [autoAssignCostDrafts, setAutoAssignCostDrafts] = useState({}); // driverId -> string

    // Bulk-pairs every vacant (Available) driver at this vendor with a vacant (Available) vehicle from
    // this vendor's own fleet - first-come, first-served by vehicle id. Used to live in Inventory
    // Management; moved here so every driver-facing action (add, remove, documents, cost, and pairing)
    // is reachable from one place - Driver Management, on a vendor's own detail page. Deliberately
    // never touches a driver or vehicle that's already paired to something; reassigning an existing
    // pairing stays the deliberate, one-at-a-time requestPairing/confirmPairing flow above. Scoped to
    // `selected` rather than fleet-wide - there's no legitimate reason a driver at one vendor would
    // ever be paired with another vendor's vehicle, and running this per-vendor makes that impossible
    // by construction instead of relying on a filter to catch it.
    //
    // Same "no vehicle without a Cost/Hour on file" rule as the manual pairing confirm above, just
    // applied to a whole batch at once: a matched driver who already has a rate pairs immediately;
    // one who doesn't gets held back for the pendingAutoAssignCosts follow-up prompt instead of
    // silently landing on a vehicle with no rate for Travel/Shuttle Plan estimates to read.
    const autoAssignDriversToVehicles = () => {
        if (!selected) return;
        const pool = selected.fleet.filter(f => vehicleAllocationStatus(f, data) === 'Available').slice();

        const pairings = {}; // driverId -> vehicleId
        vendorDrivers
            .filter(dr => driverAllocationStatus(dr) === 'Available')
            .forEach(dr => {
                if (pool.length) pairings[dr.id] = pool.shift().id;
            });

        const count = Object.keys(pairings).length;
        if (count === 0) {
            alert(`No vacant drivers and vacant vehicles to pair right now at ${selected.name}.`);
            return;
        }

        const ready = {};
        const needsCost = [];
        Object.entries(pairings).forEach(([driverId, vehicleId]) => {
            const driver = vendorDrivers.find(dr => dr.id === driverId);
            if (!driver) return;
            if (driver.costPerHour == null) {
                const vehicle = selected.fleet.find(f => f.id === vehicleId);
                needsCost.push({ driverId, driverName: driver.name, vehicleId, vehicleLabel: vehicle ? `${vehicleModelLabel(vehicle)} · ${vehicle.id}` : vehicleId });
            } else {
                ready[driverId] = vehicleId;
            }
        });

        if (Object.keys(ready).length > 0) {
            setData(d => ({
                ...d,
                drivers: d.drivers.map(dr => ready[dr.id] ? { ...dr, vehicleId: ready[dr.id] } : dr),
            }));
        }

        if (needsCost.length > 0) {
            setAutoAssignCostDrafts({});
            setPendingAutoAssignCosts({ vendorName: selected.name, readyCount: Object.keys(ready).length, items: needsCost });
        } else {
            alert(`Auto-assigned ${count} driver${count > 1 ? 's' : ''} to a vehicle at ${selected.name}.`);
        }
    };

    // Applies a Cost/Hour + the matched vehicle together for every driver in the follow-up prompt that
    // got a value filled in; anyone left blank simply stays unassigned - their vehicle goes back into
    // the pool for next time instead of being forced through with a made-up rate.
    const confirmAutoAssignCosts = () => {
        if (!pendingAutoAssignCosts) return;
        const commits = {}; // driverId -> { vehicleId, cost }
        pendingAutoAssignCosts.items.forEach(item => {
            const draft = autoAssignCostDrafts[item.driverId];
            const cost = Number(draft);
            if (draft !== undefined && draft.trim() !== '' && Number.isFinite(cost) && cost >= 0) {
                commits[item.driverId] = { vehicleId: item.vehicleId, cost };
            }
        });
        const assignedNow = Object.keys(commits).length;
        if (assignedNow > 0) {
            setData(d => ({
                ...d,
                drivers: d.drivers.map(dr => commits[dr.id] ? { ...dr, costPerHour: commits[dr.id].cost, vehicleId: commits[dr.id].vehicleId } : dr),
            }));
        }
        const totalAssigned = pendingAutoAssignCosts.readyCount + assignedNow;
        const skipped = pendingAutoAssignCosts.items.length - assignedNow;
        const { vendorName } = pendingAutoAssignCosts;
        setPendingAutoAssignCosts(null);
        setAutoAssignCostDrafts({});
        alert(`${totalAssigned} driver${totalAssigned === 1 ? '' : 's'} assigned at ${vendorName}.${skipped ? ` ${skipped} left unassigned - no cost was set for them.` : ''}`);
    };

    const cancelAutoAssignCosts = () => {
        if (!pendingAutoAssignCosts) return;
        const { readyCount, vendorName } = pendingAutoAssignCosts;
        setPendingAutoAssignCosts(null);
        setAutoAssignCostDrafts({});
        if (readyCount > 0) alert(`${readyCount} driver${readyCount > 1 ? 's' : ''} already assigned at ${vendorName}. The rest were left unassigned - no cost was set for them.`);
    };

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Vendors & Fleet</h2>

                {subview === 'list' && (
                    <div className="flex gap-2 flex-wrap">

                            hint="Documents (GSTIN, trade certificate, POC image) aren't part of CSV - attach each one from a vendor's own detail page."
                            sampleHeaders={['id', 'name', 'contact', 'phone', 'email', 'contract', 'fleetCount']} />
                        {/* Independent of any vendor's detail page - vendor assignment is mandatory but

                                onChange={e => setVendorSearch(e.target.value)}
                                className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </div>
                        <select value={contractFilter} onChange={e => setContractFilter(e.target.value)}
                            className="px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                            {['All', 'Active', 'Pending Renewal', 'Inactive'].map(o => <option key={o} value={o}>{o === 'All' ? 'All Contracts' : o}</option>)}
                        </select>
                    </div>

            {subview === 'detail' && selected && (

                        <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                            <div className="space-y-3">
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Company Information</p>
                                <div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">Vendor Name</p>
                                    <p className="text-sm text-slate-800 font-medium">{selected.name}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">Vendor ID</p>
                                    <p className="text-sm text-slate-700 font-mono">{selected.id}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">GSTIN Number</p>
                                    <p className="text-sm text-slate-700">{selected.gstin || '—'}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">Trade Certificate Number</p>

                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wide mb-1">Contract Status</p>
                                    <Badge status={selected.contract === 'Active' ? 'Active' : 'Pending'} />
                                </div>
                            </div>
                            <div className="space-y-3">
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Point of Contact</p>
                                <div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">POC Name</p>
                                    <p className="text-sm text-slate-800 font-medium">{selected.contact || '—'}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">Phone</p>
                                    <p className="text-sm text-slate-700">{selected.phone || '—'}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">Email</p>
                                    <p className="text-sm text-slate-700">{selected.email || '—'}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">Aadhaar Number</p>
                                    <p className="text-sm text-slate-700">{selected.aadhaar || '—'}</p>
                                </div>
                            </div>
                        </div>
                        <div className="px-5 pb-5">
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Uploaded Documents</p>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                                {[
                                    { label: 'GSTIN Certificate', fileName: selected.gstinFile },
                                    { label: 'Trade Certificate', fileName: selected.tradeCertFile },
                                    { label: 'POC Identity Image', fileName: selected.pocImage },
                                ].map((doc, idx) => (
                                    <div key={idx} className={`flex items-center gap-3 p-3 border rounded-lg ${doc.fileName ? 'border-slate-200 bg-slate-50' : 'border-amber-200 bg-amber-50'}`}>

                                                    <path d="M14 2v6h6" />

                                        <div className="flex-1 min-w-0">
                                            <p className="text-sm font-medium text-slate-800">{doc.label}</p>
                                            {doc.fileName ? (

                                                    {doc.fileName}  ·  Preview

                                    </div>
                                ))}
                            </div>
                        </div>
                    </Card>

                    <Card title={`Vehicle Management - Fleet (${selected.fleet.length})`}
                        action={<div className="flex flex-wrap gap-2">
                            <ImportButton label="Vehicle" onImport={file => importVehiclesToVendor(selected.id, file)}
                                hint="PUC and Insurance certificates aren't part of CSV - attach each one from Vehicle Management."
                                sampleHeaders={['type', 'model', 'capacity', 'avgConsumption', 'fuelType', 'regNo', 'status']} />
                            <Btn onClick={openVehicleModal}><Icon name="plus" size={14} className="inline mr-1" />Create Vehicle</Btn>
                        </div>}>
                        <p className="px-5 pt-4 text-xs text-slate-400">
                            End-to-end vehicle ops for {selected.name} - pairing, documents, and removal all live here.
                            Click <Icon name="eye" size={11} className="inline align-[-1px] mx-0.5" />Manage on any vehicle for the full profile.
                        </p>
                        <div className="px-5 pt-3 flex flex-wrap gap-3">
                            <div className="relative flex-1 min-w-[200px]">
                                <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                <input type="text" placeholder="Search this fleet by ID, type, or reg no..." value={fleetSearch}
                                    onChange={e => setFleetSearch(e.target.value)}
                                    className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                            </div>
                            <select value={fleetStatusFilter} onChange={e => setFleetStatusFilter(e.target.value)}
                                className="px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                                {['All', 'Active', 'Maintenance'].map(o => <option key={o} value={o}>{o === 'All' ? 'All Statuses' : o}</option>)}

                        <div className="overflow-x-auto mt-4">

                                <tbody className="divide-y divide-slate-100">
                                    {filteredFleet.length === 0 && (

                                    {filteredFleet.map(f => {

                                        return (
                                            <tr key={f.id}><td className="px-5 py-2 font-medium">{f.id}</td>

                                                <td className="px-5 py-2">{f.capacity}</td>

                                                <td className="px-5 py-2">{f.regNo}</td>
                                                <td className="px-5 py-2">
                                                    <select className="text-xs border border-slate-200 rounded px-2 py-1 min-w-[150px]"

                    <Card title={`Driver Management (${vendorDrivers.length})`}
                        action={<div className="flex flex-wrap gap-2">

                            <ImportButton label="Driver" onImport={file => importDriversToVendor(selected.id, file)}

                            <Btn onClick={openDriverModal}><Icon name="plus" size={14} className="inline mr-1" />Add Driver</Btn>
                        </div>}>
                        <p className="px-5 pt-4 text-xs text-slate-400">
                            End-to-end driver ops for {selected.name} - pairing, cost, documents, and removal all live here.

                        </p>
                        <div className="overflow-x-auto mt-3">
                            <table className="w-full text-sm">
                                <thead className="bg-slate-50 text-slate-500 text-xs"><tr>
                                    <th className="px-5 py-2 text-left">Driver Name</th><th className="px-5 py-2 text-left">Assigned Vehicle</th>

                                </tr></thead>
                                <tbody className="divide-y divide-slate-100">
                                    {vendorDrivers.length === 0 && (
                                        <tr><td colSpan={8} className="px-5 py-6 text-center text-slate-400">No drivers tagged for this vendor yet.</td></tr>

                                    {vendorDrivers.map(dr => (

                                <p className="text-[10px] text-slate-400 uppercase tracking-wide">Phone</p>
                                <p className="text-sm text-slate-700">{driverDetail.phone || '—'}</p>
                            </div>
                            <div>
                                <p className="text-[10px] text-slate-400 uppercase tracking-wide">License Expiry</p>
                                <p className="text-sm text-slate-700">{driverDetail.licenseExpiry || '—'}</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <p className="text-[10px] text-slate-400 uppercase tracking-wide mb-1">Assigned Vehicle</p>
                                <select className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brandAccent/30"
                                    value={driverDetail.vehicleId || ''}
                                    onChange={e => requestPairing(e.target.value, driverDetail.id)}>
                                    <option value="">Unassigned</option>
                                    {(data.vendors.find(v => v.name === driverDetail.vendor)?.fleet || []).map(f => (
                                        <option key={f.id} value={f.id}>{vehicleModelLabel(f)} · {f.id}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                {/* Assign Driver Cost - the core per-driver cost control, kept as its
                                    own field here (not just the table) since it's what every Travel
                                    Plan/Shuttle Plan estimate for this driver is built on. */}
