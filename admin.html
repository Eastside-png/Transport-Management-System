                                {availableVehicles.filter(v => !s.vehicles.includes(v.id)).map(v => (
                                    <option key={v.id} value={v.id}>{vehicleModelLabel(v)} · {v.id}</option>
                                ))}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // Each "View All" hands off to its own paginated page (12/page) instead of a Modal - same
    // renderer each list already uses for its inline preview, just unpaginated and full-width.
    if (showAllSuggestions) {
        return (
            <PaginatedListPage title="All Suggested Plans" items={filteredDemands} renderItem={renderSuggestionCard}
                onBack={() => setShowAllSuggestions(false)} gridClassName="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"
                emptyMessage="No suggestions match your search." />
        );
    }
    if (showAllPlans) {
        return (
            <PaginatedListPage title="All Active & Draft Plans" items={filteredPlans} renderItem={renderPlanCard}
                onBack={() => setShowAllPlans(false)} emptyMessage="No travel plans match your search or filter." />
        );
    }
    if (showAllShuttles) {
        return (
            <PaginatedListPage title="All Recurring Shuttle Plans" items={data.shuttlePlans} renderItem={renderShuttleCard}
                onBack={() => setShowAllShuttles(false)} emptyMessage="No recurring shuttle plans yet." />
        );
    }

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Route Plans</h2>
                    <p className="text-sm text-slate-500">Daily route operations - suggested plans, active/draft assignments, and recurring shuttle loops</p>
                </div>
                <div className="flex gap-2 flex-wrap">
                    <ExportImport label="Route Plans" onExport={() => exportCSV('route-plans.csv', data.travelPlans)} onImport={handleImport}
                        sampleHeaders={['id', 'stakeholder', 'accommodation', 'roomBlock', 'tmsRef', 'route', 'vehicle', 'status', 'passengers']} />
                    <Btn onClick={() => setModal(true)}>Create Route Plan</Btn>
                </div>
            </div>

            <div className="space-y-6">
                <Card
                    title="Suggested Plans (Action Required)"
                    action={
                        <button onClick={handleDemandSync} disabled={isSyncingDemands}
                            className="text-xs flex items-center gap-1 px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded transition-colors disabled:opacity-50">
                            <span className={`inline-block ${isSyncingDemands ? 'animate-spin' : ''}`}>↻</span>
                            {isSyncingDemands ? 'Syncing...' : 'Sync'}
                        </button>
                    }
                >
                    <div className="px-5 pt-4 pb-1">
                        <div className="relative max-w-sm">
                            <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                            <input type="text" placeholder="Search suggestions..." value={suggestionSearch}
                                onChange={e => setSuggestionSearch(e.target.value)}
                                className="w-full pl-8 pr-3 py-1.5 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </div>
                    </div>

                    {filteredDemands.length === 0 ? (
                        <p className="px-5 py-8 text-sm text-slate-400 text-center">
                            {data.pendingDemands.length === 0
                                ? 'No suggested plans right now - new suggestions will appear here as arrival/departure and accommodation data comes in.'
                                : 'No suggestions match your search.'}
                        </p>
                    ) : (
                        <>
                            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 p-5">
                                {filteredDemands.slice(0, SUGGESTION_PREVIEW_LIMIT).map(renderSuggestionCard)}
                            </div>
                            {filteredDemands.length > SUGGESTION_PREVIEW_LIMIT && (
                                <div className="px-5 pb-5 -mt-1 text-center">
                                    <button onClick={() => setShowAllSuggestions(true)} className="text-sm font-medium text-brandAccent hover:underline">
                                        View All Suggested Plans ({filteredDemands.length}) →
                                    </button>
                                </div>
                            )}
                        </>
                    )}
                </Card>

                <Card title="Active & Draft Plans" className="overflow-hidden">
                    <div className="px-5 pt-4 flex flex-wrap gap-3">
                        <div className="relative flex-1 min-w-[200px]">
                            <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                            <input type="text" placeholder="Search by stakeholder, accommodation, or route..." value={planSearch}
                                onChange={e => setPlanSearch(e.target.value)}
                                className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </div>
                        <select value={planStatusFilter} onChange={e => setPlanStatusFilter(e.target.value)}
                            className="px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                            {['All', 'Active', 'Draft'].map(o => <option key={o} value={o}>{o === 'All' ? 'All Statuses' : o}</option>)}
                        </select>
                    </div>

                    <div className="mt-4 px-5 pb-5">
                        {filteredPlans.length === 0 && (
                            <div className="text-center text-slate-400 text-sm py-10 border border-dashed border-slate-200 rounded-xl">
                                {data.travelPlans.length === 0 ? 'No travel plans yet - create one from a suggestion or manually.' : 'No travel plans match your search or filter.'}
                            </div>
                        )}

                        {/* Each plan is a self-contained card, not a table row squeezed into fixed
                            columns - stakeholder names, accommodations, and routes vary wildly in
                            length, and cramming all six fields side by side left barely enough room
                            for anything before it had to truncate. Stacking Route on its own full-width
                            line and grouping Accommodation/Vehicle/Driver into a labeled 3-up row below
                            gives every field room to actually be read. */}
                        <div className="space-y-3">
                            {filteredPlans.slice(0, PLAN_PREVIEW_LIMIT).map(renderPlanCard)}
                        </div>
                        {filteredPlans.length > PLAN_PREVIEW_LIMIT && (
                            <div className="pt-3 text-center">
                                <button onClick={() => setShowAllPlans(true)} className="text-sm font-medium text-brandAccent hover:underline">
                                    View All Plans ({filteredPlans.length}) →
                                </button>
                            </div>
                        )}
                    </div>
                </Card>

                <Card
                    title="Recurring Shuttle Plans"
                    className="overflow-hidden"
                    action={
                        <Btn variant="outline" onClick={openShuttleModal}>
                            <Icon name="plus" size={14} className="inline mr-1" />Create Shuttle Plan
                        </Btn>
                    }
                >
                    <p className="px-5 pt-4 text-xs text-slate-500">Fixed-interval loops between two points, run by a pool of vehicles rather than a one-off trip each.</p>

                    <div className="mt-3 px-5 pb-5">
                        {data.shuttlePlans.length === 0 && (
                            <div className="text-center text-slate-400 text-sm py-10 border border-dashed border-slate-200 rounded-xl">
                                No recurring shuttle plans yet - create one to run a fixed-interval loop between two points.
                            </div>
                        )}

                        {/* Same card-per-row treatment as Active & Draft Plans above, for the same
                            reason - Route up top full-width (it carries the distance/cost badges too),
                            then a labeled 3-up row for Frequency/Hours/Vehicles instead of forcing them
                            into narrow fixed columns. */}
                        <div className="space-y-3">
                            {data.shuttlePlans.slice(0, SHUTTLE_PREVIEW_LIMIT).map(renderShuttleCard)}
                        </div>
                        {data.shuttlePlans.length > SHUTTLE_PREVIEW_LIMIT && (
                            <div className="pt-3 text-center">
                                <button onClick={() => setShowAllShuttles(true)} className="text-sm font-medium text-brandAccent hover:underline">
                                    View All Shuttle Plans ({data.shuttlePlans.length}) →
                                </button>
                            </div>
                        )}
                    </div>
                </Card>
            </div>

            {/* Create Shuttle Plan Modal */}
            <Modal open={shuttleModal} onClose={() => setShuttleModal(false)} title="Create Recurring Shuttle Plan">
                <div className="space-y-3">
                    <div className="grid grid-cols-2 gap-3">
                        <Select label="Origin (Point A)" value={shuttleForm.origin} onChange={e => setShuttleForm(f => ({ ...f, origin: e.target.value }))}
                            options={[{ value: '', label: 'Select Location...' }, ...data.locations.map(l => ({ value: l, label: l }))]} />
                        <Select label="Destination (Point B)" value={shuttleForm.destination} onChange={e => setShuttleForm(f => ({ ...f, destination: e.target.value }))}
                            options={[{ value: '', label: 'Select Location...' }, ...data.locations.map(l => ({ value: l, label: l }))]} />
                    </div>
                    <DistanceStatCard origin={shuttleForm.origin} destination={shuttleForm.destination} />

                    <div>
                        <span className="text-xs font-medium text-slate-500 mb-1 block">Frequency (minutes)</span>
                        <div className="flex items-center gap-2">
                            <input type="number" min="5" step="5" value={shuttleForm.frequencyMinutes}
                                onChange={e => setShuttleForm(f => ({ ...f, frequencyMinutes: e.target.value }))}
                                className="w-24 px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                            <span className="text-xs text-slate-500">{shuttleFrequencyLabel(Number(shuttleForm.frequencyMinutes) || 0)}</span>
                        </div>
                        <div className="flex gap-1.5 mt-2">
                            {SHUTTLE_FREQUENCIES.map(m => (
                                <button key={m} type="button" onClick={() => setShuttleForm(f => ({ ...f, frequencyMinutes: m }))}
                                    className={`px-2.5 py-1 text-[11px] font-medium rounded-full border transition ${Number(shuttleForm.frequencyMinutes) === m ? 'border-brandAccent text-brandAccent bg-brandAccent/5' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                    {shuttleFrequencyLabel(m)}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        <label className="block">
                            <span className="text-xs font-medium text-slate-500 mb-1 block">Operating Start</span>
                            <input type="time" value={shuttleForm.startTime} onChange={e => setShuttleForm(f => ({ ...f, startTime: e.target.value }))}
                                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </label>
                        <label className="block">
                            <span className="text-xs font-medium text-slate-500 mb-1 block">Operating End</span>
                            <input type="time" value={shuttleForm.endTime} onChange={e => setShuttleForm(f => ({ ...f, endTime: e.target.value }))}
                                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </label>
                    </div>

                    <div>
                        <span className="text-xs font-medium text-slate-500 mb-1.5 block">Assign Vehicles</span>
                        <div className="border border-slate-200 rounded-lg max-h-48 overflow-y-auto divide-y divide-slate-100">
                            {availableVehicles.map(v => (
                                <label key={v.id} className="flex items-center gap-2 px-3 py-2 text-sm hover:bg-slate-50 cursor-pointer">
                                    <input type="checkbox" checked={shuttleForm.vehicles.includes(v.id)} onChange={() => toggleShuttleFormVehicle(v.id)} />
                                    <span className="flex-1">{vehicleModelLabel(v)} · {v.id}</span>
                                    <span className="text-xs text-slate-400">{v.capacity} seats</span>
                                </label>
                            ))}
                            {availableVehicles.length === 0 && <p className="px-3 py-4 text-center text-xs text-slate-400">No active vehicles available.</p>}
                        </div>
                        <p className="text-xs text-slate-400 mt-1">
                            {shuttleForm.vehicles.length} vehicle{shuttleForm.vehicles.length === 1 ? '' : 's'} selected
                            {shuttleForm.vehicles.length === 0 && ' - the plan will be created as a Draft until at least one is assigned'}
                        </p>
                    </div>

                    {shuttleFormOverextended && (
                        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                            <p className="text-xs text-amber-800">
                                Estimated round trip is <strong>~{shuttleFormDist.durationMin * 2} min</strong>, longer than what {shuttleForm.vehicles.length}
                                {' '}vehicle{shuttleForm.vehicles.length === 1 ? '' : 's'} can cover on a {shuttleFrequencyLabel(shuttleForm.frequencyMinutes).toLowerCase()} schedule
                                {' '}(~{shuttleForm.frequencyMinutes * shuttleForm.vehicles.length} min budget). Add another vehicle or lower the frequency to keep departures on time.
                            </p>
                        </div>
                    )}

                    <Btn className="w-full" onClick={createShuttlePlan}>Create Shuttle Plan</Btn>
                </div>
            </Modal>

            {/* Create Route Plan Modal (Travel Module / Accommodation) */}
            <Modal open={modal} onClose={() => setModal(false)} title="Create Route Plan">
                <div className="space-y-3">
                    <Select label="Select Reference" value={form.demandRef} onChange={e => {
                        const d = data.pendingDemands.find(x => x.ref === e.target.value);
                        if (d) applyDemand(d);
                        else { setSelectedDemand(null); setForm(f => ({ ...f, demandRef: '' })); }
                    }} options={[{ value: '', label: 'Select reference...' }, ...data.pendingDemands.map(d => ({ value: d.ref, label: `[${d.source}] ${d.stakeholder}` }))]} />
                    {selectedDemand && (
                        <div className="bg-slate-50 rounded-lg p-3 text-xs text-slate-600">
                            <p><strong>Source:</strong> {selectedDemand.source}</p>
                            <p><strong>Reference:</strong> {selectedDemand.ref}</p>
                            <p><strong>Accommodation:</strong> {selectedDemand.accommodation}</p>
                            <p><strong>Headcount:</strong> {selectedDemand.headcount}  |  <strong>Vehicle Type:</strong> {effectivePreferredVehicle(selectedDemand)}
                                {vehicleCapacity(effectivePreferredVehicle(selectedDemand)) ? ` (${vehicleCapacity(effectivePreferredVehicle(selectedDemand))} seats)` : ''}
                                {selectedDemand.stakeholderType ? ` - via ${selectedDemand.stakeholderType} mapping` : ' - from the demand itself, no stakeholder type set'}</p>
                            <p><strong>Check-in{selectedDemand.checkOut ? '/out' : ''}:</strong> {selectedDemand.checkIn}{selectedDemand.checkOut ? ` -> ${selectedDemand.checkOut}` : ''}</p>
                        </div>
                    )}

                    {selectedDemand && (
                        <Select label="Stakeholder Type" value={selectedDemand.stakeholderType || ''}
                            onChange={e => setDemandStakeholderType(selectedDemand.ref, e.target.value)}
                            options={[{ value: '', label: 'Not set - use preferredVehicle as-is' }, ...STAKEHOLDER_TYPES.map(t => ({ value: t, label: t }))]} />
                    )}

                    {selectedDemand && vehiclesNeededFor(selectedDemand) > 1 && (
                        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                            <p className="text-xs text-amber-800">
                                {selectedDemand.headcount} people won't fit in a single {effectivePreferredVehicle(selectedDemand)}
                                ({vehicleCapacity(effectivePreferredVehicle(selectedDemand))} seats). Creating this plan will split it into{' '}
                                <strong>{vehiclesNeededFor(selectedDemand)} separate legs</strong> ("Group 1/{vehiclesNeededFor(selectedDemand)}", etc.).
                                You'll see exactly which vehicles (and drivers) get auto-assigned to each leg before anything is created.
                            </p>
                        </div>
                    )}

                    <div className="grid grid-cols-2 gap-3">
                        <Select label="Origin (Point A)" value={form.origin} onChange={e => setForm({ ...form, origin: e.target.value })}
                            options={[{ value: '', label: 'Select Location...' }, ...data.locations.map(l => ({ value: l, label: l }))]} />
                        <Select label="Destination (Point B)" value={form.destination} onChange={e => setForm({ ...form, destination: e.target.value })}
                            options={[{ value: '', label: 'Select Location...' }, ...data.locations.map(l => ({ value: l, label: l }))]} />
                    </div>
                    <DistanceStatCard origin={form.origin} destination={form.destination}
                        vehicle={form.vehicle !== 'Unassigned' ? allVehiclesWithVendor.find(v => v.id === form.vehicle) : null} data={data} />

                    {(!selectedDemand || vehiclesNeededFor(selectedDemand) <= 1) && (
                        <div>
                            <Select label="Assign Vehicle" value={form.vehicle} onChange={e => setForm({ ...form, vehicle: e.target.value })}
                                options={[
                                    { value: 'Unassigned', label: 'Unassigned' },
                                    ...routeModalVehicleOptions.map(v => ({ value: v.id, label: `${vehicleModelLabel(v)} · ${v.id}` })),
                                ]} />
                            {selectedDemand && effectivePreferredVehicle(selectedDemand) && (
                                routeModalVehicleOptions.length === 0 ? (
                                    <p className="text-xs text-amber-600 mt-1">No Active {effectivePreferredVehicle(selectedDemand)} vehicles available right now.</p>
                                ) : (
                                    <p className="text-xs text-slate-400 mt-1">Narrowed to {effectivePreferredVehicle(selectedDemand)} - this demand's resolved vehicle type.</p>
                                )
                            )}
                        </div>
                    )}

                    <Btn className="w-full" onClick={createPlan}>
                        {selectedDemand && vehiclesNeededFor(selectedDemand) > 1
                            ? `Create ${vehiclesNeededFor(selectedDemand)} Route Plans`
                            : 'Create Route Plan'}
                    </Btn>
                </div>
            </Modal>

            {/* Reassignment confirmation - changing the vehicle on a live plan takes the trip away
                from whoever's already dispatched on it, so it needs an explicit, informed confirm. */}
            <Modal open={!!pendingReassignment} onClose={() => setPendingReassignment(null)} title="Confirm Vehicle Reassignment">
                {pendingReassignment && (
                    <div className="space-y-4">
                        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                            <p className="text-sm text-amber-800">
                                This plan is <strong>Active</strong> and already dispatched to <strong>{vehicleLabel(pendingReassignment.plan.vehicle)}</strong>.
                                Reassigning it will immediately notify that vehicle's driver the trip has been taken off them, and hand it to the new vehicle instead.
                            </p>
                        </div>
                        <div className="bg-slate-50 rounded-lg p-3 text-xs text-slate-600 space-y-1">
                            <p><strong>Stakeholder:</strong> {pendingReassignment.plan.stakeholder}</p>
                            <p><strong>Route:</strong> {pendingReassignment.plan.route}</p>
                            <p><strong>Current Vehicle:</strong> {vehicleLabel(pendingReassignment.plan.vehicle)}</p>
                            <p><strong>New Vehicle:</strong> {vehicleLabel(pendingReassignment.newVehicle)}</p>
                        </div>
                        <div className="flex gap-2">
                            <Btn variant="danger" onClick={confirmReassignment}>Confirm Reassignment</Btn>
                            <Btn variant="outline" onClick={() => setPendingReassignment(null)}>Cancel</Btn>
                        </div>
                    </div>
                )}
            </Modal>

            {/* Multi-vehicle auto-assign confirmation - a trip that needs more than one vehicle is
                staged here first so the admin sees exactly which vehicles (and drivers) are about to
                be booked before anything is actually created. A single-vehicle auto-assign never
                shows this - it just commits, same as any other cheap, low-risk Draft-plan change. */}
            <Modal open={!!pendingAutoAssign} onClose={() => setPendingAutoAssign(null)} title="Confirm Auto-Assigned Vehicles" wide>
                {pendingAutoAssign && (
                    <div className="space-y-4">
                        <p className="text-sm text-slate-600">
                            <strong>{pendingAutoAssign.demand.headcount} people</strong> for <strong>{pendingAutoAssign.demand.stakeholder}</strong> need{' '}
                            <strong>{pendingAutoAssign.legs.length} vehicles</strong>. Review what's about to be booked before confirming.
                        </p>
                        <div className="space-y-2">
                            {pendingAutoAssign.legs.map((leg, i) => (
                                <div key={i} className="flex items-start justify-between gap-3 border border-slate-200 rounded-lg p-3">
                                    <div className="min-w-0">
                                        <p className="text-sm font-medium text-slate-700">
                                            Group {i + 1}/{pendingAutoAssign.legs.length} <span className="text-slate-400 font-normal">· {leg.seats} pax</span>
                                        </p>
                                        {leg.vehicle ? (
                                            <p className="text-xs text-slate-500 mt-0.5">
                                                {vehicleModelLabel(leg.vehicle)} · {leg.vehicle.id} · {leg.vehicle.vendorName}
                                                {leg.driver
                                                    ? ` · Driver: ${leg.driver.name}${leg.newlyPaired ? ' (newly paired)' : ''}`
                                                    : ' · No driver available yet'}
                                                {(() => {
                                                    const dist = window.lookupDistance(pendingAutoAssign.origin, pendingAutoAssign.destination);
                                                    const cost = dist ? window.estimateTripCost(leg.vehicle, dist.distanceKm, dist.durationMin, data, leg.driver) : null;
                                                    return cost ? ` · ≈ ₹${cost.total} est. cost` : '';
                                                })()}
                                            </p>
                                        ) : (
                                            <p className="text-xs text-red-600 mt-0.5">No Available vehicle currently fits this leg - will be created as a Draft plan instead.</p>
                                        )}
                                    </div>
                                    <Icon name={leg.vehicle ? 'check' : 'alert'} size={16} className={`shrink-0 mt-0.5 ${leg.vehicle ? 'text-emerald-500' : 'text-amber-500'}`} />
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-2">
                            <Btn onClick={() => { commitAutoAssignedPlans(pendingAutoAssign); setPendingAutoAssign(null); resetCreateForm(); }}>
                                Confirm & Create {pendingAutoAssign.legs.length} Route Plans
                            </Btn>
                            <Btn variant="outline" onClick={() => setPendingAutoAssign(null)}>Cancel</Btn>
                        </div>
                    </div>
                )}
            </Modal>

            {/* Result of a single-vehicle Auto-Assign click - was a plain browser alert() before,
                which looked (and read) nothing like the rest of this app. Vehicle and Driver each get
                their own full-width labeled row with a colored icon badge (never a fixed-width grid
                column - "Honda Amaze (Sedan) · VH-9801" wrapped mid-ID the one time this was tried
                as a 2-up grid in a non-wide modal, and there was no need for the columns anyway with
                only two fields). Same gradient-avatar treatment as a plan card in the list above it. */}
            <Modal open={!!autoAssignResult} onClose={() => setAutoAssignResult(null)} title="Vehicle Auto-Assigned">
                {autoAssignResult && (
                    <div className="space-y-4">
                        {autoAssignResult.noRoute ? (
                            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                                <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                                <p className="text-sm text-amber-800">
                                    Could not automatically determine a route for this suggestion - use "Create Route Plan" to set the origin/destination manually.
                                </p>
                            </div>
                        ) : autoAssignResult.noVehicle ? (
                            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                                <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                                <p className="text-sm text-amber-800">
                                    No Available vehicle currently fits <strong>{autoAssignResult.demand.stakeholder}</strong> ({autoAssignResult.demand.headcount} pax) right now - created as a Draft plan instead.
                                </p>
                            </div>
                        ) : (
                            <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className={`w-11 h-11 rounded-full bg-gradient-to-br ${avatarGradientFor(autoAssignResult.demand.stakeholder)} flex items-center justify-center text-white text-sm font-bold shrink-0 shadow-sm ring-1 ring-black/5`}>
                                        {initialsOf(autoAssignResult.demand.stakeholder)}
                                    </div>
                                    <div className="min-w-0">
                                        <p className="font-semibold text-slate-800 text-sm truncate">{autoAssignResult.demand.stakeholder}</p>
                                        <p className="text-xs text-slate-400">{autoAssignResult.demand.headcount} pax</p>
                                    </div>
                                </div>
                                <div className="mt-4 pt-4 border-t border-slate-100 space-y-3">
                                    <div className="flex items-center gap-3">
                                        <span className="w-9 h-9 rounded-xl bg-blue-50 text-brandAccent flex items-center justify-center shrink-0">
                                            <Icon name="fleet" size={16} />
                                        </span>
                                        <div className="min-w-0">
                                            <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Vehicle</p>
                                            <p className="text-sm font-medium text-slate-700">{vehicleModelLabel(autoAssignResult.vehicle)} · {autoAssignResult.vehicle.id}</p>
                                            {/* Which vendor this came from - worth tracking since the
                                                whole point of auto-assign is picking from every vendor's
                                                fleet at once, not just the one you'd expect. */}
                                            <p className="text-xs text-slate-400">{autoAssignResult.vehicle.vendorName}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="w-9 h-9 rounded-xl bg-violet-50 text-violet-600 flex items-center justify-center shrink-0">
                                            <Icon name="users" size={16} />
                                        </span>
                                        <div className="min-w-0">
                                            <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Driver</p>
                                            {autoAssignResult.driver ? (
                                                <>
                                                    <p className="text-sm font-medium text-slate-700">{autoAssignResult.driver.name}</p>
                                                    <p className="text-xs text-slate-400">{autoAssignResult.driver.vendor}</p>
                                                </>
                                            ) : <p className="text-sm text-slate-400">No driver available yet</p>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        <Btn className="w-full" onClick={() => setAutoAssignResult(null)}>Done</Btn>
                    </div>
                )}
            </Modal>
        </div>
    );
};

// Inline preview limits for the Arrivals/Departures lists below the hero - "View All" unlocks the
// rest in a modal, same convention as Route Plans' three lists.
const ARRIVAL_PREVIEW_LIMIT = 4;
const DEPARTURE_PREVIEW_LIMIT = 4;

// Arrival/departure data, split out from Route Plans into its own tab - a detailed record per
// ticket/group ticket (Create Travel Plan), a live Flight/Train status hero pulled off each record's
// transport number + PNR (mockTransportStatus - see the "Travel API Integration and PNR Tracking"
// exploration this stands in for), and separate Arrivals/Departures lists underneath. Route-level
// concerns (suggested plans, active/draft assignments, recurring shuttles) stay on Route Plans -
// this tab only ever deals with who's arriving/departing, how, and when.
window.TravelPlansTab = ({ data, setData }) => {
    const [manualModal, setManualModal] = useState(false);
    const [planType, setPlanType] = useState('Arrival');
    const [transportMode, setTransportMode] = useState('Flight');
    const [manualPlanForm, setManualPlanForm] = useState({ ...DEFAULT_MANUAL_FORM });
    // Participants are never prefetched - each plan starts with an empty roster and the admin adds
    // exactly who's on this specific arrival/departure.
    const [people, setPeople] = useState([]);
    const [newPerson, setNewPerson] = useState({ ...BLANK_PERSON });
    const ticketInputRef = useRef(null);

    const [showAllArrivals, setShowAllArrivals] = useState(false);
    const [showAllDepartures, setShowAllDepartures] = useState(false);

    const groupHeader = planType === 'Arrival' ? 'Arrival Groups' : 'Departure Groups';
    const locationLabel = planType === 'Arrival' ? 'Arrival Location' : 'Departure Location';
    const dateLabel = planType === 'Arrival' ? 'Date of Arrival' : 'Date of Departure';
    const timeLabel = planType === 'Arrival' ? 'Arrival Time' : 'Departure Time';
    const transportLabel = `${transportMode.toUpperCase()} No.`;

    const updateManual = (field, value) => setManualPlanForm(f => ({ ...f, [field]: value }));

    const addPerson = () => {
        if (!newPerson.id.trim() || !newPerson.firstName.trim() || !newPerson.lastName.trim()) {
            alert('Enter a Player ID, first name and last name to add a participant.');
            return;
        }
        if (people.some(p => p.id === newPerson.id.trim())) {
            alert('A participant with this Player ID has already been added.');
            return;
        }
        setPeople(list => [...list, { ...newPerson, id: newPerson.id.trim(), firstName: newPerson.firstName.trim(), lastName: newPerson.lastName.trim() }]);
        setNewPerson({ ...BLANK_PERSON, accreditation: newPerson.accreditation });
    };

    const removePerson = (id) => setPeople(list => list.filter(p => p.id !== id));

    const exportMembers = () => exportCSV('members.csv', people.map(p => ({
        PlayerID: p.id, FirstName: p.firstName, LastName: p.lastName, Accreditation: p.accreditation,
    })));

    // Imported rows are appended to whatever's already in the roster (not a replace), same as every
    // other CSV import in this app - duplicate Player IDs (either against the existing roster or
    // within the file itself) are skipped rather than silently overwritten, same rule addPerson enforces.
    const handleMemberImport = (file) => importCSV(file, rows => {
        const existingIds = new Set(people.map(p => p.id));
        const imported = [];
        let skipped = 0;
        rows.forEach(r => {
            const id = (r.PlayerID || '').trim();
            const firstName = (r.FirstName || '').trim();
            const lastName = (r.LastName || '').trim();
            if (!id || !firstName || !lastName || existingIds.has(id)) { skipped++; return; }
            existingIds.add(id);
            imported.push({ id, firstName, lastName, accreditation: r.Accreditation || 'ATHLETES' });
        });
        setPeople(list => [...list, ...imported]);
        alert(`Imported ${imported.length} member${imported.length === 1 ? '' : 's'}.${skipped ? ` Skipped ${skipped} row(s) - missing Player ID/name or a duplicate.` : ''}`);
    });

    const handleTicketSelect = (e) => {
        const file = e.target.files[0];
        if (file) updateManual('uploadedTicket', file.name);
        e.target.value = '';
    };

    const clearTicket = () => updateManual('uploadedTicket', null);

    const saveManualPlan = () => {
        if (!manualPlanForm.departmentName.trim()) {
            alert('Enter a Sport/Department name for this group before saving.');
            return;
        }
        const { dateDD, dateMM, dateYYYY, timeHH, timeMM, ...rest } = manualPlanForm;
        const date = (dateDD || dateMM || dateYYYY) ? `${dateDD.padStart(2, '0')}/${dateMM.padStart(2, '0')}/${dateYYYY}` : '';
        const time = (timeHH || timeMM) ? `${timeHH.padStart(2, '0')}:${timeMM.padStart(2, '0')}` : '';
        const plan = {
            id: uid('MAN'), planType, transportMode, ...rest, date, time, people,
            createdAt: new Date().toISOString().slice(0, 10),
        };
        setData(d => ({ ...d, manualPlans: [...d.manualPlans, plan] }));
        setManualModal(false);
        setManualPlanForm({ ...DEFAULT_MANUAL_FORM });
        setPeople([]);
        setNewPerson({ ...BLANK_PERSON });
        setPlanType('Arrival');
        setTransportMode('Flight');
    };

    // planId -> nonce, bumped by "Refresh Status" to simulate a fresh poll of a live source rather
    // than the same mocked reading forever - see mockTransportStatus. refreshingStatusId tracks which
    // row is mid-refresh so its button can show a brief "Checking..." state, same simulated-latency
    // pattern as "Sync Accommodation & TMS" elsewhere in this app. Per-row (not one shared button) -
    // this is the detailed operational view, where refreshing one specific record at a time makes more
    // sense than the Dashboard preview's single "refresh everything at a glance" button.
    const [statusNonces, setStatusNonces] = useState({});
    const [refreshingStatusId, setRefreshingStatusId] = useState(null);
    const refreshLiveStatus = (planId) => {
        setRefreshingStatusId(planId);
        setTimeout(() => {
            setStatusNonces(n => ({ ...n, [planId]: (n[planId] || 0) + 1 }));
            setRefreshingStatusId(null);
        }, 900);
    };

    const openManualModal = () => {
        setManualPlanForm({ ...DEFAULT_MANUAL_FORM });
        setPeople([]);
        setNewPerson({ ...BLANK_PERSON });
        setPlanType('Arrival');
        setTransportMode('Flight');
        setManualModal(true);
    };

    // Bulk import/export for the whole arrival/departure roster - separate from the per-record
    // "Add Member Manually" import inside the Create Travel Plan modal, which only ever fills one
    // record's own participant list.
    //
    // uploadedTicket is deliberately left out of both directions here - CSV is text-only, and every
    // "document" in this prototype has only ever been a filename string captured at upload time, never
    // real file content, so there's nothing for a CSV round-trip to actually carry even if it tried.
    // An imported record always starts with no ticket; attaching one stays a one-at-a-time action from
    // the record's own detail view, same as every other document field app-wide (see ImportButton's
    // `hint` prop below).
    const exportManualPlans = () => exportCSV('arrivals-departures.csv', data.manualPlans.map(p => ({
        id: p.id, planType: p.planType, departmentName: p.departmentName, federation: p.federation,
        role: p.role, gender: p.gender, memberSize: p.memberSize, date: p.date, time: p.time,
        transportMode: p.transportMode, transportNumber: p.transportNumber, pnrNumber: p.pnrNumber,
        city: p.city, location: p.location, pocName: p.pocName, pocContact: p.pocContact,
    })));
    const handleManualImport = (file) => importCSV(file, rows => {
        const imported = rows.map(r => ({
            id: r.id || uid('MAN'),
            planType: r.planType === 'Departure' ? 'Departure' : 'Arrival',
            departmentName: r.departmentName || '', federation: r.federation || '',
            role: r.role || '', gender: r.gender || '',
            memberSize: r.memberSize || '', date: r.date || '', time: r.time || '',
            transportMode: ['Flight', 'Train', 'Bus', 'Car'].includes(r.transportMode) ? r.transportMode : 'Flight',
            transportNumber: r.transportNumber || '', pnrNumber: r.pnrNumber || '',
            city: r.city || '', location: r.location || '',
            pocName: r.pocName || '', pocContact: r.pocContact || '',
            uploadedTicket: null, people: [],
            createdAt: new Date().toISOString().slice(0, 10),
        }));
        setData(d => ({ ...d, manualPlans: [...d.manualPlans, ...imported] }));
        alert(`Imported ${imported.length} arrival/departure record(s). Ticket uploads aren't part of CSV - attach each one from its record's detail view.`);
    });

    // One arrival/departure record - group identity, transport + PNR, when, and (Flight/Train only)
    // a mocked Live Status reading with its own Refresh action. Bus/Car show a plain "not tracked"
    // note instead of a status pill, since there's no equivalent public tracking API for either.
    // Shared by the hero (Flight/Train only) and the Arrivals/Departures lists below (every mode).
    const renderManualPlanCard = (plan) => {
        const status = mockTransportStatus(plan.transportMode, plan.transportNumber, plan.pnrNumber, statusNonces[plan.id] || 0);
        const isTracked = plan.transportMode === 'Flight' || plan.transportMode === 'Train';
        const isRefreshing = refreshingStatusId === plan.id;
        return (
            <div key={plan.id} className="bg-white border border-slate-300 rounded-xl p-4 shadow-sm hover:shadow-md hover:border-slate-400 transition-all">
                <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="flex items-center gap-3 min-w-0">
                        <span className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 ${plan.planType === 'Arrival' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-brandAccent'}`}>
                            <TransportGlyph mode={plan.transportMode} size={17} />
                        </span>
                        <div className="min-w-0">
                            <p className="font-semibold text-slate-800 text-sm truncate">
                                {plan.departmentName}{plan.federation && <span className="text-slate-400 font-normal"> &middot; {plan.federation}</span>}
                            </p>
                            <p className="text-xs text-slate-400 truncate">{plan.role || 'Unspecified role'} &middot; {plan.memberSize || plan.people.length || 0} member{Number(plan.memberSize) === 1 ? '' : 's'}</p>
                        </div>
                    </div>
                    <Badge status={plan.planType} />
                </div>

                <div className="mt-3 pt-3 border-t border-slate-100 grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.transportMode}</p>
                        <p className="text-slate-700 font-medium truncate">{plan.transportNumber || '—'}</p>
                    </div>
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">PNR</p>
                        <p className="text-slate-700 font-mono truncate">{plan.pnrNumber || '—'}</p>
                    </div>
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.planType} Time</p>
                        <p className="text-slate-700 truncate">{plan.date || '—'} {plan.time}</p>
                    </div>
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.location ? 'Location' : 'City'}</p>
                        <p className="text-slate-700 truncate">{plan.location || plan.city || '—'}</p>
                    </div>
                </div>

                {plan.uploadedTicket && (
                    <button type="button" onClick={() => alert(`Preview: ${plan.uploadedTicket}`)}
                        className="mt-2.5 inline-flex items-center gap-1.5 text-xs text-brandAccent hover:underline">
                        <Icon name="download" size={12} className="shrink-0" />{plan.uploadedTicket}
                    </button>
                )}

                <div className="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                    {isTracked ? (
                        status ? (
                            <div className="min-w-0">
                                <Badge status={status.status} />
                                <p className="text-xs text-slate-400 mt-1 truncate">{status.detail} &middot; as of {status.updatedAt}</p>
                            </div>
                        ) : (
                            <p className="text-xs text-slate-400">Enter a {plan.transportMode.toLowerCase()} number and PNR to check Live Status.</p>
                        )
                    ) : (
                        <p className="text-xs text-slate-400">Live status isn't tracked for {plan.transportMode}.</p>
                    )}
                    {isTracked && status && (
                        <button onClick={() => refreshLiveStatus(plan.id)} disabled={isRefreshing}
                            className="shrink-0 inline-flex items-center gap-1.5 text-xs font-semibold text-brandAccent hover:underline disabled:opacity-50 disabled:no-underline">
                            <span className={`inline-block leading-none ${isRefreshing ? 'animate-spin' : ''}`}>&#8635;</span>
                            {isRefreshing ? 'Checking...' : 'Refresh Status'}
                        </button>
                    )}
                </div>
            </div>
        );
    };

    // The Arrivals/Departures lists below are the record as entered on the form, not a live feed -
    // no Live Status/Refresh here (that's the hero's job, and only ever true for Flight/Train
    // anyway). Instead each card is clickable, opening the full detail view (every form field, POC,
    // ticket, and the member roster) - see selectedPlanId/the "Travel Plan Details" modal below.
    const [selectedPlanId, setSelectedPlanId] = useState(null);
    const selectedPlan = selectedPlanId ? data.manualPlans.find(p => p.id === selectedPlanId) : null;

    const renderPlanRecordCard = (plan) => (
        <button key={plan.id} onClick={() => setSelectedPlanId(plan.id)}
            className="w-full text-left bg-white border border-slate-300 rounded-xl p-4 shadow-sm hover:shadow-md hover:border-slate-400 transition-all">
            <div className="flex flex-wrap items-start justify-between gap-3">
                <div className="flex items-center gap-3 min-w-0">
                    <span className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 ${plan.planType === 'Arrival' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-brandAccent'}`}>
                        <TransportGlyph mode={plan.transportMode} size={17} />
                    </span>
                    <div className="min-w-0">
                        <p className="font-semibold text-slate-800 text-sm truncate">
                            {plan.departmentName}{plan.federation && <span className="text-slate-400 font-normal"> &middot; {plan.federation}</span>}
                        </p>
                        <p className="text-xs text-slate-400 truncate">{plan.role || 'Unspecified role'} &middot; {plan.memberSize || plan.people.length || 0} member{Number(plan.memberSize) === 1 ? '' : 's'}</p>
                    </div>
                </div>
                <Badge status={plan.planType} />
            </div>

            <div className="mt-3 pt-3 border-t border-slate-100 grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                <div className="min-w-0">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.transportMode}</p>
                    <p className="text-slate-700 font-medium truncate">{plan.transportNumber || '—'}</p>
                </div>
                <div className="min-w-0">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">PNR</p>
                    <p className="text-slate-700 font-mono truncate">{plan.pnrNumber || '—'}</p>
                </div>
                <div className="min-w-0">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.planType} Time</p>
                    <p className="text-slate-700 truncate">{plan.date || '—'} {plan.time}</p>
                </div>
                <div className="min-w-0">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.location ? 'Location' : 'City'}</p>
                    <p className="text-slate-700 truncate">{plan.location || plan.city || '—'}</p>
                </div>
            </div>

            {plan.uploadedTicket && (
                <p className="mt-2.5 inline-flex items-center gap-1.5 text-xs text-brandAccent">
                    <Icon name="download" size={12} className="shrink-0" />{plan.uploadedTicket}
                </p>
            )}
        </button>
    );

    const arrivals = useMemo(() => data.manualPlans.filter(p => p.planType === 'Arrival'), [data.manualPlans]);
    const departures = useMemo(() => data.manualPlans.filter(p => p.planType === 'Departure'), [data.manualPlans]);
    const flightRecords = useMemo(() => data.manualPlans.filter(p => p.transportMode === 'Flight'), [data.manualPlans]);
    const trainRecords = useMemo(() => data.manualPlans.filter(p => p.transportMode === 'Train'), [data.manualPlans]);

    // Pulled out to its own variable (rather than inlined in just the main return) so the two
    // paginated full-page views below can render it too - clicking a card there needs to open the
    // same detail modal a card in the inline preview does.
    const planDetailModal = (
        <Modal open={!!selectedPlan} onClose={() => setSelectedPlanId(null)} title="Travel Plan Details" wide>
            {selectedPlan && (
                <div className="max-h-[75vh] overflow-y-auto -mx-1 px-1 space-y-5">
                    <div className="flex items-start justify-between gap-3">
                        <div className="flex items-center gap-3 min-w-0">
                            <span className={`w-11 h-11 rounded-xl flex items-center justify-center shrink-0 ${selectedPlan.planType === 'Arrival' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-brandAccent'}`}>
                                <TransportGlyph mode={selectedPlan.transportMode} size={20} />
                            </span>
                            <div className="min-w-0">
                                <p className="font-semibold text-slate-800 text-base truncate">{selectedPlan.departmentName}</p>
                                <p className="text-xs text-slate-400 truncate">{selectedPlan.federation || 'No federation set'}</p>
                            </div>
                        </div>
                        <Badge status={selectedPlan.planType} />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4">
                        <div>
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Group Details</p>
                            <div className="space-y-1.5 text-sm">
                                <p><span className="text-slate-400">Role: </span><span className="text-slate-700">{selectedPlan.role || '—'}</span></p>
                                <p><span className="text-slate-400">Gender: </span><span className="text-slate-700">{selectedPlan.gender || '—'}</span></p>
                                <p><span className="text-slate-400">Member Size: </span><span className="text-slate-700">{selectedPlan.memberSize || selectedPlan.people.length || 0}</span></p>
                            </div>
                        </div>
                        <div>
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Point of Contact</p>
                            <div className="space-y-1.5 text-sm">
                                <p><span className="text-slate-400">Name: </span><span className="text-slate-700">{selectedPlan.pocName || '—'}</span></p>
                                <p><span className="text-slate-400">Contact: </span><span className="text-slate-700">{selectedPlan.pocContact || '—'}</span></p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">{selectedPlan.planType} Details</p>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm bg-slate-50 border border-slate-100 rounded-lg p-3">
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Mode</p>
                                <p className="text-slate-700">{selectedPlan.transportMode}</p>
                            </div>
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{selectedPlan.transportMode} No.</p>
                                <p className="text-slate-700 truncate">{selectedPlan.transportNumber || '—'}</p>
                            </div>
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">PNR</p>
                                <p className="text-slate-700 font-mono truncate">{selectedPlan.pnrNumber || '—'}</p>
                            </div>
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{selectedPlan.planType} Time</p>
                                <p className="text-slate-700">{selectedPlan.date || '—'} {selectedPlan.time}</p>
                            </div>
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">City</p>
                                <p className="text-slate-700 truncate">{selectedPlan.city || '—'}</p>
                            </div>
                            <div className="min-w-0 col-span-2">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{selectedPlan.planType} Location</p>

                            </div>
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Created</p>
                                <p className="text-slate-700">{selectedPlan.createdAt || '—'}</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Ticket</p>
                        {selectedPlan.uploadedTicket ? (
                            <div className="flex items-center gap-3 p-3 border border-slate-200 rounded-lg bg-slate-50">
                                <div className="shrink-0 w-9 h-9 rounded-lg bg-blue-50 text-brandAccent flex items-center justify-center">
                                    <Icon name="download" size={16} />
                                </div>
                                <div className="flex-1 min-w-0">
                                    <p className="text-sm font-medium text-slate-800 truncate">{selectedPlan.uploadedTicket}</p>
                                    <button type="button" onClick={() => alert(`Preview: ${selectedPlan.uploadedTicket}`)}
                                        className="text-xs text-brandAccent font-medium hover:underline">
                                        Preview
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <p className="text-sm text-slate-400">No ticket uploaded.</p>
                        )}
                    </div>

                    <div>
                        <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">
                            Members ({selectedPlan.people.length})
                        </p>
                        {selectedPlan.people.length === 0 ? (
                            <p className="text-sm text-slate-400">No participants were added to this record.</p>
                        ) : (
                            <div className="overflow-x-auto border border-slate-100 rounded-lg">
                                <table className="w-full text-xs">
                                    <thead className="bg-slate-50 text-slate-500">
                                        <tr>
                                            <th className="px-3 py-2 text-left font-medium">Player ID</th>
                                            <th className="px-3 py-2 text-left font-medium">First Name</th>
                                            <th className="px-3 py-2 text-left font-medium">Last Name</th>
                                            <th className="px-3 py-2 text-left font-medium">Accreditation</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {selectedPlan.people.map(p => (
                                            <tr key={p.id}>
                                                <td className="px-3 py-2 font-mono">{p.id}</td>
                                                <td className="px-3 py-2">{p.firstName}</td>
                                                <td className="px-3 py-2">{p.lastName}</td>
                                                <td className="px-3 py-2">
                                                    <span className="bg-blue-50 text-blue-700 text-[10px] px-2 py-1 rounded-full font-semibold">
                                                        {p.accreditation}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            )}
        </Modal>
    );

    // "View All Arrivals/Departures" hands off to its own paginated page (12/page) instead of a
    // Modal - same renderPlanRecordCard (no live status, click-through-to-detail) as the inline
    // preview - and the detail modal above still needs to come along, since a card here opens it too.
    if (showAllArrivals) {
        return (
            <>
                <PaginatedListPage title="All Arrivals" items={arrivals} renderItem={renderPlanRecordCard}
                    onBack={() => setShowAllArrivals(false)} emptyMessage="No arrival records yet." />
                {planDetailModal}
            </>
        );
    }
    if (showAllDepartures) {
        return (
            <>
                <PaginatedListPage title="All Departures" items={departures} renderItem={renderPlanRecordCard}
                    onBack={() => setShowAllDepartures(false)} emptyMessage="No departure records yet." />
                {planDetailModal}
            </>
        );
    }

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Travel Plans</h2>
                    <p className="text-sm text-slate-500">Arrival and departure records - live flight/train status, detailed manifests, and ticket uploads</p>
                </div>
                <div className="flex gap-2 flex-wrap">
                    <ExportImport label="Arrivals & Departures" onExport={exportManualPlans} onImport={handleManualImport}
                        hint="Ticket uploads aren't part of CSV - attach each one from a record's own detail view."
                        sampleHeaders={['id', 'planType', 'departmentName', 'federation', 'role', 'gender', 'memberSize', 'date', 'time', 'transportMode', 'transportNumber', 'pnrNumber', 'city', 'location', 'pocName', 'pocContact']} />
                    <Btn onClick={openManualModal}><Icon name="plus" size={14} className="inline mr-1" />Create Travel Plan</Btn>
                </div>
            </div>

            {/* HERO - live status is what this tab leads with. Only Flight/Train ever get a Live
                Status reading (see mockTransportStatus), so those are the two segregated columns -
                Bus/Car records never show up here, only in the Arrivals/Departures lists below.
                Built as its own dark-header shell (not the plain window.Card) - same visual language
                as the full Live Fleet Tracking page's command header and the Dashboard's two preview
                cards, so this reads as the hero of the page instead of just another white card. */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-card overflow-hidden mb-6">
                <div className="relative overflow-hidden bg-slate-900">
                    <div className="absolute -top-16 -right-10 w-56 h-56 bg-brandAccent/20 rounded-full blur-3xl pointer-events-none" />
                    <div className="relative px-5 sm:px-6 py-5 flex items-start gap-4">
                        <div className="p-3 bg-white/5 border border-white/10 rounded-xl shrink-0">
                            <Icon name="calendar" size={22} className="text-brandAccent" />
                        </div>
                        <div className="min-w-0">
                            <div className="flex items-center gap-3 flex-wrap">
                                <span className="inline-flex items-center gap-1.5 bg-red-500/15 text-red-400 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-full">
                                    <span className="w-1.5 h-1.5 rounded-full bg-red-400 sos-pulse" />Live
                                </span>
                                <h2 className="text-xl font-bold text-white leading-tight">Live Arrival & Departure Status</h2>
                            </div>
                            <p className="text-sm text-slate-400 mt-1">Flight and train records, tracked by transport number + PNR</p>
                        </div>
                    </div>
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 p-5">
                    <div>
                        <h4 className="flex items-center gap-2 text-sm font-semibold text-slate-800 border-b border-slate-200 pb-2 mb-3">
                            <TransportGlyph mode="Flight" size={16} className="text-brandAccent" />Flights ({flightRecords.length})
                        </h4>
                        {flightRecords.length === 0 ? (
                            <p className="text-sm text-slate-400 text-center py-6">No flight records yet.</p>
                        ) : (
                            <div className="space-y-3">{flightRecords.map(renderManualPlanCard)}</div>
                        )}
                    </div>
                    <div>
                        <h4 className="flex items-center gap-2 text-sm font-semibold text-slate-800 border-b border-slate-200 pb-2 mb-3">
                            <TransportGlyph mode="Train" size={16} className="text-brandAccent" />Trains ({trainRecords.length})
                        </h4>
                        {trainRecords.length === 0 ? (
                            <p className="text-sm text-slate-400 text-center py-6">No train records yet.</p>
                        ) : (
                            <div className="space-y-3">{trainRecords.map(renderManualPlanCard)}</div>
                        )}
                    </div>
                </div>
            </div>

            {/* Separate Arrivals and Departures lists, every transport mode included (unlike the hero
                above) - this is the full detailed manifest, the hero is just the live-status glance. */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <Card title={`Arrivals (${arrivals.length})`}>
                    {arrivals.length === 0 ? (
                        <p className="px-5 py-8 text-sm text-slate-400 text-center">No arrival records yet.</p>
                    ) : (
                        <>
                            <div className="space-y-3 p-5">{arrivals.slice(0, ARRIVAL_PREVIEW_LIMIT).map(renderPlanRecordCard)}</div>
                            {arrivals.length > ARRIVAL_PREVIEW_LIMIT && (
                                <div className="px-5 pb-5 -mt-1 text-center">
                                    <button onClick={() => setShowAllArrivals(true)} className="text-sm font-medium text-brandAccent hover:underline">
                                        View All Arrivals ({arrivals.length}) →
                                    </button>
                                </div>
                            )}
                        </>
                    )}
                </Card>

                <Card title={`Departures (${departures.length})`}>
                    {departures.length === 0 ? (
                        <p className="px-5 py-8 text-sm text-slate-400 text-center">No departure records yet.</p>
                    ) : (
                        <>
                            <div className="space-y-3 p-5">{departures.slice(0, DEPARTURE_PREVIEW_LIMIT).map(renderPlanRecordCard)}</div>
                            {departures.length > DEPARTURE_PREVIEW_LIMIT && (
                                <div className="px-5 pb-5 -mt-1 text-center">
                                    <button onClick={() => setShowAllDepartures(true)} className="text-sm font-medium text-brandAccent hover:underline">
                                        View All Departures ({departures.length}) →
                                    </button>
                                </div>
                            )}
                        </>
                    )}
                </Card>
            </div>

            {planDetailModal}

            {/* Create Travel Plan Modal (manual arrival/departure entry) */}
            <Modal open={manualModal} onClose={() => setManualModal(false)} title="Create Travel Plan" wide>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {/* Left column - Group Details */}
                    <div className="border border-slate-200 rounded-lg p-5">
                        <h4 className="font-semibold text-slate-800 mb-4">{groupHeader}</h4>
                        <div className="space-y-4">
                            <div>
                                <span className="text-xs font-medium text-slate-500 mb-1.5 block">Type</span>
                                <div className="flex rounded-lg border border-slate-200 overflow-hidden text-sm">
                                    {['Arrival', 'Departure'].map(t => (
                                        <button key={t} type="button" onClick={() => setPlanType(t)}
                                            className={`flex-1 px-3 py-2 font-medium transition ${planType === t ? 'bg-brandAccent text-white' : 'bg-white text-slate-600 hover:bg-slate-50'}`}>
                                            {t}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <Input label="Sport/Department" value={manualPlanForm.departmentName}
                                onChange={e => updateManual('departmentName', e.target.value)} />

                            <Select label="Federation" value={manualPlanForm.federation}
                                onChange={e => updateManual('federation', e.target.value)}
                                options={[{ value: '', label: 'Select federation...' }, ...FEDERATIONS]} />

                            {/* Same fixed stakeholder categories used everywhere else this app maps a
                                group to a vehicle type (Fleet Estimation, Suggested Plans' auto-assign) -
                                one shared source of truth (window.STAKEHOLDER_TYPES) rather than a
                                separate role list just for this form. */}
                            <Select label="Role" value={manualPlanForm.role}
                                onChange={e => updateManual('role', e.target.value)}
                                options={[{ value: '', label: 'Select stakeholder role...' }, ...STAKEHOLDER_TYPES]} />

                            <Select label="Gender" value={manualPlanForm.gender}
                                onChange={e => updateManual('gender', e.target.value)}
                                options={[{ value: '', label: 'Select gender...' }, ...GENDER_OPTIONS]} />

                            <Input label="Member Size" type="number" min="0" placeholder="Total expected members"

                                        <input placeholder="YYYY" maxLength={4} value={manualPlanForm.dateYYYY}
                                            onChange={e => updateManual('dateYYYY', e.target.value)}

                                    </div>
                                </div>

                                <div>
                                    <span className="text-xs font-medium text-slate-500 mb-1 block">{timeLabel}</span>
