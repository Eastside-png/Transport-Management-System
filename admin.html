    return class HtmlOverlay extends google.maps.OverlayView {
        constructor(position, html, onClick, anchor = [40, 10]) {
            super();
            this.position = position;
            this.html = html;
            this.onClick = onClick;
            this.anchor = anchor;
            this.div = null;
        }
        onAdd() {
            this.div = document.createElement('div');
            this.div.style.position = 'absolute';
            this.div.style.cursor = this.onClick ? 'pointer' : 'default';
            this.div.innerHTML = this.html;
            if (this.onClick) {
                this.div.addEventListener('click', (e) => { e.stopPropagation(); this.onClick(); });
            }
            this.getPanes().overlayMouseTarget.appendChild(this.div);
        }
        draw() {
            const proj = this.getProjection();
            if (!proj || !this.div) return;
            const point = proj.fromLatLngToDivPixel(this.position);
            if (!point) return;
            this.div.style.left = `${point.x - this.anchor[0]}px`;
            this.div.style.top = `${point.y - this.anchor[1]}px`;
        }
        onRemove() { if (this.div) { this.div.remove(); this.div = null; } }
        setPosition(position) { this.position = position; this.draw(); }
        getPosition() { return this.position; }
    };
}

// `heightClassName` overrides the default h-[500px]/fullscreen-h-full sizing - used by the
// Dashboard's compact preview card, which needs something much shorter than the full Live Fleet
// Tracking page's map. `showLegend` lets that same preview drop the vendor-color legend box, which
// only really earns its space at the bigger sizes.
function FleetMap({ assignments, selectedId, onSelect, showPhase, isFullscreen, heightClassName, showLegend = true }) {
    const mapEl = useRef(null);
    const mapRef = useRef(null);
    const layersRef = useRef({ markers: {}, routes: {} });
    const infoWindowRef = useRef(null);
    const OverlayClassRef = useRef(null);
    // The Google Maps script tag loads before this app's own scripts run (see the <head> tag order),
    // so this is almost always already true on first render - polling here is just cheap insurance
    // against a slow network rather than something expected to matter in practice.
    const [mapsReady, setMapsReady] = useState(!!(window.google && window.google.maps));

    useEffect(() => {
        if (mapsReady) return;
        const id = setInterval(() => {
            if (window.google && window.google.maps) { setMapsReady(true); clearInterval(id); }
        }, 200);
        return () => clearInterval(id);
    }, [mapsReady]);

    const onMap = useMemo(() =>
        assignments.filter(a => {
            if (!a.routeFrom || !a.routeTo) return false;
            if (showPhase === 'Ongoing') return a.phase === 'ongoing';
            if (showPhase === 'Upcoming') return a.phase === 'upcoming';
            if (showPhase === 'Past') return a.phase === 'past';
            return a.phase === 'ongoing' || a.phase === 'upcoming';
        }),
        [assignments, showPhase]
    );

    useEffect(() => {
        if (!mapEl.current || mapRef.current || !mapsReady) return;
        mapRef.current = new google.maps.Map(mapEl.current, {
            center: { lat: 28.565, lng: 77.175 }, zoom: 12,
            mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
        });
        infoWindowRef.current = new google.maps.InfoWindow();
        OverlayClassRef.current = makeHtmlOverlayClass();
    }, [mapsReady]);

    // Opens the same InfoWindow content a marker's own click uses - pulled out so the "select from
    // outside" effect below (e.g. clicking a row in a list next to the map) can trigger the identical
    // popup a direct click on the pin would, instead of duplicating the content-building logic.
    const openInfoFor = (id) => {
        const marker = layersRef.current.markers[id];
        if (!marker || !infoWindowRef.current || !mapRef.current) return;
        infoWindowRef.current.setContent(marker.infoHtml);
        infoWindowRef.current.setPosition(marker.getPosition());
        infoWindowRef.current.open(mapRef.current);
    };

    useEffect(() => {
        const map = mapRef.current;
        if (!map || !mapsReady || !OverlayClassRef.current) return;
        const HtmlOverlay = OverlayClassRef.current;

        Object.values(layersRef.current.markers).forEach(m => m.setMap(null));
        Object.values(layersRef.current.routes).forEach(r => r.setMap(null));
        layersRef.current = { markers: {}, routes: {} };

        const bounds = new google.maps.LatLngBounds();
        let pointCount = 0;

        onMap.forEach(a => {
            const color = VENDOR_COLORS[a.vendorName] || '#64748B';
            const posArr = posAlongRoute(a.routeFrom, a.routeTo, a.progress ?? 0);
            const pos = new google.maps.LatLng(posArr[0], posArr[1]);
            bounds.extend(pos);
            pointCount++;

            // Google has no direct dashArray equivalent - a repeating line-symbol icon over an
            // otherwise fully-transparent stroke is the documented way to fake one.
            const routeLine = new google.maps.Polyline({
                path: [{ lat: a.routeFrom[0], lng: a.routeFrom[1] }, { lat: a.routeTo[0], lng: a.routeTo[1] }],
                map,
                strokeColor: color,
                strokeWeight: 2,
                ...(a.phase === 'upcoming'
                    ? { strokeOpacity: 0, icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 }, offset: '0', repeat: '10px' }] }
                    : { strokeOpacity: a.phase === 'past' ? 0.25 : 0.45 }),
            });
            layersRef.current.routes[a.id] = routeLine;

            const isSos = !!a.sos;
            const isSelected = a.id === selectedId;
            const html = `<div style="text-align:center"><div class="fleet-marker-dot ${isSos ? 'sos' : ''}" style="background:${isSos ? '#EF4444' : color};${isSelected ? 'transform:scale(1.35);' : ''}"></div><div class="fleet-marker-label">${TYPE_SHORT(a.type)} (${a.vehicleId})</div></div>`;

            // Fuel line falls back to "No data" rather than omitting itself, so the popup's shape is
            // predictable whether or not this vehicle has ever had a fuel level recorded.
            const fuelText = a.fuelLevel != null
                ? `${a.fuelLevel}%${a.dueForRefuel ? ' - due for refuel' : ''}`
                : 'No data';

            const marker = new HtmlOverlay(pos, html, () => { onSelect(a.id); openInfoFor(a.id); });
            marker.infoHtml = `
                <div style="font-family:Inter,sans-serif;font-size:12px;min-width:180px">
                    <strong>${TYPE_SHORT(a.type)} (${a.vehicleId})</strong><br/>
                    <span style="color:#64748B">${a.vendorName || 'Unknown vendor'}</span><br/>
                    Driver: ${a.driver}<br/>
                    Route: ${a.route}<br/>
                    Status: <strong>${a.status}</strong>  |  ${a.progress ?? 0}%<br/>
                    Fuel: <strong>${fuelText}</strong><br/>
                    Stakeholder: ${a.stakeholder}
                </div>
            `;
            marker.setMap(map);
            layersRef.current.markers[a.id] = marker;
        });

        if (pointCount > 1) {
            map.fitBounds(bounds, 40);
            const listener = map.addListener('idle', () => {
                if (map.getZoom() > 13) map.setZoom(13);
                google.maps.event.removeListener(listener);
            });
        } else if (pointCount === 1) {
            map.setCenter(bounds.getCenter());
            map.setZoom(13);
        }
    }, [onMap, selectedId, onSelect, mapsReady]);

    useEffect(() => {
        if (!selectedId || !layersRef.current.markers[selectedId]) return;
        mapRef.current?.panTo(layersRef.current.markers[selectedId].getPosition());
        openInfoFor(selectedId);
    }, [selectedId]);

    // Unlike Leaflet, Google Maps watches its own container for resizes, so there's no
    // invalidateSize()-style call needed when the fullscreen toggle changes the div's on-screen size -
    // this just re-centers once the CSS transition has actually finished growing/shrinking it, so the
    // recenter reads the container's final size rather than a mid-transition one.
    useEffect(() => {
        const id = setTimeout(() => {
            if (mapRef.current) google.maps.event.trigger(mapRef.current, 'resize');
        }, 150);
        return () => clearTimeout(id);
    }, [isFullscreen]);

    // The outer wrapper needs h-full too whenever the inner map div is sized with h-full - a
    // percentage height only resolves against a parent whose own height is definite, not 'auto'
    // (which is what a bare `relative` div collapses to here without it).
    return (
        <div className={(isFullscreen || heightClassName === 'h-full') ? 'relative h-full' : 'relative'}>
            <div ref={mapEl} className={`${heightClassName || (isFullscreen ? 'h-full' : 'h-[500px]')} w-full bg-slate-100`} />
            {showLegend && (
                <div className="absolute top-4 right-4 flex flex-col items-end gap-2 z-[500]">
                    <div className="bg-white/90 backdrop-blur-sm p-4 rounded-xl shadow-lg text-[10px] space-y-1">
                        <p className="font-semibold text-slate-600 uppercase tracking-wide mb-1">Vendors</p>
                        {Object.entries(VENDOR_COLORS).map(([name, color]) => (
                            <div key={name} className="flex items-center gap-1.5">
                                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: color }} />
                                <span className="text-slate-600">{name}</span>
                            </div>
                        ))}
                        <div className="flex items-center gap-1.5 pt-1 border-t border-slate-100">
                            <span className="w-2.5 h-2.5 rounded-full bg-red-500 shrink-0" />
                            <span className="text-slate-600">SOS</span>
                        </div>
                    </div>
                </div>
            )}
            <div className="absolute bottom-4 left-4 bg-white/90 backdrop-blur-sm px-3 py-2 rounded-xl shadow-lg text-[10px] text-slate-500 z-[400]">
                * Live positions simulated  |  {onMap.length} vehicles on map
            </div>
        </div>
    );
}

// Exposed for the Dashboard's compact preview card - everywhere else (Live Fleet Tracking's own
// page) still just uses the plain in-block `FleetMap` identifier, unaffected by this.
window.FleetMap = FleetMap;

// Compact fuel level + refuel-cycle readout for one vehicle - a bar colored by how low it's running
// (red <20%, amber <50%, emerald otherwise), the actual km driven since the last refuel against the
// category's recommended interval (an amber "Due for refuel" chip once it's crossed, rather than
// that interval just sitting there as an inert number), and when it was last topped off. Needs `data`
// now (vehicleFuelProfile derives fuelLevel from today's driven distance, not a stored number) -
// falls back to "No fuel data" only if the vehicle's category itself can't be resolved. Renders at
// `w-full` so it fills its own Fuel capsule exactly the way the Progress bar next to it fills its -
// same bar height, same label sizing - the two are meant to read as a matched pair. The "X / Y km" and
// "Last DATE" lines are kept short enough to each sit on their own line rather than truncating (a
// value getting cut off is its own kind of "the info isn't there"). Who logged it (lastRefuelSource)
// rides along as a hover tooltip instead of always-visible text, so it never changes this block's size.
function FuelGauge({ vehicle, data }) {
    const profile = vehicle ? vehicleFuelProfile(vehicle, data) : null;
    if (!profile || profile.fuelLevel == null) {
        return <span className="text-xs text-slate-300">No fuel data</span>;
    }
    const level = profile.fuelLevel;
    const barColor = level < 20 ? 'bg-red-500' : level < 50 ? 'bg-amber-500' : 'bg-emerald-500';
    return (
        <div className="w-full">
            <div className="flex items-center gap-2">
                <div className="flex-1 bg-slate-200 rounded-full h-1.5">
                    <div className={`h-1.5 rounded-full ${barColor} transition-all`} style={{ width: `${level}%` }} />
                </div>
                <span className="text-xs font-medium text-slate-600 w-9 text-right">{level}%</span>
            </div>
            <div className="text-[10px] text-slate-400 mt-1 leading-snug"
                title={profile.lastRefuelSource ? `Last refuel logged by: ${profile.lastRefuelSource}` : undefined}>
                <p>{Math.round(profile.kmSinceRefuel)} / {profile.refuelCycleKm} km</p>
                <p>Last {profile.lastRefuelDate || '—'}</p>
            </div>
            {profile.dueForRefuel && (
                <span className="inline-flex items-center gap-1 text-[10px] font-semibold text-amber-700 mt-0.5">
                    <Icon name="alert" size={10} className="shrink-0" />Due for refuel
                </span>
            )}
        </div>
    );
}

// Shared between the Dashboard's short preview list and the "View All Assignments" popup, so the
// two never drift out of sync - same card layout, same row behavior, just a different list length.
// One row-card per assignment rather than a table - Route and Stakeholder are both open-ended text
// (the same "Athletes Village - Block A -> Practice Arena 1" / "Delegation Wave 3 - Team Kenya" kind
// of length that made Travel Plans' table cramped and truncation-heavy), so Route gets its own
// full-width line and the shorter fields (Vendor/Fuel/Progress) share a labeled row below instead of
// all seven columns competing for space side by side. Quick Edit has been removed entirely - it was
// the one action that didn't fit this card shape (its "Quick Assignment Change" modal duplicated the
// per-row Vehicle-reassign flow Travel Plans already owns), not just relocated.
function AssignmentsTable({ list, vehicleById, selectedId, onSelect, onLogRefuel, data }) {
    if (list.length === 0) {
        return <p className="text-center text-slate-400 py-8 text-sm">No assignments match filters.</p>;
    }
    return (
        <div className="space-y-3 p-2">
            {list.map(a => {
                const vehicle = vehicleById(a.vehicleId);
                const accent = cardAccent(a);
                const isSelected = selectedId === a.id;
                const [origin, destination] = a.route.split(' -> ');
                const originLabel = splitLocationLabel(origin);
                const destLabel = splitLocationLabel(destination);
                return (
                    <div key={a.id} onClick={() => onSelect(a.id)}
                        className={`bg-white border border-l-4 ${accent.border} rounded-2xl p-4 shadow-sm hover:shadow-md transition-all cursor-pointer ${isSelected ? 'border-brandAccent/40 ring-2 ring-brandAccent/20' : 'border-slate-300 hover:border-slate-400'}`}>
                        <div className="flex flex-col lg:flex-row lg:items-start gap-4">
                            <div className="flex-1 min-w-0">
                                <div className="flex flex-wrap items-start justify-between gap-3">
                                    <div className="flex items-center gap-3 min-w-0">
                                        <div className={`w-11 h-11 rounded-xl flex items-center justify-center shrink-0 ${accent.chip}`}>
                                            <Icon name={vehicleTypeIcon(a.type)} size={20} />
                                        </div>
                                        <div className="min-w-0">
                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                <span className="font-semibold text-slate-800 text-sm">{TYPE_SHORT(a.type)} ({a.vehicleId})</span>
                                                {a.sos && <span className="shrink-0 bg-red-100 text-red-600 text-[10px] font-bold px-1.5 py-0.5 rounded-full">SOS</span>}
                                            </div>
                                            <div className="flex items-center gap-1.5 text-xs text-slate-400 mt-0.5">
                                                <Icon name="users" size={12} className="text-slate-300 shrink-0" />{a.driver}
                                                <span className="text-slate-300">&middot;</span>{a.time}
                                            </div>
                                        </div>
                                    </div>
                                    <StatusPill status={a.status} />
                                </div>

                                {/* Origin -> destination, each end its own icon square + label joined
                                    by a dashed line with a small direction marker - a compact version
                                    of the same idea Travel Plans' own detail modal uses, sized to sit
                                    inline in a card instead of a full page. */}
                                <div className="mt-4 flex items-start gap-2">
                                    <div className="w-20 shrink-0 space-y-1.5">
                                        <div className={`w-9 h-9 rounded-lg flex items-center justify-center ${accent.chip}`}>
                                            <Icon name={locationGlyph(origin)} size={15} />
                                        </div>
                                        <div className="text-xs leading-tight">
                                            <p className="font-semibold text-slate-700">{originLabel.main}</p>
                                            {originLabel.sub && <p className="text-slate-400">{originLabel.sub}</p>}
                                        </div>
                                    </div>
                                    <div className="flex-1 relative flex items-center h-9">
                                        <div className="w-full border-t-2 border-dashed border-slate-200" />
                                        <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-white border-2 border-slate-200 flex items-center justify-center">
                                            <Icon name="arrowRight" size={10} className="text-slate-400" />
                                        </div>
                                    </div>
                                    <div className="w-20 shrink-0 space-y-1.5">
                                        <div className={`w-9 h-9 rounded-lg flex items-center justify-center ${accent.chip}`}>
                                            <Icon name={locationGlyph(destination)} size={15} />
                                        </div>
                                        <div className="text-xs leading-tight">
                                            <p className="font-semibold text-slate-700">{destLabel.main}</p>
                                            {destLabel.sub && <p className="text-slate-400">{destLabel.sub}</p>}
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-4 pt-3 border-t border-slate-100 grid grid-cols-2 gap-4">
                                    <div className="min-w-0">
                                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Vendor</p>
                                        <span className="inline-flex items-center gap-1.5 text-sm text-slate-700 min-w-0">
                                            <span className="w-2 h-2 rounded-full shrink-0" style={{ background: VENDOR_COLORS[a.vendorName] || '#94A3B8' }} />
                                            <span className="truncate">{a.vendorName}</span>
                                        </span>
                                    </div>
                                    <div className="min-w-0">
                                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Stakeholder</p>
                                        <p className="text-sm text-slate-700 truncate">{a.stakeholder}</p>
                                    </div>
                                </div>
                            </div>

                            {/* Fuel and Progress are given matching capsules (same bg/border/padding,
                                same bar height and label styling) so the two read as a paired set of
                                gauges rather than one being a bare bar and the other a boxed widget. */}
                            <div className="flex gap-3 lg:w-[320px] shrink-0">
                                <div className="flex-1 bg-slate-50 border border-slate-100 rounded-xl p-3" onClick={e => e.stopPropagation()}>
                                    <p className="flex items-center gap-1 text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1.5">
                                        <Icon name="droplet" size={11} className="text-slate-300" />Fuel
                                    </p>
                                    <FuelGauge vehicle={vehicle} data={data} />
                                    {vehicle && (
                                        <button onClick={() => onLogRefuel(vehicle.id)}
                                            className="mt-2 w-full inline-flex items-center justify-center gap-1.5 text-xs font-semibold text-brandAccent bg-blue-50 hover:bg-blue-100 rounded-lg py-1.5 transition">
                                            <Icon name="upload" size={12} />Log Refuel
                                        </button>
                                    )}
                                </div>

                                <div className="flex-1 bg-slate-50 border border-slate-100 rounded-xl p-3">
                                    <p className="flex items-center gap-1 text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1.5">
                                        <Icon name="trending" size={11} className="text-slate-300" />Progress
                                    </p>
                                    <div className="flex items-center gap-2">
                                        <div className="flex-1 bg-slate-200 rounded-full h-1.5">
                                            <div className="h-1.5 rounded-full bg-brandAccent transition-all" style={{ width: `${a.progress ?? 0}%` }} />
                                        </div>
                                        <span className="text-xs font-medium text-slate-600 w-9 text-right">{a.progress ?? 0}%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            })}
        </div>
    );
}

// The actual Live Fleet Tracking content - kept as its own component (rather than folded straight
// into window.LiveFleetTrackingTab below) since it's still useful as a self-contained section on its
// own, independent of whatever page wraps it.
window.FleetTrackingSection = ({ data, setData }) => {
    const [phase, setPhase] = useState('All Active');
    const [mapPhase, setMapPhase] = useState('All Active');
    const [selectedId, setSelectedId] = useState(null);
    const [vendorFilter, setVendorFilter] = useState('All');
    // The Dashboard preview only shows a handful of rows so the assignment list doesn't dominate the
    // page - "View All Assignments" opens the same list, unlimited, in a popup instead.
    const [showAllModal, setShowAllModal] = useState(false);
    const PREVIEW_LIMIT = 5;
    // Manually marking a vehicle refueled is a deliberate, hard-to-undo claim about the real world
    // (it resets the depletion checkpoint - see logRefuel below), so a stray tap shouldn't be able to
    // commit it straight away. Staged here rather than inside AssignmentsTable/FuelGauge since the
    // confirm modal itself lives on this component.
    const [pendingRefuelVehicleId, setPendingRefuelVehicleId] = useState(null);
    // Fullscreen takes over the whole viewport (fixed inset-0) rather than just growing the map's own
    // height, so the header/filter bar/legend all stay usable at full size too - not just a taller map.
    const [isFullscreen, setIsFullscreen] = useState(false);

    // Esc exits fullscreen, and the body can't scroll behind the fixed overlay while it's up - both
    // undone automatically on unmount/toggle-off via the cleanup fn.
    useEffect(() => {
        if (!isFullscreen) return;
        const onKey = e => { if (e.key === 'Escape') setIsFullscreen(false); };
        window.addEventListener('keydown', onKey);
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = prevOverflow; };
    }, [isFullscreen]);

    const phases = ['All Active', 'Ongoing', 'Upcoming', 'Past'];
    const vendors = useMemo(() => [...new Set(data.assignments.map(a => a.vendorName).filter(Boolean))], [data.assignments]);

    const vehicleById = (vehicleId) => {
        for (const v of data.vendors) {
            const f = v.fleet.find(x => x.id === vehicleId);
            if (f) return f;
        }
        return null;
    };

    const filtered = useMemo(() => {
        let list = data.assignments;
        if (phase === 'Ongoing') list = list.filter(a => a.phase === 'ongoing');
        else if (phase === 'Upcoming') list = list.filter(a => a.phase === 'upcoming');
        else if (phase === 'Past') list = list.filter(a => a.phase === 'past');
        else list = list.filter(a => a.phase === 'ongoing' || a.phase === 'upcoming');
        if (vendorFilter !== 'All') list = list.filter(a => a.vendorName === vendorFilter);
        return list;
    }, [data.assignments, phase, vendorFilter]);

    // Enriched with each assignment's vehicle fuel level/cycle so FleetMap's popup can show it
    // without needing its own vendor lookup. Recomputes on every progress tick (data.assignments is a
    // dependency) so a vehicle's popup fuel% ticks down live right along with its moving marker.
    const mapAssignments = useMemo(() => {
        const list = vendorFilter === 'All' ? data.assignments : data.assignments.filter(a => a.vendorName === vendorFilter);
        return list.map(a => {
            const vehicle = vehicleById(a.vehicleId);
            const profile = vehicle ? vehicleFuelProfile(vehicle, data) : null;
            return { ...a, fuelLevel: profile?.fuelLevel ?? null, refuelCycleKm: profile?.refuelCycleKm ?? null, dueForRefuel: profile?.dueForRefuel ?? false };
        });
    }, [data, vendorFilter]);

    useEffect(() => {
        const id = setInterval(() => {
            setData(d => ({
                ...d,
                assignments: d.assignments.map(a => {
                    if (a.phase !== 'ongoing' || a.status !== 'In Transit' || (a.progress ?? 0) >= 100) return a;
                    return { ...a, progress: Math.min(100, (a.progress ?? 0) + 1) };
                }),
            }));
        }, 4000);
        return () => clearInterval(id);
    }, [setData]);

    // Refueling means resetting the depletion checkpoint to right now, not just forcing fuelLevel to
    // 100 - fuelCheckpointKm is stamped to the vehicle's current vehicleTotalKmDriven, so
    // window.vehicleFuelProfile's kmSinceRefuel (and therefore fuelLevel) drops back to 0/100% from
    // this point forward, while whatever was already driven today before the click stays spent rather
    // than being forgotten. lastRefuelSource records who logged it - this button is on the admin side,
    // so it's tagged 'Manual (Admin)' by default; the Driver Prototype has its own "Log Refuel" action
    // on the driver's current-trip screen tagged 'Driver App' - the two aren't wired together (no
    // shared backend between the two prototypes) but both now leave an honest trail of who reported it.
    const logRefuel = (vehicleId, source = 'Manual (Admin)') => {
        const today = new Date().toISOString().slice(0, 10);
        const vehicle = vehicleById(vehicleId);
        const checkpoint = vehicle ? vehicleTotalKmDriven(vehicle, data) : 0;
        setData(d => ({
            ...d,
            vendors: d.vendors.map(v => ({
                ...v,
                fleet: v.fleet.map(f => f.id === vehicleId
                    ? { ...f, fuelCheckpointKm: checkpoint, lastRefuelDate: today, lastRefuelSource: source }
                    : f),
            })),
        }));
    };

    // AssignmentsTable's "Log Refuel" button only ever stages this - the actual reset (logRefuel
    // above) only fires once the confirm modal is accepted.
    const requestLogRefuel = (vehicleId) => setPendingRefuelVehicleId(vehicleId);
    const confirmLogRefuel = () => {
        if (pendingRefuelVehicleId) logRefuel(pendingRefuelVehicleId);
        setPendingRefuelVehicleId(null);
    };

    // "View All Assignments" hands off to its own page (12/page, real pagination) instead of a Modal -
    // AssignmentsTable itself is unchanged, just handed whichever page's slice via renderPage.
    if (showAllModal) {
        return (
            <PaginatedListPage title="All Assignments" items={filtered} onBack={() => setShowAllModal(false)}
                emptyMessage="No assignments match filters."
                renderPage={pageItems => (
                    <div className="space-y-3">
                        <TabBar tabs={phases} active={phase} onChange={setPhase} />
                        <AssignmentsTable list={pageItems} vehicleById={vehicleById} data={data}
                            selectedId={selectedId} onSelect={setSelectedId} onLogRefuel={requestLogRefuel} />
                    </div>
                )} />
        );
    }

    return (
        <div id="fleet-tracking" className="space-y-5">
            {/* Unified hero container - command header, filter bar, and map canvas all inside one
                card so the map reads as the hero element instead of a separate section below it.
                Fullscreen swaps this to a fixed viewport overlay (flex column, map takes the
                remaining space) rather than just growing the map's own height - the header, filter
                bar, and vendor pills all stay at full, usable size too. */}
            <div className={isFullscreen
                ? 'fixed inset-0 z-[999] bg-white flex flex-col'
                : 'bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-200'}>
                {/* Command header */}
                <div className="relative overflow-hidden bg-slate-900 text-white shrink-0">
                    <div className="absolute -top-20 -right-16 w-72 h-72 bg-brandAccent/20 rounded-full blur-3xl pointer-events-none" />
                    <div className="absolute -bottom-24 -left-10 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none" />
                    <div className="relative px-5 sm:px-6 py-5 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-start gap-4 min-w-0">
                            <div className="p-3 bg-white/5 border border-white/10 rounded-xl shrink-0">
                                <Icon name="tracking" size={22} className="text-brandAccent" />
                            </div>
                            <div className="min-w-0">
                                <div className="flex items-center gap-3 flex-wrap">
                                    <span className="inline-flex items-center gap-1.5 bg-red-500/15 text-red-400 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-full">
                                        <span className="w-1.5 h-1.5 rounded-full bg-red-400 sos-pulse" />Live System
                                    </span>
                                    <h2 className="text-2xl font-bold text-white leading-tight">Live Fleet Tracking</h2>
                                </div>
                                <p className="text-sm text-slate-400 mt-1">Real-time visibility across every vendor fleet</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                            <button onClick={() => setIsFullscreen(f => !f)} title={isFullscreen ? 'Exit fullscreen (Esc)' : 'View fullscreen'}
                                className="inline-flex items-center gap-1.5 px-3 py-2 text-sm font-medium rounded-lg bg-white/5 hover:bg-white/10 text-slate-200 border border-white/10 transition">
                                <Icon name={isFullscreen ? 'minimize' : 'maximize'} size={14} />
                            </button>
                        </div>
                    </div>
                </div>

                {/* Filter bar - segmented status control on the left, vendor pills on the right */}
                <div className="bg-slate-50 border-b border-slate-200 px-4 py-3 flex flex-wrap gap-3 items-center justify-between shrink-0">
                    <div className="inline-flex bg-slate-100 rounded-lg p-1 gap-1">
                        {['All Active', 'Ongoing', 'Upcoming'].map(p => (
                            <button key={p} onClick={() => setMapPhase(p)}
                                className={`px-3.5 py-1.5 text-xs font-semibold rounded-md transition ${mapPhase === p ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                {p}
                            </button>
                        ))}
                    </div>
                    <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Vendors:</span>
                        <button onClick={() => setVendorFilter('All')}
                            className={`px-3 py-1.5 text-xs font-medium rounded-full border transition ${vendorFilter === 'All' ? 'border-brandAccent text-brandAccent bg-blue-50' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}`}>
                            All Vendors
                        </button>
                        {vendors.map(v => (
                            <button key={v} onClick={() => setVendorFilter(v)}
                                className={`px-3 py-1.5 text-xs font-medium rounded-full border transition ${vendorFilter === v ? 'border-brandAccent text-brandAccent bg-blue-50' : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}`}>
                                {v.split(' ')[0]}
                            </button>
                        ))}
                    </div>
                </div>

                {/* Map canvas - flex-1/min-h-0 so it fills whatever space the header+filter bar leave
                    behind in fullscreen; a plain block in the normal (non-fullscreen) layout. */}
                <div className={isFullscreen ? 'flex-1 min-h-0' : ''}>
                    <FleetMap assignments={mapAssignments} selectedId={selectedId} onSelect={setSelectedId} showPhase={mapPhase} isFullscreen={isFullscreen} />
                </div>
            </div>

            {/* Assignment table - a short preview only, so it doesn't dominate the Dashboard page */}
            <TabBar tabs={phases} active={phase} onChange={setPhase} />

            <Card>
                <AssignmentsTable list={filtered.slice(0, PREVIEW_LIMIT)} vehicleById={vehicleById} data={data}
                    selectedId={selectedId} onSelect={setSelectedId} onLogRefuel={requestLogRefuel} />
                {filtered.length > PREVIEW_LIMIT && (
                    <div className="px-5 py-3 border-t border-slate-100 text-center">
                        <button onClick={() => setShowAllModal(true)} className="text-sm font-medium text-brandAccent hover:underline">
                            View All Assignments ({filtered.length}) →
                        </button>
                    </div>
                )}
            </Card>


            {/* Manually marking a vehicle refueled resets its depletion checkpoint - a deliberate claim
                about the real world, not a reversible display toggle - so it's confirmed explicitly
                rather than committing the instant the button is tapped. */}
            <Modal open={!!pendingRefuelVehicleId} onClose={() => setPendingRefuelVehicleId(null)} title="Confirm Manual Refuel">
                <div className="space-y-4">
                    <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                        <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                        <p className="text-sm text-amber-800">
                            You're about to manually log <strong>{pendingRefuelVehicleId}</strong> as refueled - its fuel level will reset to 100% as of right now. Are you sure?
                        </p>
                    </div>
                    <div className="flex gap-2">
                        <Btn variant="danger" onClick={confirmLogRefuel}>Yes, Log Refuel</Btn>
                        <Btn variant="outline" onClick={() => setPendingRefuelVehicleId(null)}>Cancel</Btn>
                    </div>
                </div>
            </Modal>
        </div>
    );
};

// Back to being its own sidebar tab (see NAV_ITEMS/TAB_MAP) instead of living embedded inside the
// Dashboard - just the max-w-7xl/animate-in page wrapper every other tab gets, wrapped around the
// same FleetTrackingSection used before. FleetTrackingSection's own command header ("Live Fleet
// Tracking") already reads as this page's title, so there's no separate page heading on top of it.
window.LiveFleetTrackingTab = ({ data, setData }) => (
    <div className="max-w-7xl mx-auto animate-in">
        <FleetTrackingSection data={data} setData={setData} />
    </div>
);

</script>
<script type="text/babel">
/* global React, Card, Badge, Btn, Modal, Input, Select, ExportImport, PaginatedListPage, exportCSV, importCSV, uid, Icon, lookupDistance, vehicleModelLabel, vehicleAllocationStatus, STAKEHOLDER_TYPES, suggestedVehicleType, avatarGradientFor, initialsOf, mockTransportStatus */
const { useState, useMemo, useRef } = React;

const DEFAULT_MANUAL_FORM = {
    departmentName: '',
    federation: '',
    role: '',
    gender: '',
    memberSize: '',
    dateDD: '', dateMM: '', dateYYYY: '',
    timeHH: '', timeMM: '',
    transportNumber: '',
    pnrNumber: '',
    city: '',
    location: '',
    pocName: '',
    pocContact: '',
    uploadedTicket: null,
};

const FEDERATIONS = ['Team India', 'Team Japan', 'Team France', 'Team USA', 'Team Australia'];
const ACCREDITATION_TYPES = ['ATHLETES', 'OFFICIALS', 'TEAM STAFF', 'MEDIA', 'VIP'];
const GENDER_OPTIONS = ['Male', 'Female', 'Mixed'];
const BLANK_PERSON = { id: '', firstName: '', lastName: '', accreditation: 'ATHLETES' };

// Shared glyph so the Flight/Train/Bus/Car choice looks the same whether it's a small icon on the
// toggle button or the larger illustrative icon above the form. Anything other than the three named
// modes falls back to the plane glyph (also Flight's own icon), same as before this had more than two.
function TransportGlyph({ mode, size = 20, className = '' }) {
    const svgProps = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '1.8', strokeLinecap: 'round', strokeLinejoin: 'round', className };
    if (mode === 'Train') {
        return (
            <svg {...svgProps}>
                <rect x="4" y="3" width="16" height="12" rx="2" />
                <path d="M4 11h16M8 19h8M12 15v4" />
                <circle cx="8" cy="15" r="1" fill="currentColor" />
                <circle cx="16" cy="15" r="1" fill="currentColor" />
            </svg>
        );
    }
    if (mode === 'Bus') {
        return (
            <svg {...svgProps}>
                <rect x="3" y="5" width="18" height="11" rx="2" />

// Quick-pick suggestions shown alongside the frequency input in the Create Shuttle Plan modal and
// the Recurring Shuttle Plans table - not the only allowed values. Frequency itself is a free
// number of minutes an admin can type directly, not locked to this list.
const SHUTTLE_FREQUENCIES = [15, 30, 45, 60];
const DEFAULT_SHUTTLE_FORM = { origin: '', destination: '', frequencyMinutes: 30, startTime: '06:00', endTime: '22:00', vehicles: [] };

const shuttleFrequencyLabel = (mins) => (mins % 60 === 0 ? `Every ${mins / 60} hr${mins === 60 ? '' : 's'}` : `Every ${mins} min`);

// How many departures a loop makes in its operating window - purely a display stat, no individual
// trip records are generated for it.
const shuttleTripsPerDay = (s) => {
    const [sh, sm] = s.startTime.split(':').map(Number);
    const [eh, em] = s.endTime.split(':').map(Number);
    const span = (eh * 60 + em) - (sh * 60 + sm);
    return span > 0 && s.frequencyMinutes > 0 ? Math.floor(span / s.frequencyMinutes) + 1 : 0;
};

// True when N vehicles can't keep the loop's promised cadence: round trip (there and back) takes
// longer than the time budget the fleet has before the pattern repeats (frequency x vehicleCount).
// A soft heads-up, not a hard block.
const isShuttleOverextended = (durationMin, frequencyMinutes, vehicleCount) =>
    !!durationMin && !!frequencyMinutes && vehicleCount > 0 && (durationMin * 2) > (frequencyMinutes * vehicleCount);


// Inline preview limits for the three lists on Travel Plans - "View All" unlocks the rest in a modal
// rather than the page growing without bound as more suggestions/plans/shuttles pile up.
const SUGGESTION_PREVIEW_LIMIT = 6;
const PLAN_PREVIEW_LIMIT = 5;
const SHUTTLE_PREVIEW_LIMIT = 5;

window.RoutePlansTab = ({ data, setData }) => {
    const [modal, setModal] = useState(false);
    const [form, setForm] = useState({ demandRef: '', vehicle: 'Unassigned', origin: '', destination: '' });
    const [selectedDemand, setSelectedDemand] = useState(null);
    const [isSyncingDemands, setIsSyncingDemands] = useState(false);
    const [editingVehicleId, setEditingVehicleId] = useState(null);
    // Holds { plan, newVehicle } while a reassignment on an Active plan is pending confirmation -
    // changing the vehicle on a live plan yanks the trip away from whoever's already driving it,
    // so it's never applied straight from the dropdown's onChange the way a Draft plan's is.
    const [pendingReassignment, setPendingReassignment] = useState(null);

    const [suggestionSearch, setSuggestionSearch] = useState('');
    const [planSearch, setPlanSearch] = useState('');
    const [planStatusFilter, setPlanStatusFilter] = useState('All');

    // Each of the three lists below only renders its first few items inline (so a busy event with
    // dozens of plans doesn't turn this whole page into one long scroll) - "View All" opens the same
    // list, unlimited, in a popup instead. Same pattern as the Dashboard's "View All Assignments".
    const [showAllSuggestions, setShowAllSuggestions] = useState(false);
    const [showAllPlans, setShowAllPlans] = useState(false);
    const [showAllShuttles, setShowAllShuttles] = useState(false);

    const filteredDemands = useMemo(() => {
        const q = suggestionSearch.trim().toLowerCase();
        if (!q) return data.pendingDemands;
        return data.pendingDemands.filter(d =>
            d.stakeholder.toLowerCase().includes(q) || d.accommodation.toLowerCase().includes(q) || d.ref.toLowerCase().includes(q)
        );
    }, [data.pendingDemands, suggestionSearch]);

    const filteredPlans = useMemo(() => {
        const q = planSearch.trim().toLowerCase();
        return data.travelPlans.filter(p => {
            const matchesStatus = planStatusFilter === 'All' || p.status === planStatusFilter;
            const matchesSearch = !q
                || p.stakeholder.toLowerCase().includes(q)
                || p.accommodation.toLowerCase().includes(q)
                || p.route.toLowerCase().includes(q)
                || (p.tmsRef || '').toLowerCase().includes(q);
            return matchesStatus && matchesSearch;
        });
    }, [data.travelPlans, planSearch, planStatusFilter]);

    const applyDemand = (d) => {
        setSelectedDemand(d);
        const matchedOrigin = data.locations.includes(d.accommodation) ? d.accommodation : '';
        const defaultDestination = data.locations.includes('Jawaharlal Nehru Stadium') ? 'Jawaharlal Nehru Stadium' : '';
        setForm(f => ({ ...f, demandRef: d.ref, origin: matchedOrigin, destination: defaultDestination }));
    };

    // Tags (or clears) a demand's stakeholder category from the modal - persisted onto the demand
    // itself (not just this one session) since it's useful data to keep, and mirrored onto the
    // local selectedDemand snapshot so the modal's own captions/warnings update immediately.
    const setDemandStakeholderType = (ref, stakeholderType) => {
        setData(d => ({
            ...d,
            pendingDemands: d.pendingDemands.map(pd => pd.ref === ref ? { ...pd, stakeholderType: stakeholderType || null } : pd),
        }));
        setSelectedDemand(sd => (sd && sd.ref === ref) ? { ...sd, stakeholderType: stakeholderType || null } : sd);
        // The resolved vehicle type can change with it (effectivePreferredVehicle), which narrows the
        // modal's Assign Vehicle dropdown to a different set of vehicles - clear whatever was picked
        // rather than risk it silently keeping a now-mismatched vehicle from before the type changed.
        setForm(f => ({ ...f, vehicle: 'Unassigned' }));
    };

    const handleDemandSync = () => {
        setIsSyncingDemands(true);
        setTimeout(() => {
            setIsSyncingDemands(false);
            alert('Demands synced successfully.');
        }, 1500);
    };

    // Seats for a vehicle type, from the same fleet estimation reference data used elsewhere -
    // no separate hardcoded capacity table to drift out of sync.
    const vehicleCapacity = (typeName) => {
        const vt = data.fleetEstimation.vehicleTypes.find(v => v.type === typeName);
        return vt ? vt.capacity : null;
    };

    // The vehicle type Travel Plans actually uses for a demand: once it's tagged with a
    // stakeholderType (window.STAKEHOLDER_TYPES), window.suggestedVehicleType overrides whatever
    // preferredVehicle it came in with - that's the whole point of the stakeholder<->vehicle
    // mapping. Demands with no stakeholderType (not every delegation name fits one of the fixed
    // categories) fall back to their own preferredVehicle unchanged.
    const effectivePreferredVehicle = (demand) => {
        if (demand.stakeholderType) {
            const suggested = suggestedVehicleType(demand.stakeholderType, demand.headcount);
            if (suggested) return suggested;
        }
        return demand.preferredVehicle;
    };

    // How many vehicles of its preferred type a demand actually needs - 1 in the common case,
    // more when the headcount exceeds what a single vehicle of that type can seat.
    const vehiclesNeededFor = (demand) => {
        const cap = vehicleCapacity(effectivePreferredVehicle(demand));
        if (!cap || cap <= 0) return 1;
        return Math.max(1, Math.ceil(demand.headcount / cap));
    };

    const resetCreateForm = () => {
        setModal(false);
        setForm({ demandRef: '', vehicle: 'Unassigned', origin: '', destination: '' });
        setSelectedDemand(null);
    };

    const createPlan = () => {
        const demand = data.pendingDemands.find(d => d.ref === form.demandRef);
        if (!demand) return alert('Select a reference.');
        if (!form.origin || !form.destination) return alert('Select both an origin and a destination.');

        const legCount = vehiclesNeededFor(demand);

        if (legCount > 1) {
            // Too many people for one vehicle of the preferred type - split into one plan per leg,
            // filling each to capacity and leaving the remainder on the last one. Which specific
            // vehicle (and driver) covers each leg is resolved the same way the Suggested Plans
            // card's Auto-Assign button does, and always goes through the confirm popup below first -
            // an admin should see exactly what's about to be booked for a multi-vehicle trip, not have
            // it happen silently on click. `legLabel` stays its own field (not appended into
            // `stakeholder`) so it never gets truncated away in the plans table.
            const cap = vehicleCapacity(effectivePreferredVehicle(demand));
            let remaining = demand.headcount;
            const seatsPerLeg = Array.from({ length: legCount }, () => {
                const seats = Math.min(cap, remaining);
                remaining -= seats;
                return seats;
            });
            setModal(false);
            setPendingAutoAssign({ demand, origin: form.origin, destination: form.destination, legs: resolveLegs(seatsPerLeg, effectivePreferredVehicle(demand)) });
            return;
        }

        // Single vehicle - a manual pick from the dropdown is honored as-is (still pairing an idle
        // driver to it if it doesn't already have one, so "assign a vehicle" doesn't quietly leave the
        // trip driverless); leaving it Unassigned instead auto-resolves the best-fit Available vehicle
        // the same way Auto-Assign would, rather than creating a dead Draft plan by default.
        let vehicleId = form.vehicle;
        let newPairing = null;
        if (vehicleId === 'Unassigned') {
            const [leg] = resolveLegs([demand.headcount], effectivePreferredVehicle(demand));
            if (leg.vehicle) {
                vehicleId = leg.vehicle.id;
                if (leg.newlyPaired) newPairing = { driverId: leg.driver.id, vehicleId: leg.vehicle.id };
            }
        } else if (!driverOf(vehicleId)) {
            const vehicle = allVehiclesWithVendor.find(v => v.id === vehicleId);
            const idle = vehicle ? idleDriverFor(vehicle, new Set()) : null;
            if (idle) newPairing = { driverId: idle.id, vehicleId };
        }

        const newPlan = {
            id: uid('TP'), stakeholder: demand.stakeholder, accommodation: demand.accommodation,
            roomBlock: demand.accommodation, tmsRef: demand.ref, source: demand.source,
            route: `${form.origin} -> ${form.destination}`,
            vehicle: vehicleId, status: vehicleId === 'Unassigned' ? 'Draft' : 'Active', passengers: demand.headcount,
        };

        setData(d => ({
            ...d,
            travelPlans: [...d.travelPlans, newPlan],
            // Once a suggestion becomes a real plan it's no longer "pending" - drop it from the
            // Suggested Plans queue instead of leaving a stale duplicate suggestion sitting there.
            pendingDemands: d.pendingDemands.filter(pd => pd.ref !== demand.ref),
            drivers: newPairing ? d.drivers.map(dr => dr.id === newPairing.driverId ? { ...dr, vehicleId: newPairing.vehicleId } : dr) : d.drivers,
        }));
        resetCreateForm();
    };

    const assignVehicle = (planId, vehicle) => {
        setData(d => ({
            ...d,
            travelPlans: d.travelPlans.map(p => p.id === planId ? { ...p, vehicle, status: vehicle === 'Unassigned' ? 'Draft' : 'Active' } : p),
        }));
    };

    // Vehicle changes on a Draft plan are cheap - nothing's dispatched yet, so they apply instantly.
    // On an Active plan they're not: a real driver is already on that trip, so the dropdown never
    // writes directly - it stages the change and requires an explicit confirm first.
    const requestVehicleChange = (plan, newVehicle) => {
        if (newVehicle === plan.vehicle) return;
        if (plan.status !== 'Active') {
            assignVehicle(plan.id, newVehicle);
            return;
        }
        setPendingReassignment({ plan, newVehicle });
    };

    const confirmReassignment = () => {
        if (!pendingReassignment) return;
        assignVehicle(pendingReassignment.plan.id, pendingReassignment.newVehicle);
        setPendingReassignment(null);
        setEditingVehicleId(null);
    };

    const availableVehicles = useMemo(() =>
        data.vendors.flatMap(v => v.fleet.filter(f => f.status === 'Active')),
        [data.vendors]
    );

    // The Create Route Plan modal's "Assign Vehicle" dropdown, narrowed to the demand's resolved
    // vehicle type once one is known (effectivePreferredVehicle - same value the modal already shows
    // as "Vehicle Type" and uses to decide leg-splitting), so picking a stakeholder type actually
    // changes what's offered instead of listing every Active vehicle regardless of fit. With no
    // demand selected (manual entry has no stakeholder context) it falls back to the full list.
    const routeModalVehicleOptions = useMemo(() => {
        if (!selectedDemand) return availableVehicles;
        const preferredType = effectivePreferredVehicle(selectedDemand);
        if (!preferredType) return availableVehicles;
        return availableVehicles.filter(v => v.type === preferredType);
    }, [availableVehicles, selectedDemand]);

    const vehicleLabel = (vehicleId) => {
        const v = availableVehicles.find(x => x.id === vehicleId);
        return v ? `${vehicleModelLabel(v)} · ${v.id}` : vehicleId;
    };

    // Every vehicle with its owning vendor attached (regardless of roadworthiness/availability) - the
    // base list both the auto-assign pool below and manual-pick driver pairing look vendor context up
    // from, since a manually-picked vehicle might not be in autoAssignPool but still needs its vendor
    // known to find it an idle driver.
    const allVehiclesWithVendor = useMemo(() =>
        data.vendors.flatMap(v => v.fleet.map(f => ({ ...f, vendorId: v.id, vendorName: v.name }))),
        [data.vendors]
    );

    // Narrowed to what vehicleAllocationStatus actually calls Available right now - not just
    // roadworthy (Active), but free of any live assignment, Active travel plan, or Active shuttle
    // commitment. Auto-assign only ever pulls from this pool; the manual "Assign Vehicle" dropdowns
    // elsewhere still show every roadworthy vehicle, since a human overriding the system is a
    // deliberate, informed choice.
    const autoAssignPool = useMemo(() =>
        allVehiclesWithVendor.filter(f => vehicleAllocationStatus(f, data) === 'Available'),
        [allVehiclesWithVendor, data.assignments, data.travelPlans, data.shuttlePlans]
    );

    const driverOf = (vehicleId) => data.drivers.find(d => d.vehicleId === vehicleId) || null;

    // An idle driver (Active, not currently paired to any vehicle) from the same vendor as the
    // vehicle being staffed - mirrors the vendor-scoped pairing rule already used in Vendors & Fleet.
    const idleDriverFor = (vehicle, excludeDriverIds) =>
        data.drivers.find(d => d.vendor === vehicle.vendorName && d.status === 'Active' && !d.vehicleId && !excludeDriverIds.has(d.id)) || null;

    // Greedily resolves a list of per-leg seat counts against autoAssignPool. For each leg it prefers
    // (in order): a vehicle whose category matches the trip's preferred type, then the smallest
    // capacity that still fits (so a 40-seat bus isn't burned on a 3-seat leg), then - among equal
    // options - one that already has a driver so the trip starts fully staffed. A vehicle claimed for
    // one leg is removed from the pool before the next leg is considered, so a multi-leg trip never
    // double-books the same vehicle. If the best-fit vehicle has no driver, an idle driver from its
    // own vendor is paired to it right here as part of the same resolution, not left blank.
    const resolveLegs = (seatsPerLeg, preferredType) => {
        const claimedVehicles = new Set();
        const claimedDrivers = new Set();
        return seatsPerLeg.map(seats => {
            const candidates = autoAssignPool
                .filter(v => !claimedVehicles.has(v.id) && v.capacity >= seats)
                .sort((a, b) => {
                    const aMatch = preferredType && a.type === preferredType ? 0 : 1;
                    const bMatch = preferredType && b.type === preferredType ? 0 : 1;
                    if (aMatch !== bMatch) return aMatch - bMatch;
                    if (a.capacity !== b.capacity) return a.capacity - b.capacity;
                    const aHas = driverOf(a.id) ? 0 : 1;
                    const bHas = driverOf(b.id) ? 0 : 1;
                    return aHas - bHas;
                });
            const vehicle = candidates[0] || null;
            if (!vehicle) return { seats, vehicle: null, driver: null, newlyPaired: false };
            claimedVehicles.add(vehicle.id);
            let driver = driverOf(vehicle.id);
            let newlyPaired = false;
            if (driver) {
                claimedDrivers.add(driver.id);
            } else {
                driver = idleDriverFor(vehicle, claimedDrivers);
                if (driver) { claimedDrivers.add(driver.id); newlyPaired = true; }
            }
            return { seats, vehicle, driver, newlyPaired };
        });
    };

    // Same accommodation -> origin / fixed default destination heuristic applyDemand already uses to
    // pre-fill the modal, pulled out as its own pure function so the card's Auto-Assign button can
    // derive a route without opening the modal at all.
    const deriveRouteFor = (demand) => ({
        origin: data.locations.includes(demand.accommodation) ? demand.accommodation : '',
        destination: data.locations.includes('Jawaharlal Nehru Stadium') ? 'Jawaharlal Nehru Stadium' : '',
    });

    // Turns a resolved set of legs into real travelPlans rows (Active where a vehicle was found,
    // Draft where none was available) plus the driver pairings that were newly made along the way -
    // both applied in one setData call so the plans and the drivers they depend on land together.
    const commitAutoAssignedPlans = ({ demand, origin, destination, legs }) => {
        const route = `${origin} -> ${destination}`;
        const legCount = legs.length;
        const newPlans = legs.map((leg, i) => ({
            id: uid('TP'), stakeholder: demand.stakeholder,
            ...(legCount > 1 ? { legLabel: `Group ${i + 1}/${legCount}` } : {}),
            accommodation: demand.accommodation, roomBlock: demand.accommodation,
            tmsRef: demand.ref, source: demand.source, route,
            vehicle: leg.vehicle ? leg.vehicle.id : 'Unassigned',
            status: leg.vehicle ? 'Active' : 'Draft',
            passengers: leg.seats,
        }));
        const newPairings = legs.filter(l => l.newlyPaired && l.driver && l.vehicle);

        setData(d => ({
            ...d,
            travelPlans: [...d.travelPlans, ...newPlans],
            // Once a suggestion becomes a real plan (or set of split-leg plans) it's no longer
            // "pending" - drop it from the Suggested Plans queue instead of leaving a stale duplicate
            // suggestion sitting there. Applies whether every leg got a vehicle or some came up short
            // as Draft - either way the suggestion has been actioned, not abandoned.
            pendingDemands: d.pendingDemands.filter(pd => pd.ref !== demand.ref),
            drivers: newPairings.length
                ? d.drivers.map(dr => {
                    const pairing = newPairings.find(l => l.driver.id === dr.id);
                    return pairing ? { ...dr, vehicleId: pairing.vehicle.id } : dr;
                })
                : d.drivers,
        }));
    };

    // Holds { demand, origin, destination, legs } while a multi-vehicle auto-assignment is pending
    // confirmation - the admin should see exactly which vehicles (and drivers) are about to be
    // committed before anything is actually created, same reasoning as every other multi-step
    // confirm flow in this app. A single-vehicle trip skips this entirely and commits straight away.
    const [pendingAutoAssign, setPendingAutoAssign] = useState(null);

    // Result of a single-vehicle auto-assign (or a reason nothing was assigned), shown in its own
    // popup instead of a browser alert() - { demand, vehicle, driver } on success, { demand, noRoute:
    // true } when no route could be derived, { demand, noVehicle: true } when nothing fit.
    const [autoAssignResult, setAutoAssignResult] = useState(null);

    // The Suggested Plans card's Auto-Assign button - resolves and (for a single vehicle) commits
    // immediately, or (for multiple) stages the confirm popup instead.
    const autoAssignFromCard = (demand) => {
        const { origin, destination } = deriveRouteFor(demand);
        if (!origin || !destination) {
            setAutoAssignResult({ demand, noRoute: true });
            return;
        }
        const legCount = vehiclesNeededFor(demand);
        const cap = vehicleCapacity(effectivePreferredVehicle(demand)) || demand.headcount;
        let remaining = demand.headcount;
        const seatsPerLeg = Array.from({ length: legCount }, () => {
            const seats = Math.min(cap, remaining);
            remaining -= seats;
            return seats;
        });
        const legs = resolveLegs(seatsPerLeg, effectivePreferredVehicle(demand));

        if (legCount > 1) {
            setPendingAutoAssign({ demand, origin, destination, legs });
            return;
        }
        commitAutoAssignedPlans({ demand, origin, destination, legs });
        const [leg] = legs;
        setAutoAssignResult(leg.vehicle
            ? { demand, vehicle: leg.vehicle, driver: leg.driver }
            : { demand, noVehicle: true });
    };

    const [shuttleModal, setShuttleModal] = useState(false);
    const [shuttleForm, setShuttleForm] = useState({ ...DEFAULT_SHUTTLE_FORM });

    const toggleShuttleFormVehicle = (vehicleId) => {
        setShuttleForm(f => ({
            ...f,
            vehicles: f.vehicles.includes(vehicleId) ? f.vehicles.filter(v => v !== vehicleId) : [...f.vehicles, vehicleId],
        }));
    };

    const openShuttleModal = () => {
        setShuttleForm({ ...DEFAULT_SHUTTLE_FORM });
        setShuttleModal(true);
    };

    const createShuttlePlan = () => {
        if (!shuttleForm.origin || !shuttleForm.destination) return alert('Select both an origin and a destination.');
        if (shuttleForm.origin === shuttleForm.destination) return alert('Origin and destination must be different.');
        if (shuttleForm.startTime >= shuttleForm.endTime) return alert('End time must be after start time.');
        const plan = {
            id: uid('SHT'), origin: shuttleForm.origin, destination: shuttleForm.destination,
            frequencyMinutes: Number(shuttleForm.frequencyMinutes), startTime: shuttleForm.startTime, endTime: shuttleForm.endTime,
            vehicles: shuttleForm.vehicles, status: shuttleForm.vehicles.length > 0 ? 'Active' : 'Draft',
        };
        setData(d => ({ ...d, shuttlePlans: [...d.shuttlePlans, plan] }));
        setShuttleModal(false);
        setShuttleForm({ ...DEFAULT_SHUTTLE_FORM });
    };

    // A loop with no vehicles left on it can't actually run, so it drops back to Draft; getting its
    // first vehicle promotes it back to Active. Paused is a distinct, deliberate admin action and is
    // never overridden by these two - only the Pause/Resume button changes it.
    const addVehicleToShuttle = (shuttleId, vehicleId) => {
        if (!vehicleId) return;
        setData(d => ({
            ...d,
            shuttlePlans: d.shuttlePlans.map(s => {
                if (s.id !== shuttleId || s.vehicles.includes(vehicleId)) return s;
                return { ...s, vehicles: [...s.vehicles, vehicleId], status: s.status === 'Draft' ? 'Active' : s.status };
            }),
        }));
    };

    const removeVehicleFromShuttle = (shuttleId, vehicleId) => {
        setData(d => ({
            ...d,
            shuttlePlans: d.shuttlePlans.map(s => {
                if (s.id !== shuttleId) return s;
                const vehicles = s.vehicles.filter(v => v !== vehicleId);
                return { ...s, vehicles, status: vehicles.length === 0 && s.status === 'Active' ? 'Draft' : s.status };
            }),
        }));
    };

    // Editable straight from the Recurring Shuttle Plans table, same as vehicles being added/removed
    // inline there - a schedule tweak doesn't strand anything live the way a vehicle reassignment
    // would, so it applies instantly with no confirm step. Guards against 0/blank/negative values
    // (shuttleTripsPerDay and isShuttleOverextended both divide by this) by simply not committing an
    // invalid edit rather than allowing the schedule math to break.
    const updateShuttleFrequency = (shuttleId, value) => {
        const mins = Number(value);
        if (!Number.isFinite(mins) || mins <= 0) return;
        setData(d => ({
            ...d,
            shuttlePlans: d.shuttlePlans.map(s => s.id === shuttleId ? { ...s, frequencyMinutes: mins } : s),
        }));
    };

    const toggleShuttleStatus = (shuttleId) => {
        setData(d => ({
            ...d,
            shuttlePlans: d.shuttlePlans.map(s => s.id === shuttleId
                ? { ...s, status: s.status === 'Paused' ? (s.vehicles.length > 0 ? 'Active' : 'Draft') : 'Paused' }
                : s),
        }));
    };

    const handleImport = (file) => importCSV(file, rows => {
        const imported = rows.map(r => ({
            id: r.id || uid('TP'), stakeholder: r.stakeholder, accommodation: r.accommodation,
            roomBlock: r.roomBlock, tmsRef: r.tmsRef, route: r.route, vehicle: r.vehicle || 'Unassigned',
            status: r.status || 'Draft', passengers: Number(r.passengers) || 0,
        }));
        setData(d => ({ ...d, travelPlans: [...d.travelPlans, ...imported] }));
        alert(`Imported ${imported.length} travel plans.`);
    });

    const shuttleFormDist = lookupDistance(shuttleForm.origin, shuttleForm.destination);
    const shuttleFormOverextended = shuttleFormDist &&
        isShuttleOverextended(shuttleFormDist.durationMin, shuttleForm.frequencyMinutes, shuttleForm.vehicles.length);

    // Each renders one card for its list - defined as closures (not extracted components) so they
    // keep direct access to everything already in scope above (editingVehicleId, requestVehicleChange,
    // availableVehicles, etc.) without having to prop-drill it all through. Called once for the inline
    // preview slice and again, unsliced, inside that section's "View All" modal - same markup either way.
    const renderSuggestionCard = (d) => {
        const legCount = vehiclesNeededFor(d);
        return (
            <div key={d.ref} onClick={() => { applyDemand(d); setModal(true); }}
                className="bg-white border border-slate-200 border-l-4 border-l-amber-400 rounded-xl p-4 cursor-pointer hover:shadow-cardHover hover:border-l-amber-500 transition">
                <div className="flex items-start justify-between gap-2 mb-1.5">
                    <p className="font-semibold text-slate-800 text-sm leading-snug">{d.stakeholder}</p>
                    {d.stakeholderType && (
                        <span className="shrink-0 bg-indigo-50 text-indigo-600 text-[10px] font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap">{d.stakeholderType}</span>
                    )}
                </div>
                <p className="text-xs text-slate-500 flex items-center gap-1.5 mb-3">
                    <Icon name="building" size={12} className="text-slate-300 shrink-0" />
                    <span className="truncate">{d.accommodation}</span>
                </p>
                <div className="flex items-center gap-4 text-xs text-slate-600 pt-3 border-t border-slate-100">
                    <span className="flex items-center gap-1.5"><Icon name="users" size={13} className="text-slate-400 shrink-0" />{d.headcount} pax</span>
                    <span className={`flex items-center gap-1.5 ${legCount > 1 ? 'text-amber-700 font-medium' : ''}`}>
                        <Icon name="fleet" size={13} className={legCount > 1 ? 'text-amber-500 shrink-0' : 'text-slate-400 shrink-0'} />
                        {legCount > 1 ? `${legCount} × ${effectivePreferredVehicle(d)}` : effectivePreferredVehicle(d)}
                    </span>
                </div>
                <button onClick={e => { e.stopPropagation(); autoAssignFromCard(d); }}
                    className="mt-3 w-full inline-flex items-center justify-center gap-1.5 text-xs font-medium text-brandAccent bg-blue-50 hover:bg-blue-100 rounded-lg py-1.5 transition">
                    <Icon name="travel" size={12} />Auto-Assign
                </button>
            </div>
        );
    };

    const renderPlanCard = (p) => {
        const [origin, destination] = p.route.split(' -> ');
        const accent = p.status === 'Active' ? 'border-l-emerald-400' : 'border-l-slate-300';
        const driver = p.vehicle !== 'Unassigned' ? driverOf(p.vehicle) : null;
        return (
            <div key={p.id}
                className={`bg-white border border-slate-300 border-l-4 ${accent} rounded-xl p-4 shadow-sm hover:shadow-md hover:border-slate-400 transition-all`}>
                <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="flex items-center gap-3 min-w-0">
                        <div className={`w-10 h-10 rounded-full bg-gradient-to-br ${avatarGradientFor(p.stakeholder)} flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-sm ring-1 ring-black/5`}>
                            {initialsOf(p.stakeholder)}
                        </div>
                        <div className="min-w-0">
                            <div className="flex items-center gap-1.5 flex-wrap">
                                <span className="font-semibold text-slate-800 text-sm">{p.stakeholder}</span>
                                {p.legLabel && (
                                    <span className="shrink-0 bg-slate-100 text-slate-500 text-[10px] font-semibold px-1.5 py-0.5 rounded-full">{p.legLabel}</span>
                                )}
                            </div>
                            <div className="text-xs text-slate-400">{p.tmsRef}  &middot;  {p.passengers} pax</div>
                        </div>
                    </div>
                    <Badge status={p.status} />
                </div>

                <div className="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-x-2.5 gap-y-1.5">
                    <span className="text-sm font-medium text-slate-700">{origin}</span>
                    <Icon name="arrowRight" size={12} className="text-slate-300 shrink-0" />
                    <span className="text-sm text-slate-500">{destination}</span>
                    <DistanceBadge origin={origin} destination={destination}
                        vehicle={p.vehicle !== 'Unassigned' ? allVehiclesWithVendor.find(v => v.id === p.vehicle) : null} data={data} />
                </div>

                <div className="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Accommodation</p>
                        <div className="flex items-center gap-1.5 text-sm text-slate-700">
                            <Icon name="building" size={13} className="text-slate-300 shrink-0" />
                            <span>{p.accommodation}</span>
                        </div>
                    </div>

                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Vehicle</p>
                        {p.status === 'Active' && editingVehicleId !== p.id ? (
                            <div className="flex items-center gap-2">
                                <span className="w-6 h-6 rounded-lg bg-blue-50 text-brandAccent flex items-center justify-center shrink-0">
                                    <Icon name="fleet" size={12} />
                                </span>
                                <span className="text-sm font-medium text-slate-700">{vehicleLabel(p.vehicle)}</span>
                                <button onClick={() => setEditingVehicleId(p.id)}
                                    className="text-slate-400 hover:text-brandAccent transition shrink-0" aria-label="Edit assigned vehicle">
                                    <Icon name="edit" size={13} />
                                </button>
                            </div>
                        ) : (
                            <div className="flex items-center gap-2">
                                <select className="text-xs border border-slate-200 rounded-lg px-2 py-1.5 min-w-[150px] focus:outline-none focus:ring-2 focus:ring-brandAccent/30" value={p.vehicle}
                                    onChange={e => requestVehicleChange(p, e.target.value)}>
                                    <option value="Unassigned">Unassigned</option>
                                    {availableVehicles.map(v => (
                                        <option key={v.id} value={v.id}>{vehicleModelLabel(v)} · {v.id}</option>
                                    ))}
                                </select>
                                {p.status === 'Active' && (
                                    <button onClick={() => setEditingVehicleId(null)}
                                        className="text-emerald-600 hover:text-emerald-700 transition shrink-0" aria-label="Save vehicle assignment">
                                        <Icon name="check" size={14} />
                                    </button>
                                )}
                            </div>
                        )}
                    </div>

                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Driver</p>
                        {driver ? (
                            <span className="flex items-center gap-1.5 text-sm text-slate-700"><Icon name="users" size={13} className="text-slate-300 shrink-0" />{driver.name}</span>
                        ) : <span className="text-sm text-slate-300">—</span>}
                    </div>
                </div>
            </div>
        );
    };

    const renderShuttleCard = (s) => {
        const accent = s.status === 'Paused' ? 'border-l-amber-400' : 'border-l-emerald-400';
        return (
            <div key={s.id}
                className={`bg-white border border-slate-300 border-l-4 ${accent} rounded-xl p-4 shadow-sm hover:shadow-md hover:border-slate-400 transition-all`}>
                <div className="flex flex-wrap items-start justify-between gap-3">
                    <div>
                        <div className="flex items-center gap-1.5 flex-wrap text-slate-800 font-semibold text-sm">
                            <span>{s.origin}</span>
                            <Icon name="arrowRight" size={12} className="text-slate-300 shrink-0" />
                            <span>{s.destination}</span>
                        </div>
                        <div className="mt-1"><DistanceBadge origin={s.origin} destination={s.destination} /></div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                        <Badge status={s.status} />
                        <Btn variant="outline" onClick={() => toggleShuttleStatus(s.id)}>
                            {s.status === 'Paused' ? 'Resume' : 'Pause'}
                        </Btn>
                    </div>
                </div>

                <div className="mt-3 pt-3 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Frequency</p>
                        <div className="flex items-center gap-1.5">
                            <input type="number" min="5" step="5" value={s.frequencyMinutes}
                                onChange={e => updateShuttleFrequency(s.id, e.target.value)}
                                className="w-16 px-2 py-1 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                            <span className="text-xs text-slate-400">min</span>
                        </div>
                        <div className="text-xs font-medium text-slate-700 mt-1">{shuttleFrequencyLabel(s.frequencyMinutes)}</div>
                        <div className="text-xs text-slate-400">~{shuttleTripsPerDay(s)} trips/day</div>
                        {isShuttleOverextended((lookupDistance(s.origin, s.destination) || {}).durationMin, s.frequencyMinutes, s.vehicles.length) && (
                            <div className="mt-1 inline-flex items-center gap-1 text-[10px] font-semibold text-amber-700">
                                <Icon name="alert" size={11} className="shrink-0" />Round trip may exceed schedule
                            </div>
                        )}
                    </div>

                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Operating Hours</p>
                        <div className="flex items-center gap-1.5 text-sm text-slate-700">
                            <Icon name="calendar" size={13} className="text-slate-300 shrink-0" />
                            {s.startTime} - {s.endTime}
                        </div>
                    </div>

                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Assigned Vehicles</p>
                        <div className="flex flex-wrap items-center gap-1.5">
                            {s.vehicles.map(vid => (
                                <span key={vid} className="inline-flex items-center gap-1 bg-blue-50 text-blue-700 text-[10px] font-semibold pl-2 pr-1 py-1 rounded-full">
                                    {vehicleLabel(vid)}
                                    <button onClick={() => removeVehicleFromShuttle(s.id, vid)} className="hover:text-red-600" aria-label={`Remove ${vehicleLabel(vid)}`}>
                                        <Icon name="close" size={10} />
                                    </button>
                                </span>
                            ))}
                            <select value="" onChange={e => addVehicleToShuttle(s.id, e.target.value)}
                                className="text-[10px] border border-dashed border-slate-300 rounded-full pl-2 pr-1 py-1 text-slate-400 focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                                <option value="">+ Add</option>
