<script type="text/babel">
/* global React, Icon, ExportImport, exportCSV, importCSV, calcVehiclesRequired, STAKEHOLDER_VEHICLE_MAP, suggestedVehicleType */
const { useState } = React;

window.FleetEstimationTab = ({ data, setData }) => {
    const { stakeholders, vehicleTypes, estimates } = data.fleetEstimation;

    const capacityOf = (type) => vehicleTypes.find(vt => vt.type === type)?.capacity || 0;

    // The one vehicle type a stakeholder's headcount actually calls for - the same rule Travel Plans
    // already uses to auto-assign a category to a demand (window.suggestedVehicleType): the smallest
    // of that stakeholder's mapped type(s) that fits everyone in a single vehicle, or the largest
    // mapped type once the group's too big for that. This is the whole point of the redesign - the
    // admin enters one headcount per stakeholder, not a number against a vehicle type they'd have to
    // pick themselves; Athletes (mapped to both Bus and Minibus) is the one case where the number
    // typed in actually changes which type comes back.
    const resolvedTypeFor = (stakeholder, users) =>
        suggestedVehicleType(stakeholder, users) || (STAKEHOLDER_VEHICLE_MAP[stakeholder] || [])[0] || null;

    const updateEstimate = (stakeholder, users) => {
        setData(d => ({
            ...d,
            fleetEstimation: { ...d.fleetEstimation, estimates: { ...d.fleetEstimation.estimates, [stakeholder]: Number(users) || 0 } },
        }));
    };

    const rows = stakeholders.map(s => {
        const users = estimates[s] || 0;
        const vehicleType = resolvedTypeFor(s, users);
        const capacity = capacityOf(vehicleType);
        return { stakeholder: s, users, vehicleType, capacity, required: calcVehiclesRequired(users, capacity) };
    });

    const buildExportRows = () => rows.map(r => ({
        Stakeholder: r.stakeholder, EstimatedUsers: r.users, VehicleType: r.vehicleType, Capacity: r.capacity, VehiclesRequired: r.required,
    }));

    // One tile per vehicle type, always - fixed to vehicleTypes' own order rather than built up from
    // whichever types stakeholders happen to currently resolve to. Building the tile list dynamically
    // (only a type that at least one stakeholder resolves to gets a tile) meant a type's tile would
    // wink out of the grid - and every tile after it would reshuffle position - the moment nothing
    // resolved to it anymore (e.g. Athletes dropping below 20 stops resolving to Bus, so the Bus tile
    // vanished and Minibus jumped to a different slot). A tile now just reads 0/0 instead of disappearing.
    const totals = vehicleTypes.map(vt => {
        const matching = rows.filter(r => r.vehicleType === vt.type);
        return {
            type: vt.type,
            users: matching.reduce((sum, r) => sum + r.users, 0),
            required: matching.reduce((sum, r) => sum + r.required, 0),
        };
    });

    const handleImport = (file) => importCSV(file, csvRows => {
        const newEstimates = { ...estimates };
        let skipped = 0;
        csvRows.forEach(r => {
            if (!stakeholders.includes(r.Stakeholder)) { skipped++; return; }
            newEstimates[r.Stakeholder] = Number(r.EstimatedUsers) || 0;
        });
        setData(d => ({ ...d, fleetEstimation: { ...d.fleetEstimation, estimates: newEstimates } }));
        alert(`Imported ${csvRows.length - skipped} estimation rows.${skipped ? ` Skipped ${skipped} row(s) for an unrecognized stakeholder.` : ''}`);
    });

    const grandTotal = rows.reduce((sum, r) => sum + r.required, 0);
    const grandUsers = rows.reduce((sum, r) => sum + r.users, 0);

    return (
        <div className="max-w-5xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Fleet Estimation</h2>
                    <p className="text-sm text-slate-500">Enter how many of each stakeholder you're expecting - the vehicle type and count required resolve automatically.</p>
                </div>
                <ExportImport label="Estimation" onExport={() => exportCSV('fleet-estimation.csv', buildExportRows())} onImport={handleImport}
                    sampleHeaders={['Stakeholder', 'EstimatedUsers']} />
            </div>

            {/* At-a-glance totals up top - a highlighted grand total plus one tile per vehicle type
                actually in play, instead of making the reader sum every stakeholder row themselves. */}
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
                <div className="bg-gradient-to-br from-brandAccent to-blue-700 rounded-xl p-4 shadow-card text-white">
                    <p className="text-xs font-semibold uppercase tracking-wide text-blue-100">Total Fleet</p>
                    <p className="text-2xl font-bold mt-2">{grandTotal} <span className="text-xs font-medium text-blue-100">vehicles</span></p>
                    <p className="text-xs text-blue-100/80 mt-0.5">{grandUsers} estimated users</p>
                </div>
                {totals.map(t => (
                    <div key={t.type} className="bg-white border border-slate-200 rounded-xl p-4 shadow-card">
                        <div className="flex items-center justify-between">
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide">{t.type}</p>
                            <span className="w-7 h-7 rounded-lg bg-blue-50 text-brandAccent flex items-center justify-center shrink-0"><Icon name="fleet" size={14} /></span>
                        </div>
                        <p className="text-2xl font-bold text-slate-800 mt-2">{t.required} <span className="text-xs font-medium text-slate-400">vehicles</span></p>
                        <p className="text-xs text-slate-400 mt-0.5">{t.users} estimated users</p>
                    </div>
                ))}
            </div>

            {/* One row per stakeholder - a single "how many are you expecting" input, with the vehicle
                type it resolves to and how many of that type are required shown right alongside it.
                No more picking a vehicle type up front and estimating against that; the type comes out
                of the headcount instead of going in. */}
            <div className="space-y-2">
                {rows.map(r => (
                    <div key={r.stakeholder} className="bg-white border border-slate-300 rounded-xl p-4 shadow-sm hover:shadow-md transition-all flex flex-wrap items-center justify-between gap-4">
                        <div className="min-w-0">
                            <p className="font-semibold text-slate-800 text-sm">{r.stakeholder}</p>
                            <p className="text-xs text-slate-400 mt-0.5">
                                {r.vehicleType
                                    ? <>Resolves to <strong className="text-slate-600 font-semibold">{r.vehicleType}</strong> &middot; cap. {r.capacity} each</>
                                    : 'No vehicle type mapped to this stakeholder'}
                            </p>
                        </div>
                        <div className="flex items-center gap-3 shrink-0">
                            <div>
                                <span className="text-[10px] text-slate-400 uppercase tracking-wide block mb-0.5 text-center">Est. Users</span>
                                <input type="number" min="0" value={r.users}
                                    onChange={e => updateEstimate(r.stakeholder, e.target.value)}
                                    className="w-24 px-2 py-1.5 text-sm bg-white border border-slate-200 rounded-lg text-center focus:ring-2 focus:ring-brandAccent/30 focus:outline-none" />
                            </div>
                            <Icon name="arrowRight" size={14} className="text-slate-300 shrink-0 mt-4" />
                            <div className="bg-blue-50 rounded-lg px-4 py-2 text-center min-w-[92px]">
                                <span className="text-[10px] text-brandAccent/70 uppercase tracking-wide block mb-0.5 font-semibold truncate">{r.vehicleType || 'Vehicles'}</span>
                                <span className={`text-lg font-bold ${r.required > 0 ? 'text-brandAccent' : 'text-slate-300'}`}>{r.required}</span>
                            </div>
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
};

</script>
<script type="text/babel">
/* global React, Card, Badge, Btn, ExportImport, TabBar, exportCSV, importCSV */
const { useState } = React;

window.NotificationsTab = ({ data, setData }) => {
    const [filter, setFilter] = useState('All');
    const filters = ['All', 'Unread', 'Reminders', 'Alerts'];

    const items = data.notifications.filter(n => {
        if (filter === 'Unread') return !n.read;
        if (filter === 'Reminders') return n.type === 'reminder';
        if (filter === 'Alerts') return n.type === 'alert';
        return true;
    });

    const markRead = (id) => setData(d => ({ ...d, notifications: d.notifications.map(n => n.id === id ? { ...n, read: true } : n) }));
    const markAllRead = () => setData(d => ({ ...d, notifications: d.notifications.map(n => ({ ...n, read: true })) }));

    const priorityDot = { critical: 'bg-red-500', high: 'bg-amber-500', medium: 'bg-blue-400', low: 'bg-slate-300' };

    const handleImport = (file) => importCSV(file, rows => {
        const imported = rows.map(r => ({
            id: r.id || `NTF-${Date.now()}`, type: r.type || 'info', title: r.title,
            message: r.message, time: r.time || 'Just now', read: r.read === 'true', priority: r.priority || 'medium',
        }));
        setData(d => ({ ...d, notifications: [...d.notifications, ...imported] }));
        alert(`Imported ${imported.length} notifications.`);
    });

    return (
        <div className="max-w-3xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Notifications & Reminders</h2>
                    <p className="text-sm text-slate-500">{data.notifications.filter(n => !n.read).length} unread</p>
                </div>
                <div className="flex gap-2">
                    <ExportImport label="Notifications" onExport={() => exportCSV('notifications.csv', data.notifications)} onImport={handleImport}
                        sampleHeaders={['id', 'type', 'title', 'message', 'time', 'read', 'priority']} />
                    <Btn variant="outline" onClick={markAllRead}>Mark all read</Btn>
                </div>
            </div>

            <TabBar tabs={filters} active={filter} onChange={setFilter} />

            <Card>
                <div className="divide-y divide-slate-100">
                    {items.map(n => (
                        <div key={n.id} className={`px-5 py-4 flex gap-3 ${!n.read ? 'bg-blue-50/30' : ''}`}>
                            <span className={`w-2.5 h-2.5 rounded-full mt-1.5 shrink-0 ${priorityDot[n.priority]}`} />
                            <div className="flex-1">
                                <div className="flex justify-between items-start gap-2">
                                    <p className={`text-sm ${!n.read ? 'font-semibold text-slate-800' : 'text-slate-600'}`}>{n.title}</p>
                                    <span className="text-xs text-slate-400 whitespace-nowrap">{n.time}</span>
                                </div>
                                <p className="text-xs text-slate-500 mt-0.5">{n.message}</p>
                                <div className="flex gap-2 mt-2">
                                    <Badge status={n.type.charAt(0).toUpperCase() + n.type.slice(1)} />
                                    {!n.read && <button className="text-xs text-brandAccent hover:underline" onClick={() => markRead(n.id)}>Mark read</button>}
                                </div>
                            </div>
                        </div>
                    ))}
                    {items.length === 0 && <p className="p-8 text-center text-slate-400 text-sm">No notifications.</p>}
                </div>
            </Card>
        </div>
    );
};

                    <Input label="Assignment ID (optional)" value={form.assignmentId} onChange={e => setForm({ ...form, assignmentId: e.target.value })} />
                    <Select label="Priority" value={form.priority} onChange={e => setForm({ ...form, priority: e.target.value })} options={['High', 'Medium', 'Low']} />
                    <Btn className="w-full" onClick={addGrievance}>Submit</Btn>
                </div>
            </Modal>
        </div>
    );
};

<script type="text/babel">
/* global React, Card, Badge, Btn, Modal, Input, Select, ExportImport, exportCSV, importCSV, uid, Icon, NAV_ITEMS, VEHICLE_CATEGORIES */
const { useState } = React;

// Every assignable role except Master Admin - Master Admin is never shown in the matrix because its
// access is implicit and total, not something delegated a module at a time.
const ROLE_LIST = ['Fleet Coordinator', 'Vendor Coordinator', 'Compliance Officer', 'Travel Planner', 'Dispatcher', 'Grievance Officer'];

// Compliance Officer only - which vehicle type (if any) an inspector is scoped to in Compliance &
// Inspection. Same fixed four categories as everywhere else in the fleet (window.VEHICLE_CATEGORIES),
// not a separate list to drift out of sync.
const VEHICLE_TYPE_OPTIONS = VEHICLE_CATEGORIES.map(c => c.type);

function ToggleSwitch({ checked, onChange, label }) {
    return (
        <button type="button" role="switch" aria-checked={checked} aria-label={label} onClick={onChange}
            className={`relative inline-flex h-5 w-9 shrink-0 items-center rounded-full transition-colors cursor-pointer ${checked ? 'bg-brandAccent' : 'bg-slate-200'}`}>
            <span className={`inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow transition-transform ${checked ? 'translate-x-[18px]' : 'translate-x-1'}`} />
        </button>
    );
}
window.ToggleSwitch = ToggleSwitch;

window.AdminTab = ({ data, setData, onLogout }) => {
    const [modal, setModal] = useState(false);
    const [form, setForm] = useState({ name: '', email: '', role: 'Fleet Coordinator', vehicleTypeScope: '' });
    const isMasterAdmin = data.currentAdmin.role === 'Master Admin';

    const addAdmin = () => {
        const a = {
            id: uid('ADM'), name: form.name, email: form.email, role: form.role,
            // Only Compliance Officer actually uses this - a Vehicle Type Scope picked before
            // switching away from that role would otherwise silently linger on the record unused.
            vehicleTypeScope: form.role === 'Compliance Officer' && form.vehicleTypeScope ? form.vehicleTypeScope : null,
            status: 'Active', lastLogin: 'Never',
        };
        setData(d => ({ ...d, admins: [...d.admins, a] }));
        setModal(false);
        setForm({ name: '', email: '', role: 'Fleet Coordinator', vehicleTypeScope: '' });
    };

    // Compliance Officer only - which vehicle type this inspector is scoped to in Compliance &
    // Inspection (or '' for "All Vehicle Types" - unset, sees everything). Editable any time, same as
    // Status, rather than being locked in at creation.
    const updateVehicleTypeScope = (id, value) => setData(d => ({
        ...d,
        admins: d.admins.map(a => a.id === id ? { ...a, vehicleTypeScope: value || null } : a),
    }));

    const toggleStatus = (id) => setData(d => ({
        ...d,
        admins: d.admins.map(a => a.id === id ? { ...a, status: a.status === 'Active' ? 'Inactive' : 'Active' } : a),
    }));

    // Master Admin only - grants or revokes one role's access to one module. Admin Management itself
    // is deliberately not toggleable here; it stays exclusive to Master Admin.
    const togglePermission = (role, moduleLabel) => {
        if (!isMasterAdmin) return;
        setData(d => {
            const current = d.permissions[role] || [];
            const updated = current.includes(moduleLabel)
                ? current.filter(m => m !== moduleLabel)
                : [...current, moduleLabel];
            return { ...d, permissions: { ...d.permissions, [role]: updated } };
        });
    };

    // Master Admin only - a backend switch, not a per-role permission, so it lives in its own
    // settings block rather than the Role Permissions matrix above.
    const toggleRequireChecklist = () => {
        if (!isMasterAdmin) return;
        setData(d => ({
            ...d,
            settings: { ...d.settings, requireInspectionChecklist: !(d.settings?.requireInspectionChecklist !== false) },
        }));
    };

    // Master Admin only - controls whether the Driver App enforces geo-fencing on Start Trip/Mark
    // Trip Complete. This admin panel and the Driver App are two separate files with no shared
    // backend (same story as everywhere else in this project - see the file-level comments in
    // ACT Driver Prototype.html), so the setting is bridged through localStorage under a shared key
    // rather than a real API call. That works automatically when both apps are served from the same
    // origin (e.g. a local dev server hosting both files) - a 'storage' event fires in the Driver
    // App's tab the moment this fires here. Opened as two separate file:// documents instead, each
    // gets its own isolated storage, so the Driver App just falls back to its own local default
    // (geo-fencing on) rather than silently doing nothing.
    const GEOFENCING_STORAGE_KEY = 'kheloTechGeoFencingEnabled';
    const toggleGeoFencing = () => {
        if (!isMasterAdmin) return;
        setData(d => {
            const next = !(d.settings?.geoFencingEnabled !== false);
            try { localStorage.setItem(GEOFENCING_STORAGE_KEY, String(next)); } catch (e) { /* storage unavailable - the toggle still updates this admin session's own data either way */ }
            return { ...d, settings: { ...d.settings, geoFencingEnabled: next } };
        });
    };

    // Master Admin only - feeds window.estimateTripCost's fuel half, which every cost figure in
    // Travel Plans (and the auto-assign confirm popup) reads from. Segregated by fuel type (Petrol
    // vs Diesel track different market prices) rather than one flat number. Driver cost is no longer
    // set here - see the Drivers sub-tab in Vendors & Fleet, where it's per driver.
    const updateFuelPrice = (fuelType, value) => {
        if (!isMasterAdmin) return;
        const price = Number(value);
        const key = fuelType === 'Petrol' ? 'petrolPricePerLiter' : 'dieselPricePerLiter';
        setData(d => ({ ...d, settings: { ...d.settings, [key]: Number.isFinite(price) ? price : d.settings?.[key] } }));
    };

    const handleImport = (file) => importCSV(file, rows => {
        const imported = rows.map(r => ({
            id: r.id || uid('ADM'), name: r.name, email: r.email, role: r.role,
            status: r.status || 'Active', lastLogin: r.lastLogin || 'Never',
        }));
        setData(d => ({ ...d, admins: [...d.admins, ...imported] }));
        alert(`Imported ${imported.length} admins.`);
    });

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Admin Management</h2>
                    <p className="text-sm text-slate-500">Create, manage admins - supports concurrent multi-admin sessions</p>
                </div>
                <div className="flex gap-2">
                    <ExportImport label="Admins" onExport={() => exportCSV('admins.csv', data.admins)} onImport={handleImport}
                        sampleHeaders={['id', 'name', 'email', 'role', 'status', 'lastLogin']} />
                    <Btn onClick={() => setModal(true)}>Create Admin</Btn>
                </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                <Card className="p-5">
                    <p className="text-xs text-slate-500 uppercase tracking-wide font-medium">Your Session</p>
                    <p className="font-semibold text-slate-800 mt-2">{data.currentAdmin.name}</p>
                    <p className="text-sm text-slate-500">{data.currentAdmin.role}</p>
                    <p className="text-xs text-slate-400 mt-1">{data.currentAdmin.email}</p>
                    {data.admins.find(a => a.id === data.currentAdmin.id)?.vehicleTypeScope && (
                        <p className="text-xs text-blue-600 mt-1">
                            Scoped to {data.admins.find(a => a.id === data.currentAdmin.id).vehicleTypeScope} inspections
                        </p>
                    )}
                    <Btn variant="danger" className="w-full mt-4" onClick={onLogout}>Logout</Btn>
                </Card>

                <Card title="Currently Online" className="lg:col-span-2">
                    <div className="divide-y divide-slate-100">
                        {data.activeAdmins.map(a => (
                            <div key={a.id} className="px-5 py-3 flex justify-between text-sm">
                                <div><span className="font-medium">{a.name}</span> <span className="text-slate-400 text-xs">{a.role}</span></div>
                                <div className="text-right text-xs">
                                    <span className="text-emerald-600">* Online</span>
                                    <p className="text-slate-400">{a.tab}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </Card>
            </div>

            <Card title="All Admins">
                <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                        <thead className="bg-slate-50 text-slate-500 text-xs"><tr>
                            <th className="px-5 py-3 text-left">Name</th><th className="px-5 py-3 text-left">Email</th>
                            <th className="px-5 py-3 text-left">Role</th><th className="px-5 py-3 text-left">Vehicle Scope</th>
                            <th className="px-5 py-3 text-left">Last Login</th>
                            <th className="px-5 py-3 text-left">Status</th><th className="px-5 py-3 text-right">Actions</th>
                        </tr></thead>
                        <tbody className="divide-y divide-slate-100">
                            {data.admins.map(a => (
                                <tr key={a.id} className="hover:bg-slate-50">
                                    <td className="px-5 py-3 font-medium">{a.name}</td>
                                    <td className="px-5 py-3 text-slate-500">{a.email}</td>
                                    <td className="px-5 py-3">{a.role}</td>
                                    <td className="px-5 py-3">
                                        {/* Only Compliance Officer uses this - see Compliance & Inspection,
                                            where a scoped inspector only ever sees their one vehicle
                                            type's inspections across every vendor. */}
                                        {a.role === 'Compliance Officer' ? (
                                            <select className="text-xs border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-brandAccent/30"
                                                value={a.vehicleTypeScope || ''} onChange={e => updateVehicleTypeScope(a.id, e.target.value)}>
                                                <option value="">All Vehicle Types</option>
                                                {VEHICLE_TYPE_OPTIONS.map(t => <option key={t} value={t}>{t}</option>)}
                                            </select>
                                        ) : <span className="text-slate-300 text-xs">—</span>}
                                    </td>
                                    <td className="px-5 py-3 text-xs text-slate-400">{a.lastLogin}</td>
                                    <td className="px-5 py-3"><Badge status={a.status} /></td>
                                    <td className="px-5 py-3 text-right">
                                        <Btn variant="outline" onClick={() => toggleStatus(a.id)}>
                                            {a.status === 'Active' ? 'Deactivate' : 'Activate'}
                                        </Btn>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </Card>

            {isMasterAdmin && (
                <Card title="Role Permissions" className="mt-6">
                    <div className="px-5 pt-4 pb-1">
                        <p className="text-xs text-slate-500">
                            Master Admin always has full access to every module. <strong>Admin Management</strong> is exclusive to Master
                            Admin and can't be delegated - toggle the rest on or off to control exactly what each role can see and use.
                        </p>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm">
                            <thead className="bg-slate-50 text-slate-500 text-xs"><tr>
                                <th className="px-5 py-3 text-left">Module</th>
                                {ROLE_LIST.map(role => (
                                    <th key={role} className="px-3 py-3 text-center font-medium whitespace-nowrap">{role}</th>
                                ))}
                            </tr></thead>
                            <tbody className="divide-y divide-slate-100">
                                {NAV_ITEMS.filter(item => item.label !== 'Admin Management').map(item => (
                                    <tr key={item.label} className="hover:bg-slate-50">
                                        <td className="px-5 py-3">
                                            <div className="flex items-center gap-2 font-medium text-slate-700">
                                                <Icon name={item.icon} size={15} className="text-slate-400 shrink-0" />
                                                {item.label}
                                            </div>
                                        </td>
                                        {ROLE_LIST.map(role => (
                                            <td key={role} className="px-3 py-3 text-center">
                                                <ToggleSwitch
                                                    checked={(data.permissions[role] || []).includes(item.label)}
                                                    onChange={() => togglePermission(role, item.label)}
                                                    label={`${role} - ${item.label}`} />
                                            </td>
                                        ))}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </Card>
            )}

            {isMasterAdmin && (
                <Card title="Compliance Settings" className="mt-6">
                    <div className="px-5 py-4 flex flex-wrap items-center justify-between gap-3">
                        <div className="max-w-xl">
                            <p className="text-sm font-medium text-slate-800">Require Inspection Checklist Before Approval/Rejection</p>
                            <p className="text-xs text-slate-500 mt-1">
                                When on (default), Compliance & Inspection's Approve/Reject confirmation won't submit until the checklist
                                is completed. Switching this off lets any inspector approve or reject straight away, bypassing the
                                checklist for every pending inspection - use it for fast-tracked or manually-verified cases.
                            </p>
                        </div>
                        <ToggleSwitch checked={data.settings?.requireInspectionChecklist !== false}
                            onChange={toggleRequireChecklist} label="Require Inspection Checklist Before Approval/Rejection" />
                    </div>
                </Card>
            )}

            {isMasterAdmin && (
                <Card title="Driver App Settings" className="mt-6">
                    <div className="px-5 py-4 flex flex-wrap items-center justify-between gap-3">
                        <div className="max-w-xl">
                            <p className="text-sm font-medium text-slate-800">Geo-fencing for Trip Start/End</p>
                            <p className="text-xs text-slate-500 mt-1">
                                When on (default), a driver can only tap Start Trip once they're physically within the
                                designated pickup radius, and Mark Trip Complete once they're within the drop-off
                                radius - checked against their device's location. Switching this off lets drivers
                                start/end trips from anywhere, for venues or devices where location access is unreliable.
                            </p>
                        </div>
                        <ToggleSwitch checked={data.settings?.geoFencingEnabled !== false}
                            onChange={toggleGeoFencing} label="Geo-fencing for Trip Start/End" />
                    </div>
                </Card>
            )}

            {isMasterAdmin && (
                <Card title="Fleet & Fuel Settings" className="mt-6">
                    <div className="px-5 pt-4 pb-1">
                        <p className="text-xs text-slate-500">
                            Feeds the fuel half of Estimated Cost in Travel Plans - each vehicle's category fuel type (Petrol or
                            Diesel) picks which price applies. Driver cost is set per driver instead, on the Drivers sub-tab in
                            Vendors & Fleet.
                        </p>
                    </div>
                    <div className="px-5 py-4 flex flex-wrap items-center justify-between gap-3 border-b border-slate-100">
                        <p className="text-sm font-medium text-slate-800">Petrol Price (₹ per liter)</p>

                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">₹</span>
                            <input type="number" min="0" step="0.5" value={data.settings?.petrolPricePerLiter ?? ''}
                                onChange={e => updateFuelPrice('Petrol', e.target.value)}
                                className="w-32 pl-7 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />

                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">₹</span>
                            <input type="number" min="0" step="0.5" value={data.settings?.dieselPricePerLiter ?? ''}
                                onChange={e => updateFuelPrice('Diesel', e.target.value)}
                                className="w-32 pl-7 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </div>

                        options={['Master Admin', ...ROLE_LIST]} />

                        <Select label="Vehicle Type Scope (optional)" value={form.vehicleTypeScope}
                            onChange={e => setForm({ ...form, vehicleTypeScope: e.target.value })}

};

<script type="text/babel">
/* global React, Card, Badge, Btn, Modal, Input, Select, Icon, uid, PaginatedListPage, ToggleSwitch */
const { useState, useMemo } = React;

const API_CATEGORIES = ['Flight Status', 'Train / PNR Status', 'Maps & Geolocation', 'Notifications', 'Payments', 'Internal Systems', 'Other'];
const API_ENVIRONMENTS = ['Production', 'Sandbox'];
const API_STATUSES = ['Active', 'Inactive', 'Expired'];
const DEFAULT_API_FORM = { name: '', category: 'Flight Status', environment: 'Production', keyValue: '', status: 'Active', expiresOn: '', notes: '' };
const API_PREVIEW_LIMIT = 12;

// Shows a key's last 4 characters and dots out the rest, same convention as a masked card number -
// enough to tell two keys apart at a glance without ever displaying a usable credential by default.
const maskKey = (key) => !key ? '' : key.length <= 4 ? key : `${'•'.repeat(Math.min(24, key.length - 4))}${key.slice(-4)}`;

window.ApiManagementTab = ({ data, setData }) => {
    const [modal, setModal] = useState(false);
    const [editingId, setEditingId] = useState(null);
    const [form, setForm] = useState({ ...DEFAULT_API_FORM });
    const [search, setSearch] = useState('');
    const [categoryFilter, setCategoryFilter] = useState('All');
    const [statusFilter, setStatusFilter] = useState('All');
    // Which rows currently have their key revealed - per-row, not global, and never persisted
    // anywhere, so navigating away (or just re-rendering the list) re-masks everything by default.
    const [revealedIds, setRevealedIds] = useState({});
    const [pendingDeleteId, setPendingDeleteId] = useState(null);
    const [showAllKeys, setShowAllKeys] = useState(false);
    const [copiedId, setCopiedId] = useState(null);

    const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        return data.apiKeys.filter(k => {
            const matchesSearch = !q || k.name.toLowerCase().includes(q) || k.category.toLowerCase().includes(q) || k.notes.toLowerCase().includes(q);
            const matchesCategory = categoryFilter === 'All' || k.category === categoryFilter;
            const matchesStatus = statusFilter === 'All' || k.status === statusFilter;
            return matchesSearch && matchesCategory && matchesStatus;
        });
    }, [data.apiKeys, search, categoryFilter, statusFilter]);

    const toggleReveal = (id) => setRevealedIds(r => ({ ...r, [id]: !r[id] }));

    const copyKey = (entry) => {
        const done = () => { setCopiedId(entry.id); setTimeout(() => setCopiedId(c => (c === entry.id ? null : c)), 1500); };
        if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(entry.keyValue).then(done).catch(() => alert('Could not copy - your browser blocked clipboard access.'));
        } else {
            alert(`Clipboard access isn't available here. Key: ${entry.keyValue}`);
        }
    };

    const openCreateModal = () => {
        setEditingId(null);
        setForm({ ...DEFAULT_API_FORM });
        setModal(true);
    };

    const openEditModal = (entry) => {
        setEditingId(entry.id);
        setForm({
            name: entry.name, category: entry.category, environment: entry.environment,
            keyValue: entry.keyValue, status: entry.status, expiresOn: entry.expiresOn || '', notes: entry.notes || '',
        });
        setModal(true);
    };

    const updateForm = (field, value) => setForm(f => ({ ...f, [field]: value }));

    const saveApiKey = () => {
        if (!form.name.trim() || !form.keyValue.trim()) {
            alert('Enter at least a service name and an API key value.');
            return;
        }
        if (editingId) {
            setData(d => ({
                ...d,
                apiKeys: d.apiKeys.map(k => k.id === editingId
                    ? { ...k, name: form.name.trim(), category: form.category, environment: form.environment, keyValue: form.keyValue.trim(), status: form.status, expiresOn: form.expiresOn || null, notes: form.notes.trim() }
                    : k),
            }));
        } else {
            const entry = {
                id: uid('API'), name: form.name.trim(), category: form.category, environment: form.environment,
                keyValue: form.keyValue.trim(), status: form.status, expiresOn: form.expiresOn || null,
                notes: form.notes.trim(), addedOn: new Date().toISOString().slice(0, 10), lastUsed: null,
            };
            setData(d => ({ ...d, apiKeys: [...d.apiKeys, entry] }));
        }
        setModal(false);
        setForm({ ...DEFAULT_API_FORM });
        setEditingId(null);
    };

    const confirmDelete = () => {
        setData(d => ({ ...d, apiKeys: d.apiKeys.filter(k => k.id !== pendingDeleteId) }));
        setPendingDeleteId(null);
    };

    const pendingDeleteEntry = pendingDeleteId ? data.apiKeys.find(k => k.id === pendingDeleteId) : null;

    // Quick Active/Paused toggle, same one-click convention Admin Management already uses for its own
    // Activate/Deactivate button - no confirm needed since flipping it back undoes it completely, unlike
    // Delete. Also doubles as a manual "reactivate" for an Expired key (flips it straight to Active),
    // same as clicking it on a Paused one.
    const toggleKeyStatus = (id) => setData(d => ({
        ...d,
        apiKeys: d.apiKeys.map(k => k.id === id ? { ...k, status: k.status === 'Active' ? 'Inactive' : 'Active' } : k),
    }));

    // One credential record - service identity, masked key with reveal/copy, environment + status
    // badges, and expiry/last-used metadata. Edit and Delete are icon buttons in the corner rather
    // than a separate actions column, since this is a card not a cramped table row.
    const renderApiKeyCard = (entry) => {
        const revealed = !!revealedIds[entry.id];
        const isExpiringSoon = entry.expiresOn && (new Date(entry.expiresOn) - new Date()) / 86400000 < 30 && (new Date(entry.expiresOn) - new Date()) > 0;
        return (
            <div key={entry.id} className="bg-white border border-slate-300 rounded-xl p-4 shadow-sm hover:shadow-md transition-all">
                <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="flex items-center gap-3 min-w-0">
                        <span className="w-10 h-10 rounded-xl bg-blue-50 text-brandAccent flex items-center justify-center shrink-0">
                            <Icon name="key" size={18} />
                        </span>
                        <div className="min-w-0">
                            <p className="font-semibold text-slate-800 text-sm truncate">{entry.name}</p>
                            <p className="text-xs text-slate-400 truncate">{entry.category}</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-1.5 shrink-0">
                        <Badge status={entry.environment} />
                        <Badge status={entry.status} />
                        {/* A plain on/off switch reads as "toggle this" at a glance, unlike an icon
                            button whose meaning (lock = pause? = locked out?) needed a tooltip to land.
                            Paired with a text label so the state itself is never icon-only either. */}
                        <div className="flex items-center gap-1.5 pl-2 pr-2.5 py-1 rounded-full bg-slate-50 border border-slate-200"
                            title={entry.status === 'Active' ? 'Pause this key' : 'Activate this key'}>
                            <ToggleSwitch checked={entry.status === 'Active'} onChange={() => toggleKeyStatus(entry.id)}
                                label={entry.status === 'Active' ? `Pause ${entry.name}` : `Activate ${entry.name}`} />
                            <span className="text-[11px] font-medium text-slate-500 whitespace-nowrap">{entry.status === 'Active' ? 'Active' : 'Paused'}</span>
                        </div>
                        <button onClick={() => openEditModal(entry)} aria-label={`Edit ${entry.name}`}
                            className="w-8 h-8 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition">
                            <Icon name="edit" size={13} />
                        </button>
                        <button onClick={() => setPendingDeleteId(entry.id)} aria-label={`Delete ${entry.name}`}
                            className="w-8 h-8 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-400 hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition">
                            <Icon name="trash" size={13} />
                        </button>
                    </div>
                </div>

                <div className="mt-3 pt-3 border-t border-slate-100 flex items-center gap-2">
                    <span className="flex-1 min-w-0 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg font-mono text-xs text-slate-700 truncate">
                        {revealed ? entry.keyValue : maskKey(entry.keyValue)}
                    </span>
                    <button onClick={() => toggleReveal(entry.id)} title={revealed ? 'Hide key' : 'Show key'}
                        className="w-9 h-9 shrink-0 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition">
                        <Icon name={revealed ? 'eyeOff' : 'eye'} size={15} />
                    </button>
                    <button onClick={() => copyKey(entry)} title="Copy key"
                        className="w-9 h-9 shrink-0 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition">
                        <Icon name={copiedId === entry.id ? 'check' : 'copy'} size={15} className={copiedId === entry.id ? 'text-emerald-600' : ''} />
                    </button>
                </div>

                <div className="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Added</p>
                        <p className="text-slate-700 truncate">{entry.addedOn || '—'}</p>
                    </div>
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Last Used</p>
                        <p className="text-slate-700 truncate">{entry.lastUsed || 'Never'}</p>
                    </div>
                    <div className="min-w-0 col-span-2">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Expires</p>
                        <p className={`truncate ${isExpiringSoon ? 'text-amber-600 font-semibold' : 'text-slate-700'}`}>
                            {entry.expiresOn || 'No expiry'}{isExpiringSoon ? ' - expiring soon' : ''}
                        </p>
                    </div>
                </div>

                {entry.notes && <p className="mt-2.5 text-xs text-slate-500">{entry.notes}</p>}
            </div>
        );
    };

    if (showAllKeys) {
        return (
            <PaginatedListPage title="All API Keys" items={filtered} renderItem={renderApiKeyCard}
                onBack={() => setShowAllKeys(false)} pageSize={API_PREVIEW_LIMIT} emptyMessage="No API keys match your search or filter." />
        );
    }

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">API Management</h2>
                    <p className="text-sm text-slate-500">Third-party API keys and credentials used across the app - Master Admin only</p>
                </div>
                <Btn onClick={openCreateModal}><Icon name="plus" size={14} className="inline mr-1" />Add API Key</Btn>
            </div>

            <div className="flex flex-wrap gap-3 mb-4">
                <div className="relative flex-1 min-w-[220px]">
                    <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input type="text" placeholder="Search by name, category, or notes..." value={search}
                        onChange={e => setSearch(e.target.value)}
                        className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                </div>
                <select value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}
                    className="px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                    {['All', ...API_CATEGORIES].map(o => <option key={o} value={o}>{o === 'All' ? 'All Categories' : o}</option>)}
                </select>
                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
                    className="px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                    {['All', ...API_STATUSES].map(o => <option key={o} value={o}>{o === 'All' ? 'All Statuses' : o}</option>)}
                </select>
            </div>

            {filtered.length === 0 ? (
                <Card><p className="px-5 py-10 text-center text-slate-400 text-sm">
                    {data.apiKeys.length === 0 ? 'No API keys added yet.' : 'No API keys match your search or filter.'}
                </p></Card>
            ) : (
                <>
                    <div className="space-y-3">
                        {filtered.slice(0, API_PREVIEW_LIMIT).map(renderApiKeyCard)}
                    </div>
                    {filtered.length > API_PREVIEW_LIMIT && (
                        <div className="pt-3 text-center">
                            <button onClick={() => setShowAllKeys(true)} className="text-sm font-medium text-brandAccent hover:underline">
                                View All API Keys ({filtered.length}) →
                            </button>
                        </div>
                    )}
                </>
            )}

            <Modal open={modal} onClose={() => setModal(false)} title={editingId ? 'Edit API Key' : 'Add API Key'} wide>
                <div className="space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <Input label="Service Name" value={form.name} onChange={e => updateForm('name', e.target.value)} placeholder="e.g. Aviationstack" />
                        <Select label="Category" value={form.category} onChange={e => updateForm('category', e.target.value)} options={API_CATEGORIES} />
                    </div>
                    {/* Plain input, not window.Input - Input's className prop replaces its base
                        styling outright (JSX spread semantics) rather than merging with it, so
                        adding font-mono through it would strip the border/padding/focus ring. */}
                    <label className="block">
                        <span className="text-xs font-medium text-slate-500 mb-1 block">API Key</span>
                        <input value={form.keyValue} onChange={e => updateForm('keyValue', e.target.value)}
                            placeholder="Paste the key/secret here"
                            className="w-full px-3 py-2 text-sm font-mono border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                    </label>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Select label="Environment" value={form.environment} onChange={e => updateForm('environment', e.target.value)} options={API_ENVIRONMENTS} />
                        <Select label="Status" value={form.status} onChange={e => updateForm('status', e.target.value)} options={API_STATUSES} />
                        <Input label="Expires On (optional)" type="date" value={form.expiresOn} onChange={e => updateForm('expiresOn', e.target.value)} />
                    </div>
                    <label className="block">
                        <span className="text-xs font-medium text-slate-500 mb-1 block">Notes (optional)</span>
                        <textarea value={form.notes} onChange={e => updateForm('notes', e.target.value)} rows={2}
                            placeholder="What this key is used for..."
                            className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                    </label>
                    <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                        <Btn variant="outline" onClick={() => setModal(false)}>Cancel</Btn>
                        <Btn onClick={saveApiKey}>{editingId ? 'Save Changes' : 'Add API Key'}</Btn>
                    </div>
                </div>
            </Modal>

            <Modal open={!!pendingDeleteId} onClose={() => setPendingDeleteId(null)} title="Delete API Key">
                {pendingDeleteEntry && (
                    <div className="space-y-4">
                        <div className="bg-red-50 border border-red-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-red-500 shrink-0 mt-0.5" />
                            <p className="text-sm text-red-800">
                                Delete <strong>{pendingDeleteEntry.name}</strong>? Anything in this app relying on it will stop working until a replacement key is added. This can't be undone.
                            </p>
                        </div>
                        <div className="flex gap-2">
                            <Btn variant="danger" onClick={confirmDelete}>Delete Key</Btn>
                            <Btn variant="outline" onClick={() => setPendingDeleteId(null)}>Cancel</Btn>
                        </div>
                    </div>
                )}
            </Modal>
        </div>
    );
};

</script>
<script type="text/babel">
/* global React, ReactDOM, INITIAL_DATA, NAV_ITEMS, Icon, Btn, Modal, DashboardTab, LiveFleetTrackingTab, VendorsTab, InventoryManagementTab, RoutePlansTab, TravelPlansTab, ComplianceTab, FleetEstimationTab, NotificationsTab, GrievancesTab, AdminTab, ApiManagementTab */
const { useState, useEffect } = React;

const TAB_MAP = {
    'Dashboard': DashboardTab,
    'Live Fleet Tracking': LiveFleetTrackingTab,
    'Vendors & Fleet': VendorsTab,
    'Inventory Management': InventoryManagementTab,
    'Route Plans': RoutePlansTab,
    'Travel Plans': TravelPlansTab,
    'Compliance & Inspection': ComplianceTab,
    'Fleet Estimation': FleetEstimationTab,
    'Notifications': NotificationsTab,
    'Grievances': GrievancesTab,
    'Admin Management': AdminTab,
    'API Management': ApiManagementTab,
};

function LoginScreen({ onLogin }) {
    const [email, setEmail] = useState('shubham.das@transportmanagement.in');
    const admins = INITIAL_DATA.admins.filter(a => a.status === 'Active');

    const login = () => {
        const admin = admins.find(a => a.email === email);
        if (!admin) return alert('Admin not found or inactive.');
        onLogin({ id: admin.id, name: admin.name, role: admin.role, email: admin.email, vehicleTypeScope: admin.vehicleTypeScope || null });
    };

    return (
        <div className="min-h-screen bg-canvasLight flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
                <h1 className="text-2xl font-bold text-slate-800">Transport <span className="text-brandAccent">Management</span></h1>
                <p className="text-sm text-slate-500 mt-1 mb-6">Travel Admin Panel - Sign in to continue</p>
                <label className="block text-xs font-medium text-slate-500 mb-1">Select Admin Account</label>
                <select value={email} onChange={e => setEmail(e.target.value)}
                    className="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-lg mb-4 focus:ring-2 focus:ring-brandAccent/30 focus:outline-none">
                    {/* Vehicle-type-scoped Compliance Officers show their scope right in the picker,
                        so which of the four test accounts sees what is obvious before even logging in. */}
                    {admins.map(a => <option key={a.id} value={a.email}>{a.name} - {a.role}{a.vehicleTypeScope ? ` (${a.vehicleTypeScope})` : ''}</option>)}
                </select>
                <Btn className="w-full py-2.5" onClick={login}>Sign In</Btn>
                <p className="text-xs text-slate-400 text-center mt-4">Multiple admins can work concurrently</p>
            </div>
        </div>
    );
}

function App() {
    const [loggedIn, setLoggedIn] = useState(null);
    const [activeTab, setActiveTab] = useState('Dashboard');
    const [sidebarOpen, setSidebarOpen] = useState(false);
    const [sosModalOpen, setSosModalOpen] = useState(false);
    const [data, setData] = useState(() => JSON.parse(JSON.stringify(INITIAL_DATA)));
    const [clock, setClock] = useState('');

    useEffect(() => {
        const tick = () => setClock(new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }));
        tick();
        const id = setInterval(tick, 30000);
        return () => clearInterval(id);
    }, []);

    useEffect(() => {
        if (loggedIn) {
            setData(d => ({
                ...d,
                currentAdmin: loggedIn,
                activeAdmins: d.activeAdmins.some(a => a.id === loggedIn.id)
                    ? d.activeAdmins.map(a => a.id === loggedIn.id ? { ...a, tab: activeTab, lastActive: 'Just now' } : a)
                    : [...d.activeAdmins, { id: loggedIn.id, name: loggedIn.name, role: loggedIn.role, lastActive: 'Just now', tab: activeTab }],
            }));
        }
    }, [activeTab, loggedIn]);

    // Modules this session's role is permitted into. An unrecognized role (e.g. a custom string from
    // a CSV import) falls back to Dashboard only, rather than being silently granted nothing to see.
    const allowedTabs = loggedIn ? (data.permissions[loggedIn.role] || ['Dashboard']) : [];

    // If the active tab isn't (or is no longer) permitted for this role - right after logging in as
    // someone else, or because a Master Admin just revoked access to whatever's open - snap back to
    // the first module this role can actually see.
    useEffect(() => {
        if (loggedIn && !allowedTabs.includes(activeTab)) {
            setActiveTab(allowedTabs[0] || 'Dashboard');
        }
    }, [loggedIn, data.permissions, activeTab]);

    if (!loggedIn) return <LoginScreen onLogin={setLoggedIn} />;

    const visibleNavItems = NAV_ITEMS.filter(item => allowedTabs.includes(item.label));
    const ActiveComponent = allowedTabs.includes(activeTab) ? TAB_MAP[activeTab] : null;
    const unreadCount = data.notifications.filter(n => !n.read).length;
    const activeSOSCount = data.sosAlerts.filter(s => s.status === 'Active').length;

    const logout = () => {
        setData(d => ({ ...d, activeAdmins: d.activeAdmins.filter(a => a.id !== loggedIn.id) }));
        setLoggedIn(null);
    };

    // SOS alerts live in this header popup now, not a Dashboard banner - the SOS button opens it
    // directly, no page navigation needed. Resolving clears the alert and the underlying
    // assignment's sos flag (dropping it to Delayed, same as the old Dashboard/Fleet Tracking banners).
    const resolveSOS = (id) => {
        setData(d => ({
            ...d,
            sosAlerts: d.sosAlerts.map(s => s.id === id ? { ...s, status: 'Resolved' } : s),
            assignments: d.assignments.map(a => a.sos ? { ...a, sos: false, status: 'Delayed' } : a),
        }));
    };

    return (
        // "DRIBBBLE 1 REF" shell - light sidebar with a black active-item pill, straight from the
        // reference - but running edge-to-edge/full viewport rather than floating as an inset card.
        // (The floating-card treatment was tried first and made the app look like it was rendering
        // inside a smaller frame/tab instead of taking the whole screen, so it was dropped in favor
        // of the same full-bleed h-screen shell the app used before this reskin.)
        <div className="h-screen w-full bg-white flex overflow-hidden">
            {sidebarOpen && <div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

            <aside className={`fixed lg:static inset-y-0 left-0 w-64 bg-white text-slate-500 flex flex-col z-40 transform transition-transform border-r border-slate-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                <div className="h-16 flex items-center justify-between px-5 border-b border-slate-200">
                    <div className="flex items-center gap-2">
                        <span className="w-7 h-7 rounded-lg bg-slate-900 text-white flex items-center justify-center shrink-0"><Icon name="fleet" size={14} /></span>
                        <span className="text-slate-900 font-bold text-sm">Transport Management</span>
                    </div>
                    <button className="lg:hidden text-slate-400" onClick={() => setSidebarOpen(false)}><Icon name="close" size={20} /></button>
                </div>

                <nav className="flex-1 overflow-y-auto py-3 px-2">
                    {visibleNavItems.map(({ label, icon }) => (
                        <button key={label} onClick={() => { setActiveTab(label); setSidebarOpen(false); }}
                            className={`w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-xl mb-0.5 transition ${activeTab === label ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900'}`}>
                            <Icon name={icon} size={18} />
                            <span className="flex-1 text-left">{label}</span>
                            {label === 'Notifications' && unreadCount > 0 && (
                                <span className="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{unreadCount}</span>
                            )}
                        </button>
                    ))}
                </nav>

                <div className="p-4 border-t border-slate-200">
                    <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-full bg-gradient-to-br from-brandAccent to-indigo-700 flex items-center justify-center text-white text-xs font-bold">
                            {loggedIn.name.split(' ').map(n => n[0]).join('')}
                        </div>
                        <div className="flex-1 min-w-0">
                            <p className="text-slate-800 text-sm font-medium truncate">{loggedIn.name}</p>
                            <p className="text-slate-400 text-xs truncate">{loggedIn.role}</p>
                        </div>
                    </div>
                    {/* bg-slate-50 (not just a border) so this reads as a button at rest, not bare text
                        with an almost-invisible outline - the same fix as Btn's outline variant above. */}
                    <button onClick={logout} className="w-full mt-3 py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-50 hover:bg-slate-100 border border-slate-300 hover:border-slate-400 rounded-full transition">Logout</button>
                </div>
            </aside>

            <div className="flex-1 flex flex-col overflow-hidden min-w-0">
                <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 shrink-0">
                    <div className="flex items-center gap-3">
                        <button className="lg:hidden p-2 text-slate-500" onClick={() => setSidebarOpen(true)}><Icon name="menu" size={22} /></button>
                        {clock && (
                            <p className="text-sm text-slate-500 flex items-center gap-1.5">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0" />
                                Live  |  {clock} IST  |  {data.activeAdmins.length} admins online
                            </p>
                        )}
                    </div>
                    <div className="flex items-center gap-2">
                        {allowedTabs.includes('Dashboard') && (
                            <button
                                className={`relative px-2.5 py-1.5 rounded-full text-xs font-extrabold tracking-wide transition ${activeSOSCount > 0 ? 'text-white bg-red-600 hover:bg-red-700' : 'text-slate-400 hover:text-slate-600 hover:bg-slate-50'}`}
                                onClick={() => setSosModalOpen(true)} aria-label="SOS alerts">
                                SOS
                                {activeSOSCount > 0 && (
                                    <span className="absolute -top-1.5 -right-1.5 min-w-[16px] h-4 px-1 bg-white text-red-600 text-[10px] font-bold rounded-full flex items-center justify-center ring-2 ring-red-600 sos-pulse">
                                        {activeSOSCount}
                                    </span>
                                )}
                            </button>
                        )}
                        {allowedTabs.includes('Notifications') && (
                            <button className="relative p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-50" onClick={() => setActiveTab('Notifications')}>
                                <Icon name="bell" size={20} />
                                {unreadCount > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white" />}
                            </button>
                        )}
                    </div>
                </header>

                {/* bg-slate-100 (not the near-invisible slate-50/50) - the whole point of this tint is
                    to separate the page canvas from the white cards sitting on it; at 50% opacity of
                    an already-pale color there wasn't enough contrast left to do that. */}
                <main className="flex-1 overflow-y-auto p-4 lg:p-8 bg-slate-100">
                    {ActiveComponent ? (
                        <ActiveComponent
                            data={data}
                            setData={setData}
                            setActiveTab={setActiveTab}
                            onLogout={logout}
                        />
                    ) : (
                        <div className="max-w-md mx-auto text-center py-20">
                            <div className="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-4">
                                <Icon name="lock" size={26} />
                            </div>
                            <p className="font-semibold text-slate-700 text-lg mb-1">No modules assigned</p>
                            <p className="text-sm text-slate-500">Your role ({loggedIn.role}) doesn't have access to any module yet. Ask your Master Admin to grant permissions from Admin Management.</p>
                        </div>
                    )}
                </main>
            </div>

            {/* SOS popup - opened from the SOS button in the header, replacing the old Dashboard/Fleet
                Tracking banners. Self-contained: works from any tab, no navigation needed. */}
            <Modal open={sosModalOpen} onClose={() => setSosModalOpen(false)} title="Active SOS Alerts">
                <div className="space-y-3">
                    {activeSOSCount === 0 && (
                        <p className="text-sm text-slate-400 text-center py-6">No active SOS alerts right now.</p>
                    )}
                    {data.sosAlerts.filter(s => s.status === 'Active').map(s => (
                        <div key={s.id} className="bg-red-50 border border-red-200 rounded-xl p-4 flex flex-wrap justify-between items-center gap-3 sos-pulse">
                            <div className="flex gap-3">
                                <Icon name="alert" size={20} className="text-red-500 mt-0.5 shrink-0" />
                                <div>
                                    <p className="font-semibold text-red-800 text-sm">SOS - {s.vehicleId}  |  {s.driver}</p>
                                    <p className="text-xs text-red-600">{s.location}  |  Reported {s.reportedAt}</p>
                                </div>
                            </div>
                            <Btn variant="danger" onClick={() => resolveSOS(s.id)} className="shrink-0">Mark Resolved</Btn>
                        </div>
                    ))}
                </div>
            </Modal>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
