};

// Role is User Management's other sub-section (the sidebar shows Users | Role once User Management
// is active - see App()'s USER_MGMT_SUBTABS). Users is window.AdminTab above, this app's existing
// admin roster; Role is a deliberate placeholder for now - an honest "coming soon" page, not a dead
// link - ready to build out once there's real role-management functionality to put here. (Industry
// and Institution sub-sections briefly existed alongside these as ATOM-parity placeholders and were
// removed - there's no plan to build them, so they're gone rather than left as unreachable dead
// links.)
const ROLE_PERMISSION_KEYS = ['fullAccess', 'view', 'create', 'edit', 'delete'];
const ROLE_DATE_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// createdOn is stored YYYY-MM-DD - formatted by hand rather than via toLocaleDateString so it reads
// the same ("03 Sep, 2026") regardless of the browser's locale.
const formatRoleDate = (iso) => {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-').map(Number);
    if (!y || !m || !d) return iso;
    return `${String(d).padStart(2, '0')} ${ROLE_DATE_MONTHS[m - 1]}, ${y}`;
};

// Add Role / Edit Role / View Role - one page for all three, `mode` tells them apart. Role Name and
// Description are straightforward; the Permissions grid is the ATOM reference's own Full
// Access/View/Create/Edit/Delete columns, rows swapped out for this app's real modules
// (window.NAV_ITEMS) instead of ATOM's own domain concepts (Functional Area/Industry/etc, which have
// no equivalent here). Full Access is the one column wired to something real - it's what actually
// grants sidebar/routing access (data.permissions, unchanged since before this tab existed).
// View/Create/Edit/Delete save to data.roleActionPermissions but aren't enforced anywhere yet - same
// "structure now, build the behavior later" precedent used elsewhere in this app (e.g. Join
// Requests & Invites).
function RoleFormPage({ mode, role, data, setData, onDone }) {
    const readOnly = mode === 'view';
    const [name, setName] = useState(role?.name || '');
    const [description, setDescription] = useState(role?.description || '');
    const permissionRows = NAV_ITEMS.filter(i => i.label !== 'User Management');

    // mode === 'add' has no `role` yet, so every cell below starts unchecked - fix-list item 18's
    // decision: a new custom role starts completely empty, not inheriting any existing role's
    // template. Nothing is implicitly granted just because a name was similar to another role, or
    // because it was cloned from one - Full Access to each module is a deliberate, individually
    // ticked choice every time.
    const initDraft = () => {
        const draft = {};
        permissionRows.forEach(item => {
            const fullAccess = role ? (data.permissions[role.name] || []).includes(item.label) : false;
            const extra = role ? (data.roleActionPermissions[role.name]?.[item.label] || {}) : {};
            draft[item.label] = { fullAccess, view: !!extra.view, create: !!extra.create, edit: !!extra.edit, delete: !!extra.delete };
        });
        return draft;
    };
    const [permDraft, setPermDraft] = useState(initDraft);
    const toggleCell = (label, key) => {
        if (readOnly) return;
        setPermDraft(d => ({ ...d, [label]: { ...d[label], [key]: !d[label][key] } }));
    };

    const save = () => {
        if (!name.trim()) {
            alert('Enter a role name.');
            return;
        }
        const newName = name.trim();
        // Role names are the key every reference to a role uses (data.permissions,
        // roleActionPermissions, and admin.role itself) - a duplicate would silently merge two
        // different roles' grants and rosters together.
        if (data.roles.some(r => r.name.toLowerCase() === newName.toLowerCase() && r.name !== role?.name)) {
            alert(`A role named "${newName}" already exists - pick a different name.`);
            return;
        }
        const fullAccessModules = Object.entries(permDraft).filter(([, v]) => v.fullAccess).map(([label]) => label);
        const actionPerms = {};
        Object.entries(permDraft).forEach(([label, v]) => {
            actionPerms[label] = { view: v.view, create: v.create, edit: v.edit, delete: v.delete };
        });

        setData(d => {
            const oldName = role?.name || null;
            const renamed = !!oldName && oldName !== newName;
            const roles = mode === 'add'
                ? [...d.roles, { name: newName, description, createdOn: new Date().toISOString().slice(0, 10), locked: false }]
                : d.roles.map(r => r.name === oldName ? { ...r, name: newName, description } : r);
            // Renaming a role has to cascade to every admin holding it, or they'd be left pointing at
            // a role that no longer exists.
            const admins = renamed ? d.admins.map(a => a.role === oldName ? { ...a, role: newName } : a) : d.admins;
            const permissions = { ...d.permissions };
            if (renamed) delete permissions[oldName];
            permissions[newName] = fullAccessModules;
            const roleActionPermissions = { ...d.roleActionPermissions };
            if (renamed) delete roleActionPermissions[oldName];
            roleActionPermissions[newName] = actionPerms;
            return { ...d, roles, admins, permissions, roleActionPermissions };
        });
        onDone();
    };

    return (
        <div className="max-w-4xl mx-auto animate-in">
            <Btn variant="outline" onClick={onDone} className="mb-4">{'<- Back'}</Btn>
            <h2 className="text-lg font-semibold text-slate-800 mb-6">
                {mode === 'add' ? 'Add Role' : mode === 'edit' ? 'Edit Role' : 'View Role'}
            </h2>

            <Card className="p-5 mb-6">
                <div className="max-w-md">
                    <Input label="Role Name *" placeholder="e.g. Admin" value={name} disabled={readOnly}
                        onChange={e => setName(e.target.value)} className={readOnly ? 'bg-slate-50 text-slate-500' : ''} />
                </div>
                <div className="max-w-md mt-4">
                    <span className="text-xs font-medium text-slate-500 mb-1 block">Description</span>
                    <textarea rows={3} placeholder="Write your description here..." value={description} disabled={readOnly}
                        onChange={e => setDescription(e.target.value)}
                        className={`w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 ${readOnly ? 'bg-slate-50 text-slate-500' : ''}`} />
                </div>
            </Card>

            <Card className="p-5">
                <p className="font-semibold text-slate-800">Permissions</p>
                <p className="text-xs text-slate-500 mt-0.5 mb-4">Select what actions this role can perform across different modules.</p>
                <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                        <thead className="text-slate-500 text-xs"><tr>
                            <th className="px-3 py-2 text-left font-medium"></th>
                            <th className="px-3 py-2 text-center font-medium">Full Access</th>
                            <th className="px-3 py-2 text-center font-medium">View</th>
                            <th className="px-3 py-2 text-center font-medium">Create</th>
                            <th className="px-3 py-2 text-center font-medium">Edit</th>
                            <th className="px-3 py-2 text-center font-medium">Delete</th>
                        </tr></thead>
                        <tbody className="divide-y divide-slate-100">
                            {permissionRows.map(item => (
                                <tr key={item.label}>
                                    <td className="px-3 py-2.5">
                                        <div className="flex items-center gap-2 font-medium text-slate-700">
                                            <Icon name={item.icon} size={14} className="text-slate-400 shrink-0" />
                                            {item.label}
                                        </div>
                                    </td>
                                    {ROLE_PERMISSION_KEYS.map(key => (
                                        <td key={key} className="px-3 py-2.5 text-center">
                                            <input type="checkbox" checked={permDraft[item.label][key]} disabled={readOnly}
                                                onChange={() => toggleCell(item.label, key)}
                                                className="w-4 h-4 rounded border-slate-300 text-brandAccent focus:ring-brandAccent/30 disabled:opacity-60" />
                                        </td>
                                    ))}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </Card>

            <div className="flex justify-end gap-2 mt-6">
                <Btn variant="outline" onClick={onDone}>{readOnly ? 'Close' : 'Cancel'}</Btn>
                {!readOnly && <Btn onClick={save}>Save</Btn>}
            </div>
        </div>
    );
}

// A role's own "Users Assigned" drill-down - summary card + a searchable roster of every admin
// currently holding this role. Removing someone here needs a replacement role picked first (this
// app's admins hold exactly one role, unlike ATOM's own many-role Individuals), rather than either
// silently leaving them roleless or quietly guessing one for them.
function RoleUsersAssignedPage({ roleName, data, setData, onBack }) {
    const role = data.roles.find(r => r.name === roleName);
    const [search, setSearch] = useState('');
    const [reassignTarget, setReassignTarget] = useState(null);
    const [newRole, setNewRole] = useState('');

    const users = data.admins.filter(a => a.role === roleName);
    const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return users;
        return users.filter(a => a.name.toLowerCase().includes(q) || a.email.toLowerCase().includes(q) || (a.atomId || '').toLowerCase().includes(q));
    }, [users, search]);
    const otherRoles = data.roles.filter(r => r.name !== roleName).map(r => r.name);

    const openReassign = (admin) => { setReassignTarget(admin); setNewRole(otherRoles[0] || ''); };
    const confirmReassign = () => {
        if (!newRole) return;
        setData(d => ({
            ...d,
            admins: d.admins.map(a => a.id === reassignTarget.id ? {
                ...a, role: newRole,
                vehicleTypeScope: newRole === 'Compliance Officer' ? a.vehicleTypeScope : null,
                vendorScope: newRole === 'Compliance Officer' ? a.vendorScope : null,
            } : a),
        }));
        setReassignTarget(null);
    };

    return (
        <div className="max-w-5xl mx-auto animate-in">
            <Btn variant="outline" onClick={onBack} className="mb-4">{'<- Back to Roles'}</Btn>
            <h2 className="text-lg font-semibold text-slate-800 mb-4">Users Assigned</h2>

            <Card className="p-5 mb-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
                    <div><p className="text-[10px] text-slate-400 uppercase tracking-wide">Role</p><p className="font-medium text-slate-800">{role?.name || roleName}</p></div>
                    <div><p className="text-[10px] text-slate-400 uppercase tracking-wide">Description</p><p className="text-slate-700">{role?.description || '—'}</p></div>
                    <div><p className="text-[10px] text-slate-400 uppercase tracking-wide">Users Assigned</p><p className="text-slate-700">{users.length}</p></div>
                </div>
            </Card>

            <Card>
                <div className="px-5 pt-4">
                    <p className="font-semibold text-slate-800 mb-3">Users</p>
                    <div className="relative">
                        <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input type="text" placeholder="Search by Atom ID, User Name, Email..." value={search} onChange={e => setSearch(e.target.value)}
                            className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                    </div>
                </div>
                <div className="overflow-x-auto mt-3">
                    <table className="w-full text-sm">
                        <thead className="bg-brandAccent text-white text-xs"><tr>
                            <th className="px-5 py-3 text-left font-medium">Atom ID</th>
                            <th className="px-5 py-3 text-left font-medium">User Name</th>
                            <th className="px-5 py-3 text-left font-medium">Email</th>
                            <th className="px-5 py-3 text-right font-medium">Action</th>
                        </tr></thead>
                        <tbody className="divide-y divide-slate-100">
                            {filtered.length === 0 && (
                                <tr><td colSpan={4} className="px-5 py-8 text-center text-slate-400">No users assigned to this role yet.</td></tr>
                            )}
                            {filtered.map(a => (
                                <tr key={a.id} className="hover:bg-slate-50">
                                    <td className="px-5 py-3 font-mono text-xs text-slate-500">{a.atomId || '—'}</td>
                                    <td className="px-5 py-3">
                                        <div className="flex items-center gap-2.5">
                                            <span className={`w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-semibold shrink-0 ${avatarGradientFor(a.id)}`}>
                                                {initialsOf(a.name)}
                                            </span>
                                            <span className="font-medium text-slate-800">{a.name}</span>
                                        </div>
                                    </td>
                                    <td className="px-5 py-3 text-slate-500">{a.email}</td>
                                    <td className="px-5 py-3 text-right">
                                        <button type="button" title="Remove from this role" onClick={() => openReassign(a)}
                                            className="p-1.5 rounded-lg border border-slate-200 text-slate-400 hover:bg-red-50 hover:text-red-500 transition">
                                            <Icon name="trash" size={14} />
                                        </button>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </Card>

            <Modal open={!!reassignTarget} onClose={() => setReassignTarget(null)} title="Remove from Role">
                {reassignTarget && (
                    <div className="space-y-4">
                        <p className="text-sm text-slate-600">
                            {reassignTarget.name} needs a role - every Individual holds exactly one, so pick what they move to instead of {roleName}.
                        </p>
                        {otherRoles.length === 0 ? (
                            <p className="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3">
                                There's no other role to move them to yet - add one first from Roles.
                            </p>
                        ) : (
                            <Select label="New Role" value={newRole} onChange={e => setNewRole(e.target.value)} options={otherRoles} />
                        )}
                        <div className="flex gap-2">
                            <Btn variant="outline" className="flex-1" onClick={() => setReassignTarget(null)}>Cancel</Btn>
                            <Btn className="flex-1" onClick={confirmReassign} disabled={!newRole}>Move</Btn>
                        </div>
                    </div>
                )}
            </Modal>
        </div>
    );
}

// Assign User - lets an admin bulk-add existing Individuals to a role, the same multi-select-by-search
// pattern as the ATOM reference's own Assign User panel (rendered here in this app's own Modal instead
// of a slide-in side panel, matching how every other popup in this app works). Only Individuals not
// already holding this role are offered - assigning is a role *change* (this app's admins hold exactly
// one), not an addition, so someone already in the role has nothing to gain from being listed again.
function AssignUserModal({ roleName, role, data, setData, onClose }) {
    const [search, setSearch] = useState('');
    const [selected, setSelected] = useState([]);
    const eligible = useMemo(() => data.admins.filter(a => a.role !== roleName), [data.admins, roleName]);
    const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return eligible;
        return eligible.filter(a => a.name.toLowerCase().includes(q) || a.email.toLowerCase().includes(q) || (a.atomId || '').toLowerCase().includes(q));
    }, [eligible, search]);
    const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);

    const assign = () => {
        if (!selected.length) return;
        setData(d => ({
            ...d,
            admins: d.admins.map(a => selected.includes(a.id) ? {
                ...a, role: roleName,
                vehicleTypeScope: roleName === 'Compliance Officer' ? a.vehicleTypeScope : null,
                vendorScope: roleName === 'Compliance Officer' ? a.vendorScope : null,
            } : a),
        }));
        onClose();
    };

    return (
        <div className="space-y-4">
            <div className="grid grid-cols-2 gap-3 text-sm">
                <div><p className="text-[10px] text-slate-400 uppercase tracking-wide">Role</p><p className="font-medium text-slate-800">{roleName}</p></div>
                <div><p className="text-[10px] text-slate-400 uppercase tracking-wide">Description</p><p className="text-slate-700">{role?.description || '—'}</p></div>
            </div>
            <div>
                <span className="text-xs font-medium text-slate-500 mb-1 block">Assign Users *</span>
                <div className="relative mb-2">
                    <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input type="text" placeholder="Search user by ATOM ID, Name, Email..." value={search} onChange={e => setSearch(e.target.value)}
                        className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30" />
                </div>
                <div className="border border-slate-200 rounded-lg max-h-56 overflow-y-auto divide-y divide-slate-100">
                    {filtered.length === 0 && <p className="px-3 py-6 text-center text-sm text-slate-400">No other Individuals to assign.</p>}
                    {filtered.map(a => (
                        <label key={a.id} className="flex items-center gap-3 px-3 py-2.5 cursor-pointer hover:bg-slate-50">
                            <input type="checkbox" checked={selected.includes(a.id)} onChange={() => toggle(a.id)}
                                className="w-4 h-4 rounded border-slate-300 text-brandAccent focus:ring-brandAccent/30 shrink-0" />
                            <span className={`w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-semibold shrink-0 ${avatarGradientFor(a.id)}`}>
                                {initialsOf(a.name)}
                            </span>
                            <div className="min-w-0">
                                <p className="text-sm font-medium text-slate-800 truncate">{a.name} - {a.atomId || 'No Atom ID'}</p>
                                <p className="text-xs text-slate-400 truncate">{a.email}</p>
                            </div>
                        </label>
                    ))}
                </div>
            </div>
            <div className="flex gap-2">
                <Btn variant="outline" className="flex-1" onClick={onClose}>Cancel</Btn>
                <Btn className="flex-1" onClick={assign} disabled={!selected.length}>Assign</Btn>
            </div>
        </div>
    );
}

window.RoleManagementTab = ({ data, setData }) => {
    const [formMode, setFormMode] = useState(null); // null | 'add' | 'edit' | 'view'
    const [formRoleName, setFormRoleName] = useState(null);
    const [usersAssignedRole, setUsersAssignedRole] = useState(null);
    const [assignModalRole, setAssignModalRole] = useState(null);
    const [deleteRoleName, setDeleteRoleName] = useState(null);
    const [openMenuId, setOpenMenuId] = useState(null);
    const [search, setSearch] = useState('');

    const filteredRoles = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return data.roles;
        return data.roles.filter(r => r.name.toLowerCase().includes(q));
    }, [data.roles, search]);

    // Deleting a role that's still in use would leave its admins pointing at a role that no longer
    // exists - blocked with a clear reason instead, same as User Management won't let you remove
    // your own signed-in account. Reassign everyone first from Users Assigned, then delete.
    const requestDeleteRole = (role) => {
        const count = data.admins.filter(a => a.role === role.name).length;
        if (count > 0) {
            alert(`${role.name} still has ${count} user${count === 1 ? '' : 's'} assigned - reassign them first from Users Assigned before deleting this role.`);
            return;
        }
        setOpenMenuId(null);
        setDeleteRoleName(role.name);
    };
    const confirmDeleteRole = () => {
        setData(d => {
            const permissions = { ...d.permissions };
            delete permissions[deleteRoleName];
            const roleActionPermissions = { ...d.roleActionPermissions };
            delete roleActionPermissions[deleteRoleName];
            const auditLog = [{
                id: uid('AUD'), action: 'Delete Role', actorId: d.currentAdmin.id, actorName: d.currentAdmin.name,
                targetId: deleteRoleName, targetLabel: deleteRoleName,
                timestamp: new Date().toISOString(),
            }, ...d.auditLog];
            return { ...d, roles: d.roles.filter(r => r.name !== deleteRoleName), permissions, roleActionPermissions, auditLog };
        });
        setDeleteRoleName(null);
    };

    const formRole = formRoleName ? data.roles.find(r => r.name === formRoleName) : null;
    const assignRole = assignModalRole ? data.roles.find(r => r.name === assignModalRole) : null;

    if (formMode) {
        return <RoleFormPage mode={formMode} role={formRole} data={data} setData={setData}
            onDone={() => { setFormMode(null); setFormRoleName(null); }} />;
    }
    if (usersAssignedRole) {
        return <RoleUsersAssignedPage roleName={usersAssignedRole} data={data} setData={setData} onBack={() => setUsersAssignedRole(null)} />;
    }

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="mb-6">
                <h2 className="text-lg font-semibold text-slate-800">Role</h2>
                <p className="text-sm text-slate-500">Define roles and the permissions that come with them.</p>
            </div>

            <Card>
                <div className="px-5 pt-4 flex flex-wrap justify-between items-start gap-3">
                    <div>
                        <h3 className="font-semibold text-slate-800">Manage Roles</h3>
                        <p className="text-xs text-slate-500 mt-0.5">Create, edit, or remove roles.</p>
                    </div>
                    <Btn onClick={() => { setFormMode('add'); setFormRoleName(null); }}>
                        <Icon name="plus" size={14} className="inline mr-1" />Add Role
                    </Btn>
                </div>

                <div className="px-5 pt-4 pb-1">
                    <div className="relative">
                        <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input type="text" placeholder="Search by role..." value={search} onChange={e => setSearch(e.target.value)}
                            className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                    </div>
                </div>

                <div className="overflow-x-auto mt-3">
                    <table className="w-full text-sm">
                        <thead className="bg-brandAccent text-white text-xs"><tr>
                            <th className="px-5 py-3 text-left font-medium">Roles</th>
                            <th className="px-5 py-3 text-left font-medium">Created On</th>
                            <th className="px-5 py-3 text-left font-medium">Users Assigned</th>
                            <th className="px-5 py-3 text-right font-medium">Action</th>
                        </tr></thead>
                        <tbody className="divide-y divide-slate-100">
                            {filteredRoles.length === 0 && (
                                <tr><td colSpan={4} className="px-5 py-8 text-center text-slate-400">No roles match your search.</td></tr>
                            )}
                            {filteredRoles.map(r => {
                                const userCount = data.admins.filter(a => a.role === r.name).length;
                                return (
                                    <tr key={r.name} className="hover:bg-slate-50">
                                        <td className="px-5 py-3">
                                            {/* Locked = a pre-existing system role (every seeded role
                                                today) - view + assign only, no rename/delete. Unlocked
                                                = a custom role Add Role created, fully editable. */}
                                            <span className="font-medium text-slate-800 inline-flex items-center gap-1.5">
                                                {r.name}
                                                {r.locked && <Icon name="lock" size={12} className="text-slate-300" />}
                                            </span>
                                        </td>
                                        <td className="px-5 py-3 text-slate-500">{formatRoleDate(r.createdOn)}</td>
                                        <td className="px-5 py-3">
                                            {userCount > 0 ? (
                                                <button type="button" onClick={() => setUsersAssignedRole(r.name)}
                                                    className="text-brandAccent hover:underline font-medium">{userCount}</button>
                                            ) : (
                                                <span className="text-slate-400">{userCount}</span>
                                            )}
                                        </td>
                                        <td className="px-5 py-3 text-right relative">
                                            <button type="button" onClick={() => setOpenMenuId(m => m === r.name ? null : r.name)}
                                                className="p-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 transition" aria-label={`Actions for ${r.name}`}>
                                                <Icon name="more" size={16} />
                                            </button>
                                            {openMenuId === r.name && (
                                                <>
                                                    <div className="fixed inset-0 z-10" onClick={() => setOpenMenuId(null)} />
                                                    <div className="absolute right-5 top-full mt-1 w-44 bg-white border border-slate-200 rounded-lg shadow-lg z-20 py-1 text-left">
                                                        <button type="button" onClick={() => { setAssignModalRole(r.name); setOpenMenuId(null); }}
                                                            className="w-full text-left px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                                                            <Icon name="users" size={14} className="text-slate-400" />Assign User
                                                        </button>
                                                        {r.locked ? (
                                                            <button type="button" onClick={() => { setFormMode('view'); setFormRoleName(r.name); setOpenMenuId(null); }}
                                                                className="w-full text-left px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                                                                <Icon name="eye" size={14} className="text-slate-400" />View Role
                                                            </button>
                                                        ) : (
                                                            <>
                                                                <button type="button" onClick={() => { setFormMode('edit'); setFormRoleName(r.name); setOpenMenuId(null); }}
                                                                    className="w-full text-left px-3 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                                                                    <Icon name="edit" size={14} className="text-slate-400" />Edit Role
                                                                </button>
                                                                <button type="button" onClick={() => requestDeleteRole(r)}
                                                                    className="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
                                                                    <Icon name="trash" size={14} />Delete Role
                                                                </button>
                                                            </>
                                                        )}
                                                    </div>
                                                </>
                                            )}
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            </Card>

            <Modal open={!!assignModalRole} onClose={() => setAssignModalRole(null)} title="Assign User">
                {assignModalRole && (
                    <AssignUserModal roleName={assignModalRole} role={assignRole} data={data} setData={setData}
                        onClose={() => setAssignModalRole(null)} />
                )}
            </Modal>

            <Modal open={!!deleteRoleName} onClose={() => setDeleteRoleName(null)} title="Delete Role">
                {deleteRoleName && (
                    <div className="space-y-4">
                        <p className="text-sm text-slate-600">
                            Delete <strong>{deleteRoleName}</strong>? This can't be undone.
                        </p>
                        <div className="flex gap-2">
                            <Btn variant="outline" className="flex-1" onClick={() => setDeleteRoleName(null)}>Cancel</Btn>
                            <Btn variant="danger" className="flex-1" onClick={confirmDeleteRole}>Delete</Btn>
                        </div>
                    </div>
                )}
            </Modal>
        </div>
    );
};

// One row of Module Settings - an icon badge (so each setting has its own identity at a glance,
// same "labeled icon badge" language the rest of the app uses, not just a bare label floating next
// to a box) plus label/description on the left, whatever control (ToggleSwitch or
// SettingNumberInput below) on the right.
function SettingRow({ icon, iconBg, iconText, label, description, control, divider = true }) {
    return (
        <div className={`px-5 py-4 flex flex-wrap items-center justify-between gap-3 ${divider ? 'border-b border-slate-100' : ''}`}>
            <div className="flex items-start gap-3 min-w-0 max-w-xl">
                <span className={`w-8 h-8 rounded-lg ${iconBg} ${iconText} flex items-center justify-center shrink-0 mt-0.5`}>
                    <Icon name={icon} size={15} />
                </span>
                <div className="min-w-0">
                    <p className="text-sm font-medium text-slate-800">{label}</p>
                    {description && <p className="text-xs text-slate-500 mt-1">{description}</p>}
                </div>
            </div>
            <div className="shrink-0">{control}</div>
        </div>
    );
}

// A numeric setting that actually reads as "a setting", not just a bare text box: locked/read-only
// by default, showing the current value as plain text with a small pencil Edit action next to it -
// exactly the same locked-value-plus-pencil convention Route Plans already uses for its inline
// vehicle reassignment (window.RoutePlansTab's editingVehicleId). Clicking Edit swaps in a real
// number input (auto-focused/selected); nothing commits while typing - only clicking the checkmark
// (or pressing Enter) calls `onCommit` and locks it back, same as that same Route Plans pattern's
// checkmark Save action. Escape (or the small × next to the checkmark) discards the edit and
// reverts to the last saved value without calling onCommit at all. An invalid value on save is
// quietly rejected (reverts to the last good value, stays in edit mode) rather than saving garbage.
function SettingNumberInput({ value, onCommit, min = 0, step = 1, width = 'w-24', prefix, suffix }) {
    const [editing, setEditing] = useState(false);
    const [draft, setDraft] = useState(String(value));
    const inputRef = useRef(null);

    useEffect(() => { if (!editing) setDraft(String(value)); }, [value, editing]);
    useEffect(() => { if (editing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [editing]);

    const startEdit = () => { setDraft(String(value)); setEditing(true); };
    const cancelEdit = () => { setDraft(String(value)); setEditing(false); };
    const commit = () => {
        const num = Number(draft);
        if (!Number.isFinite(num) || num < min) { setDraft(String(value)); return; }
        if (num !== value) onCommit(num);
        setEditing(false);
    };

    if (!editing) {
        return (
            <div className="flex items-center gap-2">
                <span className="text-sm font-semibold text-slate-700 tabular-nums">
                    {prefix}{value}{suffix ? ` ${suffix}` : ''}
                </span>
                <button type="button" onClick={startEdit}
                    className="text-slate-400 hover:text-brandAccent transition shrink-0" aria-label="Edit value">
                    <Icon name="edit" size={13} />
                </button>
            </div>
        );
    }

    return (
        <div className="flex items-center gap-2">
            <div className="relative">
                {prefix && <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">{prefix}</span>}
                <input ref={inputRef} type="number" min={min} step={step} value={draft}
                    onChange={e => setDraft(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') cancelEdit(); }}
                    className={`${width} ${prefix ? 'pl-7' : 'pl-3'} ${suffix ? 'pr-9' : 'pr-3'} py-2 text-sm border border-brandAccent rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30`} />
                {suffix && <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">{suffix}</span>}
            </div>
            <button type="button" onClick={commit}
                className="text-emerald-600 hover:text-emerald-700 transition shrink-0" aria-label="Save value">
                <Icon name="check" size={16} />
            </button>
            <button type="button" onClick={cancelEdit}
                className="text-slate-300 hover:text-red-500 transition shrink-0" aria-label="Cancel edit">
                <Icon name="close" size={14} />
            </button>
        </div>
    );
}

// Compliance Settings, Driver App Settings, and Fleet & Fuel Settings - pulled out of User
// Management into their own tab so admins configuring cross-module behavior aren't hunting for it
// below the admin roster and permissions matrix. Master Admin only by default (same as API
// Management - toggleable to another role via User Management's Role Permissions matrix, unlike
// User Management itself, which is hard-locked); every control here still separately checks
// isMasterAdmin before committing, same as before the move, in case it's ever delegated.
window.ModuleSettingsTab = ({ data, setData }) => {
    const isMasterAdmin = data.currentAdmin.role === 'Master Admin';

    // A backend switch, not a per-role permission, so it lives here rather than the Role Permissions
    // matrix in User Management.
    const toggleRequireChecklist = () => {
        if (!isMasterAdmin) return;
        setData(d => ({
            ...d,
            settings: { ...d.settings, requireInspectionChecklist: !(d.settings?.requireInspectionChecklist !== false) },
        }));
    };

    // Controls whether the Driver App enforces geo-fencing on Start Trip/Mark Trip Complete. This
    // admin panel and the Driver App are two separate files with no shared backend (same story as
    // everywhere else in this project - see the file-level comments in ACT Driver Prototype.html),
    // so the setting is bridged through localStorage under a shared key rather than a real API call.
    // That works automatically when both apps are served from the same origin (e.g. a local dev
    // server hosting both files) - a 'storage' event fires in the Driver App's tab the moment this
    // fires here. Opened as two separate file:// documents instead, each gets its own isolated
    // storage, so the Driver App just falls back to its own local default (geo-fencing on) rather
    // than silently doing nothing.
    const GEOFENCING_STORAGE_KEY = 'kheloTechGeoFencingEnabled';
    const toggleGeoFencing = () => {
        if (!isMasterAdmin) return;
        setData(d => {
            const next = !(d.settings?.geoFencingEnabled !== false);
            try { localStorage.setItem(GEOFENCING_STORAGE_KEY, String(next)); } catch (e) { /* storage unavailable - the toggle still updates this admin session's own data either way */ }
            return { ...d, settings: { ...d.settings, geoFencingEnabled: next } };
        });
    };

    // Feeds window.estimateTripCost's fuel half, which every cost figure in Travel Plans (and the
    // auto-assign confirm popup) reads from. Segregated by fuel type (Petrol vs Diesel track
    // different market prices) rather than one flat number. Driver cost is set per driver instead,
    // on the Drivers sub-tab in Vendors & Fleet.
    const updateFuelPrice = (fuelType, value) => {
        if (!isMasterAdmin) return;
        const price = Number(value);
        const key = fuelType === 'Petrol' ? 'petrolPricePerLiter' : 'dieselPricePerLiter';
        setData(d => ({ ...d, settings: { ...d.settings, [key]: Number.isFinite(price) ? price : d.settings?.[key] } }));
    };

    // Fix-list section F - the six constants that used to be literals, now real settings. Three
    // (roadDistanceFactor, avgRoadSpeedKmh, geofenceRadiusKm) are also bridged to the Driver App via
    // localStorage, same mechanism and same caveats as GEOFENCING_STORAGE_KEY above - works live
    // when both apps share an origin, otherwise the Driver App just falls back to its own local
    // default. The other three (livePollingIntervalSec, pocOverlapWindowHours, documentExpiryDays/
    // contractRenewalDays/unassignedPlanHours) are admin-only, read straight off data.settings
    // wherever they're used.
    const DRIVER_APP_BRIDGE_KEYS = {
        roadDistanceFactor: 'kheloTechRoadDistanceFactor',
        avgRoadSpeedKmh: 'kheloTechAvgRoadSpeedKmh',
        geofenceRadiusKm: 'kheloTechGeofenceRadiusKm',
    };
    const updateNumericSetting = (key, value, { min = 0 } = {}) => {
        if (!isMasterAdmin) return;
        const num = Number(value);
        if (!Number.isFinite(num) || num < min) return;
        setData(d => {
            const bridgeKey = DRIVER_APP_BRIDGE_KEYS[key];
            if (bridgeKey) {
                try { localStorage.setItem(bridgeKey, String(num)); } catch (e) { /* storage unavailable - this admin session's own data still updates either way */ }
            }
            return { ...d, settings: { ...d.settings, [key]: num } };
        });
        // roadDistanceFactor/avgRoadSpeedKmh feed window.DISTANCE_MATRIX (fix-list items 51/52) - a
        // stale precomputed table would otherwise keep answering with the old numbers until reload.
        if (key === 'roadDistanceFactor' || key === 'avgRoadSpeedKmh') {
            window.ROAD_DISTANCE_FACTOR = key === 'roadDistanceFactor' ? num : window.ROAD_DISTANCE_FACTOR;
            window.AVG_ROAD_SPEED_KMH = key === 'avgRoadSpeedKmh' ? num : window.AVG_ROAD_SPEED_KMH;
            window.rebuildDistanceMatrix();
        }
    };

    return (
        <div className="max-w-4xl mx-auto animate-in">
            <div className="mb-6">
                <h2 className="text-lg font-semibold text-slate-800">Module Settings</h2>
                <p className="text-sm text-slate-500">Cross-module behavior - compliance, the driver app, fleet/fuel pricing, distance estimation, and notification thresholds</p>
            </div>

            {isMasterAdmin ? (
                <>
                    <Card title="Compliance Settings">
                        <SettingRow icon="compliance" iconBg="bg-amber-50" iconText="text-amber-600" divider={false}
                            label="Require Inspection Checklist Before Approval/Rejection"
                            description="When on (default), Compliance & Inspection's Approve/Reject confirmation won't submit until the checklist is completed. Switching this off lets any inspector approve or reject straight away, bypassing the checklist for every pending inspection - use it for fast-tracked or manually-verified cases."
                            control={<ToggleSwitch checked={data.settings?.requireInspectionChecklist !== false}
                                onChange={toggleRequireChecklist} label="Require Inspection Checklist Before Approval/Rejection" />} />
                    </Card>

                    <Card title="Driver App Settings" className="mt-6">
                        <SettingRow icon="travel" iconBg="bg-blue-50" iconText="text-brandAccent"
                            label="Geo-fencing for Trip Start/End"
                            description="When on (default), a driver can only tap Start Trip once they're physically within the designated pickup radius, and Mark Trip Complete once they're within the drop-off radius - checked against their device's location. Switching this off lets drivers start/end trips from anywhere, for venues or devices where location access is unreliable."
                            control={<ToggleSwitch checked={data.settings?.geoFencingEnabled !== false}
                                onChange={toggleGeoFencing} label="Geo-fencing for Trip Start/End" />} />
                        {/* Fix-list item 53 - was a literal 300m/GEOFENCE_RADIUS_KM in the Driver
                            Prototype (actually 500m, per that file's own comment); real Master-Admin
                            setting now, bridged over localStorage same as the toggle above. */}
                        <SettingRow icon="travel" iconBg="bg-indigo-50" iconText="text-indigo-600" divider={false}
                            label="Geofence Radius (meters)"
                            description="How close a driver's device has to be to the pickup/drop-off point for Start Trip/Mark Trip Complete to go through, when geo-fencing above is on."
                            control={<SettingNumberInput value={Math.round((data.settings?.geofenceRadiusKm ?? 0.5) * 1000)}
                                onCommit={meters => updateNumericSetting('geofenceRadiusKm', meters / 1000, { min: 0.01 })}
                                min={50} step={50} suffix="m" />} />
                    </Card>

                    <Card title="Fleet & Fuel Settings" className="mt-6">
                        <div className="px-5 pt-4 pb-1">
                            <p className="text-xs text-slate-500">
                                Feeds the fuel half of Estimated Cost in Travel Plans - each vehicle's category fuel type (Petrol or
                                Diesel) picks which price applies. Driver cost is set per driver instead, on the Drivers sub-tab in
                                Vendors & Fleet.
                            </p>
                        </div>
                        <SettingRow icon="droplet" iconBg="bg-emerald-50" iconText="text-emerald-600"
                            label="Petrol Price (₹ per liter)"
                            control={<SettingNumberInput value={data.settings?.petrolPricePerLiter ?? 0}
                                onCommit={v => updateFuelPrice('Petrol', v)} min={0} step={0.5} width="w-28" prefix="₹" />} />
                        <SettingRow icon="droplet" iconBg="bg-slate-100" iconText="text-slate-500" divider={false}
                            label="Diesel Price (₹ per liter)"
                            control={<SettingNumberInput value={data.settings?.dieselPricePerLiter ?? 0}
                                onCommit={v => updateFuelPrice('Diesel', v)} min={0} step={0.5} width="w-28" prefix="₹" />} />
                    </Card>

                    <Card title="Live Ops Settings" className="mt-6">
                        {/* Was "Estimation & Live Ops Settings" - renamed since Road Distance Factor and
                            Average Road Speed (fix-list items 51/52) are deliberately NOT rendered here
                            anymore, the user asked to hide them from this screen since the
                            straight-line-times-a-multiplier mechanism behind them is more than a demo
                            audience needs to be walked through. The settings themselves are untouched:
                            data.settings.roadDistanceFactor/avgRoadSpeedKmh still exist with their same
                            defaults (1.35 / 25), updateNumericSetting below still special-cases both keys
                            to push into window.ROAD_DISTANCE_FACTOR/AVG_ROAD_SPEED_KMH and rebuild
                            window.DISTANCE_MATRIX, and every distance/duration estimate app-wide still
                            reads from that table exactly as before. Only the two input rows that let an
                            admin retune them (and this card's old title, which named them) are gone. To
                            bring them back, re-add a SettingRow/SettingNumberInput pair (mirroring the
                            rows below) bound to updateNumericSetting, and restore the old title - nothing
                            else needs to change. */}
                        {/* Fix-list item 54 - the SLA a Critical-priority SOS alert is treated
                            against; stands in for the interval a real backend poll would run on. */}
                        <SettingRow icon="clock" iconBg="bg-blue-50" iconText="text-brandAccent"
                            label="Live Tracking / SOS Polling Interval (seconds)"
                            description="How often a moving vehicle's position and progress refresh on screen, and the target response time for a Critical-priority SOS alert."
                            control={<SettingNumberInput value={data.settings?.livePollingIntervalSec ?? 4}
                                onCommit={v => updateNumericSetting('livePollingIntervalSec', v, { min: 1 })} min={1} step={1} suffix="sec" />} />
                        {/* Fix-list item 55 - was POC_OVERLAP_WINDOW_HOURS, a literal in Travel
                            Plans; a real setting now, read by plansShareOverlappingPoc. */}
                        <SettingRow icon="users" iconBg="bg-violet-50" iconText="text-violet-600" divider={false}
                            label="Point of Contact Overlap Window (hours)"
                            description="How close together two Travel Plans have to be, sharing the same Point of Contact, before Travel Plans warns they might be double-booked."
                            control={<SettingNumberInput value={data.settings?.pocOverlapWindowHours ?? 3}
                                onCommit={v => updateNumericSetting('pocOverlapWindowHours', v, { min: 0 })} min={0} step={0.5} suffix="hrs" />} />
                    </Card>

                    <Card title="Notification Thresholds" className="mt-6">
                        {/* Fix-list item 56 - the three N values the Notification System's trigger
                            matrix used to refer to with no number pinned on any of them. */}
                        <div className="px-5 pt-4 pb-1">
                            <p className="text-xs text-slate-500">
                                Operations-owned figures in the real system - reasonable placeholders to keep building
                                against, not approved thresholds.
                            </p>
                        </div>
                        <SettingRow icon="compliance" iconBg="bg-amber-50" iconText="text-amber-600"
                            label="Document Expiry Warning (days)"
                            control={<SettingNumberInput value={data.settings?.documentExpiryDays ?? 14}
                                onCommit={v => updateNumericSetting('documentExpiryDays', v, { min: 1 })} min={1} step={1} suffix="days" />} />
                        <SettingRow icon="building" iconBg="bg-amber-50" iconText="text-amber-600"
                            label="Vendor Contract Renewal Warning (days)"
                            control={<SettingNumberInput value={data.settings?.contractRenewalDays ?? 30}
                                onCommit={v => updateNumericSetting('contractRenewalDays', v, { min: 1 })} min={1} step={1} suffix="days" />} />
                        <SettingRow icon="alert" iconBg="bg-amber-50" iconText="text-amber-600" divider={false}
                            label="Unassigned Plan Approaching (hours)"
                            control={<SettingNumberInput value={data.settings?.unassignedPlanHours ?? 6}
                                onCommit={v => updateNumericSetting('unassignedPlanHours', v, { min: 1 })} min={1} step={1} suffix="hrs" />} />
                    </Card>
                </>
            ) : (
                // Reachable at all only if a Master Admin delegates this tab to another role via the
                // Role Permissions matrix (it isn't hard-locked the way User Management is) - every
                // control above still refuses to commit for a non-Master-Admin regardless, so this is
                // just an honest "nothing to show" rather than a blank page.
                <Card><p className="px-5 py-10 text-center text-slate-400 text-sm">Module Settings is Master-Admin-only right now.</p></Card>
            )}
        </div>
    );
};

</script>
<script type="text/babel">
/* global React, ReactDOM, INITIAL_DATA, NAV_ITEMS, Icon, Btn, Modal, DashboardTab, LiveFleetTrackingTab, VendorsTab, InventoryManagementTab, RoutePlansTab, TravelPlansTab, ComplianceTab, FleetEstimationTab, NotificationsTab, AdminTab, RoleManagementTab, ModuleSettingsTab */
const { useState, useEffect } = React;

const TAB_MAP = {
    'Dashboard': DashboardTab,
    'Live Fleet Tracking': LiveFleetTrackingTab,
    'Vendors & Fleet': VendorsTab,
    'Inventory Management': InventoryManagementTab,
    'Route Plans': RoutePlansTab,
    'Travel Plans': TravelPlansTab,
    'Compliance & Inspection': ComplianceTab,
    'Fleet Estimation': FleetEstimationTab,
    'Notifications': NotificationsTab,
    'User Management': AdminTab,
    'Module Settings': ModuleSettingsTab,
};

// User Management is the one nav item with its own sub-navigation - Users | Role, shown as a small
// indented tree in the sidebar only while User Management is the active tab (see App()'s nav
// rendering below). Users is TAB_MAP's own AdminTab (the roster built out so far, labeled "Users"
// here though the tab key/component are unchanged); Role is a placeholder (window.RoleManagementTab)
// for now. Industry and Institution sub-sections briefly existed alongside these and were removed.
const USER_MGMT_SUBTABS = ['Users', 'Role'];
const USER_MGMT_SUBTAB_COMPONENTS = { 'Users': AdminTab, 'Role': RoleManagementTab };

function LoginScreen({ onLogin }) {
    const [email, setEmail] = useState('shubham.das@transportmanagement.in');
    const admins = INITIAL_DATA.admins.filter(a => a.status === 'Active');

    const login = () => {
        const admin = admins.find(a => a.email === email);
        if (!admin) return alert('Admin not found or inactive.');
        onLogin({ id: admin.id, name: admin.name, role: admin.role, email: admin.email, vehicleTypeScope: admin.vehicleTypeScope || null });
    };

    return (
        <div className="min-h-screen bg-canvasLight flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
                <h1 className="text-2xl font-bold text-slate-800">Transport <span className="text-brandAccent">Management</span></h1>
                <p className="text-sm text-slate-500 mt-1 mb-6">Travel Admin Panel - Sign in to continue</p>
                <label className="block text-xs font-medium text-slate-500 mb-1">Select Admin Account</label>
                <select value={email} onChange={e => setEmail(e.target.value)}
                    className="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-lg mb-4 focus:ring-2 focus:ring-brandAccent/30 focus:outline-none">
                    {/* Vehicle-type-scoped Compliance Officers show their scope right in the picker,
                        so which of the four test accounts sees what is obvious before even logging in. */}
                    {admins.map(a => <option key={a.id} value={a.email}>{a.name} - {a.role}{a.vehicleTypeScope ? ` (${a.vehicleTypeScope})` : ''}</option>)}
                </select>
                <Btn className="w-full py-2.5" onClick={login}>Sign In</Btn>
                <p className="text-xs text-slate-400 text-center mt-4">Multiple admins can work concurrently</p>
            </div>
        </div>
    );
}

function App() {
    const [loggedIn, setLoggedIn] = useState(null);
    const [activeTab, setActiveTab] = useState('Dashboard');
    // Which of User Management's own sub-sections is showing - only meaningful while
    // activeTab === 'User Management' (see USER_MGMT_SUBTABS/USER_MGMT_SUBTAB_COMPONENTS above).
    const [activeSubTab, setActiveSubTab] = useState('Users');
    const [sidebarOpen, setSidebarOpen] = useState(false);
    const [sosModalOpen, setSosModalOpen] = useState(false);
    const [data, setData] = useState(() => JSON.parse(JSON.stringify(INITIAL_DATA)));
    const [clock, setClock] = useState('');

    useEffect(() => {
        const tick = () => setClock(new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }));
        tick();
        const id = setInterval(tick, 30000);
        return () => clearInterval(id);
    }, []);

    useEffect(() => {
        if (loggedIn) {
            setData(d => ({
                ...d,
                currentAdmin: loggedIn,
                activeAdmins: d.activeAdmins.some(a => a.id === loggedIn.id)
                    ? d.activeAdmins.map(a => a.id === loggedIn.id ? { ...a, tab: activeTab, lastActive: 'Just now' } : a)
                    : [...d.activeAdmins, { id: loggedIn.id, name: loggedIn.name, role: loggedIn.role, lastActive: 'Just now', tab: activeTab }],
            }));
        }
    }, [activeTab, loggedIn]);

    // Modules this session's role is permitted into. An unrecognized role (e.g. a custom string from
    // a CSV import) falls back to Dashboard only, rather than being silently granted nothing to see.
    const allowedTabs = loggedIn ? (data.permissions[loggedIn.role] || ['Dashboard']) : [];

    // If the active tab isn't (or is no longer) permitted for this role - right after logging in as
    // someone else, or because a Master Admin just revoked access to whatever's open - snap back to
    // the first module this role can actually see.
    useEffect(() => {
        if (loggedIn && !allowedTabs.includes(activeTab)) {
            setActiveTab(allowedTabs[0] || 'Dashboard');
        }
    }, [loggedIn, data.permissions, activeTab]);

    if (!loggedIn) return <LoginScreen onLogin={setLoggedIn} />;

    const visibleNavItems = NAV_ITEMS.filter(item => allowedTabs.includes(item.label));
    // User Management resolves through its own sub-tab instead of straight off TAB_MAP - everything
    // else is unaffected.
    const ActiveComponent = !allowedTabs.includes(activeTab) ? null
        : activeTab === 'User Management' ? (USER_MGMT_SUBTAB_COMPONENTS[activeSubTab] || AdminTab)
        : TAB_MAP[activeTab];
    const unreadCount = data.notifications.filter(n => !n.read).length;
    const activeSOSCount = data.sosAlerts.filter(s => s.status === 'Active').length;

    const logout = () => {
        setData(d => ({ ...d, activeAdmins: d.activeAdmins.filter(a => a.id !== loggedIn.id) }));
        setLoggedIn(null);
    };

    // SOS alerts live in this header popup now, not a Dashboard banner - the SOS button opens it
    // directly, no page navigation needed. Resolving clears the alert and the underlying
    // assignment's sos flag (dropping it to Delayed, same as the old Dashboard/Fleet Tracking banners).
    const resolveSOS = (id) => {
        setData(d => ({
            ...d,
            sosAlerts: d.sosAlerts.map(s => s.id === id ? { ...s, status: 'Resolved' } : s),
            assignments: d.assignments.map(a => a.sos ? { ...a, sos: false, status: 'Delayed' } : a),
        }));
    };

    return (
        // "DRIBBBLE 1 REF" shell - light sidebar with a black active-item pill, straight from the
        // reference - but running edge-to-edge/full viewport rather than floating as an inset card.
        // (The floating-card treatment was tried first and made the app look like it was rendering
        // inside a smaller frame/tab instead of taking the whole screen, so it was dropped in favor
        // of the same full-bleed h-screen shell the app used before this reskin.)
        <div className="h-screen w-full bg-white flex overflow-hidden">
            {sidebarOpen && <div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

            <aside className={`fixed lg:static inset-y-0 left-0 w-64 bg-white text-slate-500 flex flex-col z-40 transform transition-transform border-r border-slate-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                <div className="h-16 flex items-center justify-between px-5 border-b border-slate-200">
                    <div className="flex items-center gap-2">
                        <span className="w-7 h-7 rounded-lg bg-slate-900 text-white flex items-center justify-center shrink-0"><Icon name="fleet" size={14} /></span>
                        <span className="text-slate-900 font-bold text-sm">Transport Management</span>
                    </div>
                    <button className="lg:hidden text-slate-400" onClick={() => setSidebarOpen(false)}><Icon name="close" size={20} /></button>
                </div>

                {/* Which event this deployment is running for - every TMS/Accommodation-sourced
                    record in the app is scoped to this (window.belongsToActiveProject). A single
                    label today since there's only one project; the strip is here so a project
                    switcher has an obvious home once there's a second one to switch to. */}
                <div className="px-5 py-2 border-b border-slate-200 bg-slate-50 flex items-center gap-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-brandAccent shrink-0" />
                    <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Project</span>
                    <span className="text-xs font-semibold text-slate-700 ml-auto truncate">{data.activeProject}</span>
                </div>

                <nav className="flex-1 overflow-y-auto py-3 px-2">
                    {visibleNavItems.map(({ label, icon }) => {
                        // User Management is the one nav item with its own sub-navigation
                        // (USER_MGMT_SUBTABS) - it expands into Users/Role right under it, but
                        // only while it's the active tab, same as the ATOM reference this is
                        // modeled on.
                        const isUserMgmt = label === 'User Management';
                        const expanded = isUserMgmt && activeTab === label;
                        return (
                            <React.Fragment key={label}>
                                <button onClick={() => { setActiveTab(label); setSidebarOpen(false); }}
                                    className={`w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-xl mb-0.5 transition ${activeTab === label ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900'}`}>
                                    <Icon name={icon} size={18} />
                                    <span className="flex-1 text-left">{label}</span>
                                    {label === 'Notifications' && unreadCount > 0 && (
                                        <span className="bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{unreadCount}</span>
                                    )}
                                    {isUserMgmt && (
                                        <Icon name="chevronDown" size={14} className={`shrink-0 transition-transform ${expanded ? 'rotate-180' : ''}`} />
                                    )}
                                </button>
                                {expanded && (
                                    <div className="relative ml-6 border-l border-slate-200 mb-1">
                                        {USER_MGMT_SUBTABS.map(sub => (
                                            <div key={sub} className="relative">
                                                <span className="absolute left-0 top-1/2 -translate-y-1/2 w-3 h-px bg-slate-200" />
                                                <button onClick={() => { setActiveSubTab(sub); setSidebarOpen(false); }}
                                                    className={`w-full text-left pl-6 pr-3 py-2 text-sm rounded-lg transition ${activeSubTab === sub ? 'bg-violet-50 text-brandAccent font-medium' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900'}`}>
                                                    {sub}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </React.Fragment>
                        );
                    })}
                </nav>

                <div className="p-4 border-t border-slate-200">
                    <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-full bg-gradient-to-br from-brandAccent to-indigo-700 flex items-center justify-center text-white text-xs font-bold">
                            {loggedIn.name.split(' ').map(n => n[0]).join('')}
                        </div>
                        <div className="flex-1 min-w-0">
                            <p className="text-slate-800 text-sm font-medium truncate">{loggedIn.name}</p>
                            <p className="text-slate-400 text-xs truncate">{loggedIn.role}</p>
                        </div>
                    </div>
                    {/* bg-slate-50 (not just a border) so this reads as a button at rest, not bare text
                        with an almost-invisible outline - the same fix as Btn's outline variant above. */}
                    <button onClick={logout} className="w-full mt-3 py-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-50 hover:bg-slate-100 border border-slate-300 hover:border-slate-400 rounded-full transition">Logout</button>
                </div>
            </aside>

            <div className="flex-1 flex flex-col overflow-hidden min-w-0">
                <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 shrink-0">
                    <div className="flex items-center gap-3">
                        <button className="lg:hidden p-2 text-slate-500" onClick={() => setSidebarOpen(true)}><Icon name="menu" size={22} /></button>
                        {clock && (
                            <p className="text-sm text-slate-500 flex items-center gap-1.5">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0" />
                                Live  |  {clock} IST  |  {data.activeAdmins.length} admins online
                            </p>
                        )}
                    </div>
                    <div className="flex items-center gap-2">
                        {allowedTabs.includes('Dashboard') && (
                            <button
                                className={`relative px-2.5 py-1.5 rounded-full text-xs font-extrabold tracking-wide transition ${activeSOSCount > 0 ? 'text-white bg-red-600 hover:bg-red-700' : 'text-slate-400 hover:text-slate-600 hover:bg-slate-50'}`}
                                onClick={() => setSosModalOpen(true)} aria-label="SOS alerts">
                                SOS
                                {activeSOSCount > 0 && (
                                    <span className="absolute -top-1.5 -right-1.5 min-w-[16px] h-4 px-1 bg-white text-red-600 text-[10px] font-bold rounded-full flex items-center justify-center ring-2 ring-red-600 sos-pulse">
                                        {activeSOSCount}
                                    </span>
                                )}
                            </button>
                        )}
                        {allowedTabs.includes('Notifications') && (
                            <button className="relative p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-50" onClick={() => setActiveTab('Notifications')}>
                                <Icon name="bell" size={20} />
                                {unreadCount > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white" />}
                            </button>
                        )}
                    </div>
                </header>

                {/* bg-slate-100 (not the near-invisible slate-50/50) - the whole point of this tint is
                    to separate the page canvas from the white cards sitting on it; at 50% opacity of
                    an already-pale color there wasn't enough contrast left to do that. */}
                <main className="flex-1 overflow-y-auto p-4 lg:p-8 bg-slate-100">
                    {ActiveComponent ? (
                        <ActiveComponent
                            data={data}
                            setData={setData}
                            setActiveTab={setActiveTab}
                            onLogout={logout}
                        />
                    ) : (
                        <div className="max-w-md mx-auto text-center py-20">
                            <div className="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-4">
                                <Icon name="lock" size={26} />
                            </div>
                            <p className="font-semibold text-slate-700 text-lg mb-1">No modules assigned</p>
                            <p className="text-sm text-slate-500">Your role ({loggedIn.role}) doesn't have access to any module yet. Ask your Master Admin to grant permissions from User Management.</p>
                        </div>
                    )}
                </main>
            </div>

            {/* SOS popup - opened from the SOS button in the header, replacing the old Dashboard/Fleet
                Tracking banners. Self-contained: works from any tab, no navigation needed. */}
            <Modal open={sosModalOpen} onClose={() => setSosModalOpen(false)} title="Active SOS Alerts">
                <div className="space-y-3">
                    {activeSOSCount === 0 && (
                        <p className="text-sm text-slate-400 text-center py-6">No active SOS alerts right now.</p>
                    )}
                    {data.sosAlerts.filter(s => s.status === 'Active').map(s => (
                        <div key={s.id} className="bg-red-50 border border-red-200 rounded-xl p-4 flex flex-wrap justify-between items-center gap-3 sos-pulse">
                            <div className="flex gap-3">
                                <Icon name="alert" size={20} className="text-red-500 mt-0.5 shrink-0" />
                                <div>
                                    <p className="font-semibold text-red-800 text-sm">SOS - {s.vehicleId}  |  {s.driver}</p>
                                    <p className="text-xs text-red-600">{s.location}  |  Reported {s.reportedAt}</p>
                                </div>
                            </div>
                            <Btn variant="danger" onClick={() => resolveSOS(s.id)} className="shrink-0">Mark Resolved</Btn>
                        </div>
                    ))}
                </div>
            </Modal>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
