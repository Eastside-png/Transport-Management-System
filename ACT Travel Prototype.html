        // reference's soft indigo/lavender, and canvasLight is the pale lavender backdrop the whole
        // app now floats on. Both are used pervasively (buttons, links, focus rings, badges, the map
        // pins) so this one config change is most of the color shift on its own.
        // card/cardHover strengthened from their original 0.06/0.08 opacity - too faint to read as a
        // real boundary once the borders using them were also this pale, which is exactly what made
        // every white card blend into the page instead of looking like a distinct box.
        tailwind.config = { theme: { extend: { colors: { brandBlue: '#0F172A', brandAccent: '#7C6FEA', bgLight: '#F8FAFC', canvasLight: '#EDEAFB' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }, boxShadow: { card: '0 1px 2px 0 rgb(15 23 42 / 0.05), 0 1px 3px 0 rgb(15 23 42 / 0.12)', cardHover: '0 4px 12px 0 rgb(15 23 42 / 0.16)' } } } };

<script type="text/babel">
/* global window, LOCATION_REGISTRY, INITIAL_DATA */
window.exportCSV = (filename, rows) => {
    if (!rows.length) return alert('No data to export.');
    const headers = Object.keys(rows[0]);
    const csv = [headers.join(','), ...rows.map(r => headers.map(h => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
};

// A blank starter template for an Import button - just the header row a given import actually reads
// (see each handleImport's own field list), no data rows. Deliberately its own function rather than
// calling window.exportCSV with one blank row: exportCSV derives headers from real data, so there'd
// be no way to hand it a header list that isn't backed by an actual row - and every value would come
// back quoted for nothing, since there's nothing here that could ever contain a comma to escape.
window.downloadSampleCSV = (filename, headers) => {
    const blob = new Blob([headers.join(',')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
};

// Splits one CSV line into fields, handling both quoted values (with embedded commas and ""-escaped
// quotes - what window.exportCSV itself produces) and plain unquoted ones (what Excel/Google Sheets
// produce by default) character by character. The previous approach - line.match(/regex/g) - looked
// reasonable but actually returned twice as many entries as there were real fields: a global regex
// whose alternatives can both match an empty string (like [^,]*) emits a spurious "" match at every
// comma position (and one more at end-of-line) in addition to each real value, silently shifting
// every field after the first one over by a slot. That's the whole reason CSV re-imports (including
// an admin's own file exported moments earlier from this app) were coming back with the first column
// right and everything after it empty or wrong.
function splitCsvLine(line) {
    const vals = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (inQuotes) {
            if (c === '"') {
                if (line[i + 1] === '"') { cur += '"'; i++; } // escaped "" inside a quoted field
                else inQuotes = false;
            } else {
                cur += c;
            }
        } else if (c === '"') {
            inQuotes = true;
        } else if (c === ',') {
            vals.push(cur.trim());
            cur = '';
        } else {
            cur += c;
        }
    }
    vals.push(cur.trim());
    return vals;
}

window.importCSV = (file, onLoad) => {
    const reader = new FileReader();
    reader.onload = (e) => {
        // Excel/Sheets exports use CRLF line endings - split on any of \r\n, \r, or \n rather than
        // just \n, and drop any blank trailing lines that leaves behind.
        const lines = e.target.result.trim().split(/\r\n|\r|\n/).filter(l => l.trim() !== '');
        if (lines.length < 2) return alert('CSV must have a header row and at least one data row.');
        const headers = splitCsvLine(lines[0]);
        const rows = lines.slice(1).map(line => {
            const vals = splitCsvLine(line);
            const obj = {};
            headers.forEach((h, i) => { obj[h] = vals[i] || ''; });
            return obj;
        });
        onLoad(rows);
    };
    reader.readAsText(file);
};

window.calcVehiclesRequired = (users, capacity) => capacity > 0 ? Math.ceil(Number(users) / capacity) : 0;

window.uid = (prefix) => `${prefix}-${Date.now().toString(36).toUpperCase()}`;

window.posAlongRoute = (from, to, progress) => {
    const t = Math.max(0, Math.min(100, progress)) / 100;
    return [from[0] + (to[0] - from[0]) * t, from[1] + (to[1] - from[1]) * t];
};

// Plain name -> [lat, lng] lookup, derived from window.LOCATION_REGISTRY (set before INITIAL_DATA,
// first script block) rather than a second hand-typed coordinate table - the two used to be
// independent literals that could (and did, per the earlier line-by-line review) only stay in sync
// by discipline. Every existing consumer (posAlongRoute, the DISTANCE_MATRIX build below) keeps
// working unchanged against this same [lat, lng] shape.
window.LOCATION_COORDS = Object.fromEntries(LOCATION_REGISTRY.map(l => [l.name, [l.lat, l.lng]]));

// Looks up a location's category (airport/station/venue/hotel) straight off the registry - e.g. for
// UI that wants to group or icon Origin/Destination options by kind without re-deriving it.
window.locationType = (name) => LOCATION_REGISTRY.find(l => l.name === name)?.type || null;

// Great-circle distance between two [lat, lng] points, in kilometers (haversine formula).
window.haversineKm = ([lat1, lng1], [lat2, lng2]) => {
    const R = 6371;
    const toRad = (deg) => deg * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
};

// There's no routing engine wired up in this prototype (the map draws straight polylines between
// points - no Google Directions/OSRM integration), so both distance and duration are estimated from
// straight-line distance: ROAD_DISTANCE_FACTOR inflates the great-circle distance to approximate
// how much longer real streets are than "as the crow flies", and AVG_ROAD_SPEED_KMH converts that
// estimated road distance into a duration assuming one constant average speed for the whole trip
// (mixed event-city urban traffic, signals, congestion). Both are rough, tunable placeholders, not
// measured data - fix-list items 51/52, now real window.* values a Master Admin can retune from
// Module Settings (window.ModuleSettingsTab) instead of literals baked into this script. `window.`
// (not `const`) specifically so reassigning them here and calling rebuildDistanceMatrix below is
// enough for every existing bare reference elsewhere in this file (vehicleTotalKmDriven included) to
// pick up the new value immediately - nothing else needs to change to react to a retuned setting.
window.ROAD_DISTANCE_FACTOR = 1.35; // straight-line -> road-distance multiplier
window.AVG_ROAD_SPEED_KMH = 25;     // assumed average urban speed incl. traffic/signals

// A distance matrix: an N x N lookup table of distance/duration between every pair of known
// locations. Built via this function (fix-list items 51/52 - was a one-shot IIFE, now callable again
// whenever Module Settings changes ROAD_DISTANCE_FACTOR/AVG_ROAD_SPEED_KMH) so every later lookup
// stays an O(1) two-key object read instead of recomputing trig on every render. Keyed
// [originName][destName] in both directions (haversine is symmetric).
window.rebuildDistanceMatrix = () => {
    const names = Object.keys(LOCATION_COORDS);
    const matrix = {};
    names.forEach(from => {
        matrix[from] = {};
        names.forEach(to => {
            if (from === to) { matrix[from][to] = { distanceKm: 0, durationMin: 0 }; return; }
            const roadKm = haversineKm(LOCATION_COORDS[from], LOCATION_COORDS[to]) * ROAD_DISTANCE_FACTOR;
            matrix[from][to] = {
                distanceKm: Math.round(roadKm * 10) / 10,
                durationMin: Math.round(roadKm / AVG_ROAD_SPEED_KMH * 60),
            };
        });
    });
    window.DISTANCE_MATRIX = matrix;
};
window.rebuildDistanceMatrix();

// Safe two-key lookup - returns null (never throws) when either name is blank or isn't a known
// location, so callers can treat "nothing selected yet" and "unknown location" identically.
window.lookupDistance = (origin, destination) => {
    if (!origin || !destination) return null;
    const row = DISTANCE_MATRIX[origin];
    return (row && row[destination]) || null;
};

// Shared caption formatter so every modal/table renders distance+duration identically.
window.distanceCaption = (origin, destination) => {
    const d = lookupDistance(origin, destination);
    return d ? `≈ ${d.distanceKm} km · ~${d.durationMin} min` : null;
};

// A trip's estimated total duration in minutes, from the same distance/duration estimate everything
// else uses (window.lookupDistance) - falls back to a flat default when either endpoint isn't a
// recognized location (an assignment's `route` string is occasionally something looser, not a clean
// "A -> B" of two known location names).
const DEFAULT_TRIP_DURATION_MIN = 30;
window.estimatedTripDurationMin = (routeStr) => {
    const [origin, destination] = (routeStr || '').split(' -> ');
    return lookupDistance(origin, destination)?.durationMin || DEFAULT_TRIP_DURATION_MIN;
};

// A trip's live progress (fix-list items 65/66), derived fresh from a stored start timestamp and
// estimated duration rather than a ticked, stored counter. Deterministic - the same assignment
// computes the same progress at the same wall-clock moment everywhere, not a separate value per
// open browser tab - and immune to freezing when nothing's open to tick it: the next render,
// whenever that happens, computes the correct value for right now, not a stale one resumed from
// wherever a missed interval left off. Falls back to whatever `progress` is already stored for an
// assignment that predates this or was never started via startedAt, so nothing breaks.
window.derivedProgress = (assignment) => {
    // A 'past' assignment always reads back its own stored value - its clock is done, not still
    // computing forward past whatever startedAt/estimatedDurationMin it was given.
    if (assignment.phase === 'past' || !assignment.startedAt || !assignment.estimatedDurationMin) return assignment.progress ?? 0;
    const elapsedMin = (Date.now() - assignment.startedAt) / 60000;
    return Math.max(0, Math.min(100, Math.round((elapsedMin / assignment.estimatedDurationMin) * 100)));
};

// Mocked flight/train "Live Status" lookup, keyed off exactly what a real integration would use -
// PNR + transport number (see the "Travel API Integration and PNR Tracking" exploration: a real
// version would call a flight-status API like Aviationstack by flight number/date, and an IRCTC PNR
// aggregator by PNR, since airline PNRs aren't publicly queryable for flight status the way train
// PNRs are for running status). No backend exists in this prototype to hold real API keys or make
// that call, so this stands in for it - same "estimate/simulate since no real API" approach as
// window.DISTANCE_MATRIX above. Deterministic on (mode, transportNumber, pnrNumber, nonce) - same
// inputs always give the same result, so a render doesn't flicker between different statuses on its
// own. `nonce` is what a "Refresh Status" click bumps, to simulate polling a live source coming back
// with a new reading. Bus/Car return null - there's no equivalent public tracking API for either.
// Window-scoped (not just local to Travel Plans) so the Dashboard's Arrivals & Departures preview
// resolves the exact same status for the exact same record.
const LIVE_STATUS_POOL = ['On Time', 'Delayed', 'Departed', 'Arrived', 'Cancelled'];
const LIVE_STATUS_WEIGHTS = [40, 28, 16, 11, 5]; // relative - Cancelled deliberately rare
const hashSeed = (str) => { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
window.mockTransportStatus = (mode, transportNumber, pnrNumber, nonce = 0) => {
    if (mode !== 'Flight' && mode !== 'Train') return null;
    if (!transportNumber || !pnrNumber) return null;
    const totalWeight = LIVE_STATUS_WEIGHTS.reduce((a, b) => a + b, 0);
    let r = hashSeed(`${mode}|${transportNumber}|${pnrNumber}|${nonce}`) % totalWeight;
    let status = LIVE_STATUS_POOL[LIVE_STATUS_POOL.length - 1];
    for (let i = 0; i < LIVE_STATUS_POOL.length; i++) {
        if (r < LIVE_STATUS_WEIGHTS[i]) { status = LIVE_STATUS_POOL[i]; break; }
        r -= LIVE_STATUS_WEIGHTS[i];
    }
    const delayMinutes = status === 'Delayed' ? 10 + (hashSeed(`${pnrNumber}|${nonce}|delay`) % 9) * 10 : 0;
    const noun = mode === 'Flight' ? 'Flight' : 'Train';
    const detail = {
        'On Time': `${noun} on schedule`,
        'Delayed': `Running ${delayMinutes} min late`,
        'Departed': `${noun} en route`,
        'Arrived': mode === 'Flight' ? 'Landed' : 'Arrived at station',
        'Cancelled': `${noun} cancelled - contact ${mode === 'Flight' ? 'airline' : 'railway helpline'}`,
    }[status];
    return { status, delayMinutes, detail, updatedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
};

// Vehicle categorization reference: the four fixed capacity classes used across Fleet Estimation,
// Travel Plans capacity math, and vehicle onboarding now all come from one shared list instead of
// drifting independently (the old per-form vehicle-type list even included types - Van, Shuttle -
// that Fleet Estimation had no capacity entry for, silently breaking capacity math if picked).
// `models` are a handful of real-world make/model examples for the specific-vehicle picker
// (Category "Sedan" -> Model "Swift Dzire"); `admins` is a first-pass escort/coordinator staffing
// rule, surfaced as a read-only suggestion for now - see the note below. `avgConsumption` (km per
// liter), `tankCapacity` (liters), and `refuelCycleKm` (recommended distance between refuels) are
// category-level fuel defaults, not per-vehicle fields - real-world mileage varies by specific
// vehicle, but a per-category approximation is enough to drive fuel display and trip-cost estimates
// without needing every single vehicle individually specced. `fuelType` (Petrol/Diesel) is the
// category's default fuel - not currently exposed as its own onboarding field, but it's what picks
// which of User Management's two segregated fuel prices a vehicle's cost estimate uses. Also
// fix-list item 45's vehicle category config table.
window.VEHICLE_CATEGORIES = [
    { type: 'Sedan', capacity: 3, admins: 1, avgConsumption: 15, tankCapacity: 45, refuelCycleKm: 500, fuelType: 'Petrol', models: ['Swift Dzire', 'Honda Amaze', 'Toyota Etios', 'Hyundai Aura', 'Honda City', 'Maruti Ciaz'] },
    { type: 'SUV', capacity: 5, admins: 1, avgConsumption: 12, tankCapacity: 55, refuelCycleKm: 500, fuelType: 'Diesel', models: ['Toyota Innova Crysta', 'Mahindra XUV700', 'Toyota Fortuner', 'Mahindra Scorpio-N', 'Hyundai Creta', 'Tata Safari'] },
    { type: 'Minibus', capacity: 20, admins: 1, avgConsumption: 8, tankCapacity: 90, refuelCycleKm: 400, fuelType: 'Diesel', models: ['Force Traveller', 'Tata Winger', 'Force Urbania', 'Mahindra Supro Van'] },
    { type: 'Bus', capacity: 40, admins: 2, avgConsumption: 4, tankCapacity: 200, refuelCycleKm: 350, fuelType: 'Diesel', models: ['Ashok Leyland Viking', 'Tata Starbus Ultra', 'Eicher Skyline Pro', 'BharatBenz 1617'] },
];
window.vehicleCategoryOf = (type) => VEHICLE_CATEGORIES.find(c => c.type === type) || null;

// Which vehicle type(s) each event stakeholder category is allowed to use - a fixed operational
// rule (not a per-event guess), currently the single source of truth for Fleet Estimation's
// stakeholder rows and their locked vehicle-type columns. Athletes is the only category with more
// than one allowed type (Bus for large squads, Minibus for smaller ones); every other category maps
// to exactly one. Also fix-list item 44's stakeholder-type-to-vehicle-type config table.
window.STAKEHOLDER_VEHICLE_MAP = {
    'Athletes': ['Bus', 'Minibus'],
    'Technical Officials': ['SUV'],
    'Chef de Mission (CDM)': ['Sedan'],
    'Competition Manager (CM)': ['Sedan'],
    'Games Technical Conduct Committee (GTCC)': ['Sedan'],
    'Volunteers': ['Minibus'],
    'Host State Government / Sports Authority': ['Sedan'],
};
window.STAKEHOLDER_TYPES = Object.keys(STAKEHOLDER_VEHICLE_MAP);

// Resolves a stakeholder category (+ headcount, since Athletes has two allowed types) down to the
// one vehicle type Travel Plans should actually suggest - the smallest of its mapped type(s) that
// still fits the whole group in a single vehicle, falling back to the largest mapped type when the
// group is too big for any single one of them (multi-vehicle splitting then takes over as usual).
// Powers the "Stakeholder Type" picker in Create Route Plan / Suggested Plans - once a demand is
// tagged with a category, this replaces whatever preferredVehicle it came in with.
window.suggestedVehicleType = (stakeholderType, headcount) => {
    const options = STAKEHOLDER_VEHICLE_MAP[stakeholderType];
    if (!options || options.length === 0) return null;
    const sorted = options
        .map(t => ({ type: t, capacity: vehicleCategoryOf(t)?.capacity || 0 }))
        .sort((a, b) => a.capacity - b.capacity);
    const fitting = sorted.find(o => headcount <= o.capacity);
    return (fitting || sorted[sorted.length - 1]).type;
};

// The actual RTO (India) license classes, not a simplified stand-in - this fleet is 100%
// passenger movement (Sedan/SUV/Minibus/Bus, see VEHICLE_CATEGORIES), so only classes that
// legally authorize driving passengers-for-hire unlock anything here:
//   LMV-NT      non-transport/private car license - no commercial endorsement, so it can't be used
//               to drive any vehicle in this fleet.
//   LMV         bare small-vehicle license, no transport endorsement - per India's Motor Vehicles
//               Act a plain LMV cannot be used to carry passengers commercially, only LMV-TR can, so
//               this grants nothing too (fix-list item 10 - it used to incorrectly grant Sedan,
//               contradicting LMV-NT's own more-restrictive row for what's functionally the same
//               "no transport endorsement" case).
//   LMV-TR      commercial light-vehicle endorsement (taxis, light goods carriers) - covers Sedan + SUV.
//   MGV         medium goods vehicle - goods-only, doesn't authorize carrying passengers commercially.
//   HGMV        heavy goods vehicle - same, goods-only.
//   HMV/HPMV/HTV  heavy motor vehicle and heavy passenger motor vehicle collapsed into one row (fix-
//               list item 11) - both covered everything up to Bus with no behavioural difference
//               between them in this system, so keeping two identical rows was pure upkeep with
//               nothing to show for it.
// This is the one rule window.driverLicensePermits enforces everywhere a driver gets paired to a
// vehicle, so a light-license-only driver can never end up behind the wheel of a Bus (or a goods-only
// license holder behind the wheel of anything) just because a dropdown let it happen.
window.LICENSE_CLASSES = ['LMV-NT', 'LMV', 'LMV-TR', 'MGV', 'HGMV', 'HMV/HPMV/HTV'];
window.LICENSE_CLASS_VEHICLE_MAP = {
    'LMV-NT': [],
    'LMV': [],
    'LMV-TR': ['Sedan', 'SUV'],
    'MGV': [],
    'HGMV': [],
    'HMV/HPMV/HTV': ['Sedan', 'SUV', 'Minibus', 'Bus'],
};

// What an unrecognized/missing license class grants - nothing. Named and used explicitly (fix-list
// item 12) rather than falling back to LICENSE_CLASS_VEHICLE_MAP['LMV'] the way this used to: that
// fallback happened to be safe only because LMV's own row was also empty, an accident this constant
// no longer depends on. A driver whose license class was mistyped or never recorded should never be
// quietly waved through to drive anything.
window.UNKNOWN_LICENSE_PERMISSIONS = [];

// A driver with no recognized license class on file (an older or imported record missing the field,
// or one with stray whitespace/casing - see the normalization below, fix-list item 15) fails safe to
// UNKNOWN_LICENSE_PERMISSIONS rather than any real tier. `vehicleType` of null/undefined (nothing
// picked yet) always permits, since there's nothing to validate against yet.
window.driverLicensePermits = (driver, vehicleType) => {
    if (!vehicleType) return true;
    const key = (driver?.licenseClass || '').trim().toUpperCase();
    const allowed = LICENSE_CLASS_VEHICLE_MAP[key] || UNKNOWN_LICENSE_PERMISSIONS;
    return allowed.includes(vehicleType);
};

// Resolves the vendor a fleet vehicle belongs to. Callers that already flattened data.vendors with
// vendorName attached (the data.vendors.flatMap(v => v.fleet.map(f => ({ ...f, vendorName: v.name })))
// pattern used throughout) skip straight to the lookup; a bare fleet vehicle with no vendor context
// falls back to a linear scan - fine at this scale (a handful of vendors, a few dozen vehicles).
window.vendorOfVehicle = (vehicle, data) => {
    if (vehicle.vendorName) return data.vendors.find(v => v.name === vehicle.vendorName) || null;
    return data.vendors.find(v => v.fleet.some(f => f.id === vehicle.id)) || null;
};
// Drivers carry their vendor's name directly (driver.vendor), so this is a straight lookup.
window.vendorOfDriver = (driver, data) => data.vendors.find(v => v.name === driver.vendor) || null;

// One consolidated inspection per vendor covers all three onboarding documents (GSTIN Certificate,
// Trade Certificate & POC Identity Document) together - same "one row, not three" convention the
// vehicle side already uses for PUC/Insurance/Physical (see window.mkInspection). The type string
// is checked by keyword further down (window.ComplianceTab's buildDocuments), same pattern as the
// vehicle-level type there too.
window.VENDOR_INSPECTION_TYPE = 'GSTIN, Trade Certificate & POC Identity Verification';
// A vendor's own compliance status, derived from that one inspection record rather than a
// separately-maintained field, so it can never drift out of sync with what a Compliance Officer
// actually approved. No record on file yet (a brand-new vendor) defaults to Pending, not Approved,
// since vendor-level verification is the thing being introduced here and has no "already cleared"
// history to grandfather in.
// Default with no inspection on file at all is 'Pending', not 'Approved' (fix-list item 9) -
// deliberately stricter than the vehicle/driver default just below, which treats no-record-at-all as
// already-cleared pre-existing fleet. A vendor is the thing everything else is gated behind
// (window.vehicleOnHold/driverOnHold), so it should never silently start out counted as verified.
window.vendorComplianceStatus = (vendor, data) => {
    const insp = data.inspections.find(i => i.vendor === vendor.name && i.vehicleId === 'N/A' && !i.driverId);
    const status = insp ? insp.status : 'Pending';
    // Fix-list item 8 - decided yes, a lapsed contract puts a vendor on the same footing as an
    // unresolved compliance inspection, not a separate business-only concern. Operating a fleet
    // under an expired commercial agreement is a real liability exposure during a live event, the
    // same class of problem vendor-level compliance already exists to catch - so it goes through
    // the same On Hold mechanism rather than a second, parallel one. Only downgrades an otherwise-
    // Approved vendor, same reasoning as document expiry above.
    if (status === 'Approved' && (vendor.contract === 'Pending Renewal' || isPastDate(vendor.contractRenewalDate))) return 'Pending';
    return status;
};

// A vehicle's/driver's own compliance status, read straight off its inspection record (there's at
// most one per vehicle/driver - see window.mkInspection and the Compliance & Inspection tab's
// updateStatus, which mutates it in place rather than creating a new one every time). No record on
// file at all means it predates this tracking (an existing fleet vehicle/driver that was never
// routed through a compliance submission) - treated as already cleared rather than newly blocked,
// so this only ever flags what's actually sitting in the queue, not the whole pre-existing fleet.
// True once a date string (YYYY-MM-DD) is in the past relative to right now - used by both
// compliance functions below to revert an otherwise-Approved record the moment its underlying
// document has actually expired (fix-list item 7), rather than only reacting to a manual re-review.
// A blank/missing expiry date is never treated as expired - there's nothing to compare against.
const isPastDate = (dateStr) => !!dateStr && dateStr < new Date().toISOString().slice(0, 10);

window.vehicleComplianceStatus = (vehicle, data) => {
    const insp = data.inspections.find(i => i.vehicleId === vehicle.id && !i.driverId);
    const status = insp ? insp.status : 'Approved';
    // Only downgrades an Approved record - a Rejected one is already the more severe state, and a
    // Pending one is already exactly where expiry would have sent it anyway.
    if (status === 'Approved' && (isPastDate(vehicle.pucExpiry) || isPastDate(vehicle.insuranceExpiry))) return 'Pending Inspection';
    return status;
};
window.driverComplianceStatus = (driver, data) => {
    const insp = data.inspections.find(i => i.driverId === driver.id);
    const status = insp ? insp.status : 'Approved';
    if (status === 'Approved' && isPastDate(driver.licenseExpiry)) return 'Pending Inspection';
    return status;
};

// True only once a vehicle/driver has individually cleared its own inspection but is still stuck
// behind its vendor not being verified yet - "approved vehicles and drivers get put on hold until
// the vendor itself is approved". A vehicle/driver still mid-review (or rejected) is already
// excluded from assignment by its own status, so this only needs to catch the otherwise-cleared case.
window.vehicleOnHold = (vehicle, data) => {
    if (vehicleComplianceStatus(vehicle, data) !== 'Approved') return false;
    const vendor = vendorOfVehicle(vehicle, data);
    return !!vendor && vendorComplianceStatus(vendor, data) !== 'Approved';
};
window.driverOnHold = (driver, data) => {
    if (driverComplianceStatus(driver, data) !== 'Approved') return false;
    const vendor = vendorOfDriver(driver, data);
    return !!vendor && vendorComplianceStatus(vendor, data) !== 'Approved';
};

// Single badge label to show next to a vehicle/driver wherever it's listed (Vendors & Fleet,
// Inventory Management) summarizing whether it can actually be put to work right now, beyond its
// own vehicle.status/driver.status - null when there's nothing to flag (cleared, and its vendor is too).
window.vehicleComplianceBadge = (vehicle, data) => {
    const status = vehicleComplianceStatus(vehicle, data);
    if (status === 'Rejected') return 'Rejected';
    if (status !== 'Approved') return 'Pending Inspection';
    return vehicleOnHold(vehicle, data) ? 'On Hold' : null;
};
window.driverComplianceBadge = (driver, data) => {
    const status = driverComplianceStatus(driver, data);
    if (status === 'Rejected') return 'Rejected';
    if (status !== 'Approved') return 'Pending Inspection';
    return driverOnHold(driver, data) ? 'On Hold' : null;
};

// Same idea, for the vendor itself - shown next to a vendor's contract badge (VendorCard, Vendors &
// Fleet / Inventory Management's vendor grid) so "this vendor still needs verifying" is visible
// before ever drilling into its fleet. null once Approved - nothing to flag.
window.vendorVerificationBadge = (vendor, data) => {
    const status = vendorComplianceStatus(vendor, data);
    if (status === 'Rejected') return 'Verification Rejected';
    if (status !== 'Approved') return 'Unverified';
    return null;
};

// How far a vehicle has actually driven today, in km - completed assignments count in full, an
// assignment still "In Transit" counts for whatever share of its route it's already covered
// (progress%), and anything not yet underway counts for nothing. Uses the same
// haversine x ROAD_DISTANCE_FACTOR road-distance estimate as window.DISTANCE_MATRIX, so a vehicle's
// fuel math and its trips' displayed distances agree with each other. This is the live number
// window.vehicleFuelProfile's depletion math is built on - reads window.derivedProgress, so it moves
// with an In Transit assignment's real elapsed time rather than a ticked, stored counter.
window.vehicleTotalKmDriven = (vehicle, data) => {
    if (!data?.assignments) return 0;
    return data.assignments
        .filter(a => a.vehicleId === vehicle.id && a.routeFrom && a.routeTo)
        .reduce((sum, a) => {
            const full = haversineKm(a.routeFrom, a.routeTo) * ROAD_DISTANCE_FACTOR;
            if (a.phase === 'past') return sum + full;
            if (a.phase === 'ongoing') return sum + full * (derivedProgress(a) / 100);
            return sum;
        }, 0);
};

// A vehicle's live fuel picture. fuelLevel is *derived*, not stored - it never meant anything for it
// to just sit at whatever number was last set, since nothing was ever draining it. Instead:
// kmSinceRefuel = today's total driven distance (vehicleTotalKmDriven) minus vehicle.fuelCheckpointKm,
// the driven-distance total as of the last logged refuel (defaults to 0 - "assume a full tank at the
// start of the day" for any vehicle that hasn't had one logged yet in this session). fuelLevel and
// dueForRefuel both fall out of that one running number, so it only ever recovers when a refuel is
// actually logged (see FleetTrackingSection's logRefuel, which stamps a fresh checkpoint) - driving
// is the only thing that moves it down. avgConsumption/fuelType still fall back from per-vehicle to
// category defaults as before; tankCapacity/refuelCycleKm stay category-level. Returns null only if
// the vehicle's category itself is unrecognized. Resolves fix-list item 28 (kmSinceRefuel "stored
// nowhere") by deciding it should stay that way - a derived number, computed fresh here, rather than
// a second field that could drift from the assignments/refuel data it's actually computed from. Item
// 86 (baseline fuel for a vehicle with no lastRefuelDate) is the same "defaults to 0" behaviour
// already described above, not a separate gap.
// Fix-list item 46 - the fuel percentage the Notification System's trigger matrix already
// distinguishes ("Fuel due, or fuel critical" - Due: Low, Critical: High) needed an actual number
// behind it; this is a reasonable placeholder, not an Operations-approved figure (same status as the
// rest of this section's config tables - see the fix list's own note on section E).
window.CRITICAL_FUEL_PERCENT = 15;

window.vehicleFuelProfile = (vehicle, data) => {
    const cat = vehicleCategoryOf(vehicle.type);
    if (!cat) return null;
    const avgConsumption = typeof vehicle.avgConsumption === 'number' ? vehicle.avgConsumption : cat.avgConsumption;
    const tankCapacity = cat.tankCapacity;
    const refuelCycleKm = cat.refuelCycleKm;
    const kmSinceRefuel = Math.max(0, vehicleTotalKmDriven(vehicle, data) - (vehicle.fuelCheckpointKm || 0));
    const litersUsed = avgConsumption > 0 ? kmSinceRefuel / avgConsumption : 0;
    const fuelLevel = tankCapacity > 0
        ? Math.max(0, Math.min(100, Math.round(100 - (litersUsed / tankCapacity) * 100)))
        : null;
    return {
        avgConsumption,
        fuelType: vehicle.fuelType || cat.fuelType,
        tankCapacity,
        refuelCycleKm,
        fuelLevel,
        kmSinceRefuel: Math.round(kmSinceRefuel * 10) / 10,
        // Two distinct tiers now, not one - dueForRefuel (distance-cycle based, "book it in soon") vs
        // fuelCritical (percentage based, "urgent") - matching the two severities the notification
        // trigger matrix already names.
        dueForRefuel: refuelCycleKm != null && kmSinceRefuel >= refuelCycleKm,
        fuelCritical: fuelLevel != null && fuelLevel <= CRITICAL_FUEL_PERCENT,
        lastRefuelDate: vehicle.lastRefuelDate || null,
        lastRefuelSource: vehicle.lastRefuelSource || null,
    };
};

// Estimated cost of a trip in this vehicle: fuel (distance / this vehicle's mileage x its fuel
// type's admin-configured price - Petrol/Diesel are priced separately in User Management's Fleet &
// Fuel Settings) plus driver cost (trip duration x whichever driver is actually paired to this
// vehicle's own hourly rate, set on the Drivers sub-tab in Vendors & Fleet - not a flat admin-wide
// number). `driver` can be passed explicitly to price a pairing that hasn't been committed to
// data.drivers yet (e.g. a proposed auto-assignment); otherwise it's looked up from the vehicle.
// Returns { fuelCost, driverCost, total }, or null only when neither figure can be computed at all
// (no vehicle/distance and no pricing, or no driver with a rate set) - a route planner should still
// see whichever half of the estimate is available rather than losing the whole number.
window.estimateTripCost = (vehicle, distanceKm, durationMin, data, driver) => {
    const profile = vehicle ? vehicleFuelProfile(vehicle, data) : null;
    const pricePerLiter = profile?.fuelType === 'Petrol' ? data?.settings?.petrolPricePerLiter : data?.settings?.dieselPricePerLiter;
    const resolvedDriver = driver || (vehicle ? data?.drivers?.find(d => d.vehicleId === vehicle.id) : null);

    const fuelCost = (profile && distanceKm && pricePerLiter)
        ? Math.round((distanceKm / profile.avgConsumption) * pricePerLiter) : null;
    const driverCost = (durationMin && resolvedDriver?.costPerHour)
        ? Math.round((durationMin / 60) * resolvedDriver.costPerHour) : null;

    if (fuelCost == null && driverCost == null) return null;
    return { fuelCost: fuelCost ?? 0, driverCost: driverCost ?? 0, total: (fuelCost ?? 0) + (driverCost ?? 0) };
};

// The one place "how does a vehicle's name look" gets decided - model prominent, category in
// parens (e.g. "Swift Dzire (Sedan)"), falling back to just the category if no model was ever
// recorded (older/imported rows). Every table, dropdown, and detail view should render a vehicle's
// name through this instead of hand-rolling `${type} (${model})` locally.
window.vehicleModelLabel = (vehicle) => {
    if (!vehicle) return '—';
    return vehicle.model ? `${vehicle.model} (${vehicle.type})` : vehicle.type;
};

// A vehicle's real-time allocation status, derived entirely from existing records rather than a
// stored field - there's nothing to keep in sync, and it's always correct off the current data.
// Checked in priority order: unresolved compliance always wins, since a vehicle that hasn't
// cleared its own inspection or whose vendor isn't verified yet can't legitimately be on the road
// no matter what it's booked to; after that, a vehicle physically out on the road right now
// outranks a paperwork booking, and Maintenance beats a mere reservation. Fix-list item 3 settles
// the one case that was genuinely undefined before: a vehicle that is BOTH Pending Inspection
// (compliance not yet reviewed) AND flagged Maintenance at the same time reads as Pending
// Inspection, not Maintenance - compliance is the more fundamental gate (nothing about a vehicle
// can be assessed, including whether it needs maintenance, until its own inspection has actually
// been reviewed), so it's checked first and wins.
//   Rejected           -> its own inspection was rejected (see window.vehicleComplianceStatus).
//   Pending Inspection -> its own inspection hasn't been reviewed yet.
//   In Transit  -> tied to a Live Fleet Tracking assignment whose phase is 'ongoing' right now -
//                  checked BEFORE On Hold/Maintenance (see the carve-out note below).
//   On Hold            -> its own inspection passed, but its vendor isn't Approved yet
//                          (see window.vehicleOnHold) - deployable the moment the vendor clears.
//   Maintenance -> vehicle.status is 'Maintenance' (a roadworthiness issue, not a live trip).
//   Reserved    -> tied to an Active travel plan or an Active shuttle plan, but not moving yet.
//   Available   -> none of the above - free to assign to a trip.
window.vehicleAllocationStatus = (vehicle, data) => {
    const compliance = vehicleComplianceStatus(vehicle, data);
    if (compliance === 'Rejected') return 'Rejected';
    if (compliance !== 'Approved') return 'Pending Inspection';
    // In Transit wins over On Hold/Maintenance - a vendor's compliance flipping (or a vehicle being
    // flagged for maintenance) mid-trip holds back its NEXT assignment, it does not retroactively
    // mislabel a trip already under way. Settling this ordering was fix-list item 2.
    if (data.assignments.some(a => a.vehicleId === vehicle.id && a.phase === 'ongoing')) return 'In Transit';
    if (vehicleOnHold(vehicle, data)) return 'On Hold';
    if (vehicle.status === 'Maintenance') return 'Maintenance';
    // 'Assigned' replaced the old bare 'Active' status (fix-list item 34/window.ROUTE_PLAN_STATUSES) -
    // a plan already showing as Ongoing here would already have matched the In Transit check above via
    // its linked assignment, so Assigned is the only stored value left that means "committed, not yet
    // moving."
    if (data.travelPlans.some(p => p.vehicle === vehicle.id && p.status === 'Assigned')) return 'Reserved';
    if (data.shuttlePlans.some(s => s.status === 'Active' && s.vehicles.includes(vehicle.id))) return 'Reserved';
    return 'Available';
};

// What a vehicle with a non-Available status is actually tied to right now, for display next to its
// status badge - the "why" behind Reserved/In Transit, checked in the same priority order as above.
window.vehicleAllocationContext = (vehicle, data) => {
    const live = data.assignments.find(a => a.vehicleId === vehicle.id && a.phase === 'ongoing');
    if (live) return live.stakeholder;
    const plan = data.travelPlans.find(p => p.vehicle === vehicle.id && p.status === 'Assigned');
    if (plan) return plan.stakeholder;
    const shuttle = data.shuttlePlans.find(s => s.status === 'Active' && s.vehicles.includes(vehicle.id));
    if (shuttle) return `Shuttle: ${shuttle.origin} -> ${shuttle.destination}`;
    return null;
};

// A driver's real-time allocation status, mirroring vehicleAllocationStatus's derive-don't-store
// approach - there's no separate field to keep in sync, this is always correct off current data.
// Checked in priority order: a driver whose own record isn't Active (expired license, deactivated)
// can't be dispatched at all regardless of anything else; then unresolved compliance, same
// reasoning and same three states as the vehicle side; otherwise it's just whether they're
// currently paired to a vehicle.
//   Inactive            -> driver.status isn't 'Active' - covers both an administratively
//                          Inactive driver (fix-list item 4) and one whose license has actually
//                          Expired (fix-list item 5 - already resolved by this being the very
//                          first check here, not a separate gap; an Expired driver never reaches
//                          the Available branch below, or any auto-assign pool, all of which also
//                          gate on status === 'Active' - see window.idleDriverFor).
//   Rejected             -> their own inspection was rejected.
//   Pending Inspection  -> their own inspection hasn't been reviewed yet.
//   Booked              -> paired to a vehicle (driver.vehicleId is set) that's mid-trip right now -
//                          checked BEFORE On Hold, same carve-out reasoning as vehicleAllocationStatus.
//   On Hold             -> their own inspection passed, but their vendor isn't Approved yet.
//   Booked (future)     -> paired to a vehicle, but nothing is under way yet - On Hold still wins.
//   Available           -> none of the above - free to pair with a vehicle.
window.driverAllocationStatus = (driver, data) => {
    if (driver.status !== 'Active') return 'Inactive';
    const compliance = driverComplianceStatus(driver, data);
    if (compliance === 'Rejected') return 'Rejected';
    if (compliance !== 'Approved') return 'Pending Inspection';
    // A driver already mid-trip (their paired vehicle has a live 'ongoing' assignment) stays Booked
    // even if their vendor's compliance flips mid-trip - the hold applies to their NEXT pairing, not
    // this one already under way. A driver merely paired for something not yet departed still falls
    // through to the On Hold check below, same as before. Fix-list item 2's driver-side carve-out.
    if (driver.vehicleId && data.assignments.some(a => a.vehicleId === driver.vehicleId && a.phase === 'ongoing')) return 'Booked';
    if (driverOnHold(driver, data)) return 'On Hold';
    if (driver.vehicleId) return 'Booked';
    return 'Available';
};

// A record with no `project` field was never tied to one (e.g. Travel-Module-sourced demand, which
// is this deployment's own first-party data, not pulled from an external system) and is always in
// scope. A record that does carry one - today, VMS/TMS/Accommodation-sourced pendingDemands plus
// data.venues/tournamentSchedule/accommodationAssignments themselves - is only in scope for the
// project actually running right now.
window.belongsToActiveProject = (record, data) => !record.project || record.project === data.activeProject;

// A Travel Plan record no longer carries one group-wide "Role" - stakeholder type is allocated per
// member instead (each person's own `stakeholderType`, picked from the same window.STAKEHOLDER_TYPES
// list). This is the shared summary shown wherever a plan card used to just print plan.role - the
// distinct stakeholder type(s) actually present among its members, collapsing to a count once there
// are more than a couple to keep a card's second line from overflowing.
window.planStakeholderSummary = (plan) => {
    if (!plan.people || plan.people.length === 0) return 'No stakeholders yet';
    const types = [...new Set(plan.people.map(p => p.stakeholderType).filter(Boolean))];
    if (types.length === 0) return 'Unspecified stakeholder type';
    if (types.length <= 2) return types.join(', ');
    return `${types.length} stakeholder types`;
};

window.VENDOR_COLOR_PALETTE = ['#3B82F6', '#10B981', '#8B5CF6', '#F59E0B', '#EC4899', '#14B8A6', '#F97316', '#6366F1'];

window.phaseColor = { ongoing: 'bg-blue-100 text-blue-700', upcoming: 'bg-amber-100 text-amber-700', past: 'bg-slate-100 text-slate-600' };
window.statusColor = {

    // Route Plan status enum (window.ROUTE_PLAN_STATUSES) - 'Completed' and 'Draft' above already

    'Assigned': 'bg-blue-100 text-blue-700', 'Ongoing': 'bg-emerald-100 text-emerald-700',
    'Cancelled': 'bg-red-100 text-red-700',
    'Fixture': 'bg-purple-100 text-purple-700', 'Arrival': 'bg-emerald-100 text-emerald-700',
    'Departure': 'bg-blue-100 text-blue-700', 'Reminder': 'bg-amber-100 text-amber-700',
    'Alert': 'bg-red-100 text-red-700', 'Info': 'bg-slate-100 text-slate-600',
    'High': 'bg-red-100 text-red-700', 'Medium': 'bg-amber-100 text-amber-700', 'Low': 'bg-slate-100 text-slate-600',
    'Pending Renewal': 'bg-amber-100 text-amber-700', 'Inactive': 'bg-slate-100 text-slate-500',
    // An Individual invited but not yet activated (fix-list item 125) - distinct from Active/Inactive.
    'Invited': 'bg-violet-100 text-violet-700',
    'Expired': 'bg-red-100 text-red-700', 'Paused': 'bg-amber-100 text-amber-700',
    // Inventory Management's derived allocation status - Vehicle side (Maintenance reuses
    // vehicle.status directly, the other three are computed from live assignments/plans - see
    // window.vehicleAllocationStatus) and Driver side ('Booked' - see window.driverAllocationStatus).
    'Available': 'bg-emerald-100 text-emerald-700', 'Reserved': 'bg-blue-100 text-blue-700',
    'Maintenance': 'bg-amber-100 text-amber-700', 'Booked': 'bg-blue-100 text-blue-700',
    // Compliance-driven allocation states, same two functions above - 'Rejected' already has a
    // color from the inspection-status entry higher up, reused as-is here. 'Pending Inspection' its
    // own inspection hasn't been reviewed yet; 'On Hold' one tier more specific - individually

    'Pending Inspection': 'bg-amber-100 text-amber-700', 'On Hold': 'bg-orange-100 text-orange-700',

    'Unverified': 'bg-amber-100 text-amber-700', 'Verification Rejected': 'bg-red-100 text-red-700',

};

// "DRIBBBLE 1 REF" status badges - a small colored dot + label on a neutral chip instead of a pill
// filled solid with the status color (matching the reference's "• Active" / "• Attention needed"
// language). Reuses each status's existing text-* class from window.statusColor for the dot color
// instead of maintaining a second parallel color map that could drift out of sync with it.
window.Badge = ({ status }) => {
    const classes = statusColor[status] || 'bg-slate-100 text-slate-600';
    const textClass = (classes.match(/text-\S+/) || ['text-slate-600'])[0];
    const dotClass = textClass.replace('text-', 'bg-');
    return (
        <span className="inline-flex items-center gap-1.5 whitespace-nowrap shrink-0 px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-50 border border-slate-100">
            <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${dotClass}`} />
            <span className={textClass}>{status}</span>
        </span>
    );
};

window.Card = ({ title, action, children, className = '' }) => (
    // border-slate-200 (not the far paler slate-100) so a white card actually reads as a distinct box
    // against the page's near-white background instead of blending into it - slate-100 was too close
    // to invisible once you added the equally-faint 6% shadow.card on top of it.
    <div className={`bg-white rounded-2xl border border-slate-200 shadow-card ${className}`}>
        {title && (
            <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center gap-3">
                <h3 className="font-semibold text-slate-800 text-sm">{title}</h3>
                {action}
            </div>
        )}
        {children}
    </div>
);

// Per-vendor avatar color, picked deterministically from the vendor id so the same vendor always
// gets the same color (no re-render flicker) while a grid of many vendors reads as varied rather
// than a wall of identical blue tiles. Shared (window-scoped) rather than redefined per tab - every
// "gradient circle with someone's initials" avatar in this app (vendor cards, Travel Plans' stakeholder
// avatars, auto-assign result popups) should read as the same visual language, not each pick its own
// slightly-different palette.
window.AVATAR_PALETTES = [
    'from-blue-500 to-indigo-600', 'from-violet-500 to-purple-600', 'from-teal-500 to-cyan-600',
    'from-rose-500 to-pink-600', 'from-amber-500 to-orange-600', 'from-emerald-500 to-teal-600',
];
window.avatarGradientFor = (key) => AVATAR_PALETTES[
    [...String(key)].reduce((a, c) => a + c.charCodeAt(0), 0) % AVATAR_PALETTES.length
];
window.initialsOf = (name) => name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

// A big, clickable vendor summary card - the shared entry point for "browse this vendor's vehicles
// and drivers" in both Vendors & Fleet and Inventory Management, so the two tabs look and behave
// consistently even though what each one leads with differs (fleet/driver counts in one, live
// availability in the other). vehicleStat/driverStat are twin capsules (bg-slate-50 border rounded-xl,
// same shape as the Fuel/Progress capsule pair in AssignmentsTable) rather than one headline number
// with the other metric demoted to a muted caption - vehicles and drivers are equally important
// counts, so they get equal visual weight, and each capsule's own mini-bar only ever represents that
// capsule's own metric (a single combined bar sitting under both numbers read as ambiguous - unclear
// which count it was describing). Every field is passed in pre-computed rather than a generic `stats`
// array, since this layout has fixed slots, unlike the old flexible tile grid.
window.VendorCard = ({ vendor, contract, verificationBadge, vehicleStat, driverStat, footerLeft, footerRight, hasAlert, onClick }) => {
    const StatCapsule = ({ icon, stat, barColor }) => {
        const pct = stat?.percent != null ? Math.max(0, Math.min(100, stat.percent)) : null;
        return (
            <div className="bg-slate-50 border border-slate-100 rounded-xl p-3 min-w-0">
                <div className="flex items-center gap-1.5 text-slate-400 mb-1.5">
                    <Icon name={icon} size={12} className="shrink-0" />
                    <p className="text-[10px] font-semibold uppercase tracking-wide truncate">{stat?.label}</p>
                </div>
                <p className="text-xl font-bold text-slate-800 leading-none">{stat?.value ?? 0}</p>
                {stat?.sub && <p className="text-[11px] text-slate-400 mt-1 truncate">{stat.sub}</p>}
                {pct != null && (
                    <div className="w-full h-1.5 rounded-full bg-slate-200 mt-2 overflow-hidden">
                        <div className={`h-full rounded-full ${barColor}`} style={{ width: `${pct}%` }} />
                    </div>
                )}
            </div>
        );
    };

    return (
        <button onClick={onClick}
            className="group text-left bg-white border border-slate-300 rounded-2xl p-5 shadow-card hover:shadow-cardHover hover:-translate-y-0.5 transition-all duration-200">
            <div className="flex items-start gap-3 mb-4">
                <div className="w-11 h-11 rounded-xl bg-blue-50 flex items-center justify-center shrink-0">
                    <Icon name="fleet" size={20} className="text-brandAccent" />
                </div>
                <div className="min-w-0 flex-1 pt-0.5">
                    <p className="font-semibold text-slate-800 truncate leading-tight">{vendor.name}</p>
                    <p className="text-xs text-slate-400 truncate mt-0.5">{vendor.id}</p>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                    {contract && <Badge status={contract} />}
                    {verificationBadge && <Badge status={verificationBadge} />}
                    {hasAlert && (
                        <span className="w-5 h-5 rounded-full bg-red-100 text-red-500 flex items-center justify-center" title="Needs attention">
                            <Icon name="alert" size={11} />
                        </span>
                    )}
                </div>
            </div>

            {/* Vehicles and drivers as a matched pair of capsules - same shape, same sizing, each
                with its own count and its own (never shared) utilization bar. */}
            <div className="grid grid-cols-2 gap-3 mb-4">
                <StatCapsule icon="fleet" stat={vehicleStat} barColor="bg-brandAccent" />
                <StatCapsule icon="users" stat={driverStat} barColor="bg-emerald-500" />
            </div>

            <div className="flex items-center justify-between gap-3 pt-3 border-t border-slate-100">
                <div className="flex items-center gap-5 min-w-0">
                    {footerLeft && (
                        <div className="min-w-0">
                            <p className="text-[10px] text-slate-400 uppercase tracking-wide">{footerLeft.label}</p>
                            <p className="text-xs font-medium text-slate-700 truncate">{footerLeft.value || '—'}</p>
                        </div>
                    )}
                    {footerRight && (
                        <div className="min-w-0">
                            <p className="text-[10px] text-slate-400 uppercase tracking-wide">{footerRight.label}</p>
                            <p className="text-xs font-medium text-slate-700 truncate">{footerRight.value || '—'}</p>
                        </div>
                    )}
                </div>
                <span className="w-8 h-8 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center shrink-0 text-slate-400 group-hover:bg-brandAccent group-hover:border-brandAccent group-hover:text-white transition-colors">
                    <Icon name="arrowRight" size={14} className="-rotate-45" />
                </span>
            </div>
        </button>
    );
};

// "DRIBBBLE 1 REF" pill-button treatment - rounded-full instead of rounded-lg, primary switched from
// brandBlue to near-black (matching the reference's "Place Order", "+ Add Prescription" black pills).
window.Btn = ({ children, variant = 'primary', className = '', ...props }) => {
    const styles = {
        primary: 'bg-slate-900 text-white hover:bg-slate-800',
        accent: 'bg-brandAccent text-white hover:opacity-90',
        // border-slate-300 (not slate-200) and a visible-when-idle bg-white with a hover fill that
        // actually darkens - the old slate-200 border on a white button sitting on a white/near-white
        // card was too faint to read as a button at all, just bare text with an invisible box around it.
        outline: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 hover:border-slate-400',
        danger: 'bg-red-600 text-white hover:bg-red-700',
        success: 'bg-emerald-600 text-white hover:bg-emerald-700',
    };
    return <button className={`px-3.5 py-1.5 text-sm font-medium rounded-full transition disabled:opacity-60 disabled:cursor-not-allowed ${styles[variant]} ${className}`} {...props}>{children}</button>;
};

// One label's worth of blank-template button - dashed border sets it apart from the solid
// Export/Import buttons as the lighter, secondary action it is. `sampleHeaders` is the exact header
// row that label's own import actually reads (see that tab's handleImport), so the file someone
// downloads, fills in, and re-imports lines up column-for-column on the first try.
function SampleCsvButton({ label, sampleHeaders, sampleName }) {
    const filename = sampleName || `${label.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-sample.csv`;
    return (
        <button type="button" onClick={() => downloadSampleCSV(filename, sampleHeaders)}
            className="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs font-medium text-slate-500 border border-dashed border-slate-300 rounded-lg hover:text-brandAccent hover:border-brandAccent/40 hover:bg-blue-50/50 transition">
            <Icon name="download" size={12} />Sample CSV
        </button>
    );
}

// `hint` is an optional one-line caption rendered under the button(s) - used app-wide to flag that
// CSV import/export is text-only and won't carry a record's documents (license, PUC, insurance,
// GSTIN, ticket, photo...). Only pass it where the entity being imported actually has a document
// field for that to matter - e.g. never on Notifications/Admins CSV, which have none.
// `sampleHeaders` (+ optional `sampleName`) adds the blank-template button above, for whichever
// label's exact import header row - pass it wherever a bulk import expects a specific fixed shape
// (i.e. everywhere, since every handleImport reads its own named fields).
window.ExportImport = ({ onExport, onImport, label = 'Data', hint, sampleHeaders, sampleName }) => (
    <div>
        <div className="flex gap-2 flex-wrap items-center">
            <Btn variant="outline" onClick={onExport}><Icon name="download" size={14} className="inline mr-1" />Export {label}</Btn>
            <label className="cursor-pointer">
                <span className="inline-flex items-center px-3 py-1.5 text-sm font-medium rounded-lg bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">
                    <Icon name="upload" size={14} className="inline mr-1" />Import {label}
                </span>
                <input type="file" accept=".csv" className="hidden" onChange={e => { if (e.target.files[0]) onImport(e.target.files[0]); e.target.value = ''; }} />
            </label>
            {sampleHeaders && <SampleCsvButton label={label} sampleHeaders={sampleHeaders} sampleName={sampleName} />}
        </div>
        {hint && <p className="text-[11px] text-slate-400 mt-1.5 max-w-xs">{hint}</p>}
    </div>
);

// The import half of ExportImport above, standalone - for the handful of places (Onboard Vendor's
// Vehicle Assets/Driver Roster, a vendor's own Fleet/Driver Details cards) that need a bulk-import
// button with no matching export action alongside it. Same `hint`/`sampleHeaders` convention as
// ExportImport.
window.ImportButton = ({ onImport, label = 'Data', hint, sampleHeaders, sampleName }) => (
    <div>
        <div className="flex gap-2 flex-wrap items-center">
            <label className="cursor-pointer">
                <span className="inline-flex items-center px-3 py-1.5 text-sm font-medium rounded-lg bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">
                    <Icon name="upload" size={14} className="inline mr-1" />Import {label}
                </span>
                <input type="file" accept=".csv" className="hidden" onChange={e => { if (e.target.files[0]) onImport(e.target.files[0]); e.target.value = ''; }} />
            </label>
            {sampleHeaders && <SampleCsvButton label={label} sampleHeaders={sampleHeaders} sampleName={sampleName} />}
        </div>
        {hint && <p className="text-[11px] text-slate-400 mt-1.5 max-w-xs">{hint}</p>}
    </div>
);

window.Modal = ({ open, onClose, title, children, wide = false }) => {
    if (!open) return null;
    return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40" onClick={onClose}>
            <div className={`bg-white rounded-xl shadow-xl w-full ${wide ? 'max-w-5xl' : 'max-w-lg'} max-h-[90vh] overflow-y-auto`} onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center px-5 py-4 border-b border-slate-100">
                    <h3 className="font-semibold text-slate-800">{title}</h3>
                    <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="close" size={20} /></button>
                </div>
                <div className="p-5">{children}</div>
            </div>
        </div>
    );
};

// className is merged onto (not replaced by) the base look - {...props} alone would silently drop
// every default class the moment a caller passed its own className, which nothing did until Role
// Management's read-only fields needed one.
window.Input = ({ label, className = '', ...props }) => (
    <label className="block">
        {label && <span className="text-xs font-medium text-slate-500 mb-1 block">{label}</span>}
        <input className={`w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent ${className}`} {...props} />
    </label>
);

window.Select = ({ label, options, className = '', ...props }) => (
    <label className="block">
        {label && <span className="text-xs font-medium text-slate-500 mb-1 block">{label}</span>}
        <select className={`w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 ${className}`} {...props}>
            {options.map(o => <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>)}
        </select>
    </label>
);

window.EmptyState = ({ title, desc }) => (
    <div className="text-center py-12 text-slate-400">
        <p className="font-medium text-slate-500">{title}</p>
        <p className="text-sm mt-1">{desc}</p>
    </div>
);

// The full, unlimited version of a "View All" list - every such list in this app now hands off to
// this as its own page (replacing the tab's normal content, with a Back button) instead of opening in
// a Modal popup, and paginates at a fixed page size instead of one long scroll. `renderItem` is
// whichever card-renderer the calling tab already uses for its preview list, so a row looks identical
// whether it's in the inline preview or here. `gridClassName` lets a caller opt into a multi-column
// grid (Suggested Plans' cards) instead of the default single-column stack every other list uses.
// `renderPage` is the escape hatch for the one list (Live Fleet Tracking's Assignments) that isn't
// rendered item-by-item at all - it's handed the current page's slice and renders it however it wants
// (there, the existing AssignmentsTable component, unchanged).
window.PaginatedListPage = ({ title, subtitle, items, renderItem, renderPage, onBack, pageSize = 12, gridClassName, emptyMessage = 'Nothing to show yet.' }) => {
    const [page, setPage] = useState(1);
    const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
    const safePage = Math.min(page, totalPages);
    const pageItems = items.slice((safePage - 1) * pageSize, safePage * pageSize);

    // Windowed page numbers (first, last, current +/- 1, "..." for the gaps) so a list with dozens of
    // pages doesn't render dozens of number buttons in a row.
    const pageNumbers = () => {
        const pages = [];
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || Math.abs(i - safePage) <= 1) pages.push(i);
            else if (pages[pages.length - 1] !== '...') pages.push('...');
        }
        return pages;
    };

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="flex items-center gap-3 mb-6">
                <button onClick={onBack} aria-label="Back"
                    className="w-9 h-9 rounded-full bg-white border border-slate-300 flex items-center justify-center text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition shrink-0">
                    <Icon name="arrowRight" size={16} className="rotate-180" />
                </button>
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">{title}</h2>
                    <p className="text-sm text-slate-500">{items.length} total{subtitle ? ` · ${subtitle}` : ''}</p>
                </div>
            </div>

            {items.length === 0 ? (
                <div className="bg-white border border-slate-200 rounded-2xl shadow-card py-16 text-center text-slate-400 text-sm">{emptyMessage}</div>
            ) : (
                <>
                    {renderPage ? renderPage(pageItems) : (
                        <div className={gridClassName || 'space-y-3'}>
                            {pageItems.map(renderItem)}
                        </div>
                    )}

                    {totalPages > 1 && (
                        <div className="flex items-center justify-center gap-1.5 mt-6">
                            <button onClick={() => setPage(p => Math.max(1, p - 1))} disabled={safePage === 1}
                                className="px-3 py-1.5 text-sm font-medium rounded-full border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition">
                                Prev
                            </button>
                            {pageNumbers().map((n, i) => n === '...' ? (
                                <span key={`gap-${i}`} className="px-1 text-slate-400 text-sm">&hellip;</span>
                            ) : (
                                <button key={n} onClick={() => setPage(n)}
                                    className={`w-9 h-9 text-sm font-medium rounded-full transition ${n === safePage ? 'bg-slate-900 text-white' : 'bg-white border border-slate-300 text-slate-600 hover:bg-slate-100'}`}>
                                    {n}
                                </button>
                            ))}
                            <button onClick={() => setPage(p => Math.min(totalPages, p + 1))} disabled={safePage === totalPages}
                                className="px-3 py-1.5 text-sm font-medium rounded-full border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition">
                                Next
                            </button>
                        </div>
                    )}
                </>
            )}
        </div>
    );
};

// Global Fleet Status reference data - shared (not just local to Inventory Management) so the
// Dashboard's own capsule version agrees on the exact same statuses, colors, and icons rather than
// keeping a second, driftable copy.
// 'Pending Inspection' and 'On Hold' fold compliance (window.vehicleAllocationStatus/
// driverAllocationStatus) into this same fixed status set - a vehicle/driver can't be handed a trip
// while either is true, so they belong alongside Maintenance/Inactive as reasons something isn't
// Available, not as a separate concept tracked only in Compliance & Inspection. 'Rejected' is a
// real allocationStatus value too but deliberately left out of this curated tile/filter set -
// Compliance & Inspection already owns full Pending/Approved/Rejected review for that.
window.INVENTORY_STATUSES = ['Available', 'Reserved', 'In Transit', 'Maintenance', 'Pending Inspection', 'On Hold'];
window.DRIVER_INVENTORY_STATUSES = ['Available', 'Booked', 'Inactive', 'Pending Inspection', 'On Hold'];

// Route Plan status enum (fix-list item 34 - the entity used to be prose-only, with 'Active'/'Draft'
// string literals repeated at every plan-creation call site and no shared list). Draft: no vehicle
// yet. Assigned: a vehicle is committed but the trip hasn't started. Ongoing/Completed: mirror a
// linked Live Fleet Tracking assignment's phase once one exists (see window.routePlanStatus below) -
// a plan's own stored `status` field only ever holds Draft/Assigned/Cancelled; Ongoing/Completed are
// derived, never written directly, so they can't drift from the assignment they're describing.
// Cancelled: an explicit admin action (fix-list item 89, not yet wired to a button in this pass).
window.ROUTE_PLAN_STATUSES = ['Draft', 'Assigned', 'Ongoing', 'Completed', 'Cancelled'];

// A plan's effective status - its own stored value (Draft/Assigned/Cancelled), unless a linked Live
// Fleet Tracking assignment (matched by travelPlanId, see data.assignments' seed comment) says
// otherwise, in which case the assignment's phase wins: 'ongoing' -> Ongoing, 'past' -> Completed.
// Every screen that shows or filters on a Route Plan's status should read this, not `plan.status`
// directly, so a plan that's actually under way is never shown as merely Assigned.
window.routePlanStatus = (plan, data) => {
    const linked = data.assignments.find(a => a.travelPlanId === plan.id);
    if (linked?.phase === 'ongoing') return 'Ongoing';
    if (linked?.phase === 'past') return 'Completed';
    return plan.status;
};
// Text + background tint for each status's tile - matches Badge's own color logic (window.statusColor)
// so a tile always agrees with what the same status looks like as a badge.
window.VEHICLE_STATUS_TILE = {
    Available: { text: 'text-emerald-600', bg: 'bg-emerald-50' },
    Reserved: { text: 'text-blue-600', bg: 'bg-blue-50' },
    'In Transit': { text: 'text-blue-600', bg: 'bg-blue-50' },
    Maintenance: { text: 'text-amber-600', bg: 'bg-amber-50' },
    'Pending Inspection': { text: 'text-amber-600', bg: 'bg-amber-50' },
    'On Hold': { text: 'text-orange-600', bg: 'bg-orange-50' },
};
window.DRIVER_STATUS_TILE = {
    Available: { text: 'text-emerald-600', bg: 'bg-emerald-50' },
    Booked: { text: 'text-blue-600', bg: 'bg-blue-50' },
    Inactive: { text: 'text-slate-400', bg: 'bg-slate-100' },
    'Pending Inspection': { text: 'text-amber-600', bg: 'bg-amber-50' },
    'On Hold': { text: 'text-orange-600', bg: 'bg-orange-50' },
};
window.VEHICLE_STATUS_ICON = {
    Available: 'fleet', Reserved: 'calendar', 'In Transit': 'travel', Maintenance: 'wrench',
    'Pending Inspection': 'compliance', 'On Hold': 'lock',
};
window.DRIVER_STATUS_ICON = {
    Available: 'users', Booked: 'users', Inactive: 'lock',
    'Pending Inspection': 'compliance', 'On Hold': 'lock',
};

window.TabBar = ({ tabs, active, onChange }) => (
    <div className="flex gap-1 border-b border-slate-200 mb-4 overflow-x-auto">
        {tabs.map(t => (
            <button key={t} onClick={() => onChange(t)}
                className={`px-4 py-2 text-sm font-medium whitespace-nowrap border-b-2 transition ${active === t ? 'border-brandAccent text-brandAccent' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                {t}
            </button>
        ))}
    </div>
);

</script>
<script type="text/babel">
/* global React, Card, Badge, Icon, Btn, Modal, uid, FleetMap, mockTransportStatus, vehicleAllocationStatus, driverAllocationStatus, driverLicensePermits, driverComplianceBadge, vehicleModelLabel, suggestedVehicleType, avatarGradientFor, initialsOf, INVENTORY_STATUSES, DRIVER_INVENTORY_STATUSES, VEHICLE_STATUS_TILE, DRIVER_STATUS_TILE, VEHICLE_STATUS_ICON, DRIVER_STATUS_ICON, planStakeholderSummary */
const { useMemo, useState } = React;

// Plain string date compare (YYYY-MM-DD) so there's no timezone drift juggling Date objects between
// renders - only used for display formatting (toLocaleDateString) below, sorting stays string-based.
const parseCalDate = (str) => new Date(str + 'T00:00:00');

// Same color language Badge already uses for these three types elsewhere in the app (Fixture =
// purple, Arrival = emerald, Departure = blue), now as a small labeled icon badge per row instead
// of a bare dot - matches the icon-badge convention the rest of the app's list rows use. `plane` is
// shared between arrival/departure and mirrored via rotate-180 for departure rather than adding a
// near-duplicate glyph.
const CALENDAR_TYPE_META = {
    fixture: { icon: 'award', bg: 'bg-violet-50', text: 'text-violet-600' },
    arrival: { icon: 'plane', bg: 'bg-emerald-50', text: 'text-emerald-600' },
    departure: { icon: 'plane', bg: 'bg-blue-50', text: 'text-brandAccent', iconClassName: 'rotate-180' },
};

// A compact "what's coming up" reference list - replaces the old full week-grid (7 day columns x
// hourly rows), which was really more calendar than this ever needed to be for a Dashboard glance.
// Sized and styled to sit as a peer alongside Admins Online/Unread Alerts rather than dominating the
// page on its own. Past events are hidden by default (nothing to "reference" there); the type filter
// stays since it's cheap and still useful even in a short list.
function UpcomingEventsCard({ events }) {
    const [typeFilter, setTypeFilter] = useState('All');
    const PREVIEW_LIMIT = 6;

    const upcoming = useMemo(() => {
        let list = events.filter(e => e.phase !== 'past');
        if (typeFilter !== 'All') list = list.filter(e => e.type === typeFilter);
        return [...list].sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
    }, [events, typeFilter]);

    return (
        <Card className="overflow-hidden">
            {/* Custom header (icon badge + title/subtitle) instead of Card's plain text title - matches
                Suggested Route Plans' header treatment next to this card, so the pair reads as one
                deliberate design rather than a fancy card next to a plain one. */}
            <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center gap-3">
                <div className="flex items-center gap-2.5 min-w-0">
