        </Card>
    );
}

// Dashboard's own condensed glance at Route Plans' Suggested Plans queue (data.pendingDemands) -
// the same records that page's "Suggested Plans (Action Required)" card lists in full, previewed
// here so a shortage never has to wait for someone to click into Route Plans to be noticed. "View
// All" hands off to that full page; a handful of the simplest entries can be resolved right here.
const DASH_SUGGESTION_PREVIEW_LIMIT = 5;

function SuggestedRoutePlansCard({ data, setData, setActiveTab }) {
    // Same three small pure reads Route Plans' own suggestion cards use (window.RoutePlansTab) -
    // duplicated locally rather than imported since they're cheap derivations of data already on
    // hand, not a separate table that could drift out of sync. Kept intentionally simpler here: no
    // multi-vehicle leg splitting, that stays Route Plans' job, see quickAssign below.
    const vehicleCapacity = (typeName) => {
        const vt = data.fleetEstimation.vehicleTypes.find(v => v.type === typeName);
        return vt ? vt.capacity : null;
    };
    const effectivePreferredVehicle = (demand) => {
        if (demand.stakeholderType) {
            const suggested = suggestedVehicleType(demand.stakeholderType, demand.headcount);
            if (suggested) return suggested;
        }
        return demand.preferredVehicle;
    };
    const vehiclesNeededFor = (demand) => {
        const cap = vehicleCapacity(effectivePreferredVehicle(demand));
        if (!cap || cap <= 0) return 1;
        return Math.max(1, Math.ceil(demand.headcount / cap));
    };
    // Same accommodation-or-blank, fixed-default-venue resolution as Route Plans' own
    // deriveRouteFor - only a demand whose accommodation is a recognised location can be quick
    // assigned without an admin picking an origin by hand.
    const routeFor = (demand) => ({
        origin: data.locations.includes(demand.accommodation) ? demand.accommodation : '',
        destination: data.locations.includes('Jawaharlal Nehru Stadium') ? 'Jawaharlal Nehru Stadium' : '',
    });

    const [result, setResult] = useState(null); // { demand, vehicle, driver } | { demand, vehicle: null } | null

    // One click, one vehicle. Mirrors Route Plans' Auto-Assign for the common single-vehicle case -
    // smallest-capacity Available vehicle of the resolved type, paired to an idle, licensed,
    // compliant driver from the same vendor if it doesn't already have one - but never the
    // multi-leg split a large group can need, that's left to the full Create Route Plan flow.
    const quickAssign = (demand) => {
        const { origin, destination } = routeFor(demand);
        const preferredType = effectivePreferredVehicle(demand);
        const pool = data.vendors.flatMap(v => v.fleet.map(f => ({ ...f, vendorName: v.name })))
            .filter(v => vehicleAllocationStatus(v, data) === 'Available' && v.capacity >= demand.headcount);
        const vehicle = pool.filter(v => !preferredType || v.type === preferredType)
            .sort((a, b) => a.capacity - b.capacity)[0] || null;

        let driver = null;
        let newlyPaired = false;
        if (vehicle) {
            driver = data.drivers.find(d => d.vehicleId === vehicle.id) || null;
            if (!driver) {
                driver = data.drivers.find(d => d.vendor === vehicle.vendorName && d.status === 'Active' && !d.vehicleId
                    && driverLicensePermits(d, vehicle.type) && !driverComplianceBadge(d, data)) || null;
                if (driver) newlyPaired = true;
            }
        }

        const newPlan = {
            id: uid('TP'), stakeholder: demand.stakeholder, accommodation: demand.accommodation,
            roomBlock: demand.accommodation, demandRef: demand.ref, source: demand.source,
            route: `${origin} -> ${destination}`, date: demand.checkIn || '',
            vehicle: vehicle ? vehicle.id : 'Unassigned', status: vehicle ? 'Assigned' : 'Draft',
            passengers: demand.headcount,
            // Traces back to the Travel Plan this demand was raised from, where one exists (fix-list
            // item 31) - a demand synced in from Accommodation/TMS/VMS has no such origin.
            manualPlanId: demand.sourceManualPlanId || null,
        };
        setData(d => ({
            ...d,
            travelPlans: [...d.travelPlans, newPlan],
            pendingDemands: d.pendingDemands.filter(pd => pd.ref !== demand.ref),
            drivers: newlyPaired ? d.drivers.map(dr => dr.id === driver.id ? { ...dr, vehicleId: vehicle.id } : dr) : d.drivers,
            // Reverse link (fix-list item 31) - the originating Travel Plan now knows which Route
            // Plan(s) it produced.
            manualPlans: demand.sourceManualPlanId
                ? d.manualPlans.map(mp => mp.id === demand.sourceManualPlanId ? { ...mp, linkedRouteIds: [...(mp.linkedRouteIds || []), newPlan.id] } : mp)
                : d.manualPlans,
        }));
        setResult({ demand, vehicle, driver: newlyPaired || driver ? driver : null });
    };

    const preview = data.pendingDemands.slice(0, DASH_SUGGESTION_PREVIEW_LIMIT);

    return (
        <Card className="overflow-hidden">
            {/* Same custom-header-with-a-logo-badge treatment the old Smart Suggestions card used -
                keeps this card visually distinct from a plain list card rather than just another
                bullet list next to Upcoming Events. */}
            <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center gap-3">
                <div className="flex items-center gap-2.5 min-w-0">
                    <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-brandAccent to-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm">
                        <Icon name="travel" size={16} />
                    </div>
                    <div className="min-w-0">
                        <h3 className="font-semibold text-slate-800 text-sm truncate">Suggested Route Plans</h3>
                        <p className="text-[11px] text-slate-400">{data.pendingDemands.length} pending</p>
                    </div>
                </div>
                <button onClick={() => setActiveTab('Route Plans')}
                    className="shrink-0 inline-flex items-center gap-1.5 text-sm font-semibold text-brandAccent hover:underline">
                    View All &rarr;
                </button>
            </div>
            {preview.length === 0 ? (
                <div className="px-5 py-8 text-center">
                    <div className="w-10 h-10 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center mx-auto mb-2">
                        <Icon name="check" size={18} />
                    </div>
                    <p className="text-sm font-medium text-slate-600">All clear</p>
                    <p className="text-xs text-slate-400 mt-0.5">No suggested route plans waiting on a vehicle right now.</p>
                </div>
            ) : (
                <div className="divide-y divide-slate-100 max-h-[420px] overflow-y-auto">
                    {preview.map(d => {
                        const legCount = vehiclesNeededFor(d);
                        const { origin, destination } = routeFor(d);
                        const canQuickAssign = legCount === 1 && origin && destination;
                        return (
                            <div key={d.ref} className="px-5 py-3 flex items-center gap-3 hover:bg-slate-50 transition-colors">
                                <div className={`w-9 h-9 rounded-full bg-gradient-to-br ${avatarGradientFor(d.stakeholder)} flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-sm ring-1 ring-black/5`}>
                                    {initialsOf(d.stakeholder)}
                                </div>
                                <div className="min-w-0 flex-1">
                                    <p className="font-medium text-slate-800 text-xs truncate">{d.stakeholder}</p>
                                    <p className="text-[11px] text-slate-400 mt-0.5 truncate">
                                        {d.headcount} pax &middot; {legCount > 1 ? `${legCount} × ${effectivePreferredVehicle(d)}` : effectivePreferredVehicle(d)}
                                        {!d.accommodation && ' · accommodation not yet assigned'}
                                    </p>
                                </div>
                                {canQuickAssign ? (
                                    <button onClick={() => quickAssign(d)}
                                        className="shrink-0 inline-flex items-center gap-1 text-[11px] font-medium text-brandAccent bg-blue-50 hover:bg-blue-100 rounded-lg px-2.5 py-1.5 transition">
                                        <Icon name="fleet" size={12} />Assign
                                    </button>
                                ) : (
                                    <button onClick={() => setActiveTab('Route Plans')}
                                        title={legCount > 1 ? `Needs ${legCount} vehicles - set up from Route Plans` : 'Needs an origin set from Route Plans'}
                                        className="shrink-0 inline-flex items-center gap-1 text-[11px] font-medium text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-lg px-2.5 py-1.5 transition">
                                        <Icon name="arrowRight" size={12} />Set up
                                    </button>
                                )}
                            </div>
                        );
                    })}
                </div>
            )}
            {data.pendingDemands.length > DASH_SUGGESTION_PREVIEW_LIMIT && (
                <p className="px-5 py-2.5 border-t border-slate-100 text-center text-[11px] text-slate-400">
                    +{data.pendingDemands.length - DASH_SUGGESTION_PREVIEW_LIMIT} more in Route Plans
                </p>
            )}

            <Modal open={!!result} onClose={() => setResult(null)} title="Vehicle Assigned">
                {result && (
                    <div className="space-y-4">
                        {!result.vehicle ? (
                            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                                <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                                <p className="text-sm text-amber-800">
                                    No Available vehicle currently fits <strong>{result.demand.stakeholder}</strong> ({result.demand.headcount} pax) right now - created as a Draft plan instead, visible in Route Plans.
                                </p>
                            </div>
                        ) : (
                            <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className={`w-11 h-11 rounded-full bg-gradient-to-br ${avatarGradientFor(result.demand.stakeholder)} flex items-center justify-center text-white text-sm font-bold shrink-0 shadow-sm ring-1 ring-black/5`}>
                                        {initialsOf(result.demand.stakeholder)}
                                    </div>
                                    <div className="min-w-0">
                                        <p className="font-semibold text-slate-800 text-sm truncate">{result.demand.stakeholder}</p>
                                        <p className="text-xs text-slate-400">{result.demand.headcount} pax</p>
                                    </div>
                                </div>
                                <div className="mt-4 pt-4 border-t border-slate-100 space-y-3">
                                    <div className="flex items-center gap-3">
                                        <span className="w-9 h-9 rounded-xl bg-blue-50 text-brandAccent flex items-center justify-center shrink-0">
                                            <Icon name="fleet" size={16} />
                                        </span>
                                        <div className="min-w-0">
                                            <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Vehicle</p>
                                            <p className="text-sm font-medium text-slate-700">{vehicleModelLabel(result.vehicle)} &middot; {result.vehicle.id}</p>
                                            <p className="text-xs text-slate-400">{result.vehicle.vendorName}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="w-9 h-9 rounded-xl bg-violet-50 text-violet-600 flex items-center justify-center shrink-0">
                                            <Icon name="users" size={16} />
                                        </span>
                                        <div className="min-w-0">
                                            <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Driver</p>
                                            {result.driver ? (
                                                <>
                                                    <p className="text-sm font-medium text-slate-700">{result.driver.name}</p>
                                                    <p className="text-xs text-slate-400">{result.driver.vendor}</p>
                                                </>
                                            ) : <p className="text-sm text-slate-400">No driver available yet - pair one from Vendors &amp; Fleet</p>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        <Btn className="w-full" onClick={() => setResult(null)}>Done</Btn>
                    </div>
                )}
            </Modal>
        </Card>
    );
}

window.DashboardTab = ({ data, setData, setActiveTab }) => {
    const [isSyncing, setIsSyncing] = useState(false);
    const [lastSynced, setLastSynced] = useState('Just now');

    const greeting = useMemo(() => {
        const h = new Date().getHours();
        return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    }, []);
    const firstName = (data.currentAdmin.name || '').split(' ')[0];

    // The Dashboard's hero pair - a live map glance and a live arrivals/departures glance, each just
    // a summary of its own full page (Live Fleet Tracking / Travel Plans) with a "View" action through
    // to it, not a second copy of everything that page already does in full.
    const ongoingCount = data.assignments.filter(a => a.phase === 'ongoing').length;
    const upcomingCount = data.assignments.filter(a => a.phase === 'upcoming').length;
    const activeSOSCount = data.sosAlerts.filter(s => s.status === 'Active').length;
    const recentManualPlans = useMemo(() => [...data.manualPlans].reverse().slice(0, 4), [data.manualPlans]);

    // Global Fleet Status - same counts Inventory Management's own sidebar shows (same
    // window.vehicleAllocationStatus/driverAllocationStatus, same fixed status lists), computed fresh
    // here rather than read off that tab's state, since the two components don't share anything else.
    const globalVehicleCounts = useMemo(() => {
        const counts = { Available: 0, Reserved: 0, 'In Transit': 0, Maintenance: 0 };
        data.vendors.forEach(v => v.fleet.forEach(f => {
            const status = vehicleAllocationStatus(f, data);
            counts[status] = (counts[status] || 0) + 1;
        }));
        return counts;
    }, [data]);
    const totalVehicles = Object.values(globalVehicleCounts).reduce((a, b) => a + b, 0);
    const globalDriverCounts = useMemo(() => {
        const counts = { Available: 0, Booked: 0, Inactive: 0 };
        data.drivers.forEach(dr => {
            const status = driverAllocationStatus(dr, data);
            counts[status] = (counts[status] || 0) + 1;
        });
        return counts;
    }, [data.drivers, data.inspections, data.vendors]);
    const totalDrivers = Object.values(globalDriverCounts).reduce((a, b) => a + b, 0);
    // One shared nonce for every record shown here (unlike Travel Plans' own per-row refresh) - this
    // preview is meant to be glanced at as a whole, so a single "Refresh Live Status" re-polls

        setIsRefreshingStatus(true);
        setTimeout(() => {
            setStatusNonce(n => n + 1);
            setIsRefreshingStatus(false);

    const handleSync = () => {
        setIsSyncing(true);
        setTimeout(() => {
            setIsSyncing(false);

                ...d,
                notifications: [{
                    id: uid('NTF'), type: 'info', title: 'System Sync Complete',
                    message: 'Successfully synced latest data from TMS and Accommodation modules.',
                    time: 'Just now', read: false, priority: 'low', recipientRole: 'Master Admin', source: null,
                }, ...d.notifications],
            }));
        }, 2000);
    };

    return (
        <div className="max-w-7xl mx-auto space-y-6 animate-in">
            {/* Welcome header + sync capsule, side by side */}
            <div className="flex flex-wrap items-center justify-between gap-4">

                </div>
                <button onClick={handleSync} disabled={isSyncing} title={`Sync data with Accommodation and TMS for ${data.activeProject}`}
                    className={`group flex items-center gap-2.5 bg-white border border-slate-200 rounded-full pl-2 pr-4 py-2 shadow-card hover:shadow-cardHover hover:border-brandAccent/30 transition shrink-0 ${isSyncing ? 'cursor-not-allowed opacity-70' : ''}`}>
                    <span className={`w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-brandAccent shrink-0 ${isSyncing ? 'animate-spin' : ''}`}>
                        <span className="text-base leading-none" style={{ display: 'inline-block' }}>↻</span>
                    </span>
                    <span className="text-left">
                        <span className="block text-xs font-semibold text-slate-700">{isSyncing ? 'Syncing...' : 'Sync Accommodation & TMS'}</span>
                        <span className="block text-[10px] text-slate-400">{data.activeProject} &middot; Last synced: {lastSynced}</span>

                                            <p className="text-slate-700 font-medium truncate">{plan.transportNumber || '—'}</p>
                                        </div>
                                        <div className="min-w-0">
                                            <p className="font-semibold text-slate-400 uppercase tracking-wide">PNR</p>

                                            <p className="text-slate-700 truncate">{plan.location || plan.city || '—'}</p>

                    </div>

                    <div className="px-5 py-3 border-t border-slate-200 text-right">
                        <button onClick={() => setActiveTab('Travel Plans')} className="text-sm font-semibold text-brandAccent hover:underline">

            </div>

            {/* Global Fleet Status - the same counts Inventory Management's own sidebar shows, as a
                grid of small stat tiles grouped under a Vehicles/Drivers heading each, rather than a
                single row of chips that wraps unpredictably once every status has to fit on one line.
                Each tile carries its own icon circle so a status is identifiable by shape/color even
                before reading the number - "View Details" hands off to the real thing (Inventory
                Management), same pattern as the hero pair above. */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-card overflow-hidden">
                <div className="flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-100">

                        className="shrink-0 inline-flex items-center gap-1.5 text-sm font-semibold text-brandAccent hover:underline">

                </div>

                <div className="px-5 py-4 space-y-4">
                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-2">Vehicles</p>
                        <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                            {INVENTORY_STATUSES.map(s => (
                                <div key={s} className={`flex flex-col items-center gap-1.5 rounded-xl py-2.5 px-1 ${VEHICLE_STATUS_TILE[s].bg}`}>

                                        <Icon name={VEHICLE_STATUS_ICON[s]} size={12} />

                                    <span className={`text-lg font-bold leading-none ${VEHICLE_STATUS_TILE[s].text}`}>{globalVehicleCounts[s] || 0}</span>

                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-2">Drivers</p>
                        <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">

                                    <span className={`w-6 h-6 rounded-full bg-white/70 flex items-center justify-center shadow-sm ${DRIVER_STATUS_TILE[s].text}`}>
                                        <Icon name={DRIVER_STATUS_ICON[s]} size={12} />
                                    </span>
                                    <span className={`text-lg font-bold leading-none ${DRIVER_STATUS_TILE[s].text}`}>{globalDriverCounts[s] || 0}</span>
                                    <span className="text-[9px] font-semibold text-slate-500 uppercase tracking-wide text-center leading-tight">{s}</span>
                                </div>
                            ))}

                    </div>
                    {/* Rejected is a real allocationStatus value (window.vehicleAllocationStatus/
                        driverAllocationStatus) but deliberately left out of the tile set above -
                        Compliance & Inspection already owns full review of it, see
                        window.INVENTORY_STATUSES' comment. Left fully invisible here would mean a
                        rejected vehicle/driver never surfaces anywhere on this glance-view at all, so
                        this one small alert chip (fix-list item 1) links straight to where it's
                        actually handled instead of adding a seventh/sixth full tile for it. */}
                    {(globalVehicleCounts['Rejected'] || globalDriverCounts['Rejected']) > 0 && (
                        <button onClick={() => setActiveTab('Compliance & Inspection')}
                            className="inline-flex items-center gap-1.5 bg-red-50 hover:bg-red-100 text-red-600 border border-red-100 rounded-full px-3 py-1.5 text-[11px] font-semibold transition">
                            <Icon name="alert" size={12} />
                            +{(globalVehicleCounts['Rejected'] || 0) + (globalDriverCounts['Rejected'] || 0)} Rejected - see Compliance &amp; Inspection
                        </button>
                    )}
                </div>
            </div>

            {/* Upcoming Events + Suggested Route Plans side by side - the same 35/65 split the old
                Smart Suggestions card used, Upcoming Events is a short reference list while
                Suggested Route Plans' rows carry more (a quick-assign action per entry) and earn
                the extra room. `fr` units (not %) so the gap between them doesn't get counted
                twice. */}
            <div className="grid grid-cols-1 lg:grid-cols-[35fr_65fr] gap-6">
                <UpcomingEventsCard events={data.calendarEvents} />
                <SuggestedRoutePlansCard data={data} setData={setData} setActiveTab={setActiveTab} />

};
