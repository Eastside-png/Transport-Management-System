        const defaultDestination = data.locations.includes('Jawaharlal Nehru Stadium') ? 'Jawaharlal Nehru Stadium' : '';
        setForm(f => ({ ...f, demandRef: d.ref, origin: matchedOrigin, destination: defaultDestination }));
    };

    // Tags (or clears) a demand's stakeholder category from the modal - persisted onto the demand
    // itself (not just this one session) since it's useful data to keep, and mirrored onto the
    // local selectedDemand snapshot so the modal's own captions/warnings update immediately.
    const setDemandStakeholderType = (ref, stakeholderType) => {
        setData(d => ({
            ...d,
            pendingDemands: d.pendingDemands.map(pd => pd.ref === ref ? { ...pd, stakeholderType: stakeholderType || null } : pd),
        }));
        setSelectedDemand(sd => (sd && sd.ref === ref) ? { ...sd, stakeholderType: stakeholderType || null } : sd);
        // The resolved vehicle type can change with it (effectivePreferredVehicle), which narrows the
        // modal's Assign Vehicle dropdown to a different set of vehicles - clear whatever was picked
        // rather than risk it silently keeping a now-mismatched vehicle from before the type changed.
        setForm(f => ({ ...f, vehicle: 'Unassigned' }));
    };

    const handleDemandSync = () => {
        setIsSyncingDemands(true);
        setTimeout(() => {
            setIsSyncingDemands(false);
            alert('Demands synced successfully.');
        }, 1500);
    };

    // Seats for a vehicle type, from the same fleet estimation reference data used elsewhere -
    // no separate hardcoded capacity table to drift out of sync.
    const vehicleCapacity = (typeName) => {
        const vt = data.fleetEstimation.vehicleTypes.find(v => v.type === typeName);
        return vt ? vt.capacity : null;
    };

    // The vehicle type Travel Plans actually uses for a demand: once it's tagged with a
    // stakeholderType (window.STAKEHOLDER_TYPES), window.suggestedVehicleType overrides whatever
    // preferredVehicle it came in with - that's the whole point of the stakeholder<->vehicle
    // mapping. Demands with no stakeholderType (not every delegation name fits one of the fixed
    // categories) fall back to their own preferredVehicle unchanged.
    const effectivePreferredVehicle = (demand) => {
        if (demand.stakeholderType) {
            const suggested = suggestedVehicleType(demand.stakeholderType, demand.headcount);
            if (suggested) return suggested;
        }
        return demand.preferredVehicle;
    };

    // How many vehicles of its preferred type a demand actually needs - 1 in the common case,
    // more when the headcount exceeds what a single vehicle of that type can seat.
    const vehiclesNeededFor = (demand) => {
        const cap = vehicleCapacity(effectivePreferredVehicle(demand));
        if (!cap || cap <= 0) return 1;
        return Math.max(1, Math.ceil(demand.headcount / cap));
    };

    const resetCreateForm = () => {
        setModal(false);
        setForm({ demandRef: '', vehicle: 'Unassigned', origin: '', destination: '' });
        setSelectedDemand(null);
    };

    const createPlan = () => {
        const demand = data.pendingDemands.find(d => d.ref === form.demandRef);
        if (!demand) return alert('Select a reference.');
        if (!form.origin || !form.destination) return alert('Select both an origin and a destination.');

        const legCount = vehiclesNeededFor(demand);

        if (legCount > 1) {
            // Too many people for one vehicle of the preferred type - split into one plan per leg,
            // filling each to capacity and leaving the remainder on the last one. Which specific
            // vehicle (and driver) covers each leg is resolved the same way the Suggested Plans
            // card's Auto-Assign button does, and always goes through the confirm popup below first -
            // an admin should see exactly what's about to be booked for a multi-vehicle trip, not have
            // it happen silently on click. `legLabel` stays its own field (not appended into
            // `stakeholder`) so it never gets truncated away in the plans table.
            const cap = vehicleCapacity(effectivePreferredVehicle(demand));
            let remaining = demand.headcount;
            const seatsPerLeg = Array.from({ length: legCount }, () => {
                const seats = Math.min(cap, remaining);
                remaining -= seats;
                return seats;
            });
            setModal(false);
            setPendingAutoAssign({ demand, origin: form.origin, destination: form.destination, legs: resolveLegs(seatsPerLeg, effectivePreferredVehicle(demand)) });
            return;
        }

        // Single vehicle - a manual pick from the dropdown is honored as-is (still pairing an idle
        // driver to it if it doesn't already have one, so "assign a vehicle" doesn't quietly leave the
        // trip driverless); leaving it Unassigned instead auto-resolves the best-fit Available vehicle
        // the same way Auto-Assign would, rather than creating a dead Draft plan by default.
        let vehicleId = form.vehicle;
        let newPairing = null;
        if (vehicleId === 'Unassigned') {
            const [leg] = resolveLegs([demand.headcount], effectivePreferredVehicle(demand));
            if (leg.vehicle) {
                vehicleId = leg.vehicle.id;
                if (leg.newlyPaired) newPairing = { driverId: leg.driver.id, vehicleId: leg.vehicle.id };
            }
        } else if (!driverOf(vehicleId)) {
            const vehicle = allVehiclesWithVendor.find(v => v.id === vehicleId);
            const idle = vehicle ? idleDriverFor(vehicle, new Set()) : null;
            if (idle) newPairing = { driverId: idle.id, vehicleId };
        }

        const newPlan = {
            id: uid('TP'), stakeholder: demand.stakeholder, accommodation: demand.accommodation,
            roomBlock: demand.accommodation, demandRef: demand.ref, source: demand.source,
            route: `${form.origin} -> ${form.destination}`, date: demand.checkIn || '',
            vehicle: vehicleId, status: vehicleId === 'Unassigned' ? 'Draft' : 'Assigned', passengers: demand.headcount,
            manualPlanId: demand.sourceManualPlanId || null,
        };

        setData(d => ({
            ...d,
            travelPlans: [...d.travelPlans, newPlan],
            // Once a suggestion becomes a real plan it's no longer "pending" - drop it from the
            // Suggested Plans queue instead of leaving a stale duplicate suggestion sitting there.
            pendingDemands: d.pendingDemands.filter(pd => pd.ref !== demand.ref),
            drivers: newPairing ? d.drivers.map(dr => dr.id === newPairing.driverId ? { ...dr, vehicleId: newPairing.vehicleId } : dr) : d.drivers,
            manualPlans: demand.sourceManualPlanId
                ? d.manualPlans.map(mp => mp.id === demand.sourceManualPlanId ? { ...mp, linkedRouteIds: [...(mp.linkedRouteIds || []), newPlan.id] } : mp)
                : d.manualPlans,
        }));
        resetCreateForm();
    };

    const assignVehicle = (planId, vehicle) => {
        setData(d => ({
            ...d,
            travelPlans: d.travelPlans.map(p => p.id === planId ? { ...p, vehicle, status: vehicle === 'Unassigned' ? 'Draft' : 'Assigned' } : p),
        }));
    };

    // Vehicle changes on a Draft plan are cheap - nothing's dispatched yet, so they apply instantly.
    // On an Active plan they're not: a real driver is already on that trip, so the dropdown never
    // writes directly - it stages the change and requires an explicit confirm first.
    const requestVehicleChange = (plan, newVehicle) => {
        if (newVehicle === plan.vehicle) return;
        // Only a plan that's actually Ongoing (a live linked assignment, not merely Assigned-but-not-
        // yet-departed) needs the explicit confirm below - reassigning something that hasn't
        // physically left yet is cheap, same as a Draft. Was `plan.status !== 'Active'` before the
        // status enum rename (fix-list item 34); 'Active' no longer exists as a stored value, so this
        // now reads the actual derived status instead of a literal that could never match again.
        if (routePlanStatus(plan, data) !== 'Ongoing') {
            assignVehicle(plan.id, newVehicle);
            return;
        }
        setPendingReassignment({ plan, newVehicle });
    };

    const confirmReassignment = () => {
        if (!pendingReassignment) return;
        assignVehicle(pendingReassignment.plan.id, pendingReassignment.newVehicle);
        setPendingReassignment(null);
        setEditingVehicleId(null);
    };

    const availableVehicles = useMemo(() =>
        data.vendors.flatMap(v => v.fleet.filter(f => f.status === 'Active')),
        [data.vendors]
    );

    // The Create Route Plan modal's "Assign Vehicle" dropdown, narrowed to the demand's resolved
    // vehicle type once one is known (effectivePreferredVehicle - same value the modal already shows
    // as "Vehicle Type" and uses to decide leg-splitting), so picking a stakeholder type actually
    // changes what's offered instead of listing every Active vehicle regardless of fit. With no
    // demand selected (manual entry has no stakeholder context) it falls back to the full list.
    const routeModalVehicleOptions = useMemo(() => {
        if (!selectedDemand) return availableVehicles;
        const preferredType = effectivePreferredVehicle(selectedDemand);
        if (!preferredType) return availableVehicles;
        return availableVehicles.filter(v => v.type === preferredType);
    }, [availableVehicles, selectedDemand]);

    // Same-day double-booking check (fix-list items 57/58) - Auto-Assign already only ever pulls
    // from vehicles/drivers vehicleAllocationStatus calls Available, so this is purely for the
    // manual "Assign Vehicle" dropdowns that are deliberately unfiltered by design (see
    // routeModalVehicleOptions's own comment above - "a human overriding the system is a deliberate,
    // informed choice"). A warning, not a block, same convention as Travel Plans' own
    // Point-of-Contact overlap check (plansShareOverlappingPoc/POC_OVERLAP_WINDOW_HOURS). Same-day
    // granularity only, not a real time-window scheduling engine - an acknowledged, deliberate
    // limitation, documented in the PRD's Open Items.
    const vehicleSameDayConflict = (vehicleId, date, excludePlanId) => {
        if (!vehicleId || vehicleId === 'Unassigned' || !date) return null;
        return data.travelPlans.find(p =>
            p.id !== excludePlanId && p.vehicle === vehicleId && p.date === date && p.status !== 'Cancelled'
        ) || null;
    };

    const vehicleLabel = (vehicleId) => {
        const v = allVehiclesWithVendor.find(x => x.id === vehicleId) || availableVehicles.find(x => x.id === vehicleId);
        if (!v) return vehicleId;
        // Manual "Assign Vehicle" stays unfiltered by compliance (same "a human overriding the
        // system is a deliberate, informed choice" reasoning as the roadworthiness filter above) but
        // still flags it right in the option text, so a Pending/On Hold pick is visible, not silent.
        const badge = vehicleComplianceBadge(v, data);
        return `${vehicleModelLabel(v)} · ${v.id}${badge ? ` (${badge})` : ''}`;
    };

    // Every vehicle with its owning vendor attached (regardless of roadworthiness/availability) - the
    // base list both the auto-assign pool below and manual-pick driver pairing look vendor context up
    // from, since a manually-picked vehicle might not be in autoAssignPool but still needs its vendor
    // known to find it an idle driver.
    const allVehiclesWithVendor = useMemo(() =>
        data.vendors.flatMap(v => v.fleet.map(f => ({ ...f, vendorId: v.id, vendorName: v.name }))),
        [data.vendors]
    );

    // Narrowed to what vehicleAllocationStatus actually calls Available right now - not just
    // roadworthy (Active), but free of any live assignment, Active travel plan, or Active shuttle
    // commitment. Auto-assign only ever pulls from this pool; the manual "Assign Vehicle" dropdowns
    // elsewhere still show every roadworthy vehicle, since a human overriding the system is a
    // deliberate, informed choice.
    const autoAssignPool = useMemo(() =>
        allVehiclesWithVendor.filter(f => vehicleAllocationStatus(f, data) === 'Available'),
        [allVehiclesWithVendor, data.assignments, data.travelPlans, data.shuttlePlans]
    );

    const driverOf = (vehicleId) => data.drivers.find(d => d.vehicleId === vehicleId) || null;

    // An idle driver (Active, not currently paired to any vehicle) from the same vendor as the
    // vehicle being staffed, whose License Class actually covers it and who's actually clear to be
    // dispatched (own compliance Approved, not On Hold behind a not-yet-verified vendor) - mirrors
    // the vendor-scoped pairing rule, the license-class rule, and the compliance rule already
    // enforced in Vendors & Fleet's manual pairing (window.requestPairing).
    const idleDriverFor = (vehicle, excludeDriverIds) =>
        data.drivers.find(d => d.vendor === vehicle.vendorName && d.status === 'Active' && !d.vehicleId
            && !excludeDriverIds.has(d.id) && driverLicensePermits(d, vehicle.type) && !driverComplianceBadge(d, data)) || null;

    // Greedily resolves a list of per-leg seat counts against autoAssignPool. For each leg it prefers
    // (in order): a vehicle whose category matches the trip's preferred type, then the smallest
    // capacity that still fits (so a 40-seat bus isn't burned on a 3-seat leg), then - among equal
    // options - one that already has a driver so the trip starts fully staffed. A vehicle claimed for
    // one leg is removed from the pool before the next leg is considered, so a multi-leg trip never
    // double-books the same vehicle. If the best-fit vehicle has no driver, an idle driver from its
    // own vendor is paired to it right here as part of the same resolution, not left blank.
    const resolveLegs = (seatsPerLeg, preferredType) => {
        const claimedVehicles = new Set();
        const claimedDrivers = new Set();
        return seatsPerLeg.map(seats => {
            const candidates = autoAssignPool
                .filter(v => !claimedVehicles.has(v.id) && v.capacity >= seats)
                .sort((a, b) => {
                    const aMatch = preferredType && a.type === preferredType ? 0 : 1;
                    const bMatch = preferredType && b.type === preferredType ? 0 : 1;
                    if (aMatch !== bMatch) return aMatch - bMatch;
                    if (a.capacity !== b.capacity) return a.capacity - b.capacity;
                    const aHas = driverOf(a.id) ? 0 : 1;
                    const bHas = driverOf(b.id) ? 0 : 1;
                    return aHas - bHas;
                });
            const vehicle = candidates[0] || null;
            if (!vehicle) return { seats, vehicle: null, driver: null, newlyPaired: false };
            claimedVehicles.add(vehicle.id);
            let driver = driverOf(vehicle.id);
            let newlyPaired = false;
            if (driver) {
                claimedDrivers.add(driver.id);
            } else {
                driver = idleDriverFor(vehicle, claimedDrivers);
                if (driver) { claimedDrivers.add(driver.id); newlyPaired = true; }
            }
            return { seats, vehicle, driver, newlyPaired };
        });
    };

    // Same accommodation -> origin / fixed default destination heuristic applyDemand already uses to
    // pre-fill the modal, pulled out as its own pure function so the card's Auto-Assign button can
    // derive a route without opening the modal at all.
    const deriveRouteFor = (demand) => ({
        origin: data.locations.includes(demand.accommodation) ? demand.accommodation : '',
        destination: data.locations.includes('Jawaharlal Nehru Stadium') ? 'Jawaharlal Nehru Stadium' : '',
    });

    // Turns a resolved set of legs into real travelPlans rows (Assigned where a vehicle was found,
    // Draft where none was available) plus the driver pairings that were newly made along the way -
    // both applied in one setData call so the plans and the drivers they depend on land together.
    const commitAutoAssignedPlans = ({ demand, origin, destination, legs }) => {
        const route = `${origin} -> ${destination}`;
        const legCount = legs.length;
        const newPlans = legs.map((leg, i) => ({
            id: uid('TP'), stakeholder: demand.stakeholder,
            ...(legCount > 1 ? { legLabel: `Group ${i + 1}/${legCount}` } : {}),
            accommodation: demand.accommodation, roomBlock: demand.accommodation,
            demandRef: demand.ref, source: demand.source, route, date: demand.checkIn || '',
            vehicle: leg.vehicle ? leg.vehicle.id : 'Unassigned',
            status: leg.vehicle ? 'Assigned' : 'Draft',
            passengers: leg.seats,
            manualPlanId: demand.sourceManualPlanId || null,
        }));
        const newPairings = legs.filter(l => l.newlyPaired && l.driver && l.vehicle);

        setData(d => ({
            ...d,
            travelPlans: [...d.travelPlans, ...newPlans],
            // Once a suggestion becomes a real plan (or set of split-leg plans) it's no longer
            // "pending" - drop it from the Suggested Plans queue instead of leaving a stale duplicate
            // suggestion sitting there. Applies whether every leg got a vehicle or some came up short
            // as Draft - either way the suggestion has been actioned, not abandoned.
            pendingDemands: d.pendingDemands.filter(pd => pd.ref !== demand.ref),
            drivers: newPairings.length
                ? d.drivers.map(dr => {
                    const pairing = newPairings.find(l => l.driver.id === dr.id);
                    return pairing ? { ...dr, vehicleId: pairing.vehicle.id } : dr;
                })
                : d.drivers,
            // Reverse link (fix-list item 31), all resulting legs at once.
            manualPlans: demand.sourceManualPlanId
                ? d.manualPlans.map(mp => mp.id === demand.sourceManualPlanId ? { ...mp, linkedRouteIds: [...(mp.linkedRouteIds || []), ...newPlans.map(p => p.id)] } : mp)
                : d.manualPlans,
        }));
    };

    // Holds { demand, origin, destination, legs } while a multi-vehicle auto-assignment is pending
    // confirmation - the admin should see exactly which vehicles (and drivers) are about to be
    // committed before anything is actually created, same reasoning as every other multi-step
    // confirm flow in this app. A single-vehicle trip skips this entirely and commits straight away.
    const [pendingAutoAssign, setPendingAutoAssign] = useState(null);

    // Result of a single-vehicle auto-assign (or a reason nothing was assigned), shown in its own
    // popup instead of a browser alert() - { demand, vehicle, driver } on success, { demand, noRoute:
    // true } when no route could be derived, { demand, noVehicle: true } when nothing fit.
    const [autoAssignResult, setAutoAssignResult] = useState(null);

    // The Suggested Plans card's Auto-Assign button - resolves and (for a single vehicle) commits
    // immediately, or (for multiple) stages the confirm popup instead.
    const autoAssignFromCard = (demand) => {
        const { origin, destination } = deriveRouteFor(demand);
        if (!origin || !destination) {
            setAutoAssignResult({ demand, noRoute: true });
            return;
        }
        const legCount = vehiclesNeededFor(demand);
        const cap = vehicleCapacity(effectivePreferredVehicle(demand)) || demand.headcount;
        let remaining = demand.headcount;
        const seatsPerLeg = Array.from({ length: legCount }, () => {
            const seats = Math.min(cap, remaining);
            remaining -= seats;
            return seats;
        });
        const legs = resolveLegs(seatsPerLeg, effectivePreferredVehicle(demand));

        if (legCount > 1) {
            setPendingAutoAssign({ demand, origin, destination, legs });
            return;
        }
        commitAutoAssignedPlans({ demand, origin, destination, legs });
        const [leg] = legs;
        setAutoAssignResult(leg.vehicle
            ? { demand, vehicle: leg.vehicle, driver: leg.driver }
            : { demand, noVehicle: true });
    };

    const [shuttleModal, setShuttleModal] = useState(false);
    const [shuttleForm, setShuttleForm] = useState({ ...DEFAULT_SHUTTLE_FORM });

    const toggleShuttleFormVehicle = (vehicleId) => {
        setShuttleForm(f => ({
            ...f,
            vehicles: f.vehicles.includes(vehicleId) ? f.vehicles.filter(v => v !== vehicleId) : [...f.vehicles, vehicleId],
        }));
    };

    const openShuttleModal = () => {
        setShuttleForm({ ...DEFAULT_SHUTTLE_FORM });
        setShuttleModal(true);
    };

    const createShuttlePlan = () => {
        if (!shuttleForm.origin || !shuttleForm.destination) return alert('Select both an origin and a destination.');
        if (shuttleForm.origin === shuttleForm.destination) return alert('Origin and destination must be different.');
        if (shuttleForm.startTime >= shuttleForm.endTime) return alert('End time must be after start time.');
        const plan = {
            id: uid('SHT'), origin: shuttleForm.origin, destination: shuttleForm.destination,
            frequencyMinutes: Number(shuttleForm.frequencyMinutes), startTime: shuttleForm.startTime, endTime: shuttleForm.endTime,
            vehicles: shuttleForm.vehicles, status: shuttleForm.vehicles.length > 0 ? 'Active' : 'Draft',
        };
        setData(d => ({ ...d, shuttlePlans: [...d.shuttlePlans, plan] }));
        setShuttleModal(false);
        setShuttleForm({ ...DEFAULT_SHUTTLE_FORM });
    };

    // A loop with no vehicles left on it can't actually run, so it drops back to Draft; getting its
    // first vehicle promotes it back to Active. Paused is a distinct, deliberate admin action and is
    // never overridden by these two - only the Pause/Resume button changes it.
    const addVehicleToShuttle = (shuttleId, vehicleId) => {
        if (!vehicleId) return;
        setData(d => ({
            ...d,
            shuttlePlans: d.shuttlePlans.map(s => {
                if (s.id !== shuttleId || s.vehicles.includes(vehicleId)) return s;
                return { ...s, vehicles: [...s.vehicles, vehicleId], status: s.status === 'Draft' ? 'Active' : s.status };
            }),
        }));
    };

    const removeVehicleFromShuttle = (shuttleId, vehicleId) => {
        setData(d => ({
            ...d,
            shuttlePlans: d.shuttlePlans.map(s => {
                if (s.id !== shuttleId) return s;
                const vehicles = s.vehicles.filter(v => v !== vehicleId);
                return { ...s, vehicles, status: vehicles.length === 0 && s.status === 'Active' ? 'Draft' : s.status };
            }),
        }));
    };

    // Editable straight from the Recurring Shuttle Plans table, same as vehicles being added/removed
    // inline there - a schedule tweak doesn't strand anything live the way a vehicle reassignment
    // would, so it applies instantly with no confirm step. Guards against 0/blank/negative values
    // (shuttleTripsPerDay and isShuttleOverextended both divide by this) by simply not committing an
    // invalid edit rather than allowing the schedule math to break.
    const updateShuttleFrequency = (shuttleId, value) => {
        const mins = Number(value);
        if (!Number.isFinite(mins) || mins <= 0) return;
        setData(d => ({
            ...d,
            shuttlePlans: d.shuttlePlans.map(s => s.id === shuttleId ? { ...s, frequencyMinutes: mins } : s),
        }));
    };

    const toggleShuttleStatus = (shuttleId) => {
        setData(d => ({
            ...d,
            shuttlePlans: d.shuttlePlans.map(s => s.id === shuttleId
                ? { ...s, status: s.status === 'Paused' ? (s.vehicles.length > 0 ? 'Active' : 'Draft') : 'Paused' }
                : s),
        }));
    };

    const handleImport = (file) => importCSV(file, rows => {
        const imported = rows.map(r => {
            const vehicle = r.vehicle || 'Unassigned';
            // Ongoing/Completed are derived from a linked assignment (window.routePlanStatus), never
            // stored directly - an imported row claiming either lands on the right stored status
            // instead (Assigned if it has a vehicle, Draft if not), same as every other creation path.
            const status = ['Draft', 'Assigned', 'Cancelled'].includes(r.status)
                ? r.status
                : (vehicle === 'Unassigned' ? 'Draft' : 'Assigned');
            return {
                id: r.id || uid('TP'), stakeholder: r.stakeholder, accommodation: r.accommodation,
                roomBlock: r.roomBlock, demandRef: r.demandRef, route: r.route, date: r.date || '',
                vehicle, status, passengers: Number(r.passengers) || 0,
            };
        });
        setData(d => ({ ...d, travelPlans: [...d.travelPlans, ...imported] }));
        alert(`Imported ${imported.length} travel plans.`);
    });

    const shuttleFormDist = lookupDistance(shuttleForm.origin, shuttleForm.destination);
    const shuttleFormOverextended = shuttleFormDist &&
        isShuttleOverextended(shuttleFormDist.durationMin, shuttleForm.frequencyMinutes, shuttleForm.vehicles.length);

    // Each renders one card for its list - defined as closures (not extracted components) so they
    // keep direct access to everything already in scope above (editingVehicleId, requestVehicleChange,
    // availableVehicles, etc.) without having to prop-drill it all through. Called once for the inline
    // preview slice and again, unsliced, inside that section's "View All" modal - same markup either way.
    const renderSuggestionCard = (d) => {
        const legCount = vehiclesNeededFor(d);
        return (
            <div key={d.ref} onClick={() => { applyDemand(d); setModal(true); }}
                className="bg-white border border-slate-200 border-l-4 border-l-amber-400 rounded-xl p-4 cursor-pointer hover:shadow-cardHover hover:border-l-amber-500 transition">
                <div className="flex items-start justify-between gap-2 mb-1.5">
                    <p className="font-semibold text-slate-800 text-sm leading-snug">{d.stakeholder}</p>
                    {d.stakeholderType && (
                        <span className="shrink-0 bg-indigo-50 text-indigo-600 text-[10px] font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap">{d.stakeholderType}</span>
                    )}
                </div>
                <p className="text-xs text-slate-500 flex items-center gap-1.5 mb-1">
                    <Icon name="building" size={12} className="text-slate-300 shrink-0" />
                    <span className="truncate">{d.accommodation || 'Accommodation not yet assigned'}</span>
                </p>
                {/* Every demand here is scoped to whichever event is actually running
                    (window.belongsToActiveProject) - the tag is only worth showing once it's set. */}
                {d.project && (
                    <p className="inline-flex items-center gap-1 text-[11px] text-brandAccent font-medium mb-2">
                        <span className="w-1 h-1 rounded-full bg-brandAccent shrink-0" />{d.project}
                    </p>
                )}
                <div className="flex items-center gap-4 text-xs text-slate-600 pt-3 border-t border-slate-100">
                    <span className="flex items-center gap-1.5"><Icon name="users" size={13} className="text-slate-400 shrink-0" />{d.headcount} pax</span>
                    <span className={`flex items-center gap-1.5 ${legCount > 1 ? 'text-amber-700 font-medium' : ''}`}>
                        <Icon name="fleet" size={13} className={legCount > 1 ? 'text-amber-500 shrink-0' : 'text-slate-400 shrink-0'} />
                        {legCount > 1 ? `${legCount} × ${effectivePreferredVehicle(d)}` : effectivePreferredVehicle(d)}
                    </span>
                </div>
                <button onClick={e => { e.stopPropagation(); autoAssignFromCard(d); }}
                    className="mt-3 w-full inline-flex items-center justify-center gap-1.5 text-xs font-medium text-brandAccent bg-blue-50 hover:bg-blue-100 rounded-lg py-1.5 transition">
                    <Icon name="travel" size={12} />Auto-Assign
                </button>
            </div>
        );
    };

    const renderPlanCard = (p) => {
        const [origin, destination] = p.route.split(' -> ');
        // Derived status (window.routePlanStatus), not p.status directly - a plan with a linked live
        // assignment shows as Ongoing/Completed here even though its own stored field never holds
        // those values (fix-list item 34).
        const status = routePlanStatus(p, data);
        const hasVehicle = status === 'Assigned' || status === 'Ongoing' || status === 'Completed';
        const accent = hasVehicle ? 'border-l-emerald-400' : 'border-l-slate-300';
        const driver = p.vehicle !== 'Unassigned' ? driverOf(p.vehicle) : null;
        return (
            <div key={p.id}
                className={`bg-white border border-slate-300 border-l-4 ${accent} rounded-xl p-4 shadow-sm hover:shadow-md hover:border-slate-400 transition-all`}>
                <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="flex items-center gap-3 min-w-0">
                        <div className={`w-10 h-10 rounded-full bg-gradient-to-br ${avatarGradientFor(p.stakeholder)} flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-sm ring-1 ring-black/5`}>
                            {initialsOf(p.stakeholder)}
                        </div>
                        <div className="min-w-0">
                            <div className="flex items-center gap-1.5 flex-wrap">
                                <span className="font-semibold text-slate-800 text-sm">{p.stakeholder}</span>
                                {p.legLabel && (
                                    <span className="shrink-0 bg-slate-100 text-slate-500 text-[10px] font-semibold px-1.5 py-0.5 rounded-full">{p.legLabel}</span>
                                )}
                            </div>
                            <div className="text-xs text-slate-400">{p.demandRef}  &middot;  {p.passengers} pax</div>
                        </div>
                    </div>
                    <Badge status={status} />
                </div>

                <div className="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-x-2.5 gap-y-1.5">
                    <span className="text-sm font-medium text-slate-700">{origin}</span>
                    <Icon name="arrowRight" size={12} className="text-slate-300 shrink-0" />
                    <span className="text-sm text-slate-500">{destination}</span>
                    <DistanceBadge origin={origin} destination={destination}
                        vehicle={p.vehicle !== 'Unassigned' ? allVehiclesWithVendor.find(v => v.id === p.vehicle) : null} data={data} />
                </div>

                <div className="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Accommodation</p>
                        <div className="flex items-center gap-1.5 text-sm text-slate-700">
                            <Icon name="building" size={13} className="text-slate-300 shrink-0" />
                            <span>{p.accommodation}</span>
                        </div>
                    </div>

                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Vehicle</p>
                        {hasVehicle && editingVehicleId !== p.id ? (
                            <div className="flex items-center gap-2">
                                <span className="w-6 h-6 rounded-lg bg-blue-50 text-brandAccent flex items-center justify-center shrink-0">
                                    <Icon name="fleet" size={12} />
                                </span>
                                <span className="text-sm font-medium text-slate-700">{vehicleLabel(p.vehicle)}</span>
                                <button onClick={() => setEditingVehicleId(p.id)}
                                    className="text-slate-400 hover:text-brandAccent transition shrink-0" aria-label="Edit assigned vehicle">
                                    <Icon name="edit" size={13} />
                                </button>
                            </div>
                        ) : (
                            <div className="flex items-center gap-2">
                                <select className="text-xs border border-slate-200 rounded-lg px-2 py-1.5 min-w-[150px] focus:outline-none focus:ring-2 focus:ring-brandAccent/30" value={p.vehicle}
                                    onChange={e => requestVehicleChange(p, e.target.value)}>
                                    <option value="Unassigned">Unassigned</option>
                                    {availableVehicles.map(v => (
                                        <option key={v.id} value={v.id}>{vehicleModelLabel(v)} · {v.id}</option>
                                    ))}
                                </select>
                                {hasVehicle && (
                                    <button onClick={() => setEditingVehicleId(null)}
                                        className="text-emerald-600 hover:text-emerald-700 transition shrink-0" aria-label="Save vehicle assignment">
                                        <Icon name="check" size={14} />
                                    </button>
                                )}
                            </div>
                        )}
                    </div>

                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Driver</p>
                        {driver ? (
                            <span className="flex items-center gap-1.5 text-sm text-slate-700"><Icon name="users" size={13} className="text-slate-300 shrink-0" />{driver.name}</span>
                        ) : <span className="text-sm text-slate-300">—</span>}
                    </div>
                </div>
            </div>
        );
    };

    const renderShuttleCard = (s) => {
        const accent = s.status === 'Paused' ? 'border-l-amber-400' : 'border-l-emerald-400';
        return (
            <div key={s.id}
                className={`bg-white border border-slate-300 border-l-4 ${accent} rounded-xl p-4 shadow-sm hover:shadow-md hover:border-slate-400 transition-all`}>
                <div className="flex flex-wrap items-start justify-between gap-3">
                    <div>
                        <div className="flex items-center gap-1.5 flex-wrap text-slate-800 font-semibold text-sm">
                            <span>{s.origin}</span>
                            <Icon name="arrowRight" size={12} className="text-slate-300 shrink-0" />
                            <span>{s.destination}</span>
                        </div>
                        <div className="mt-1"><DistanceBadge origin={s.origin} destination={s.destination} /></div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                        <Badge status={s.status} />
                        <Btn variant="outline" onClick={() => toggleShuttleStatus(s.id)}>
                            {s.status === 'Paused' ? 'Resume' : 'Pause'}
                        </Btn>
                    </div>
                </div>

                <div className="mt-3 pt-3 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Frequency</p>
                        <div className="flex items-center gap-1.5">
                            <input type="number" min="5" step="5" value={s.frequencyMinutes}
                                onChange={e => updateShuttleFrequency(s.id, e.target.value)}
                                className="w-16 px-2 py-1 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                            <span className="text-xs text-slate-400">min</span>
                        </div>
                        <div className="text-xs font-medium text-slate-700 mt-1">{shuttleFrequencyLabel(s.frequencyMinutes)}</div>
                        <div className="text-xs text-slate-400">~{shuttleTripsPerDay(s)} trips/day</div>
                        {isShuttleOverextended((lookupDistance(s.origin, s.destination) || {}).durationMin, s.frequencyMinutes, s.vehicles.length) && (
                            <div className="mt-1 inline-flex items-center gap-1 text-[10px] font-semibold text-amber-700">
                                <Icon name="alert" size={11} className="shrink-0" />Round trip may exceed schedule
                            </div>
                        )}
                    </div>

                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Operating Hours</p>
                        <div className="flex items-center gap-1.5 text-sm text-slate-700">
                            <Icon name="calendar" size={13} className="text-slate-300 shrink-0" />
                            {s.startTime} - {s.endTime}
                        </div>
                    </div>

                    <div>
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">Assigned Vehicles</p>
                        <div className="flex flex-wrap items-center gap-1.5">
                            {s.vehicles.map(vid => (
                                <span key={vid} className="inline-flex items-center gap-1 bg-blue-50 text-blue-700 text-[10px] font-semibold pl-2 pr-1 py-1 rounded-full">
                                    {vehicleLabel(vid)}
                                    <button onClick={() => removeVehicleFromShuttle(s.id, vid)} className="hover:text-red-600" aria-label={`Remove ${vehicleLabel(vid)}`}>
                                        <Icon name="close" size={10} />
                                    </button>
                                </span>
                            ))}
                            <select value="" onChange={e => addVehicleToShuttle(s.id, e.target.value)}
                                className="text-[10px] border border-dashed border-slate-300 rounded-full pl-2 pr-1 py-1 text-slate-400 focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                                <option value="">+ Add</option>
                                {availableVehicles.filter(v => !s.vehicles.includes(v.id)).map(v => (
                                    <option key={v.id} value={v.id}>{vehicleModelLabel(v)} · {v.id}</option>
                                ))}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // Each "View All" hands off to its own paginated page (12/page) instead of a Modal - same
    // renderer each list already uses for its inline preview, just unpaginated and full-width.
    if (showAllSuggestions) {
        return (
            <PaginatedListPage title="All Suggested Plans" items={filteredDemands} renderItem={renderSuggestionCard}
                onBack={() => setShowAllSuggestions(false)} gridClassName="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"
                emptyMessage="No suggestions match your search." />
        );
    }
    if (showAllPlans) {
        return (
            <PaginatedListPage title="All Active & Draft Plans" items={filteredPlans} renderItem={renderPlanCard}
                onBack={() => setShowAllPlans(false)} emptyMessage="No travel plans match your search or filter." />
        );
    }
    if (showAllShuttles) {
        return (
            <PaginatedListPage title="All Recurring Shuttle Plans" items={data.shuttlePlans} renderItem={renderShuttleCard}
                onBack={() => setShowAllShuttles(false)} emptyMessage="No recurring shuttle plans yet." />
        );
    }

    return (
        <div className="max-w-7xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Route Plans</h2>
                    <p className="text-sm text-slate-500">Daily route operations - suggested plans, active/draft assignments, and recurring shuttle loops</p>
                </div>
                <div className="flex gap-2 flex-wrap">
                    <ExportImport label="Route Plans" onExport={() => exportCSV('route-plans.csv', data.travelPlans)} onImport={handleImport}
                        sampleHeaders={['id', 'stakeholder', 'accommodation', 'roomBlock', 'demandRef', 'route', 'date', 'vehicle', 'status', 'passengers']} />
                    <Btn onClick={() => setModal(true)}>Create Route Plan</Btn>
                </div>
            </div>

            <div className="space-y-6">
                <Card
                    title="Suggested Plans (Action Required)"
                    action={
                        <button onClick={handleDemandSync} disabled={isSyncingDemands}
                            className="text-xs flex items-center gap-1 px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded transition-colors disabled:opacity-50">
                            <span className={`inline-block ${isSyncingDemands ? 'animate-spin' : ''}`}>↻</span>
                            {isSyncingDemands ? 'Syncing...' : 'Sync'}
                        </button>
                    }
                >
                    {/* Explains where a suggestion actually comes from, since none of it is a demand
                        another system pushed in - see data.pendingDemands' header comment and
                        window.TravelPlansTab's raiseTravelDemand. Worth stating in the UI itself, not
                        just in code comments, since this is the one place an admin might otherwise
                        assume VMS/TMS/Accommodation are creating these on their own. */}
                    <p className="px-5 pt-4 text-xs text-slate-400">
                        Generated by this platform from Travel Plans' own arrival and departure records,
                        cross-referenced against Accommodation, the Venue list (VMS), and the Tournament
                        Schedule (TMS) - none of those three hand over a ready-made demand.
                    </p>
                    <div className="px-5 pt-2 pb-1">
                        <div className="relative max-w-sm">
                            <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                            <input type="text" placeholder="Search suggestions..." value={suggestionSearch}
                                onChange={e => setSuggestionSearch(e.target.value)}
                                className="w-full pl-8 pr-3 py-1.5 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </div>
                    </div>

                    {filteredDemands.length === 0 ? (
                        <p className="px-5 py-8 text-sm text-slate-400 text-center">
                            {data.pendingDemands.length === 0
                                ? 'No suggested plans right now - new suggestions will appear here as arrival/departure and accommodation data comes in.'
                                : 'No suggestions match your search.'}
                        </p>
                    ) : (
                        <>
                            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 p-5">
                                {filteredDemands.slice(0, SUGGESTION_PREVIEW_LIMIT).map(renderSuggestionCard)}
                            </div>
                            {filteredDemands.length > SUGGESTION_PREVIEW_LIMIT && (
                                <div className="px-5 pb-5 -mt-1 text-center">
                                    <button onClick={() => setShowAllSuggestions(true)} className="text-sm font-medium text-brandAccent hover:underline">
                                        View All Suggested Plans ({filteredDemands.length}) →
                                    </button>
                                </div>
                            )}
                        </>
                    )}
                </Card>

                <Card title="Active & Draft Plans" className="overflow-hidden">
                    <div className="px-5 pt-4 flex flex-wrap gap-3">
                        <div className="relative flex-1 min-w-[200px]">
                            <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                            <input type="text" placeholder="Search by stakeholder, accommodation, or route..." value={planSearch}
                                onChange={e => setPlanSearch(e.target.value)}
                                className="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </div>
                        <select value={planStatusFilter} onChange={e => setPlanStatusFilter(e.target.value)}
                            className="px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30">
                            {['All', ...ROUTE_PLAN_STATUSES].map(o => <option key={o} value={o}>{o === 'All' ? 'All Statuses' : o}</option>)}
                        </select>
                    </div>

                    <div className="mt-4 px-5 pb-5">
                        {filteredPlans.length === 0 && (
                            <div className="text-center text-slate-400 text-sm py-10 border border-dashed border-slate-200 rounded-xl">
                                {data.travelPlans.length === 0 ? 'No travel plans yet - create one from a suggestion or manually.' : 'No travel plans match your search or filter.'}
                            </div>
                        )}

                        {/* Each plan is a self-contained card, not a table row squeezed into fixed
                            columns - stakeholder names, accommodations, and routes vary wildly in
                            length, and cramming all six fields side by side left barely enough room
                            for anything before it had to truncate. Stacking Route on its own full-width
                            line and grouping Accommodation/Vehicle/Driver into a labeled 3-up row below
                            gives every field room to actually be read. */}
                        <div className="space-y-3">
                            {filteredPlans.slice(0, PLAN_PREVIEW_LIMIT).map(renderPlanCard)}
                        </div>
                        {filteredPlans.length > PLAN_PREVIEW_LIMIT && (
                            <div className="pt-3 text-center">
                                <button onClick={() => setShowAllPlans(true)} className="text-sm font-medium text-brandAccent hover:underline">
                                    View All Plans ({filteredPlans.length}) →
                                </button>
                            </div>
                        )}
                    </div>
                </Card>

                <Card
                    title="Recurring Shuttle Plans"
                    className="overflow-hidden"
                    action={
                        <Btn variant="outline" onClick={openShuttleModal}>
                            <Icon name="plus" size={14} className="inline mr-1" />Create Shuttle Plan
                        </Btn>
                    }
                >
                    <p className="px-5 pt-4 text-xs text-slate-500">Fixed-interval loops between two points, run by a pool of vehicles rather than a one-off trip each.</p>

                    <div className="mt-3 px-5 pb-5">
                        {data.shuttlePlans.length === 0 && (
                            <div className="text-center text-slate-400 text-sm py-10 border border-dashed border-slate-200 rounded-xl">
                                No recurring shuttle plans yet - create one to run a fixed-interval loop between two points.
                            </div>
                        )}

                        {/* Same card-per-row treatment as Active & Draft Plans above, for the same
                            reason - Route up top full-width (it carries the distance/cost badges too),
                            then a labeled 3-up row for Frequency/Hours/Vehicles instead of forcing them
                            into narrow fixed columns. */}
                        <div className="space-y-3">
                            {data.shuttlePlans.slice(0, SHUTTLE_PREVIEW_LIMIT).map(renderShuttleCard)}
                        </div>
                        {data.shuttlePlans.length > SHUTTLE_PREVIEW_LIMIT && (
                            <div className="pt-3 text-center">
                                <button onClick={() => setShowAllShuttles(true)} className="text-sm font-medium text-brandAccent hover:underline">
                                    View All Shuttle Plans ({data.shuttlePlans.length}) →
                                </button>
                            </div>
                        )}
                    </div>
                </Card>
            </div>

            {/* Create Shuttle Plan Modal */}
            <Modal open={shuttleModal} onClose={() => setShuttleModal(false)} title="Create Recurring Shuttle Plan">
                <div className="space-y-3">
                    <div className="grid grid-cols-2 gap-3">
                        <Select label="Origin (Point A)" value={shuttleForm.origin} onChange={e => setShuttleForm(f => ({ ...f, origin: e.target.value }))}
                            options={[{ value: '', label: 'Select Location...' }, ...data.locations.map(l => ({ value: l, label: l }))]} />
                        <Select label="Destination (Point B)" value={shuttleForm.destination} onChange={e => setShuttleForm(f => ({ ...f, destination: e.target.value }))}
                            options={[{ value: '', label: 'Select Location...' }, ...data.locations.map(l => ({ value: l, label: l }))]} />
                    </div>
                    <DistanceStatCard origin={shuttleForm.origin} destination={shuttleForm.destination} />

                    <div>
                        <span className="text-xs font-medium text-slate-500 mb-1 block">Frequency (minutes)</span>
                        <div className="flex items-center gap-2">
                            <input type="number" min="5" step="5" value={shuttleForm.frequencyMinutes}
                                onChange={e => setShuttleForm(f => ({ ...f, frequencyMinutes: e.target.value }))}
                                className="w-24 px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                            <span className="text-xs text-slate-500">{shuttleFrequencyLabel(Number(shuttleForm.frequencyMinutes) || 0)}</span>
                        </div>
                        <div className="flex gap-1.5 mt-2">
                            {SHUTTLE_FREQUENCIES.map(m => (
                                <button key={m} type="button" onClick={() => setShuttleForm(f => ({ ...f, frequencyMinutes: m }))}
                                    className={`px-2.5 py-1 text-[11px] font-medium rounded-full border transition ${Number(shuttleForm.frequencyMinutes) === m ? 'border-brandAccent text-brandAccent bg-brandAccent/5' : 'border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                    {shuttleFrequencyLabel(m)}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        <label className="block">
                            <span className="text-xs font-medium text-slate-500 mb-1 block">Operating Start</span>
                            <input type="time" value={shuttleForm.startTime} onChange={e => setShuttleForm(f => ({ ...f, startTime: e.target.value }))}
                                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </label>
                        <label className="block">
                            <span className="text-xs font-medium text-slate-500 mb-1 block">Operating End</span>
                            <input type="time" value={shuttleForm.endTime} onChange={e => setShuttleForm(f => ({ ...f, endTime: e.target.value }))}
                                className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brandAccent/30 focus:border-brandAccent" />
                        </label>
                    </div>

                    <div>
                        <span className="text-xs font-medium text-slate-500 mb-1.5 block">Assign Vehicles</span>
                        <div className="border border-slate-200 rounded-lg max-h-48 overflow-y-auto divide-y divide-slate-100">
                            {/* This list stays roadworthy-only, not Available-only, by design (same
                                "a human overriding the system" reasoning as Route Plans' own manual
                                dropdown) - so a vehicle already busy elsewhere still shows up, just
                                flagged (fix-list items 57/58) instead of hidden, a warning rather than
                                a block. A recurring shuttle has no single date to check against yet
                                (fix-list item 95, not in this pass), so this flags the narrower,
                                always-checkable case: already committed to another running shuttle
                                loop right now. */}
                            {availableVehicles.map(v => {
                                const shuttleConflict = data.shuttlePlans.find(s => s.status === 'Active' && s.id !== shuttleForm.id && s.vehicles.includes(v.id));
                                return (
                                    <label key={v.id} className="flex items-center gap-2 px-3 py-2 text-sm hover:bg-slate-50 cursor-pointer">
                                        <input type="checkbox" checked={shuttleForm.vehicles.includes(v.id)} onChange={() => toggleShuttleFormVehicle(v.id)} />
                                        <span className="flex-1">
                                            {vehicleModelLabel(v)} · {v.id}
                                            {shuttleConflict && (
                                                <span className="block text-[11px] text-amber-600">Already in {shuttleConflict.origin} → {shuttleConflict.destination}</span>
                                            )}
                                        </span>
                                        <span className="text-xs text-slate-400">{v.capacity} seats</span>
                                    </label>
                                );
                            })}
                            {availableVehicles.length === 0 && <p className="px-3 py-4 text-center text-xs text-slate-400">No active vehicles available.</p>}
                        </div>
                        <p className="text-xs text-slate-400 mt-1">
                            {shuttleForm.vehicles.length} vehicle{shuttleForm.vehicles.length === 1 ? '' : 's'} selected
                            {shuttleForm.vehicles.length === 0 && ' - the plan will be created as a Draft until at least one is assigned'}
                        </p>
                    </div>

                    {shuttleFormOverextended && (
                        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                            <p className="text-xs text-amber-800">
                                Estimated round trip is <strong>~{shuttleFormDist.durationMin * 2} min</strong>, longer than what {shuttleForm.vehicles.length}
                                {' '}vehicle{shuttleForm.vehicles.length === 1 ? '' : 's'} can cover on a {shuttleFrequencyLabel(shuttleForm.frequencyMinutes).toLowerCase()} schedule
                                {' '}(~{shuttleForm.frequencyMinutes * shuttleForm.vehicles.length} min budget). Add another vehicle or lower the frequency to keep departures on time.
                            </p>
                        </div>
                    )}

                    <Btn className="w-full" onClick={createShuttlePlan}>Create Shuttle Plan</Btn>
                </div>
            </Modal>

            {/* Create Route Plan Modal (Travel Module / Accommodation) */}
            <Modal open={modal} onClose={() => setModal(false)} title="Create Route Plan">
                <div className="space-y-3">
                    <Select label="Select Reference" value={form.demandRef} onChange={e => {
                        const d = data.pendingDemands.find(x => x.ref === e.target.value);
                        if (d) applyDemand(d);
                        else { setSelectedDemand(null); setForm(f => ({ ...f, demandRef: '' })); }
                    }} options={[{ value: '', label: 'Select reference...' }, ...data.pendingDemands.map(d => ({ value: d.ref, label: `[${d.source}] ${d.stakeholder}` }))]} />
                    {selectedDemand && (
                        <div className="bg-slate-50 rounded-lg p-3 text-xs text-slate-600">
                            <p><strong>Source:</strong> {selectedDemand.source}</p>
                            <p><strong>Reference:</strong> {selectedDemand.ref}</p>
                            <p><strong>Accommodation:</strong> {selectedDemand.accommodation}</p>
                            <p><strong>Headcount:</strong> {selectedDemand.headcount}  |  <strong>Vehicle Type:</strong> {effectivePreferredVehicle(selectedDemand)}
                                {vehicleCapacity(effectivePreferredVehicle(selectedDemand)) ? ` (${vehicleCapacity(effectivePreferredVehicle(selectedDemand))} seats)` : ''}
                                {selectedDemand.stakeholderType ? ` - via ${selectedDemand.stakeholderType} mapping` : ' - from the demand itself, no stakeholder type set'}</p>
                            <p><strong>Check-in{selectedDemand.checkOut ? '/out' : ''}:</strong> {selectedDemand.checkIn}{selectedDemand.checkOut ? ` -> ${selectedDemand.checkOut}` : ''}</p>
                        </div>
                    )}

                    {selectedDemand && (
                        <Select label="Stakeholder Type" value={selectedDemand.stakeholderType || ''}
                            onChange={e => setDemandStakeholderType(selectedDemand.ref, e.target.value)}
                            options={[{ value: '', label: 'Not set - use preferredVehicle as-is' }, ...STAKEHOLDER_TYPES.map(t => ({ value: t, label: t }))]} />
                    )}

                    {selectedDemand && vehiclesNeededFor(selectedDemand) > 1 && (
                        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                            <p className="text-xs text-amber-800">
                                {selectedDemand.headcount} people won't fit in a single {effectivePreferredVehicle(selectedDemand)}
                                ({vehicleCapacity(effectivePreferredVehicle(selectedDemand))} seats). Creating this plan will split it into{' '}
                                <strong>{vehiclesNeededFor(selectedDemand)} separate legs</strong> ("Group 1/{vehiclesNeededFor(selectedDemand)}", etc.).
                                You'll see exactly which vehicles (and drivers) get auto-assigned to each leg before anything is created.
                            </p>
                        </div>
                    )}

                    <div className="grid grid-cols-2 gap-3">
                        <Select label="Origin (Point A)" value={form.origin} onChange={e => setForm({ ...form, origin: e.target.value })}
                            options={[{ value: '', label: 'Select Location...' }, ...data.locations.map(l => ({ value: l, label: l }))]} />
                        <Select label="Destination (Point B)" value={form.destination} onChange={e => setForm({ ...form, destination: e.target.value })}
                            options={[{ value: '', label: 'Select Location...' }, ...data.locations.map(l => ({ value: l, label: l }))]} />
                    </div>
                    <DistanceStatCard origin={form.origin} destination={form.destination}
                        vehicle={form.vehicle !== 'Unassigned' ? allVehiclesWithVendor.find(v => v.id === form.vehicle) : null} data={data} />

                    {(!selectedDemand || vehiclesNeededFor(selectedDemand) <= 1) && (
                        <div>
                            <Select label="Assign Vehicle" value={form.vehicle} onChange={e => setForm({ ...form, vehicle: e.target.value })}
                                options={[
                                    { value: 'Unassigned', label: 'Unassigned' },
                                    ...routeModalVehicleOptions.map(v => ({ value: v.id, label: `${vehicleModelLabel(v)} · ${v.id}` })),
                                ]} />
                            {selectedDemand && effectivePreferredVehicle(selectedDemand) && (
                                routeModalVehicleOptions.length === 0 ? (
                                    <p className="text-xs text-amber-600 mt-1">No Active {effectivePreferredVehicle(selectedDemand)} vehicles available right now.</p>
                                ) : (
                                    <p className="text-xs text-slate-400 mt-1">Narrowed to {effectivePreferredVehicle(selectedDemand)} - this demand's resolved vehicle type.</p>
                                )
                            )}
                            {(() => {
                                const conflict = vehicleSameDayConflict(form.vehicle, selectedDemand?.checkIn, null);
                                return conflict && (
                                    <div className="mt-2 bg-amber-50 border border-amber-200 rounded-lg p-2.5 flex gap-2">
                                        <Icon name="alert" size={14} className="text-amber-600 shrink-0 mt-0.5" />
                                        <p className="text-xs text-amber-800">
                                            {vehicleLabel(form.vehicle)} is already on <strong>{conflict.stakeholder}</strong> the same day ({conflict.route}). Double-check before assigning it here too.
                                        </p>
                                    </div>
                                );
                            })()}
                        </div>
                    )}

                    <Btn className="w-full" onClick={createPlan}>
                        {selectedDemand && vehiclesNeededFor(selectedDemand) > 1
                            ? `Create ${vehiclesNeededFor(selectedDemand)} Route Plans`
                            : 'Create Route Plan'}
                    </Btn>
                </div>
            </Modal>

            {/* Reassignment confirmation - changing the vehicle on a live plan takes the trip away
                from whoever's already dispatched on it, so it needs an explicit, informed confirm. */}
            <Modal open={!!pendingReassignment} onClose={() => setPendingReassignment(null)} title="Confirm Vehicle Reassignment">
                {pendingReassignment && (
                    <div className="space-y-4">
                        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                            <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                            <p className="text-sm text-amber-800">
                                This plan is <strong>Ongoing</strong> and already dispatched to <strong>{vehicleLabel(pendingReassignment.plan.vehicle)}</strong>.
                                Reassigning it will immediately notify that vehicle's driver the trip has been taken off them, and hand it to the new vehicle instead.
                            </p>
                        </div>
                        {(() => {
                            const conflict = vehicleSameDayConflict(pendingReassignment.newVehicle, pendingReassignment.plan.date, pendingReassignment.plan.id);
                            return conflict && (
                                <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                                    <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                                    <p className="text-sm text-amber-800">
                                        {vehicleLabel(pendingReassignment.newVehicle)} is already on <strong>{conflict.stakeholder}</strong> the same day ({conflict.route}) too.
                                    </p>
                                </div>
                            );
                        })()}
                        <div className="bg-slate-50 rounded-lg p-3 text-xs text-slate-600 space-y-1">
                            <p><strong>Stakeholder:</strong> {pendingReassignment.plan.stakeholder}</p>
                            <p><strong>Route:</strong> {pendingReassignment.plan.route}</p>
                            <p><strong>Current Vehicle:</strong> {vehicleLabel(pendingReassignment.plan.vehicle)}</p>
                            <p><strong>New Vehicle:</strong> {vehicleLabel(pendingReassignment.newVehicle)}</p>
                        </div>
                        <div className="flex gap-2">
                            <Btn variant="danger" onClick={confirmReassignment}>Confirm Reassignment</Btn>
                            <Btn variant="outline" onClick={() => setPendingReassignment(null)}>Cancel</Btn>
                        </div>
                    </div>
                )}
            </Modal>

            {/* Multi-vehicle auto-assign confirmation - a trip that needs more than one vehicle is
                staged here first so the admin sees exactly which vehicles (and drivers) are about to
                be booked before anything is actually created. A single-vehicle auto-assign never
                shows this - it just commits, same as any other cheap, low-risk Draft-plan change. */}
            <Modal open={!!pendingAutoAssign} onClose={() => setPendingAutoAssign(null)} title="Confirm Auto-Assigned Vehicles" wide>
                {pendingAutoAssign && (
                    <div className="space-y-4">
                        <p className="text-sm text-slate-600">
                            <strong>{pendingAutoAssign.demand.headcount} people</strong> for <strong>{pendingAutoAssign.demand.stakeholder}</strong> need{' '}
                            <strong>{pendingAutoAssign.legs.length} vehicles</strong>. Review what's about to be booked before confirming.
                        </p>
                        <div className="space-y-2">
                            {pendingAutoAssign.legs.map((leg, i) => (
                                <div key={i} className="flex items-start justify-between gap-3 border border-slate-200 rounded-lg p-3">
                                    <div className="min-w-0">
                                        <p className="text-sm font-medium text-slate-700">
                                            Group {i + 1}/{pendingAutoAssign.legs.length} <span className="text-slate-400 font-normal">· {leg.seats} pax</span>
                                        </p>
                                        {leg.vehicle ? (
                                            <p className="text-xs text-slate-500 mt-0.5">
                                                {vehicleModelLabel(leg.vehicle)} · {leg.vehicle.id} · {leg.vehicle.vendorName}
                                                {leg.driver
                                                    ? ` · Driver: ${leg.driver.name}${leg.newlyPaired ? ' (newly paired)' : ''}`
                                                    : ' · No driver available yet'}
                                                {(() => {
                                                    const dist = window.lookupDistance(pendingAutoAssign.origin, pendingAutoAssign.destination);
                                                    const cost = dist ? window.estimateTripCost(leg.vehicle, dist.distanceKm, dist.durationMin, data, leg.driver) : null;
                                                    return cost ? ` · ≈ ₹${cost.total} est. cost` : '';
                                                })()}
                                            </p>
                                        ) : (
                                            <p className="text-xs text-red-600 mt-0.5">No Available vehicle currently fits this leg - will be created as a Draft plan instead.</p>
                                        )}
                                    </div>
                                    <Icon name={leg.vehicle ? 'check' : 'alert'} size={16} className={`shrink-0 mt-0.5 ${leg.vehicle ? 'text-emerald-500' : 'text-amber-500'}`} />
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-2">
                            <Btn onClick={() => { commitAutoAssignedPlans(pendingAutoAssign); setPendingAutoAssign(null); resetCreateForm(); }}>
                                Confirm & Create {pendingAutoAssign.legs.length} Route Plans
                            </Btn>
                            <Btn variant="outline" onClick={() => setPendingAutoAssign(null)}>Cancel</Btn>
                        </div>
                    </div>
                )}
            </Modal>

            {/* Result of a single-vehicle Auto-Assign click - was a plain browser alert() before,
                which looked (and read) nothing like the rest of this app. Vehicle and Driver each get
                their own full-width labeled row with a colored icon badge (never a fixed-width grid
                column - "Honda Amaze (Sedan) · VH-9801" wrapped mid-ID the one time this was tried
                as a 2-up grid in a non-wide modal, and there was no need for the columns anyway with
                only two fields). Same gradient-avatar treatment as a plan card in the list above it. */}
            <Modal open={!!autoAssignResult} onClose={() => setAutoAssignResult(null)} title="Vehicle Auto-Assigned">
                {autoAssignResult && (
                    <div className="space-y-4">
                        {autoAssignResult.noRoute ? (
                            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                                <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                                <p className="text-sm text-amber-800">
                                    Could not automatically determine a route for this suggestion - use "Create Route Plan" to set the origin/destination manually.
                                </p>
                            </div>
                        ) : autoAssignResult.noVehicle ? (
                            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex gap-2.5">
                                <Icon name="alert" size={18} className="text-amber-600 shrink-0 mt-0.5" />
                                <p className="text-sm text-amber-800">
                                    No Available vehicle currently fits <strong>{autoAssignResult.demand.stakeholder}</strong> ({autoAssignResult.demand.headcount} pax) right now - created as a Draft plan instead.
                                </p>
                            </div>
                        ) : (
                            <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className={`w-11 h-11 rounded-full bg-gradient-to-br ${avatarGradientFor(autoAssignResult.demand.stakeholder)} flex items-center justify-center text-white text-sm font-bold shrink-0 shadow-sm ring-1 ring-black/5`}>
                                        {initialsOf(autoAssignResult.demand.stakeholder)}
                                    </div>
                                    <div className="min-w-0">
                                        <p className="font-semibold text-slate-800 text-sm truncate">{autoAssignResult.demand.stakeholder}</p>
                                        <p className="text-xs text-slate-400">{autoAssignResult.demand.headcount} pax</p>
                                    </div>
                                </div>
                                <div className="mt-4 pt-4 border-t border-slate-100 space-y-3">
                                    <div className="flex items-center gap-3">
                                        <span className="w-9 h-9 rounded-xl bg-blue-50 text-brandAccent flex items-center justify-center shrink-0">
                                            <Icon name="fleet" size={16} />
                                        </span>
                                        <div className="min-w-0">
                                            <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Vehicle</p>
                                            <p className="text-sm font-medium text-slate-700">{vehicleModelLabel(autoAssignResult.vehicle)} · {autoAssignResult.vehicle.id}</p>
                                            {/* Which vendor this came from - worth tracking since the
                                                whole point of auto-assign is picking from every vendor's
                                                fleet at once, not just the one you'd expect. */}
                                            <p className="text-xs text-slate-400">{autoAssignResult.vehicle.vendorName}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="w-9 h-9 rounded-xl bg-violet-50 text-violet-600 flex items-center justify-center shrink-0">
                                            <Icon name="users" size={16} />
                                        </span>
                                        <div className="min-w-0">
                                            <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Driver</p>
                                            {autoAssignResult.driver ? (
                                                <>
                                                    <p className="text-sm font-medium text-slate-700">{autoAssignResult.driver.name}</p>
                                                    <p className="text-xs text-slate-400">{autoAssignResult.driver.vendor}</p>
                                                </>
                                            ) : <p className="text-sm text-slate-400">No driver available yet</p>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        <Btn className="w-full" onClick={() => setAutoAssignResult(null)}>Done</Btn>
                    </div>
                )}
            </Modal>
        </div>
    );
};

// Inline preview limits for the Arrivals/Departures lists below the hero - "View All" unlocks the
// rest in a modal, same convention as Route Plans' three lists.
const ARRIVAL_PREVIEW_LIMIT = 4;
const DEPARTURE_PREVIEW_LIMIT = 4;

// Arrival/departure data, split out from Route Plans into its own tab - a detailed record per
// ticket/group ticket (Create Travel Plan), a live Flight/Train status hero pulled off each record's
// transport number + PNR (mockTransportStatus - see the "Travel API Integration and PNR Tracking"
// exploration this stands in for), and separate Arrivals/Departures lists underneath. Route-level
// concerns (suggested plans, active/draft assignments, recurring shuttles) stay on Route Plans -
// this tab only ever deals with who's arriving/departing, how, and when.
window.TravelPlansTab = ({ data, setData }) => {
    const [manualModal, setManualModal] = useState(false);
    const [planType, setPlanType] = useState('Arrival');
    const [transportMode, setTransportMode] = useState('Flight');
    const [manualPlanForm, setManualPlanForm] = useState({ ...DEFAULT_MANUAL_FORM });
    // Participants are never prefetched - each plan starts with an empty roster and the admin adds
    // exactly who's on this specific arrival/departure.
    const [people, setPeople] = useState([]);
    const [newPerson, setNewPerson] = useState({ ...BLANK_PERSON });
    // What's currently typed into the "Add Member" search box - kept separate from newPerson so the
    // raw ATOM ID/First/Last inputs below still work for a person who isn't in the directory yet.
    const [memberSearch, setMemberSearch] = useState('');
    const ticketInputRef = useRef(null);

    const [showAllArrivals, setShowAllArrivals] = useState(false);
    const [showAllDepartures, setShowAllDepartures] = useState(false);

    const groupHeader = planType === 'Arrival' ? 'Arrival Groups' : 'Departure Groups';
    const locationLabel = planType === 'Arrival' ? 'Arrival Location' : 'Departure Location';
    const dateLabel = planType === 'Arrival' ? 'Date of Arrival' : 'Date of Departure';
    // "(IST)" here rather than a per-record timezone field or any conversion logic (fix-list items
    // 104/126) - NG 2027 is a single-timezone, India-hosted programme, so every date/time in this
    // system, arrival/departure times included, is Indian Standard Time, full stop. A flight's
