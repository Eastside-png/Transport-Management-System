    // ticketed arrival time is already local-to-Delhi in real life, so this is a labeling decision,
    // not a data-model one - see the PRD's own note on this.
    const timeLabel = (planType === 'Arrival' ? 'Arrival Time' : 'Departure Time') + ' (IST)';
    const transportLabel = `${transportMode.toUpperCase()} No.`;

    const updateManual = (field, value) => setManualPlanForm(f => ({ ...f, [field]: value }));

    // Every person ever added to any Arrival/Departure group, deduplicated by ATOM ID - the closest
    // thing this prototype has to a personnel directory. Powers the "Point of Contact" search below
    // (by name or ATOM ID) and gives the overlap check something stable to match on instead of a
    // free-typed name. The roster being built right now is folded in too, so a POC can be picked
    // from this plan's own members before the plan is even saved.
    const atomDirectory = useMemo(() => {
        const seen = new Map();
        data.manualPlans.forEach(p => p.people.forEach(person => { if (person.id) seen.set(person.id, person); }));
        people.forEach(person => { if (person.id) seen.set(person.id, person); });
        return [...seen.values()];
    }, [data.manualPlans, people]);

    // Point of Contact numbers we've actually seen before, keyed by ATOM ID - built from every past
    // plan's own resolved POC (pocId + pocContact recorded together), not from the person roster
    // itself. A person only has a number on file here once they've actually been someone's POC
    // before - e.g. Kenji Watanabe (ATOM-10890) already is, on MAN-003. Lets picking a POC off the
    // directory pull in a phone number this plan never has to ask for again, the same "don't
    // re-type what the platform already knows" idea atomDirectory serves for names.
    const atomContacts = useMemo(() => {
        const map = new Map();
        data.manualPlans.forEach(p => { if (p.pocId && p.pocContact) map.set(p.pocId, p.pocContact); });
        return map;
    }, [data.manualPlans]);

    // Typing into the POC field either lands on a directory suggestion (formatted "Name (ATOM ID)" -
    // see the datalist below) or stays free text for a contact who isn't anyone's roster entry yet;
    // pocId is only ever set in the first case, so the overlap check below can tell a resolved ATOM
    // identity apart from a bare typed name.
    const updatePocName = (value) => {
        const match = value.match(/\(([^()]+)\)\s*$/);
        const hit = match ? atomDirectory.find(p => p.id === match[1]) : null;
        // Picking a directory suggestion (its value briefly lands in the input as "Name (ATOM ID)")
        // resolves back down to just the clean name in state - pocId is what actually remembers the
        // match, so the name shown everywhere else (cards, detail view) never carries the "(ID)" tail.
        // A known contact number rides along automatically; otherwise the field is left exactly as
        // it was so a manually-typed number for a first-time POC is never clobbered.
        setManualPlanForm(f => ({
            ...f,
            pocName: hit ? `${hit.firstName} ${hit.lastName}` : value,
            pocId: hit ? hit.id : null,
            pocContact: (hit && atomContacts.has(hit.id)) ? atomContacts.get(hit.id) : f.pocContact,
        }));
    };

    // Same directory, searchable by name or ATOM ID, for the "Add Member Manually" panel - picking a
    // suggestion fills in id/first/last/stakeholder type from a person this app has already seen
    // elsewhere instead of retyping them; typing something that matches nothing just stays free text
    // in the search box while the four fields below stay manually editable.
    const updateNewPersonFromSearch = (value) => {
        setMemberSearch(value);
        const match = value.match(/\(([^()]+)\)\s*$/);
        const hit = match ? atomDirectory.find(p => p.id === match[1]) : null;
        if (hit) {
            setNewPerson({ id: hit.id, firstName: hit.firstName, lastName: hit.lastName, stakeholderType: hit.stakeholderType, atomVerified: true });
        }
    };

    // Live draft date/time, combined the same way saveManualPlan combines them at save time - lets
    // the overlap warning below react as the admin fills in the form, not just after saving.
    const draftDate = (manualPlanForm.dateDD || manualPlanForm.dateMM || manualPlanForm.dateYYYY)
        ? `${manualPlanForm.dateDD.padStart(2, '0')}/${manualPlanForm.dateMM.padStart(2, '0')}/${manualPlanForm.dateYYYY}` : '';
    const draftTime = (manualPlanForm.timeHH || manualPlanForm.timeMM)
        ? `${manualPlanForm.timeHH.padStart(2, '0')}:${manualPlanForm.timeMM.padStart(2, '0')}` : '';

    // Module Settings' configurable window (fix-list item 55), falling back to the module default if
    // it's somehow unset.
    const pocOverlapWindowHours = data.settings?.pocOverlapWindowHours ?? POC_OVERLAP_WINDOW_HOURS;

    // The other plan (if any) this draft's Point of Contact is already double-booked against - see
    // plansShareOverlappingPoc/POC_OVERLAP_WINDOW_HOURS above.
    const pocConflict = useMemo(() => {
        if (!manualPlanForm.pocName.trim()) return null;
        const draft = { pocId: manualPlanForm.pocId, pocName: manualPlanForm.pocName, date: draftDate, time: draftTime };
        return data.manualPlans.find(p => plansShareOverlappingPoc(draft, p, pocOverlapWindowHours)) || null;
    }, [data.manualPlans, manualPlanForm.pocId, manualPlanForm.pocName, draftDate, draftTime, pocOverlapWindowHours]);

    const addPerson = () => {
        if (!newPerson.id.trim() || !newPerson.firstName.trim() || !newPerson.lastName.trim()) {
            alert('Enter an ATOM ID, first name and last name to add a participant.');
            return;
        }
        if (people.some(p => p.id === newPerson.id.trim())) {
            alert('A participant with this ATOM ID has already been added.');
            return;
        }
        setPeople(list => [...list, { ...newPerson, id: newPerson.id.trim(), firstName: newPerson.firstName.trim(), lastName: newPerson.lastName.trim() }]);
        setNewPerson({ ...BLANK_PERSON, stakeholderType: newPerson.stakeholderType });
        setMemberSearch('');
    };

    const removePerson = (id) => setPeople(list => list.filter(p => p.id !== id));

    const exportMembers = () => exportCSV('members.csv', people.map(p => ({
        AtomID: p.id, FirstName: p.firstName, LastName: p.lastName, StakeholderType: p.stakeholderType,
    })));

    // Imported rows are appended to whatever's already in the roster (not a replace), same as every
    // other CSV import in this app - duplicate ATOM IDs (either against the existing roster or
    // within the file itself) are skipped rather than silently overwritten, same rule addPerson enforces.
    const handleMemberImport = (file) => importCSV(file, rows => {
        const existingIds = new Set(people.map(p => p.id));
        const imported = [];
        let skipped = 0;
        rows.forEach(r => {
            const id = (r.AtomID || '').trim();
            const firstName = (r.FirstName || '').trim();
            const lastName = (r.LastName || '').trim();
            if (!id || !firstName || !lastName || existingIds.has(id)) { skipped++; return; }
            existingIds.add(id);
            imported.push({ id, firstName, lastName, stakeholderType: STAKEHOLDER_TYPES.includes(r.StakeholderType) ? r.StakeholderType : STAKEHOLDER_TYPES[0] });
        });
        setPeople(list => [...list, ...imported]);
        alert(`Imported ${imported.length} member${imported.length === 1 ? '' : 's'}.${skipped ? ` Skipped ${skipped} row(s) - missing ATOM ID/name or a duplicate.` : ''}`);
    });

    const handleTicketSelect = (e) => {
        const file = e.target.files[0];
        if (file) updateManual('uploadedTicket', file.name);
        e.target.value = '';
    };

    const clearTicket = () => updateManual('uploadedTicket', null);

    // Every new arrival or departure raises its own movement need into Route Plans' Suggested
    // Plans queue, unconditionally, the same "creating the record queues the follow-up work"
    // convention Vendors & Fleet already uses for compliance. This is the platform's own logic,
    // not a feed from TMS or Accommodation - see data.pendingDemands' header comment. The
    // stakeholder's accommodation is cross-referenced from data.accommodationAssignments by
    // federation, exactly the join Accommodation Management System integration is meant to do, a
    // federation with no assignment on file is left blank rather than guessed, the Travel Planner
    // fills it in from Create Route Plan same as any other partially-known suggestion.
    const raiseTravelDemand = (plan) => {
        const sameType = plan.people.length && plan.people.every(p => p.stakeholderType === plan.people[0].stakeholderType)
            ? plan.people[0].stakeholderType : null;
        const headcount = plan.people.length || Number(plan.memberSize) || 0;
        const accommodation = data.accommodationAssignments.find(a => a.federation === plan.federation)?.accommodation || '';
        const [dd, mm, yyyy] = (plan.date || '').split('/');
        const checkIn = (dd && mm && yyyy) ? `${yyyy}-${mm}-${dd}` : '';
        return {
            ref: uid(plan.planType === 'Arrival' ? 'ARR' : 'DEP'), source: 'Travel Module', project: data.activeProject,
            stakeholder: plan.federation ? `${plan.federation} - ${plan.departmentName}` : plan.departmentName,
            stakeholderType: sameType || undefined,
            accommodation, checkIn, headcount,
            preferredVehicle: (sameType && suggestedVehicleType(sameType, headcount)) || 'Minibus',
            // Traces this demand back to the Travel Plan record it was raised from (fix-list item
            // 31) - carried forward onto whatever Route Plan(s) eventually get created from it (see
            // window.RoutePlansTab/SuggestedRoutePlansCard), and used to write the reverse link
            // (linkedRouteIds) back onto this same manual plan once that happens.
            sourceManualPlanId: plan.id,
        };
    };

    const saveManualPlan = () => {
        if (!manualPlanForm.departmentName.trim()) {
            alert('Enter a Sport/Department name for this group before saving.');
            return;
        }
        const { dateDD, dateMM, dateYYYY, timeHH, timeMM, ...rest } = manualPlanForm;
        const date = (dateDD || dateMM || dateYYYY) ? `${dateDD.padStart(2, '0')}/${dateMM.padStart(2, '0')}/${dateYYYY}` : '';
        const time = (timeHH || timeMM) ? `${timeHH.padStart(2, '0')}:${timeMM.padStart(2, '0')}` : '';
        const plan = {
            id: uid('MAN'), planType, transportMode, ...rest, date, time, people,
            createdAt: new Date().toISOString().slice(0, 10),
            // Populated once a Route Plan is actually created from this plan's demand (fix-list item
            // 31) - see raiseTravelDemand's sourceManualPlanId and window.RoutePlansTab/
            // SuggestedRoutePlansCard's own linkBackToManualPlan.
            linkedRouteIds: [],
        };
        setData(d => ({
            ...d,
            manualPlans: [...d.manualPlans, plan],
            pendingDemands: [...d.pendingDemands, raiseTravelDemand(plan)],
        }));
        setManualModal(false);
        setManualPlanForm({ ...DEFAULT_MANUAL_FORM });
        setPeople([]);
        setNewPerson({ ...BLANK_PERSON });
        setMemberSearch('');
        setPlanType('Arrival');
        setTransportMode('Flight');
    };

    // planId -> nonce, bumped by "Refresh Status" to simulate a fresh poll of a live source rather
    // than the same mocked reading forever - see mockTransportStatus. refreshingStatusId tracks which
    // row is mid-refresh so its button can show a brief "Checking..." state, same simulated-latency
    // pattern as "Sync Accommodation & TMS" elsewhere in this app. Per-row (not one shared button) -
    // this is the detailed operational view, where refreshing one specific record at a time makes more
    // sense than the Dashboard preview's single "refresh everything at a glance" button.
    const [statusNonces, setStatusNonces] = useState({});
    const [refreshingStatusId, setRefreshingStatusId] = useState(null);
    const refreshLiveStatus = (planId) => {
        setRefreshingStatusId(planId);
        setTimeout(() => {
            setStatusNonces(n => ({ ...n, [planId]: (n[planId] || 0) + 1 }));
            setRefreshingStatusId(null);
        }, 900);
    };

    const openManualModal = () => {
        setManualPlanForm({ ...DEFAULT_MANUAL_FORM });
        setPeople([]);
        setNewPerson({ ...BLANK_PERSON });
        setMemberSearch('');
        setPlanType('Arrival');
        setTransportMode('Flight');
        setManualModal(true);
    };

    // Bulk import/export for the whole arrival/departure roster - separate from the per-record
    // "Add Member Manually" import inside the Create Travel Plan modal, which only ever fills one
    // record's own participant list.
    //
    // uploadedTicket is deliberately left out of both directions here - CSV is text-only, and every
    // "document" in this prototype has only ever been a filename string captured at upload time, never
    // real file content, so there's nothing for a CSV round-trip to actually carry even if it tried.
    // An imported record always starts with no ticket; attaching one stays a one-at-a-time action from
    // the record's own detail view, same as every other document field app-wide (see ImportButton's
    // `hint` prop below).
    const exportManualPlans = () => exportCSV('arrivals-departures.csv', data.manualPlans.map(p => ({
        id: p.id, planType: p.planType, departmentName: p.departmentName, federation: p.federation,
        memberSize: p.memberSize, date: p.date, time: p.time,
        transportMode: p.transportMode, transportNumber: p.transportNumber, pnrNumber: p.pnrNumber,
        city: p.city, location: p.location, pocId: p.pocId, pocName: p.pocName, pocContact: p.pocContact,
    })));
    const handleManualImport = (file) => importCSV(file, rows => {
        const imported = rows.map(r => ({
            id: r.id || uid('MAN'),
            planType: r.planType === 'Departure' ? 'Departure' : 'Arrival',
            departmentName: r.departmentName || '', federation: r.federation || '',
            memberSize: r.memberSize || '', date: r.date || '', time: r.time || '',
            transportMode: ['Flight', 'Train', 'Bus', 'Car'].includes(r.transportMode) ? r.transportMode : 'Flight',
            transportNumber: r.transportNumber || '', pnrNumber: r.pnrNumber || '',
            city: r.city || '', location: r.location || '',
            pocId: r.pocId || null, pocName: r.pocName || '', pocContact: r.pocContact || '',
            uploadedTicket: null, people: [],
            createdAt: new Date().toISOString().slice(0, 10),
            linkedRouteIds: [],
        }));
        // Same unconditional queue-the-follow-up rule as a manually created plan - a bulk imported
        // arrival or departure still needs a vehicle, so it still raises its own Suggested Plan.
        setData(d => ({
            ...d,
            manualPlans: [...d.manualPlans, ...imported],
            pendingDemands: [...d.pendingDemands, ...imported.map(raiseTravelDemand)],
        }));
        alert(`Imported ${imported.length} arrival/departure record(s). Ticket uploads aren't part of CSV - attach each one from its record's detail view.`);
    });

    // One arrival/departure record - group identity, transport + PNR, when, and (Flight/Train only)
    // a mocked Live Status reading with its own Refresh action. Bus/Car show a plain "not tracked"
    // note instead of a status pill, since there's no equivalent public tracking API for either.
    // Shared by the hero (Flight/Train only) and the Arrivals/Departures lists below (every mode).
    const renderManualPlanCard = (plan) => {
        const status = mockTransportStatus(plan.transportMode, plan.transportNumber, plan.pnrNumber, statusNonces[plan.id] || 0);
        const isTracked = plan.transportMode === 'Flight' || plan.transportMode === 'Train';
        const isRefreshing = refreshingStatusId === plan.id;
        return (
            <div key={plan.id} className="bg-white border border-slate-300 rounded-xl p-4 shadow-sm hover:shadow-md hover:border-slate-400 transition-all">
                <div className="flex flex-wrap items-start justify-between gap-3">
                    <div className="flex items-center gap-3 min-w-0">
                        <span className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 ${plan.planType === 'Arrival' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-brandAccent'}`}>
                            <TransportGlyph mode={plan.transportMode} size={17} />
                        </span>
                        <div className="min-w-0">
                            <p className="font-semibold text-slate-800 text-sm truncate">
                                {plan.departmentName}{plan.federation && <span className="text-slate-400 font-normal"> &middot; {plan.federation}</span>}
                            </p>
                            <p className="text-xs text-slate-400 truncate">{planStakeholderSummary(plan)} &middot; {plan.memberSize || plan.people.length || 0} member{Number(plan.memberSize) === 1 ? '' : 's'}</p>
                        </div>
                    </div>
                    <Badge status={plan.planType} />
                </div>

                <div className="mt-3 pt-3 border-t border-slate-100 grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.transportMode}</p>
                        <p className="text-slate-700 font-medium truncate">{plan.transportNumber || '—'}</p>
                    </div>
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">PNR</p>
                        <p className="text-slate-700 font-mono truncate">{plan.pnrNumber || '—'}</p>
                    </div>
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.planType} Time</p>
                        <p className="text-slate-700 truncate">{plan.date || '—'} {plan.time}</p>
                    </div>
                    <div className="min-w-0">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.location ? 'Location' : 'City'}</p>
                        <p className="text-slate-700 truncate">{plan.location || plan.city || '—'}</p>
                    </div>
                </div>

                {plan.uploadedTicket && (
                    <button type="button" onClick={() => alert(`Preview: ${plan.uploadedTicket}`)}
                        className="mt-2.5 inline-flex items-center gap-1.5 text-xs text-brandAccent hover:underline">
                        <Icon name="download" size={12} className="shrink-0" />{plan.uploadedTicket}
                    </button>
                )}

                <div className="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                    {isTracked ? (
                        status ? (
                            <div className="min-w-0">
                                <Badge status={status.status} />
                                <p className="text-xs text-slate-400 mt-1 truncate">{status.detail} &middot; as of {status.updatedAt}</p>
                            </div>
                        ) : (
                            <p className="text-xs text-slate-400">Enter a {plan.transportMode.toLowerCase()} number and PNR to check Live Status.</p>
                        )
                    ) : (
                        <p className="text-xs text-slate-400">Live status isn't tracked for {plan.transportMode}.</p>
                    )}
                    {isTracked && status && (
                        <button onClick={() => refreshLiveStatus(plan.id)} disabled={isRefreshing}
                            className="shrink-0 inline-flex items-center gap-1.5 text-xs font-semibold text-brandAccent hover:underline disabled:opacity-50 disabled:no-underline">
                            <span className={`inline-block leading-none ${isRefreshing ? 'animate-spin' : ''}`}>&#8635;</span>
                            {isRefreshing ? 'Checking...' : 'Refresh Status'}
                        </button>
                    )}
                </div>
            </div>
        );
    };

    // The Arrivals/Departures lists below are the record as entered on the form, not a live feed -
    // no Live Status/Refresh here (that's the hero's job, and only ever true for Flight/Train
    // anyway). Instead each card is clickable, opening the full detail view (every form field, POC,
    // ticket, and the member roster) - see selectedPlanId/the "Travel Plan Details" modal below.
    const [selectedPlanId, setSelectedPlanId] = useState(null);
    const selectedPlan = selectedPlanId ? data.manualPlans.find(p => p.id === selectedPlanId) : null;

    const renderPlanRecordCard = (plan) => (
        <button key={plan.id} onClick={() => setSelectedPlanId(plan.id)}
            className="w-full text-left bg-white border border-slate-300 rounded-xl p-4 shadow-sm hover:shadow-md hover:border-slate-400 transition-all">
            <div className="flex flex-wrap items-start justify-between gap-3">
                <div className="flex items-center gap-3 min-w-0">
                    <span className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 ${plan.planType === 'Arrival' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-brandAccent'}`}>
                        <TransportGlyph mode={plan.transportMode} size={17} />
                    </span>
                    <div className="min-w-0">
                        <p className="font-semibold text-slate-800 text-sm truncate">
                            {plan.departmentName}{plan.federation && <span className="text-slate-400 font-normal"> &middot; {plan.federation}</span>}
                        </p>
                        <p className="text-xs text-slate-400 truncate">{planStakeholderSummary(plan)} &middot; {plan.memberSize || plan.people.length || 0} member{Number(plan.memberSize) === 1 ? '' : 's'}</p>
                    </div>
                </div>
                <Badge status={plan.planType} />
            </div>

            <div className="mt-3 pt-3 border-t border-slate-100 grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                <div className="min-w-0">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.transportMode}</p>
                    <p className="text-slate-700 font-medium truncate">{plan.transportNumber || '—'}</p>
                </div>
                <div className="min-w-0">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">PNR</p>
                    <p className="text-slate-700 font-mono truncate">{plan.pnrNumber || '—'}</p>
                </div>
                <div className="min-w-0">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.planType} Time</p>
                    <p className="text-slate-700 truncate">{plan.date || '—'} {plan.time}</p>
                </div>
                <div className="min-w-0">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{plan.location ? 'Location' : 'City'}</p>
                    <p className="text-slate-700 truncate">{plan.location || plan.city || '—'}</p>
                </div>
            </div>

            {plan.uploadedTicket && (
                <p className="mt-2.5 inline-flex items-center gap-1.5 text-xs text-brandAccent">
                    <Icon name="download" size={12} className="shrink-0" />{plan.uploadedTicket}
                </p>
            )}
        </button>
    );

    // Department/federation/POC still match by substring same as every other search box in this
    // app; a member's ATOM ID also counts as a hit, so a plan can be found by who's actually on it,
    // not just its group-level fields - this is "ATOM ID is searchable within the Travel Plan" (the
    // per-member entry form is the only place an ID gets typed in, this is where it pays off).
    const [planSearch, setPlanSearch] = useState('');
    const matchesPlanSearch = (plan, q) => !q
        || (plan.departmentName || '').toLowerCase().includes(q)
        || (plan.federation || '').toLowerCase().includes(q)
        || (plan.pocName || '').toLowerCase().includes(q)
        || (plan.pocId || '').toLowerCase().includes(q)
        || plan.people.some(p => (p.id || '').toLowerCase().includes(q) || `${p.firstName} ${p.lastName}`.toLowerCase().includes(q));

    const arrivals = useMemo(() => {
        const q = planSearch.trim().toLowerCase();
        return data.manualPlans.filter(p => p.planType === 'Arrival' && matchesPlanSearch(p, q));
    }, [data.manualPlans, planSearch]);
    const departures = useMemo(() => {
        const q = planSearch.trim().toLowerCase();
        return data.manualPlans.filter(p => p.planType === 'Departure' && matchesPlanSearch(p, q));
    }, [data.manualPlans, planSearch]);
    const flightRecords = useMemo(() => data.manualPlans.filter(p => p.transportMode === 'Flight'), [data.manualPlans]);
    const trainRecords = useMemo(() => data.manualPlans.filter(p => p.transportMode === 'Train'), [data.manualPlans]);

    // Pulled out to its own variable (rather than inlined in just the main return) so the two
    // paginated full-page views below can render it too - clicking a card there needs to open the
    // same detail modal a card in the inline preview does.
    const planDetailModal = (
        <Modal open={!!selectedPlan} onClose={() => setSelectedPlanId(null)} title="Travel Plan Details" wide>
            {selectedPlan && (
                <div className="max-h-[75vh] overflow-y-auto -mx-1 px-1 space-y-5">
                    <div className="flex items-start justify-between gap-3">
                        <div className="flex items-center gap-3 min-w-0">
                            <span className={`w-11 h-11 rounded-xl flex items-center justify-center shrink-0 ${selectedPlan.planType === 'Arrival' ? 'bg-emerald-50 text-emerald-600' : 'bg-blue-50 text-brandAccent'}`}>
                                <TransportGlyph mode={selectedPlan.transportMode} size={20} />
                            </span>
                            <div className="min-w-0">
                                <p className="font-semibold text-slate-800 text-base truncate">{selectedPlan.departmentName}</p>
                                <p className="text-xs text-slate-400 truncate">{selectedPlan.federation || 'No federation set'}</p>
                            </div>
                        </div>
                        <Badge status={selectedPlan.planType} />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4">
                        <div>
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Group Details</p>
                            <div className="space-y-1.5 text-sm">
                                <p><span className="text-slate-400">Stakeholder Type(s): </span><span className="text-slate-700">{planStakeholderSummary(selectedPlan)}</span></p>
                                <p><span className="text-slate-400">Member Size: </span><span className="text-slate-700">{selectedPlan.memberSize || selectedPlan.people.length || 0}</span></p>
                            </div>
                        </div>
                        <div>
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Point of Contact</p>
                            <div className="space-y-1.5 text-sm">
                                <p><span className="text-slate-400">Name: </span><span className="text-slate-700">{selectedPlan.pocName || '—'}</span></p>
                                {selectedPlan.pocId && <p><span className="text-slate-400">ATOM ID: </span><span className="text-slate-700 font-mono">{selectedPlan.pocId}</span></p>}
                                <p><span className="text-slate-400">Contact: </span><span className="text-slate-700">{selectedPlan.pocContact || '—'}</span></p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">{selectedPlan.planType} Details</p>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm bg-slate-50 border border-slate-100 rounded-lg p-3">
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Mode</p>
                                <p className="text-slate-700">{selectedPlan.transportMode}</p>
                            </div>
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{selectedPlan.transportMode} No.</p>
                                <p className="text-slate-700 truncate">{selectedPlan.transportNumber || '—'}</p>
                            </div>
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">PNR</p>
                                <p className="text-slate-700 font-mono truncate">{selectedPlan.pnrNumber || '—'}</p>
                            </div>
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{selectedPlan.planType} Time</p>
                                <p className="text-slate-700">{selectedPlan.date || '—'} {selectedPlan.time}</p>
                            </div>
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">City</p>

<script type="text/babel">
/* global React, Icon, ExportImport, exportCSV, importCSV, calcVehiclesRequired, STAKEHOLDER_VEHICLE_MAP, suggestedVehicleType */
const { useState } = React;

window.FleetEstimationTab = ({ data, setData }) => {
    const { stakeholders, vehicleTypes, estimates } = data.fleetEstimation;

    const capacityOf = (type) => vehicleTypes.find(vt => vt.type === type)?.capacity || 0;

    // The one vehicle type a stakeholder's headcount actually calls for - the same rule Travel Plans
    // already uses to auto-assign a category to a demand (window.suggestedVehicleType): the smallest
    // of that stakeholder's mapped type(s) that fits everyone in a single vehicle, or the largest
    // mapped type once the group's too big for that. This is the whole point of the redesign - the
    // admin enters one headcount per stakeholder, not a number against a vehicle type they'd have to
    // pick themselves; Athletes (mapped to both Bus and Minibus) is the one case where the number
    // typed in actually changes which type comes back.
    const resolvedTypeFor = (stakeholder, users) =>
        suggestedVehicleType(stakeholder, users) || (STAKEHOLDER_VEHICLE_MAP[stakeholder] || [])[0] || null;

    const updateEstimate = (stakeholder, users) => {
        setData(d => ({
            ...d,
            fleetEstimation: { ...d.fleetEstimation, estimates: { ...d.fleetEstimation.estimates, [stakeholder]: Number(users) || 0 } },
        }));
    };

    const rows = stakeholders.map(s => {
        const users = estimates[s] || 0;
        const vehicleType = resolvedTypeFor(s, users);
        const capacity = capacityOf(vehicleType);
        return { stakeholder: s, users, vehicleType, capacity, required: calcVehiclesRequired(users, capacity) };
    });

    const buildExportRows = () => rows.map(r => ({
        Stakeholder: r.stakeholder, EstimatedUsers: r.users, VehicleType: r.vehicleType, Capacity: r.capacity, VehiclesRequired: r.required,
    }));

    // One tile per vehicle type, always - fixed to vehicleTypes' own order rather than built up from
    // whichever types stakeholders happen to currently resolve to. Building the tile list dynamically
    // (only a type that at least one stakeholder resolves to gets a tile) meant a type's tile would
    // wink out of the grid - and every tile after it would reshuffle position - the moment nothing
    // resolved to it anymore (e.g. Athletes dropping below 20 stops resolving to Bus, so the Bus tile
    // vanished and Minibus jumped to a different slot). A tile now just reads 0/0 instead of disappearing.
    const totals = vehicleTypes.map(vt => {
        const matching = rows.filter(r => r.vehicleType === vt.type);
        return {
            type: vt.type,
            users: matching.reduce((sum, r) => sum + r.users, 0),
            required: matching.reduce((sum, r) => sum + r.required, 0),
        };
    });

    const handleImport = (file) => importCSV(file, csvRows => {
        const newEstimates = { ...estimates };
        let skipped = 0;
        csvRows.forEach(r => {
            if (!stakeholders.includes(r.Stakeholder)) { skipped++; return; }
            newEstimates[r.Stakeholder] = Number(r.EstimatedUsers) || 0;
        });
        setData(d => ({ ...d, fleetEstimation: { ...d.fleetEstimation, estimates: newEstimates } }));
        alert(`Imported ${csvRows.length - skipped} estimation rows.${skipped ? ` Skipped ${skipped} row(s) for an unrecognized stakeholder.` : ''}`);
    });

    const grandTotal = rows.reduce((sum, r) => sum + r.required, 0);
    const grandUsers = rows.reduce((sum, r) => sum + r.users, 0);

    return (
        <div className="max-w-5xl mx-auto animate-in">
            <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                <div>
                    <h2 className="text-lg font-semibold text-slate-800">Fleet Estimation</h2>
                    <p className="text-sm text-slate-500">Enter how many of each stakeholder you're expecting - the vehicle type and count required resolve automatically.</p>
                </div>
                <ExportImport label="Estimation" onExport={() => exportCSV('fleet-estimation.csv', buildExportRows())} onImport={handleImport}
                    sampleHeaders={['Stakeholder', 'EstimatedUsers']} />
            </div>

            {/* At-a-glance totals up top - a highlighted grand total plus one tile per vehicle type
                actually in play, instead of making the reader sum every stakeholder row themselves. */}
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
                <div className="bg-gradient-to-br from-brandAccent to-blue-700 rounded-xl p-4 shadow-card text-white">
                    <p className="text-xs font-semibold uppercase tracking-wide text-blue-100">Total Fleet</p>
                    <p className="text-2xl font-bold mt-2">{grandTotal} <span className="text-xs font-medium text-blue-100">vehicles</span></p>
                    <p className="text-xs text-blue-100/80 mt-0.5">{grandUsers} estimated users</p>
                </div>
                {totals.map(t => (
                    <div key={t.type} className="bg-white border border-slate-200 rounded-xl p-4 shadow-card">
                        <div className="flex items-center justify-between">
                            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide">{t.type}</p>
                            <span className="w-7 h-7 rounded-lg bg-blue-50 text-brandAccent flex items-center justify-center shrink-0"><Icon name="fleet" size={14} /></span>
                        </div>
                        <p className="text-2xl font-bold text-slate-800 mt-2">{t.required} <span className="text-xs font-medium text-slate-400">vehicles</span></p>
                        <p className="text-xs text-slate-400 mt-0.5">{t.users} estimated users</p>
                    </div>
                ))}
            </div>

            {/* One row per stakeholder - a single "how many are you expecting" input, with the vehicle
                type it resolves to and how many of that type are required shown right alongside it.
                No more picking a vehicle type up front and estimating against that; the type comes out
                of the headcount instead of going in. */}
            <div className="space-y-2">
                {rows.map(r => (
                    <div key={r.stakeholder} className="bg-white border border-slate-300 rounded-xl p-4 shadow-sm hover:shadow-md transition-all flex flex-wrap items-center justify-between gap-4">
                        <div className="min-w-0">
                            <p className="font-semibold text-slate-800 text-sm">{r.stakeholder}</p>
                            <p className="text-xs text-slate-400 mt-0.5">
                                {r.vehicleType
                                    ? <>Resolves to <strong className="text-slate-600 font-semibold">{r.vehicleType}</strong> &middot; cap. {r.capacity} each</>
                                    : 'No vehicle type mapped to this stakeholder'}
                            </p>
                        </div>
                        <div className="flex items-center gap-3 shrink-0">
                            <div>
                                <span className="text-[10px] text-slate-400 uppercase tracking-wide block mb-0.5 text-center">Est. Users</span>
                                <input type="number" min="0" value={r.users}
                                    onChange={e => updateEstimate(r.stakeholder, e.target.value)}
                                    className="w-24 px-2 py-1.5 text-sm bg-white border border-slate-200 rounded-lg text-center focus:ring-2 focus:ring-brandAccent/30 focus:outline-none" />
                            </div>
                            <Icon name="arrowRight" size={14} className="text-slate-300 shrink-0 mt-4" />
                            <div className="bg-blue-50 rounded-lg px-4 py-2 text-center min-w-[92px]">
                                <span className="text-[10px] text-brandAccent/70 uppercase tracking-wide block mb-0.5 font-semibold truncate">{r.vehicleType || 'Vehicles'}</span>
                                <span className={`text-lg font-bold ${r.required > 0 ? 'text-brandAccent' : 'text-slate-300'}`}>{r.required}</span>
                            </div>
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
};

</script>

                    <Input label="City" value={f.city} onChange={e => update('city', e.target.value)} />
                    <Input label="Pin Code" value={f.pinCode} onChange={e => update('pinCode', e.target.value)} />
                </div>
            </Card>

            <Card className="p-5 mb-6">
                <p className="font-semibold text-slate-800 border-l-4 border-brandAccent pl-2.5 mb-4">Account & Access</p>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <Select label="Role" value={f.role} onChange={e => update('role', e.target.value)} options={['Master Admin', ...data.roles.map(r => r.name)]} />
                    <Select label="Status" value={f.status} onChange={e => update('status', e.target.value)} options={['Active', 'Inactive']} />
                </div>
                {/* Same Compliance Assignment fields as the Invite modal - see window.AdminTab's
                    saveEdit for why only Compliance Officer keeps either one. */}
                {f.role === 'Compliance Officer' && (
                    <div className="mt-4 pt-4 border-t border-slate-100">
                        <p className="text-xs font-semibold text-slate-700 flex items-center gap-1.5">
                            <span className="w-1 h-3.5 rounded-full bg-brandAccent inline-block shrink-0" />
                            Compliance Assignment
                        </p>
                        <p className="text-[11px] text-slate-400 mt-0.5 mb-3">
                            Which vehicles and vendors this Compliance Officer oversees in Compliance & Inspection. Leave either unset for every vehicle type or vendor.
                        </p>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <Select label="Assign Vehicle Type" value={f.vehicleTypeScope}
                                onChange={e => update('vehicleTypeScope', e.target.value)}
                                options={[{ value: '', label: 'All Vehicle Types' }, ...VEHICLE_TYPE_OPTIONS.map(t => ({ value: t, label: t }))]} />
                            <label className="block">
                                <span className="text-xs font-medium text-slate-500 mb-1 block">Assign Vendor</span>
                                <select multiple size={Math.min(4, data.vendors.length) || 1}
                                    className="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brandAccent/30"
                                    value={f.vendorScope}
                                    onChange={e => update('vendorScope', Array.from(e.target.selectedOptions, o => o.value))}>
                                    {data.vendors.map(v => <option key={v.id} value={v.name}>{v.name}</option>)}
                                </select>
                                <span className="text-[11px] text-slate-400 mt-1 block">Ctrl/Cmd-click to select more than one - leave nothing selected for every vendor.</span>
                            </label>
                        </div>
                    </div>
                )}
            </Card>

            <div className="flex justify-end gap-2 flex-wrap">
                <Btn variant="outline" onClick={onCancel}>Cancel</Btn>
                <Btn variant="outline" onClick={() => setF(blank())}>Reset Changes</Btn>
                <Btn onClick={save}>Save Changes</Btn>
            </div>
        </div>
    );
}

// onLogout still comes through from the app shell (every tab gets it), just unused here now -
// Logout lives in the sidebar's account section, not this page, since Your Session was removed.
window.AdminTab = ({ data, setData }) => {
    const BLANK_ADMIN_FORM = { name: '', email: '', role: 'Fleet Coordinator', vehicleTypeScope: '', vendorScope: [] };

    // Invite stays a modal (unchanged, matches the ATOM reference's own Invite Individual popup) -
    // Edit Details is a full page instead now (editId/onSave below), so the two have separate state.
    const [modal, setModal] = useState(false);
    const [form, setForm] = useState({ ...BLANK_ADMIN_FORM });
    const [search, setSearch] = useState('');
    // Which row's ⋯ action menu is open (at most one at a time); which admin's Profile page or Edit
    // Details page has taken over this whole tab (see the early-return routing below); which admin is
    // one confirm away from being removed.
    const [openMenuId, setOpenMenuId] = useState(null);
    const [viewId, setViewId] = useState(null);
    const [editId, setEditId] = useState(null);
    const [removeId, setRemoveId] = useState(null);

    const openInviteModal = () => { setForm({ ...BLANK_ADMIN_FORM }); setModal(true); };
    const closeInviteModal = () => { setModal(false); setForm({ ...BLANK_ADMIN_FORM }); };

    const saveInvite = () => {
        if (!form.name.trim() || !form.email.trim()) {
            alert('Enter a name and email.');
            return;
        }
        // Only Compliance Officer actually uses either of these - a scope picked before switching
        // away from that role would otherwise silently linger on the record unused.
        // 'Invited', not 'Active' (fix-list item 125) - a real invite is an email round trip nobody's
        // clicked yet, so an invited account shouldn't be immediately usable. There's no real email
        // provider in this prototype to send that link, so the "Activate" action on an Invited row
        // below stands in for the person clicking it - clearly a mocked step, not wired to anything.
        // window.LoginScreen already only lists status === 'Active' accounts, so an Invited admin
        // genuinely can't sign in until that happens, same as the real flow would enforce.
        const a = {
            id: uid('ADM'), atomId: generateAtomId(), name: form.name, email: form.email, role: form.role,
            vehicleTypeScope: form.role === 'Compliance Officer' && form.vehicleTypeScope ? form.vehicleTypeScope : null,
            vendorScope: form.role === 'Compliance Officer' && form.vendorScope.length ? form.vendorScope : null,
            status: 'Invited', lastLogin: 'Never',
        };
        setData(d => ({
            ...d,
            admins: [...d.admins, a],
            auditLog: [{
                id: uid('AUD'), action: 'Invite User', actorId: d.currentAdmin.id, actorName: d.currentAdmin.name,
                targetId: a.id, targetLabel: `${a.name} (${a.email}) - ${a.role}`,
                timestamp: new Date().toISOString(),
            }, ...d.auditLog],
        }));
        closeInviteModal();
    };

    // Stands in for "the invited person clicked the activation link in their email" - the one step
    // this prototype has no real email provider to actually perform.
    const activateAdmin = (id) => {
        setData(d => ({ ...d, admins: d.admins.map(a => a.id === id ? { ...a, status: 'Active' } : a) }));
    };

    // AdminEditPage hands back the whole edited form - only Compliance Officer keeps either scope
    // field (same rule saveInvite uses), everything else (personal details, address) is saved as-is.
    const saveEdit = (f) => {
        setData(d => ({
            ...d,
            admins: d.admins.map(a => a.id === editId ? {
                ...a, name: f.name, email: f.email, gender: f.gender, dob: f.dob, mobile: f.mobile, photo: f.photo,
                address: f.address, landmark: f.landmark, country: f.country, state: f.state, city: f.city, pinCode: f.pinCode,
                role: f.role, status: f.status,
                vehicleTypeScope: f.role === 'Compliance Officer' && f.vehicleTypeScope ? f.vehicleTypeScope : null,
                vendorScope: f.role === 'Compliance Officer' && f.vendorScope.length ? f.vendorScope : null,
            } : a),
        }));
        setEditId(null);
    };

    // Compliance Settings, Driver App Settings, and Fleet & Fuel Settings all moved out to their own
    // Module Settings tab (window.ModuleSettingsTab); the Role Permissions matrix that used to live
    // here moved out too, to its own Role sub-tab (window.RoleManagementTab) - User Management stays
    // focused on the admin roster itself.

    const removeAdmin = (id) => {
        const removed = data.admins.find(a => a.id === id);

            ...d,
            admins: d.admins.filter(a => a.id !== id),

            auditLog: [{

                                </label>
                            </div>

                    )}
                    <Btn className="w-full" onClick={saveInvite}>Send Invite</Btn>
                </div>
            </Modal>

            {/* Remove - the one destructive action here, so it gets its own explicit confirm step
                (this app's usual pattern for anything that can't be undone) rather than firing straight
                off the action menu. */}
            <Modal open={!!removeAdminRecord} onClose={() => setRemoveId(null)} title="Remove User">
                {removeAdminRecord && (
                    <div className="space-y-4">

                        </p>

                            <Btn variant="danger" className="flex-1" onClick={() => removeAdmin(removeAdminRecord.id)}>Remove</Btn>

                )}
            </Modal>
        </div>
