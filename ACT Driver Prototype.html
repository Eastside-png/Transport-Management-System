// The "trip under way right now" card - large departure time, route, live progress + ETA, an
// expandable inline route map. Shared between HomeScreen (where it's the whole point of the screen)
// and MyTripsScreen's Ongoing section, so a driver sees the exact same card either place they find it.
function OngoingTripCard({ trip, isExpanded, onSelect, onToggleExpand }) {
    return (
        <div className="bg-white rounded-2xl border-2 border-brandAccent/40 shadow-cardHover overflow-hidden">
            <button onClick={onSelect} className="w-full text-left p-5">
                <div className="flex justify-between items-start gap-3 mb-4">
                    <div>
                        <p className="text-3xl font-bold text-slate-800 leading-none tracking-tight">{trip.time}</p>
                        <p className="text-[11px] text-slate-400 mt-1.5 font-medium">Departure time</p>
                    </div>
                    <Badge status={trip.status} />
                </div>

                <RoutePath route={trip.route} large />

                <div className="flex items-center gap-1.5 text-xs text-slate-500 mt-4 pt-4 border-t border-slate-100">
                    <Icon name="user" size={13} className="shrink-0" />
                    <span className="truncate">{trip.stakeholder}</span>
                </div>

                {trip.sos && (
                    <p className="text-xs text-red-600 font-semibold mt-3 flex items-center gap-1.5">
                        <Icon name="alert" size={13} />SOS reported on this trip
                    </p>
                )}

                <div className="mt-4">
                    <div className="flex justify-between text-[11px] font-medium text-slate-500 mb-1.5">
                        <span>Trip progress</span><span>{derivedProgress(trip)}%</span>
                    </div>
                    <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
                        <div className="h-full bg-brandAccent transition-all" style={{ width: `${derivedProgress(trip)}%` }} />
                    </div>
                </div>

                {liveEta(trip) && (
                    <div className="flex justify-between items-center mt-3 pt-3 border-t border-slate-100">
                        <span className="text-xs text-slate-500">Estimated Arrival</span>
                        <span className="text-base font-bold text-brandAccent">{liveEta(trip)}</span>
                    </div>
                )}
            </button>
            <button onClick={(e) => { e.stopPropagation(); onToggleExpand(); }}
                className="w-full flex items-center justify-center gap-1.5 py-2.5 text-xs font-semibold text-brandAccent border-t border-slate-100 hover:bg-slate-50 transition">
                {isExpanded ? 'Hide Route Map' : 'View Route Map'}
            </button>
            {isExpanded && <RouteMap route={trip.route} />}
        </div>
    );
}

// Home's ongoing-trip hero - modeled on a delivery-tracking reference the user supplied: a full-width
// live route map up top (the hero), a rounded content sheet overlapping its bottom edge, then trip
// status/ETA, the route, a vehicle/vendor/cost detail grid (with the fuel gauge + Log Refuel folded
// into the same card rather than off in a separate one), and the two trip-ending actions (Mark Trip
// Complete / Report SOS) pinned at the bottom. Everything about this one trip lives on one screen -
// no tapping through to a separate detail page to see it, unlike the compact list-row treatment
// OngoingTripCard uses on My Trips.
function HomeOngoingHero({ trip, fuelProfile, onLogRefuel, onComplete, onOpenSos, onResolveSos }) {
    const est = tripEstimate(trip.route);
    const cost = tripCostEstimate(trip);
    const canSos = !trip.sos;

    return (
        <div className="animate-in">
            <div className="relative">
                <RouteMap route={trip.route} progress={derivedProgress(trip)} heightClass="h-60" showZoomControl />
                <div className="absolute top-3 left-3 z-[500]"><Badge status={trip.status} /></div>
            </div>

            <div className="-mt-5 relative z-[400] bg-bgLight rounded-t-3xl px-4 pt-5 pb-5 space-y-4">
                {/* sosQueued (fix-list item 78) is a distinct state from sos - a report still sitting
                    in the local offline queue hasn't reached anyone yet, so this banner never claims
                    "help is on the way" for one, and there's nothing to Mark Safe until it actually
                    sends. */}
                {trip.sosQueued && !trip.sos && (
                    <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-4 py-3 text-sm flex items-center gap-2">
                        <Icon name="alert" size={18} />
                        <span className="font-semibold">SOS saved - will send automatically once you're back online</span>
                    </div>
                )}
                {trip.sos && (
                    <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm flex items-center justify-between gap-3 sos-pulse">
                        <div className="flex items-center gap-2">
                            <Icon name="alert" size={18} />
                            <span className="font-semibold">SOS reported - help is on the way</span>
                        </div>
                        <button onClick={onResolveSos} className="text-xs font-semibold underline shrink-0">Mark Safe</button>
                    </div>
                )}

                {/* Each of these used to be one big multi-section card (ETA/Progress + Route, then
                    Vehicle/Vendor/Distance/Cost + Passenger + Fuel all stacked inside a second one) -
                    split into its own small card per concern instead, so the screen reads as a set of
                    distinct at-a-glance facts rather than two dense blocks. */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4">
                    <div className="flex items-start justify-between gap-3">
                        <div>
                            <p className="flex items-center gap-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wide">
                                <Icon name="clock" size={11} />Estimated Arrival
                            </p>
                            <p className="text-2xl font-bold text-slate-800 leading-tight mt-0.5">{liveEta(trip) || '—'}</p>
                        </div>
                        <div className="text-right shrink-0">
                            <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Progress</p>
                            <p className="text-2xl font-bold text-brandAccent leading-tight mt-0.5">{derivedProgress(trip)}%</p>
                        </div>
                    </div>
                    <div className="h-2 rounded-full bg-slate-100 overflow-hidden mt-3">
                        <div className="h-full bg-brandAccent transition-all" style={{ width: `${derivedProgress(trip)}%` }} />
                    </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4">
                    <RoutePath route={trip.route} large />
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4 grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="truck" size={11} />Vehicle</p>
                        <p className="font-medium text-slate-800 mt-0.5">{trip.vehicleId}</p>
                        <p className="text-xs text-slate-500">{trip.type}</p>
                    </div>
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="building" size={11} />Vendor</p>
                        <p className="font-medium text-slate-800 mt-0.5">{trip.vendorName}</p>
                    </div>
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="distance" size={11} />Distance</p>
                        <p className="font-medium text-slate-800 mt-0.5">{est ? `${est.distanceKm} km` : '—'}</p>
                    </div>
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="tag" size={11} />Estimated Cost</p>
                        <p className="font-medium text-slate-800 mt-0.5">{cost != null ? `₹${cost}` : '—'}</p>
                    </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4">
                    <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="user" size={11} />Passenger / Stakeholder</p>
                    <p className="font-medium text-slate-800 mt-0.5">{trip.stakeholder}</p>
                </div>

                {fuelProfile && (
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4">
                        <div className="flex items-center justify-between mb-1.5">
                            <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="droplet" size={11} />Fuel</p>
                            <button onClick={onLogRefuel} className="text-[11px] font-semibold text-brandAccent hover:underline">Log Refuel</button>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                                <div className={`h-full rounded-full transition-all ${fuelProfile.fuelCritical ? 'bg-red-500' : fuelProfile.fuelLevel < 50 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                                    style={{ width: `${fuelProfile.fuelLevel}%` }} />
                            </div>
                            <span className="text-xs font-semibold text-slate-600 w-9 text-right">{fuelProfile.fuelLevel}%</span>
                        </div>
                        <p className="text-[10px] text-slate-400 mt-1">
                            {Math.round(fuelProfile.kmSinceRefuel)} / {fuelProfile.refuelCycleKm} km &middot; Last {fuelProfile.lastRefuelDate || '—'}{fuelProfile.lastRefuelSource ? ` (${fuelProfile.lastRefuelSource})` : ''}
                        </p>
                        {fuelProfile.dueForRefuel && (
                            <span className="inline-flex items-center gap-1 text-[10px] font-semibold text-amber-700 mt-1">
                                <Icon name="alert" size={10} />Due for refuel
                            </span>
                        )}
                    </div>
                )}

                <div className="flex items-center gap-3">
                    <button onClick={onComplete}
                        className="flex-1 py-3.5 rounded-full bg-brandBlue text-white text-sm font-bold hover:bg-slate-800 active:scale-[0.99] transition flex items-center justify-center gap-2 shadow-sm">
                        <Icon name="check" size={16} />Mark Trip Complete
                    </button>
                    {canSos && (
                        <button onClick={onOpenSos} title="Report Emergency / SOS" aria-label="Report Emergency / SOS"
                            className="w-14 h-14 rounded-full bg-red-600 text-white flex items-center justify-center shrink-0 hover:bg-red-700 active:scale-[0.97] transition shadow-sm">
                            <Icon name="alert" size={22} />
                        </button>
                    )}
                </div>
            </div>
        </div>
    );
}

// The one, complete view of a shuttle-loop trip (kind: 'shuttle') - covers all three states it can
// be in (Scheduled/not yet departed, In Transit or Delayed/under way, Completed) and is used BOTH as
// Home's featured card while a loop is the driver's current business AND as the full page reached by
// tapping into it from My Trips or the Shuttle tab, so there's exactly one place this trip's full
// picture is built, not two that could quietly drift apart. Same map-first/content-sheet/actions-
// pinned-at-bottom layering as HomeOngoingHero, but built around the full stop chain
// (ShuttleRouteMap/ShuttleStopList) instead of a single origin/destination - a shuttle loop's whole
// point is more than one leg, and hiding everything but the current leg's two endpoints (the old
// behaviour, reusing the one-off TripDetailScreen) was exactly the gap this redesign fixes.
function ShuttleTripScreen({ trip, hasActiveTrip, onStart, onAdvance, onOpenSos, onResolveSos, fuelProfile, onLogRefuel }) {
    const isScheduled = trip.status === 'Scheduled';
    const isRunning = trip.status === 'In Transit' || trip.status === 'Delayed';
    const isCompleted = trip.status === 'Completed';
    const startBlocked = isScheduled && hasActiveTrip;
    const legEst = isRunning ? shuttleLegEstimate(trip, trip.legIndex) : null;
    const legProgress = isRunning ? shuttleLegProgress(trip) : 0;
    const nextStopIndex = isRunning ? trip.legIndex + 1 : 1;
    const isFinalLeg = isRunning && nextStopIndex === trip.stops.length - 1;
    const canSos = isRunning && !trip.sos;

    return (
        <div className="animate-in">
            <div className="relative">
                <ShuttleRouteMap stops={trip.stops} legIndex={isRunning ? trip.legIndex : null} legProgress={isRunning ? legProgress : null}
                    heightClass="h-60" showZoomControl />
                <div className="absolute top-3 left-3 z-[500]"><Badge status={trip.status} /></div>
                {isRunning && (
                    <div className="absolute top-3 right-3 z-[500] bg-white/95 backdrop-blur px-2.5 py-1 rounded-full text-[11px] font-semibold text-slate-600 shadow-sm">
                        Leg {trip.legIndex + 1} of {trip.stops.length - 1}
                    </div>
                )}
            </div>

            <div className="-mt-5 relative z-[400] bg-bgLight rounded-t-3xl px-4 pt-5 pb-5 space-y-4">
                {trip.sosQueued && !trip.sos && (
                    <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-4 py-3 text-sm flex items-center gap-2">
                        <Icon name="alert" size={18} />
                        <span className="font-semibold">SOS saved - will send automatically once you're back online</span>
                    </div>
                )}
                {trip.sos && (
                    <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm flex items-center justify-between gap-3 sos-pulse">
                        <div className="flex items-center gap-2">
                            <Icon name="alert" size={18} />
                            <span className="font-semibold">SOS reported - help is on the way</span>
                        </div>
                        <button onClick={onResolveSos} className="text-xs font-semibold underline shrink-0">Mark Safe</button>
                    </div>
                )}

                {isCompleted ? (
                    <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex items-center gap-3">
                        <span className="w-9 h-9 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
                            <Icon name="check" size={18} />
                        </span>
                        <div>
                            <p className="text-sm font-bold text-emerald-800">Loop Complete</p>
                            <p className="text-xs text-emerald-600 mt-0.5">Every stop on this run was reached. Start another from the Shuttle tab whenever you're ready.</p>
                        </div>
                    </div>
                ) : (
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4">
                        <div className="flex items-start justify-between gap-3">
                            <div>
                                <p className="flex items-center gap-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wide">
                                    <Icon name="clock" size={11} />{isScheduled ? 'First Stop' : 'Next Stop'}
                                </p>
                                <p className="text-lg font-bold text-slate-800 leading-tight mt-0.5">{trip.stops[nextStopIndex]}</p>
                                <p className="text-xs text-slate-400 mt-0.5">ETA {shuttleStopEta(trip, nextStopIndex) || '—'}</p>
                            </div>
                            {isRunning && (
                                <div className="text-right shrink-0">
                                    <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Leg Progress</p>
                                    <p className="text-2xl font-bold text-brandAccent leading-tight mt-0.5">{legProgress}%</p>
                                </div>
                            )}
                        </div>
                        {isRunning && (
                            <div className="h-2 rounded-full bg-slate-100 overflow-hidden mt-3">
                                <div className="h-full bg-brandAccent transition-all" style={{ width: `${legProgress}%` }} />
                            </div>
                        )}
                    </div>
                )}

                <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-3">Full Loop</p>
                    <ShuttleStopList trip={trip} />
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4 grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="truck" size={11} />Vehicle</p>
                        <p className="font-medium text-slate-800 mt-0.5">{trip.vehicleId}</p>
                        <p className="text-xs text-slate-500">{trip.type}</p>
                    </div>
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="building" size={11} />Vendor</p>
                        <p className="font-medium text-slate-800 mt-0.5">{trip.vendorName}</p>
                    </div>
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="distance" size={11} />{isRunning ? 'Current Leg' : 'Full Loop'}</p>
                        <p className="font-medium text-slate-800 mt-0.5">
                            {isRunning ? (legEst ? `${legEst.distanceKm} km` : '—') : `${trip.stops.length - 1} legs`}
                        </p>
                    </div>
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="clock" size={11} />Frequency</p>
                        <p className="font-medium text-slate-800 mt-0.5">Every {trip.frequencyMinutes} min</p>
                    </div>
                </div>

                {fuelProfile && (
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4">
                        <div className="flex items-center justify-between mb-1.5">
                            <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="droplet" size={11} />Fuel</p>
                            <button onClick={onLogRefuel} className="text-[11px] font-semibold text-brandAccent hover:underline">Log Refuel</button>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                                <div className={`h-full rounded-full transition-all ${fuelProfile.fuelCritical ? 'bg-red-500' : fuelProfile.fuelLevel < 50 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                                    style={{ width: `${fuelProfile.fuelLevel}%` }} />
                            </div>
                            <span className="text-xs font-semibold text-slate-600 w-9 text-right">{fuelProfile.fuelLevel}%</span>
                        </div>
                        <p className="text-[10px] text-slate-400 mt-1">
                            {Math.round(fuelProfile.kmSinceRefuel)} / {fuelProfile.refuelCycleKm} km &middot; Last {fuelProfile.lastRefuelDate || '—'}{fuelProfile.lastRefuelSource ? ` (${fuelProfile.lastRefuelSource})` : ''}
                        </p>
                        {fuelProfile.dueForRefuel && (
                            <span className="inline-flex items-center gap-1 text-[10px] font-semibold text-amber-700 mt-1">
                                <Icon name="alert" size={10} />Due for refuel
                            </span>
                        )}
                    </div>
                )}

                {startBlocked && (
                    <div className="w-full py-3 rounded-xl bg-slate-100 text-slate-400 text-sm font-semibold flex items-center justify-center gap-2">
                        <Icon name="lock" size={15} />Finish your current trip before starting this loop
                    </div>
                )}

                {isScheduled && !startBlocked && (
                    <button onClick={onStart}
                        className="w-full py-3.5 rounded-full bg-brandBlue text-white text-sm font-bold hover:bg-slate-800 active:scale-[0.99] transition flex items-center justify-center gap-2 shadow-sm">
                        <Icon name="play" size={16} />Start Trip
                    </button>
                )}

                {isRunning && (
                    <div className="flex items-center gap-3">
                        <button onClick={onAdvance}
                            className="flex-1 py-3.5 rounded-full bg-brandBlue text-white text-sm font-bold hover:bg-slate-800 active:scale-[0.99] transition flex items-center justify-center gap-2 shadow-sm">
                            <Icon name="check" size={16} />{isFinalLeg ? 'Complete Loop' : `Arrived at ${trip.stops[nextStopIndex]}`}
                        </button>
                        {canSos && (
                            <button onClick={onOpenSos} title="Report Emergency / SOS" aria-label="Report Emergency / SOS"
                                className="w-14 h-14 rounded-full bg-red-600 text-white flex items-center justify-center shrink-0 hover:bg-red-700 active:scale-[0.97] transition shadow-sm">
                                <Icon name="alert" size={22} />
                            </button>
                        )}
                    </div>
                )}
            </div>
        </div>
    );
}

// A slim, always-visible strip naming whichever vehicle this driver is currently driving - unlike
// everything else on Home, this isn't conditional on a trip being under way, so a driver can always
// glance at Home and know what they're assigned to right now even between trips. The vehicle's own
// identity (name + reg no) is the hero here - "Managed by Fleet Coordinator" is just attribution, so
// it's pushed to the bottom as a small, quiet footnote rather than competing with the label up top.
function CurrentVehicleCard({ driver, vehicleType }) {
    return (
        <div className="p-4 pb-0 animate-in">
            <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4 flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-brandAccent/10 text-brandAccent flex items-center justify-center shrink-0">
                    <Icon name="truck" size={20} />
                </div>
                <div className="min-w-0 flex-1">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Current Vehicle Assigned</p>
                    <p className="font-bold text-slate-800 truncate">{vehicleNameFor(vehicleType, driver.vehicleId)}</p>
                    <p className="text-sm text-slate-500 font-mono truncate">{driver.vehicleId} &middot; {vehicleRegNoFor(driver.vehicleId)}</p>
                    <p className="text-[10px] text-slate-300 mt-1.5">Managed by Fleet Coordinator</p>
                </div>
            </div>
        </div>
    );
}

// A compact awareness card for Home when this driver is rostered on a recurring shuttle (see App's
// myShuttlePlan) but no loop is actually under way right now - without this, a shuttle driver's Home
// looked exactly like someone with nothing scheduled at all, with no hint the Shuttle tab exists.
function ShuttleRosterCard({ plan, activeLoopTrip, onGoToShuttle }) {
    const next = nextShuttleDeparture(plan);
    return (
        <button type="button" onClick={onGoToShuttle}
            className="w-full text-left bg-white rounded-2xl border border-slate-200 shadow-sm p-4 hover:border-brandAccent transition">
            <div className="flex items-center justify-between mb-2">
                <span className="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-full">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500" />Recurring Shuttle
                </span>
                <Icon name="arrowRight" size={14} className="text-slate-300 shrink-0" />
            </div>
            <div className="flex items-center gap-1.5 flex-wrap text-sm font-semibold text-slate-800">
                {plan.origins.map((loc, i) => (
                    <React.Fragment key={i}>
                        {i > 0 && <Icon name="arrowRight" size={11} className="text-slate-300 shrink-0" />}
                        <span>{loc}</span>
                    </React.Fragment>
                ))}
                <Icon name="arrowRight" size={11} className="text-slate-300 shrink-0" />
                <span>{plan.destination}</span>
            </div>
            <p className="text-xs text-slate-400 mt-2">
                {activeLoopTrip ? 'A loop is ready to start - tap to begin.' : next ? `Next departure ${next.time} (~${next.inMin} min)` : 'Service has ended for today.'}
            </p>
        </button>
    );
}

// Home tab - deliberately narrow: the driver's current vehicle (always visible, see
// CurrentVehicleCard), a reassignment notice (if any, since it's blocking and needs acknowledgement
// no matter what else is going on), and whichever single trip is actually under way right now, shown
// in full via HomeOngoingHero (a one-off dispatch) or ShuttleTripScreen (a recurring loop - the full
// multi-stop view, not the flat two-point one a one-off trip gets, per the redesign this replaced).
// Everything else (upcoming, completed, the full list) lives on My Trips - Home is "what's happening
// right now", not a second copy of the full trip list. A driver rostered on a shuttle plan but with
// no loop actually running yet still gets a compact awareness card (ShuttleRosterCard) rather than
// looking exactly like someone with nothing scheduled at all.
function HomeScreen({ trips, assignments, fuelState, driver, vehicleType, shuttlePlan, activeLoopTrip, hasActiveTrip,
    onAcknowledge, onComplete, onOpenSos, onResolveSos, onAdvanceShuttleLeg, onLogRefuel, onGoToTrips, onGoToShuttle }) {
    const reassignedTrips = trips.filter(t => t.reassigned);
    // One-off trips only - a shuttle loop (Scheduled or running) is handled by its own branches below,
    // since it needs the full stop chain, not the flat single route a one-off trip has.
    const ongoing = trips.find(t => !t.reassigned && t.kind !== 'shuttle' && (t.status === 'In Transit' || t.status === 'Delayed')) || null;
    const nextUpcoming = trips.filter(t => !t.reassigned && t.kind !== 'shuttle' && t.status === 'Scheduled').sort((a, b) => a.time.localeCompare(b.time))[0];
    const shuttleRunning = activeLoopTrip && (activeLoopTrip.status === 'In Transit' || activeLoopTrip.status === 'Delayed');

    return (
        <div>
            <CurrentVehicleCard driver={driver} vehicleType={vehicleType} />

            {reassignedTrips.length > 0 && (
                <div className="p-4 space-y-4 animate-in">
                    {reassignedTrips.map(t => <ReassignedTripCard key={t.id} trip={t} onAcknowledge={() => onAcknowledge(t.id)} />)}
                </div>
            )}

            {ongoing ? (
                <div className="mt-4">
                    <HomeOngoingHero trip={ongoing} fuelProfile={vehicleFuelProfile(ongoing, assignments, fuelState)}
                        onLogRefuel={() => onLogRefuel(ongoing.vehicleId)} onComplete={() => onComplete(ongoing)}
                        onOpenSos={() => onOpenSos(ongoing.id)} onResolveSos={() => onResolveSos(ongoing.id)} />
                </div>
            ) : shuttleRunning ? (
                <div className="mt-4">
                    <ShuttleTripScreen trip={activeLoopTrip} hasActiveTrip={hasActiveTrip} onAdvance={() => onAdvanceShuttleLeg(activeLoopTrip)}
                        onOpenSos={() => onOpenSos(activeLoopTrip.id)} onResolveSos={() => onResolveSos(activeLoopTrip.id)}
                        fuelProfile={vehicleFuelProfile(activeLoopTrip, assignments, fuelState)} onLogRefuel={() => onLogRefuel(activeLoopTrip.vehicleId)} />
                </div>
            ) : reassignedTrips.length === 0 && (
                <div className="p-4 space-y-3">
                    <div className="text-center py-10">
                        <div className="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                            <Icon name="truck" size={26} />
                        </div>
                        <p className="font-medium text-slate-500">No trip in progress</p>
                        {nextUpcoming ? (
                            <>
                                <p className="text-sm text-slate-400 mt-1">Your next trip departs at <span className="font-semibold text-slate-600">{nextUpcoming.time}</span>.</p>
                                <button onClick={onGoToTrips} className="mt-4 text-sm font-semibold text-brandAccent hover:underline">Go to My Trips to start it &rarr;</button>
                            </>
                        ) : !shuttlePlan && (
                            <p className="text-sm text-slate-400 mt-1">You don't have any trips scheduled right now.</p>
                        )}
                    </div>

                    {shuttlePlan && <ShuttleRosterCard plan={shuttlePlan} activeLoopTrip={activeLoopTrip} onGoToShuttle={onGoToShuttle} />}
                </div>
            )}
        </div>
    );
}

// My Trips tab - the complete list, every trip grouped by where it stands (Reassigned / Ongoing /
// Upcoming / Completed). The Ongoing trip shown here is the same OngoingTripCard as Home's, just
// sitting alongside the rest of the list instead of being the only thing on screen.
// Compact My Trips/Shuttle-tab row for a shuttle loop, whatever status it's in - tapping in opens the
// same full ShuttleTripScreen every other shuttle surface in this app uses, rather than a plain
// RoutePath row (what every other card here renders) that could only ever show the loop's flattened
// first-stop -> last-stop fallback, not its real ordered chain.
function ShuttleTripCard({ trip, onSelect }) {
    const isRunning = trip.status === 'In Transit' || trip.status === 'Delayed';
    const legProgress = isRunning ? shuttleLegProgress(trip) : null;
    return (
        <button onClick={onSelect} className="w-full text-left bg-white rounded-2xl border border-slate-200 shadow-card p-5 hover:border-brandAccent transition">
            <div className="flex justify-between items-start gap-3 mb-3">
                <span className="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-full">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500" />Recurring Shuttle
                </span>
                <Badge status={trip.status} />
            </div>
            <div className="flex items-center gap-1.5 flex-wrap text-sm font-semibold text-slate-800">
                {trip.stops.map((name, i) => (
                    <React.Fragment key={i}>
                        {i > 0 && <Icon name="arrowRight" size={11} className="text-slate-300 shrink-0" />}
                        <span className={isRunning && i === trip.legIndex + 1 ? 'text-brandAccent' : ''}>{name}</span>
                    </React.Fragment>
                ))}
            </div>
            {legProgress != null ? (
                <div className="mt-3 pt-3 border-t border-slate-100">
                    <div className="flex justify-between text-xs text-slate-500 mb-1">
                        <span>Leg {trip.legIndex + 1} of {trip.stops.length - 1}</span><span>{legProgress}%</span>
                    </div>
                    <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
                        <div className="h-full bg-brandAccent transition-all" style={{ width: `${legProgress}%` }} />
                    </div>
                </div>
            ) : (
                <p className="text-xs text-slate-400 mt-3 pt-3 border-t border-slate-100">
                    {trip.status === 'Completed' ? 'Loop complete.' : `Departs ${trip.time} - tap to start.`}
                </p>
            )}
        </button>
    );
}

function MyTripsScreen({ trips, onSelect, onStartTrip, hasActiveTrip, onAcknowledge }) {
    // Tracks which single trip's route map is currently expanded inline. Starting a trip auto-expands
    // it; the id keeps matching the same trip even after it moves from the Upcoming section into
    // Ongoing on the next render.
    const [expandedTripId, setExpandedTripId] = useState(null);
    const toggleExpanded = (id) => setExpandedTripId(curr => (curr === id ? null : id));

    if (trips.length === 0) {
        return (
            <div className="p-8 text-center text-slate-400">
                <p className="font-medium text-slate-500">No trips assigned</p>
                <p className="text-sm mt-1">You don't have any trips scheduled right now.</p>
            </div>
        );
    }

    // A reassigned trip is pulled out of its normal Ongoing/Upcoming grouping entirely - it's no
    // longer actionable, it needs to be impossible to miss, so it gets its own section up top. A
    // shuttle loop (any status) gets its own section too, just below - a flat RoutePath row (what
    // these other groupings all render) can only ever show its collapsed first-stop -> last-stop
    // fallback, not the full chain, so it needs ShuttleTripCard/ShuttleTripScreen instead.
    const reassignedTrips = trips.filter(t => t.reassigned);
    const shuttleTrip = trips.find(t => t.kind === 'shuttle') || null;
    // "Ongoing" covers both In Transit and Delayed - either way the trip has been started and is
    // actively running, so it deserves top billing over trips that haven't started yet.
    const ongoingTrips = trips.filter(t => !t.reassigned && t.kind !== 'shuttle' && (t.status === 'In Transit' || t.status === 'Delayed'));
    const upcomingTrips = trips.filter(t => !t.reassigned && t.kind !== 'shuttle' && t.status === 'Scheduled').sort((a, b) => a.time.localeCompare(b.time));
    const pastTrips = trips.filter(t => !t.reassigned && t.kind !== 'shuttle' && t.status === 'Completed').sort((a, b) => a.time.localeCompare(b.time));

    return (
        <div className="p-4 space-y-6 animate-in">
            {reassignedTrips.length > 0 && (
                <div>
                    <h4 className="text-xs font-semibold text-amber-600 uppercase tracking-wide mb-2 flex items-center gap-2">
                        <Icon name="alert" size={14} />Trip Reassigned
                    </h4>
                    <div className="space-y-4">
                        {reassignedTrips.map(t => <ReassignedTripCard key={t.id} trip={t} onAcknowledge={() => onAcknowledge(t.id)} />)}
                    </div>
                </div>
            )}

            {shuttleTrip && (
                <div>
                    <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Recurring Shuttle</h4>
                    <ShuttleTripCard trip={shuttleTrip} onSelect={() => onSelect(shuttleTrip.id)} />
                </div>
            )}

            {ongoingTrips.length > 0 && (
                <div>
                    <h4 className="text-xs font-semibold text-emerald-600 uppercase tracking-wide mb-2 flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />Ongoing Trip
                    </h4>
                    <div className="space-y-4">
                        {ongoingTrips.map(t => (
                            <OngoingTripCard key={t.id} trip={t} isExpanded={expandedTripId === t.id}
                                onSelect={() => onSelect(t.id)} onToggleExpand={() => toggleExpanded(t.id)} />
                        ))}
                    </div>
                </div>
            )}

            {upcomingTrips.length > 0 && (
                <div>
                    <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Upcoming Trips</h4>
                    <div className="space-y-4">
                        {upcomingTrips.map(t => (
                            <div key={t.id} className="bg-white rounded-2xl border border-slate-200 shadow-card p-5">
                                <button onClick={() => onSelect(t.id)} className="w-full text-left">
                                    <div className="flex justify-between items-start gap-3 mb-4">
                                        <div>
                                            <p className="text-3xl font-bold text-slate-800 leading-none tracking-tight">{t.time}</p>
                                            <p className="text-[11px] text-slate-400 mt-1.5 font-medium">Departure time</p>
                                        </div>
                                        <Badge status={t.status} />
                                    </div>

                                    <RoutePath route={t.route} large />

                                    <div className="flex items-center gap-1.5 text-xs text-slate-500 mt-4 pt-4 border-t border-slate-100">
                                        <Icon name="user" size={13} className="shrink-0" />
                                        <span className="truncate">{t.stakeholder}</span>
                                    </div>
                                    {tripEstimate(t.route) && (
                                        <div className="flex items-center gap-1.5 text-xs text-slate-500 mt-2">
                                            <span className="font-semibold text-slate-700">~{tripEstimate(t.route).durationMin} min</span>
                                            <span className="text-slate-300">·</span>
                                            <span>{tripEstimate(t.route).distanceKm} km</span>
                                        </div>
                                    )}
                                </button>

                                {hasActiveTrip ? (
                                    <div className="w-full mt-4 py-3.5 rounded-xl bg-slate-100 text-slate-400 text-sm font-semibold flex items-center justify-center gap-2">
                                        <Icon name="lock" size={15} />Finish current trip first
                                    </div>
                                ) : (
                                    <button onClick={() => onStartTrip(t, () => setExpandedTripId(t.id))}
                                        className="w-full mt-4 py-3.5 rounded-xl bg-brandBlue text-white text-sm font-bold hover:bg-slate-800 active:scale-[0.99] transition flex items-center justify-center gap-2 shadow-sm">
                                        <Icon name="play" size={16} />Start Trip
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {pastTrips.length > 0 && (
                <div>
                    <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Completed</h4>
                    <div className="space-y-2">
                        {pastTrips.map(t => (
                            <button key={t.id} onClick={() => onSelect(t.id)}
                                className="w-full text-left bg-white rounded-xl border border-slate-100 p-3 opacity-80 hover:opacity-100 transition">
                                <div className="flex justify-between items-center gap-2">
                                    <p className="text-sm font-medium text-slate-600 truncate">{t.route}</p>
                                    <Badge status={t.status} />
                                </div>
                            </button>
                        ))}
                    </div>
                </div>
            )}
        </div>
    );
}

// Static schedule-preview stepper for a loop that hasn't started yet - same "full ordered stop chain,
// one dot per stop" visual language as ShuttleStopList (used once a loop is actually running), but
// working off tripEstimate's own leg-by-leg minutes rather than shuttleStopEta/shuttleLegProgress,
// which both require a real in-progress `trip` this screen doesn't have yet. Every stop reads as
// "upcoming" here on purpose - nothing about this loop is under way until Start Next Loop is tapped.
// A real clock-time ETA from an "HH:MM" anchor plus a minute offset - same base-time-plus-offset shape
// shuttleStopEta already uses for an in-progress loop, just taking the anchor as a plain string instead
// of deriving it from a live trip, since this preview runs before any trip exists.
const clockPlusMinutes = (hhmm, minutes) => {
    const [h, m] = hhmm.split(':').map(Number);
    const base = new Date();
    base.setHours(h, m, 0, 0);
    return formatClockTime(new Date(base.getTime() + minutes * 60000));
};

function ShuttlePlanStopPreview({ stops, baseTime }) {
    let cumulative = 0;
    return (
        <div className="flex gap-3">
            <div className="flex flex-col items-center pt-1.5">
                {stops.map((_, i) => (
                    <React.Fragment key={i}>
                        <span className={`w-3 h-3 rounded-full ring-4 shrink-0 ${i === 0 ? 'bg-brandAccent ring-blue-100' : i === stops.length - 1 ? 'bg-emerald-500 ring-emerald-100' : 'bg-slate-300 ring-slate-100'}`} />
                        {i < stops.length - 1 && <span className="w-0.5 flex-1 bg-slate-200 my-1" />}
                    </React.Fragment>
                ))}
            </div>
            <div className="flex-1 min-w-0 space-y-3">
                {stops.map((name, i) => {
                    if (i > 0) {
                        const leg = tripEstimate(`${stops[i - 1]} -> ${name}`);
                        if (leg) cumulative += Math.max(0, leg.durationMin);
                    }
                    const eta = baseTime ? clockPlusMinutes(baseTime, cumulative) : null;
                    return (
                        <div key={i} className="flex items-start justify-between gap-3">
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">
                                    {i === 0 ? 'Start' : i === stops.length - 1 ? 'Final Stop' : `Stop ${i}`}
                                </p>
                                <p className="text-sm font-semibold text-slate-800 truncate">{name}</p>
                                {i > 0 && <p className="text-xs text-slate-400 mt-0.5">~{cumulative} min from departure</p>}
                            </div>
                            {eta && <p className="text-sm font-semibold text-brandAccent shrink-0">{eta}</p>}
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

// Recurring Shuttle tab - what a driver on a fixed-interval loop (window.DRIVER_APP_DATA.shuttlePlans,
// resolved by matching their own vehicleId against a plan's `vehicles`, same as the admin panel's own
// shuttle/vehicle model) sees instead of a one-off dispatched trip. The loop itself is informational
// (schedule, not live-tracked - same "no individual per-trip assignment record" reasoning documented
// on the admin/stakeholder apps' own shuttlePlans data), but "Start Next Loop" hands off to the exact
// same trip machinery every one-off assignment already uses (geofencing, SOS, fuel, Mark Complete) by
// creating one real, temporary assignment for this one run - not a parallel, half-featured UI.
function ShuttleScreen({ plan, activeLoopTrip, hasActiveTrip, onStartLoop, onSelect }) {
    if (!plan) {
        return (
            <div className="p-8 text-center text-slate-400">
                <div className="w-14 h-14 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                    <Icon name="truck" size={26} />
                </div>
                <p className="font-medium text-slate-500">No recurring shuttle loop</p>
                <p className="text-sm mt-1">Your vehicle isn't currently rostered on a fixed shuttle route - see My Trips for your one-off dispatches.</p>
            </div>
        );
    }

    const next = nextShuttleDeparture(plan);
    const stops = [...plan.origins, plan.destination];
    const totalEst = tripEstimate(`${plan.origins[0]} -> ${plan.destination}`);

    return (
        <div className="p-4 space-y-4 animate-in">
            <div className="bg-white rounded-3xl border border-slate-200 shadow-card overflow-hidden">
                <div className="bg-gradient-to-br from-brandBlue to-slate-800 text-white p-5">
                    <div className="flex items-center justify-between">
                        <span className="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                            <Icon name="truck" size={20} />
                        </span>
                        <Badge status={plan.status} />
                    </div>
                    <p className="text-xs font-semibold text-white/60 uppercase tracking-wide mt-3">Recurring Shuttle</p>
                    <p className="text-base font-bold mt-0.5">{plan.origins[0]} &rarr; {plan.destination}</p>
                    {plan.vehicles?.length > 0 && (
                        <p className="text-xs text-white/70 mt-1">{plan.vehicles.length} vehicle{plan.vehicles.length === 1 ? '' : 's'} on this loop{totalEst ? ` · ~${totalEst.durationMin} min end to end` : ''}</p>
                    )}
                </div>

                <div className="p-5 space-y-4">
                    {next ? (
                        <div className="bg-blue-50 border border-blue-100 rounded-2xl px-4 py-3 flex items-center justify-between">
                            <p className="flex items-center gap-1.5 text-[11px] font-semibold text-brandAccent uppercase tracking-wide">
                                <Icon name="clock" size={12} />Next Departure
                            </p>
                            <p className="text-xl font-bold text-brandAccent">{next.time} <span className="text-xs font-medium text-slate-400">(~{next.inMin} min)</span></p>
                        </div>
                    ) : (
                        <div className="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-center">
                            <p className="text-sm font-medium text-slate-500">Service has ended for today</p>
                            <p className="text-xs text-slate-400 mt-0.5">Resumes tomorrow at {plan.startTime}</p>
                        </div>
                    )}

                    <div className="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <p className="text-[10px] text-slate-400 uppercase tracking-wide">Frequency</p>
                            <p className="font-medium text-slate-800 mt-0.5">Every {plan.frequencyMinutes} min</p>
                        </div>
                        <div>
                            <p className="text-[10px] text-slate-400 uppercase tracking-wide">Operating Hours</p>
                            <p className="font-medium text-slate-800 mt-0.5">{plan.startTime} - {plan.endTime}</p>
                        </div>
                    </div>

                    <div className="pt-1">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-2">Route &amp; Stops</p>
                        <ShuttlePlanStopPreview stops={stops} baseTime={next ? next.time : plan.startTime} />
                    </div>
                </div>
            </div>

            {activeLoopTrip ? (
                <button onClick={() => onSelect(activeLoopTrip.id)}
                    className="w-full py-3.5 rounded-xl bg-brandBlue text-white text-sm font-bold hover:bg-slate-800 active:scale-[0.99] transition flex items-center justify-center gap-2 shadow-sm">
                    <Icon name="truck" size={16} />
                    {activeLoopTrip.status === 'Scheduled' ? 'Go to This Loop - Start Trip' : 'Go to Current Loop'}
                </button>
            ) : hasActiveTrip ? (
                <div className="w-full py-3.5 rounded-xl bg-slate-100 text-slate-400 text-sm font-semibold flex items-center justify-center gap-2">
                    <Icon name="lock" size={15} />Finish your current trip first
                </div>
            ) : (
                <button onClick={() => onStartLoop(plan)}
                    className="w-full py-3.5 rounded-xl bg-brandBlue text-white text-sm font-bold hover:bg-slate-800 active:scale-[0.99] transition flex items-center justify-center gap-2 shadow-sm">
                    <Icon name="play" size={16} />Start Next Loop
                </button>
            )}
        </div>
    );
}

function TripDetailScreen({ trip, hasActiveTrip, onStart, onComplete, onOpenSos, onResolveSos, onAcknowledge, fuelProfile, onLogRefuel }) {
    if (trip.reassigned) {
        return (
            <div className="p-4 animate-in">
                <div className="bg-amber-50 rounded-2xl border-2 border-amber-400 p-5">
                    <div className="flex items-center gap-2 text-amber-700 mb-3">
                        <Icon name="alert" size={22} />
                        <h3 className="font-bold text-lg">Trip Reassigned</h3>
                    </div>
                    <p className="text-sm text-amber-800 mb-4">
                        Fleet control has moved this trip to a different vehicle. Do not proceed to the pickup point for this trip.
                    </p>

                    <div className="flex justify-between items-center mb-3">
                        <Badge status="Reassigned" />
                        <span className="font-mono text-xs font-bold text-amber-700">{trip.time}</span>
                    </div>
                    <div className="opacity-50 pointer-events-none select-none mb-4">
                        <RoutePath route={trip.route} large />
                    </div>

                    <div className="py-3.5 rounded-xl bg-amber-100 border border-amber-300 text-amber-800 text-sm font-bold text-center tracking-wide mb-3">
                        TRIP REASSIGNED
                    </div>
                    <button onClick={onAcknowledge}
                        className="w-full py-3.5 rounded-xl bg-amber-600 text-white text-sm font-bold hover:bg-amber-700 active:scale-[0.99] transition">
                        Acknowledge &amp; Return
                    </button>
                </div>
            </div>
        );
    }

    const isScheduled = trip.status === 'Scheduled';
    const isRunning = trip.status === 'In Transit' || trip.status === 'Delayed';
    // A Scheduled trip can only be started if no other trip for this driver is already running.
    const startBlocked = isScheduled && hasActiveTrip;
    const action = isScheduled && !startBlocked
        ? { label: 'Start Trip', icon: 'play', run: onStart }
        : isRunning
            ? { label: 'Mark Trip Complete', icon: 'check', run: onComplete }
            : null;
    const canSos = isRunning && !trip.sos;

    return (
        <div className="p-4 space-y-4 animate-in">
            {trip.sosQueued && !trip.sos && (
                <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-4 py-3 text-sm flex items-center gap-2">
                    <Icon name="alert" size={18} />
                    <span className="font-semibold">SOS saved - will send automatically once you're back online</span>
                </div>
            )}
            {trip.sos && (
                <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm flex items-center justify-between gap-3 sos-pulse">
                    <div className="flex items-center gap-2">
                        <Icon name="alert" size={18} />
                        <span className="font-semibold">SOS reported - help is on the way</span>
                    </div>
                    <button onClick={onResolveSos} className="text-xs font-semibold underline shrink-0">Mark Safe</button>
                </div>
            )}

            <div className="bg-white rounded-xl border border-slate-200 shadow-card p-4">
                <div className="flex justify-between items-center mb-3">
                    <Badge status={trip.status} />
                    <span className="font-mono text-xs font-bold text-slate-500">{trip.time}</span>
                </div>
                <RoutePath route={trip.route} large />

                {isScheduled && tripEstimate(trip.route) && (
                    <div className="flex items-center gap-1.5 text-xs text-slate-500 mt-3 pt-3 border-t border-slate-100">
                        <span className="font-semibold text-slate-700">~{tripEstimate(trip.route).durationMin} min</span>
                        <span className="text-slate-300">·</span>
                        <span>{tripEstimate(trip.route).distanceKm} km estimated</span>
                    </div>
                )}

                {isRunning && (
                    <div className="mt-4">
                        <div className="flex justify-between text-xs text-slate-500 mb-1">
                            <span>Trip progress</span><span>{derivedProgress(trip)}%</span>
                        </div>
                        <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
                            <div className="h-full bg-brandAccent transition-all" style={{ width: `${derivedProgress(trip)}%` }} />
                        </div>
                        {liveEta(trip) && (
                            <div className="flex justify-between items-center mt-3 pt-3 border-t border-slate-100">
                                <span className="text-xs text-slate-500">Estimated Arrival</span>
                                <span className="text-base font-bold text-brandAccent">{liveEta(trip)}</span>
                            </div>
                        )}
                    </div>
                )}
            </div>

            <div className="bg-white rounded-xl border border-slate-200 shadow-card p-4 grid grid-cols-2 gap-4 text-sm">
                <div>
                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">Vehicle</p>
                    <p className="font-medium text-slate-800">{trip.vehicleId}</p>
                    <p className="text-xs text-slate-500">{trip.type}</p>
                </div>
                <div>
                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">Vendor</p>
                    <p className="font-medium text-slate-800">{trip.vendorName}</p>
                </div>
                <div className="col-span-2">
                    <p className="text-[10px] text-slate-400 uppercase tracking-wide">Passenger / Stakeholder</p>
                    <p className="font-medium text-slate-800">{trip.stakeholder}</p>
                </div>

                {fuelProfile && (
                    <div className="col-span-2 pt-3 border-t border-slate-100">
                        <div className="flex items-center justify-between mb-1.5">
                            <p className="text-[10px] text-slate-400 uppercase tracking-wide">Fuel</p>
                            <button onClick={onLogRefuel} className="text-[11px] font-semibold text-brandAccent hover:underline">Log Refuel</button>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                                <div className={`h-full rounded-full transition-all ${fuelProfile.fuelCritical ? 'bg-red-500' : fuelProfile.fuelLevel < 50 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                                    style={{ width: `${fuelProfile.fuelLevel}%` }} />
                            </div>
                            <span className="text-xs font-semibold text-slate-600 w-9 text-right">{fuelProfile.fuelLevel}%</span>
                        </div>
                        <p className="text-[10px] text-slate-400 mt-1">
                            {Math.round(fuelProfile.kmSinceRefuel)} / {fuelProfile.refuelCycleKm} km &middot; Last {fuelProfile.lastRefuelDate || '—'}{fuelProfile.lastRefuelSource ? ` (${fuelProfile.lastRefuelSource})` : ''}
                        </p>
                        {fuelProfile.dueForRefuel && (
                            <span className="inline-flex items-center gap-1 text-[10px] font-semibold text-amber-700 mt-1">
                                <Icon name="alert" size={10} />Due for refuel
                            </span>
                        )}
                    </div>
                )}
            </div>

            {startBlocked && (
                <div className="w-full py-3 rounded-xl bg-slate-100 text-slate-400 text-sm font-semibold flex items-center justify-center gap-2">
                    <Icon name="lock" size={15} />Finish your ongoing trip before starting this one
                </div>
            )}

            {action && (
                <button onClick={action.run} className="w-full py-3.5 rounded-xl bg-brandBlue text-white text-sm font-bold hover:bg-slate-800 active:scale-[0.99] transition flex items-center justify-center gap-2 shadow-sm">
                    <Icon name={action.icon} size={16} />{action.label}
                </button>

// Every fixed-position popup in this app (SosModal, VehicleReassignedModal, GeofenceModal) portals
// straight to document.body instead of rendering in place. The app's own layout nests them many
// levels deep (App's h-screen/overflow-hidden frame -> flex-col -> flex-1/overflow-y-auto screen
// area -> whatever screen is active), and `position: fixed` inside stacked scrolling/overflow
// containers is a known trouble spot on mobile Safari in particular - a fixed element can end up
// visually clipped to or detached from an ancestor's box instead of the real viewport. Rendering
// the popup as a sibling of #root sidesteps all of that: it's fixed relative to the actual window,
// full stop, regardless of anything going on in the component tree that mounted it.
function ModalPortal({ children }) {
    return ReactDOM.createPortal(children, document.body);
}
