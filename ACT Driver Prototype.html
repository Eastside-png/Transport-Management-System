// The three states a Start Trip/Mark Trip Complete attempt can be in while geo-fencing is on:
// checking (waiting on the device's location fix), blocked (got a fix, but it's outside the radius),
// or error (couldn't get a fix at all - permission denied, unsupported, timed out). Nothing renders
// when there's no attempt in flight - the modal only ever appears for the few seconds a check is
// actually happening, or when it's actually failed, never as a persistent status display.
// One label per geofence action - 'start' and 'complete' are a one-off trip's; 'arrive' and
// 'completeLoop' are a shuttle leg's (see App's attemptStartShuttleLeg/attemptAdvanceShuttleLeg).
const GEOFENCE_ACTION_LABELS = {
    start: { verb: 'start this trip', short: 'Start' },
    complete: { verb: 'mark this trip complete', short: 'Complete' },
    arrive: { verb: 'confirm you\'ve reached this stop', short: 'Confirm Arrival' },
    completeLoop: { verb: 'complete this shuttle loop', short: 'Complete' },
};

function GeofenceModal({ check, onRetry, onCancel }) {
    if (!check) return null;
    const actionLabel = (GEOFENCE_ACTION_LABELS[check.action] || GEOFENCE_ACTION_LABELS.complete).verb;
    const actionShort = (GEOFENCE_ACTION_LABELS[check.action] || GEOFENCE_ACTION_LABELS.complete).short;
    const radiusM = Math.round(GEOFENCE_RADIUS_KM * 1000);
    return (
        <ModalPortal>
            <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/40">
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm max-h-[85vh] overflow-y-auto p-5">
                    {check.status === 'checking' && (
                        <div className="text-center py-3">
                            <div className="w-9 h-9 border-[3px] border-slate-200 border-t-brandAccent rounded-full animate-spin mx-auto mb-3" />
                            <p className="text-sm font-semibold text-slate-700">Checking your location&hellip;</p>
                            <p className="text-xs text-slate-400 mt-1">Confirming you're near {check.locationName}</p>
                        </div>
                    )}

                    {check.status === 'blocked' && (
                        <>
                            <div className="flex items-center gap-2 text-amber-600 mb-2">
                                <Icon name="lock" size={20} /><h3 className="font-bold text-lg text-slate-800">Too Far to {actionShort}</h3>
                            </div>
                            <p className="text-sm text-slate-500 mb-4">
                                Geo-fencing is on for this account - you need to be within {radiusM}m of <strong className="text-slate-700">{check.locationName}</strong> to {actionLabel}.
                                You're currently about <strong className="text-slate-700">{check.distanceKm < 1 ? `${Math.round(check.distanceKm * 1000)}m` : `${check.distanceKm.toFixed(1)} km`}</strong> away.
                            </p>
                            <div className="flex gap-2">
                                <button onClick={onRetry} className="flex-1 py-2.5 rounded-lg bg-brandBlue text-white text-sm font-semibold hover:bg-slate-800 transition">Check Again</button>
                                <button onClick={onCancel} className="px-4 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 transition">Cancel</button>
                            </div>
                        </>
                    )}

                    {check.status === 'error' && (
                        <>
                            <div className="flex items-center gap-2 text-red-600 mb-2">
                                <Icon name="alert" size={20} /><h3 className="font-bold text-lg text-slate-800">Location Unavailable</h3>
                            </div>
                            <p className="text-sm text-slate-500 mb-4">
                                {check.message} Geo-fencing is on for this account, so location access is required to {actionLabel}.
                            </p>
                            <div className="flex gap-2">
                                <button onClick={onRetry} className="flex-1 py-2.5 rounded-lg bg-brandBlue text-white text-sm font-semibold hover:bg-slate-800 transition">Try Again</button>
                                <button onClick={onCancel} className="px-4 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 transition">Cancel</button>
                            </div>
                        </>
                    )}
                </div>
            </div>
        </ModalPortal>
    );
}

function App() {
    const [loggedIn, setLoggedIn] = useState(null);
    const [activeTab, setActiveTab] = useState('home');
    const [selectedTripId, setSelectedTripId] = useState(null);
    const [assignments, setAssignments] = useState(() => DRIVER_APP_DATA.assignments.map(a => ({ ...a })));
    const [sosAlerts, setSosAlerts] = useState(() => DRIVER_APP_DATA.sosAlerts.map(s => ({ ...s })));
    const [sosModalOpen, setSosModalOpen] = useState(false);
    // Which trip the SOS modal is currently reporting for - Home's hero and Trip Details both open
    // the same modal for whichever trip they're each showing, so this can't just assume "selectedTrip"
    // the way it used to when the modal only ever opened from the detail screen.
    const [sosTargetId, setSosTargetId] = useState(null);
    // { fromVehicleId, toVehicleId, acknowledged } for a pending "your vehicle changed" notice, or
    // null when there isn't one. Distinct from a per-trip `reassigned` flag - see VehicleReassignedModal.
    const [vehicleReassignment, setVehicleReassignment] = useState(null);
    // vehicleId -> { fuelCheckpointKm, lastRefuelDate, lastRefuelSource } - see vehicleFuelProfile above.
    const [fuelState, setFuelState] = useState({});
    // Refuel event entity (fix-list item 39) - a real log now, one row per Log Refuel tap, alongside
    // fuelState's own "current checkpoint" snapshot above (that one gets overwritten each time; this
    // one accumulates).
    const [refuelEvents, setRefuelEvents] = useState([]);
    // Whether Start Trip/Mark Trip Complete require the driver to actually be near the pickup/
    // drop-off point - a policy the admin panel controls, not this app. There's no shared backend
    // between the two files, so this reads a localStorage key the admin panel writes to (see
    // toggleGeoFencing in ACT Travel Prototype.html's window.AdminTab) - defaults on when that key
    // has never been set (e.g. this app opened on its own, or from a plain file:// document where the
    // two files can't share storage at all).
    const [geoFencingEnabled, setGeoFencingEnabled] = useState(() => {
        try {
            const stored = localStorage.getItem(GEOFENCING_STORAGE_KEY);
            return stored === null ? true : stored === 'true';
        } catch (e) { return true; }
    });
    // In-flight/blocked Start Trip or Mark Trip Complete attempt - { trip, action, onSuccess, status,
    // distanceKm?, message? } or null when nothing's being checked. See attemptStartTrip/
    // attemptCompleteTrip and GeofenceModal below.
    const [geofenceCheck, setGeofenceCheck] = useState(null);
    // Demo-only stand-in for "the device's real GPS happens to be at the venue" - see the toggle
    // button in TopBar. Only changes where runGeofenceCheck gets its position reading from, not
    // whether the check runs at all (that's still geoFencingEnabled, above).
    const [simulateAtLocation, setSimulateAtLocation] = useState(false);
    // Native browser connectivity state (fix-list item 78) - tracks the device's real network status.
    const [browserOnline, setBrowserOnline] = useState(() => (typeof navigator !== 'undefined' ? navigator.onLine : true));
    // Demo-only override (see the toggle button in TopBar) for forcing the offline branch on demand,
    // since a demo device is almost always actually connected. Independent of the real signal above -
    // effective connectivity is "genuinely online AND not simulated offline", so a real disconnection
    // still wins even if someone forgot to flip this back on.
    const [simulateOffline, setSimulateOffline] = useState(false);
    const isOnline = browserOnline && !simulateOffline;

    // Picks up a geo-fencing toggle from the admin panel live, if the two happen to be open in tabs
    // sharing the same browser storage (same origin) right now - 'storage' only fires for changes made
    // in another document, never the tab that made them, which is exactly the case this is for.
    useEffect(() => {
        const onStorage = (e) => {
            if (e.key !== GEOFENCING_STORAGE_KEY) return;
            setGeoFencingEnabled(e.newValue === null ? true : e.newValue === 'true');
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
    }, []);

    // Fix-list items 51/52/53 - same bridge idea as geo-fencing above, for the three numeric settings
    // Module Settings can retune. These three (ROAD_DISTANCE_FACTOR/AVG_ROAD_SPEED_KMH/
    // GEOFENCE_RADIUS_KM) are plain module-level `let`s, not React state, so a bump to this otherwise
    // unused counter is what actually forces a re-render once they change - without it, a distance
    // caption already on screen wouldn't visibly update until some unrelated state change happened to
    // re-render it.
    const [, forceSettingsSyncTick] = useState(0);
    useEffect(() => {
        const syncFromStorage = () => {
            let changed = false;
            try {
                const factor = Number(localStorage.getItem(ROAD_DISTANCE_FACTOR_STORAGE_KEY));
                if (Number.isFinite(factor) && factor > 0 && factor !== ROAD_DISTANCE_FACTOR) { ROAD_DISTANCE_FACTOR = factor; changed = true; }
                const speed = Number(localStorage.getItem(AVG_ROAD_SPEED_STORAGE_KEY));
                if (Number.isFinite(speed) && speed > 0 && speed !== AVG_ROAD_SPEED_KMH) { AVG_ROAD_SPEED_KMH = speed; changed = true; }
                const radius = Number(localStorage.getItem(GEOFENCE_RADIUS_STORAGE_KEY));
                if (Number.isFinite(radius) && radius > 0) GEOFENCE_RADIUS_KM = radius;
            } catch (e) { /* storage unavailable - stays on the built-in defaults */ }
            if (changed) { rebuildDistanceMatrix(); forceSettingsSyncTick(t => t + 1); }
        };
        syncFromStorage();
        window.addEventListener('storage', syncFromStorage);
        return () => window.removeEventListener('storage', syncFromStorage);
    }, []);

    useEffect(() => {
        const goOnline = () => setBrowserOnline(true);
        const goOffline = () => setBrowserOnline(false);
        window.addEventListener('online', goOnline);
        window.addEventListener('offline', goOffline);
        return () => { window.removeEventListener('online', goOnline); window.removeEventListener('offline', goOffline); };
    }, []);

    // Ambient location reporting (see reportMyLocation's own comment) - not tied to any specific trip
    // action, just "let the admin side know roughly where this driver actually is" on a loop while
    // logged in. Fires once right after login, then every LOCATION_REPORT_INTERVAL_MS, so the
    // admin's proximity check has a reasonably fresh signal without the driver having to do anything.
    useEffect(() => {
        if (!loggedIn) return;
        reportMyLocation(loggedIn.id);
        const interval = setInterval(() => reportMyLocation(loggedIn.id), LOCATION_REPORT_INTERVAL_MS);
        return () => clearInterval(interval);
    }, [loggedIn?.id]);

    // Broadcasts how busy this driver is right now (reportMyAvailability's own comment) - re-derived
    // from `assignments` directly rather than the myTrips/hasActiveTrip consts below, since those
    // aren't computed yet at this point in the component (they're declared after the early
    // "not logged in" return, which every hook here has to come before - Rules of Hooks). Re-runs
    // whenever `assignments` actually changes (a trip starting/completing), not just on the interval,
    // so an on-call orchestration watching this doesn't have to wait up to 30s to see a driver go
    // busy or free.
    useEffect(() => {
        if (!loggedIn) return;
        // dropLocation reads a shuttle trip's NEXT stop (stops[legIndex + 1] - the only stop that's
        // actually still ahead of them) rather than a fixed final destination, since a shuttle loop has
        // no single "final" drop-off the way a one-off dispatched trip's own flat `route` string does.
        const computeAvailability = () => {
            const mine = assignments.filter(a => a.driver === loggedIn.name && !(a.reassigned && a.acknowledged));
            const active = mine.find(t => !t.reassigned && (t.status === 'In Transit' || t.status === 'Delayed'));
            if (!active || !active.startedAt || !active.estimatedDurationMin) return { busyUntil: null, dropLocation: null };
            const dropLocation = active.kind === 'shuttle'
                ? (active.stops && active.legIndex != null ? active.stops[active.legIndex + 1] || null : null)
                : (active.route || '').split(' -> ')[1]?.trim() || null;
            return { busyUntil: active.startedAt + active.estimatedDurationMin * 60000, dropLocation };
        };
        const report = () => { const a = computeAvailability(); reportMyAvailability(loggedIn.id, loggedIn.name, a.busyUntil, a.dropLocation); };
        report();
        const interval = setInterval(report, 30000);
        return () => clearInterval(interval);
    }, [loggedIn?.id, assignments]);

    // The incoming On-Call nudge currently shown, if any - only ever one at a time, same as the rest
    // of this flow (a driver is only ever offered one ride at once). Polled rather than event-driven
    // only, since the entry this app is waiting on can also expire purely with the passage of time,
    // not just a 'storage' write - the interval below is what notices that.
    const [incomingNudge, setIncomingNudge] = useState(null);
    useEffect(() => {
        if (!loggedIn) return;
        const poll = () => {
            let all = [];
            try { all = JSON.parse(localStorage.getItem(ONCALL_NUDGE_STORAGE_KEY) || '[]'); } catch (e) { all = []; }
            const mine = all.find(n => n.driverId === loggedIn.id && n.status === 'Pending' && n.expiresAt > Date.now());
            setIncomingNudge(mine || null);
            // Best-effort real push attempt (per this feature's own plan doc) - only fires when the
            // tab is actually backgrounded and permission was already granted earlier; this app never
            // itself prompts for permission, since asking cold for a feature the driver hasn't seen
            // yet would be a bad first impression. Wrapped in try/catch since the Notification API
            // isn't available on every browser/context this could be opened in.
            if (mine && document.hidden && window.Notification && Notification.permission === 'granted') {
                try { new Notification('New On-Call Ride Request', { body: `${mine.origin} -> ${mine.destination}` }); } catch (e) { /* best-effort only */ }
            }
        };
        poll();
        const interval = setInterval(poll, 3000);
        const onStorage = (e) => { if (e.key === ONCALL_NUDGE_STORAGE_KEY) poll(); };
        window.addEventListener('storage', onStorage);
        return () => { clearInterval(interval); window.removeEventListener('storage', onStorage); };
    }, [loggedIn?.id]);

    // Accept/Decline both flip the SAME bridge entry's own status (never create a new one) - whichever
    // side (Stakeholder App's own orchestration, or App's own settleAdminNudges for a manual
    // assignment) is watching it picks the change up on its own next read. Accept also creates a real
    // trip here, same as any other kind - Scheduled, startable through the usual geofenced Start Trip
    // flow, tracked exactly like a dispatched or shuttle trip from this point on; nothing here forces
    // it straight into In Transit.
    const respondToNudge = (nudge, outcome) => {
        let all = [];
        try { all = JSON.parse(localStorage.getItem(ONCALL_NUDGE_STORAGE_KEY) || '[]'); } catch (e) { all = []; }
        try {
            localStorage.setItem(ONCALL_NUDGE_STORAGE_KEY, JSON.stringify(
                all.map(n => n.id === nudge.id ? { ...n, status: outcome, respondedAt: Date.now() } : n)
            ));
        } catch (e) { /* storage unavailable - the Stakeholder/admin side will just see this time out instead */ }
        setIncomingNudge(null);
        if (outcome === 'Accepted') {
            setAssignments(list => [...list, {
                id: nudge.id, vehicleId: nudge.vehicleId, type: nudge.vehicleType, driver: loggedIn.name,
                vendorName: nudge.vendorName, route: nudge.route, time: formatClockTime(new Date()),
                status: 'Scheduled', progress: 0, stakeholder: 'On-Call Ride', phase: 'upcoming', sos: false,
                kind: 'oncall',
            }]);
        }
    };

    // Demo-only (TopBar's own phone-icon button) - manufactures a real nudge on the same bridge
    // window.ONCALL_NUDGE_STORAGE_KEY a genuine Stakeholder App on-call request would write, addressed
    // to this driver, so the "matched automatically, before an admin ever manually intervenes"
    // experience can be shown on the driver side alone. Refuses to stack a second one on top of an
    // already-showing nudge (real or simulated) - same one-at-a-time rule the real flow follows.
    const simulateIncomingOnCallNudge = () => {
        if (!loggedIn || incomingNudge) return;
        const windowSec = 40; // matches Module Settings' own oncallNudgeWindowSec default
        const nudge = {
            id: uid('NDG'), requestId: uid('OC'), driverId: loggedIn.id, driverName: loggedIn.name,
            vehicleId: loggedIn.vehicleId, vehicleType: currentVehicleType || 'Minibus (20)', vendorName: loggedIn.vendor,
            origin: 'Athletes Village - Block A', destination: 'Jawaharlal Nehru Stadium', route: 'Athletes Village - Block A -> Jawaharlal Nehru Stadium',
            passengers: 2, sentAt: Date.now(), expiresAt: Date.now() + windowSec * 1000, status: 'Pending', initiatedBy: 'stakeholder',
            matchStakeholderType: 'Athletes', matchDistanceKm: 3.2,
        };
        let all = [];
        try { all = JSON.parse(localStorage.getItem(ONCALL_NUDGE_STORAGE_KEY) || '[]'); } catch (e) { all = []; }
        try { localStorage.setItem(ONCALL_NUDGE_STORAGE_KEY, JSON.stringify([nudge, ...all].slice(0, 100))); } catch (e) { /* storage unavailable - still shows locally below */ }
        setIncomingNudge(nudge);
    };

    // Picks up any Route Plan the admin panel has Published for this driver (matched by name, same as
    // every other trip-ownership check in this file) - see ROUTE_PLAN_PUBLISH_STORAGE_KEY's own
    // comment for the bridge itself. Merges each one straight into `assignments` as a real Scheduled
    // trip the first time it's seen, then this app tracks it exactly like anything else locally from
    // there - re-publishing (e.g. after a vehicle reassignment) only overwrites a copy that's still
    // Scheduled here, never one already started or completed, so a live trip's own progress is never
    // clobbered by a stale re-read of the bridge.
    const mergePublishedPlans = (driverName) => {
        let published = [];
        try { published = JSON.parse(localStorage.getItem(ROUTE_PLAN_PUBLISH_STORAGE_KEY) || '[]'); } catch (e) { published = []; }
        const mine = published.filter(r => r.driverName === driverName);
        if (mine.length === 0) return;
        setAssignments(list => {
            let changed = false;
            let next = list;
            mine.forEach(r => {
                const idx = next.findIndex(a => a.id === r.id);
                const shaped = {
                    id: r.id, vehicleId: r.vehicleId, type: r.vehicleType, driver: r.driverName, vendorName: r.vendorName,
                    route: r.route, time: r.time || '', status: 'Scheduled', progress: 0, stakeholder: r.stakeholder,
                    phase: 'upcoming', sos: false, publishedAt: r.publishedAt,
                };
                if (idx === -1) {
                    next = [shaped, ...next];
                    changed = true;
                } else if (next[idx].status === 'Scheduled' && next[idx].publishedAt !== r.publishedAt) {
                    next = next.map((a, i) => i === idx ? { ...a, ...shaped } : a);
                    changed = true;
                }
            });
            return changed ? next : list;
        });
    };
    useEffect(() => {
        if (!loggedIn) return;
        mergePublishedPlans(loggedIn.name);
        const onStorage = (e) => { if (e.key === ROUTE_PLAN_PUBLISH_STORAGE_KEY) mergePublishedPlans(loggedIn.name); };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
    }, [loggedIn?.name]);

    // Flushes any SOS reports queued while offline (see submitSos below) the moment connectivity
    // comes back - fix-list item 78. localStorage stands in for a real durable queue/background sync
    // since there's no service worker or backend here.
    useEffect(() => {
        if (!isOnline) return;
        let queued = [];
        try { queued = JSON.parse(localStorage.getItem(SOS_QUEUE_STORAGE_KEY) || '[]'); } catch (e) { queued = []; }
        if (queued.length === 0) return;
        setSosAlerts(list => [...queued, ...list]);
        // sosQueued -> sos is the actual delivery moment (fix-list item 78) - only now does "help is
        // on the way" become a true claim, so only now does the trip pick up the flag that banner
        // reads.
        setAssignments(list => list.map(a =>
            queued.some(q => q.assignmentId === a.id) ? { ...a, sos: true, sosQueued: false, status: 'Delayed' } : a
        ));
        try { localStorage.removeItem(SOS_QUEUE_STORAGE_KEY); } catch (e) {}
    }, [isOnline]);

    // Backfills startedAt/estimatedDurationMin onto any seeded 'In Transit' trip that doesn't have
    // them yet (fix-list items 65/66), so derivedProgress has something to compute from - chosen so
    // the first derived value lands close to whatever `progress` was seeded with, rather than
    // jumping to 0%. Runs once; startTrip below sets these directly for a trip actually started
    // during this session, same as the admin prototype's own backfill effect.
    useEffect(() => {
        setAssignments(list => list.map(a => {
            if (a.status !== 'In Transit' || a.startedAt) return a;
            const estimatedDurationMin = estimatedTripDurationMin(a.route);
            const seededProgress = a.progress ?? 0;
            const startedAt = Date.now() - (seededProgress / 100) * estimatedDurationMin * 60000;
            return { ...a, startedAt, estimatedDurationMin };
        }));
    }, []);

    // Nothing here mutates progress any more (see derivedProgress above, fix-list items 65/66) - just
    // forces a re-render every so often so a trip's progress bar/map marker keeps visibly advancing
    // while the app is open, standing in for real GPS the same way the old ticked counter did.
    const [, forceProgressTick] = useState(0);
    useEffect(() => {
        const id = setInterval(() => forceProgressTick(t => t + 1), 1800);
        return () => clearInterval(id);
    }, []);

    // Shuttle loops published from the admin panel (see readPublishedShuttles). Kept here, before the
    // login early return below, because the Rules of Hooks need every hook ahead of it.
    const [publishedShuttles, setPublishedShuttles] = useState(readPublishedShuttles);
    useEffect(() => {
        const onStorage = (e) => { if (e.key === SHUTTLE_PUBLISH_STORAGE_KEY) setPublishedShuttles(readPublishedShuttles()); };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
    }, []);

    if (!loggedIn) {
        return <LoginScreen drivers={DRIVER_APP_DATA.drivers} onLogin={setLoggedIn} />;
    }

    // Once a reassignment has been acknowledged the trip is gone for good from this driver's list -
    // it's no longer theirs, so it shouldn't linger anywhere on their screen.
    const myTrips = assignments.filter(a => a.driver === loggedIn.name && !(a.reassigned && a.acknowledged));
    const selectedTrip = myTrips.find(t => t.id === selectedTripId) || null;
    // A driver can only physically be on one trip at a time - block starting a new one while
    // another is still In Transit / Delayed. A reassigned trip is no longer actionable, so it
    // doesn't count - the driver should be free to pick up something else.
    const hasActiveTrip = myTrips.some(t => !t.reassigned && (t.status === 'In Transit' || t.status === 'Delayed'));
    // The vehicle "type" (e.g. "Bus (40)") isn't stored on the driver record itself, only on each
    // trip - so it's read off whichever trip actually matches the driver's current vehicle id, falling
    // back to any trip at all if none match yet (e.g. right after a reassignment, before any new trip
    // data exists for that id). Shared by the Home vehicle card and Profile's Assigned Vehicle row so
    // both resolve the exact same model name for the same vehicle.
    const currentVehicleType = (myTrips.find(t => t.vehicleId === loggedIn.vehicleId) || myTrips[0])?.type || null;

    // The recurring shuttle loop this driver's own vehicle is rostered on, if any - matched the same
    // way the admin panel matches a vehicle to a shuttle plan (plan.vehicles includes the vehicle id).
    const myShuttlePlan = mergeShuttlePlans(DRIVER_APP_DATA.shuttlePlans, publishedShuttles)
        .find(s => s.status === 'Active' && s.vehicles.includes(loggedIn.vehicleId)) || null;
    // Whichever shuttle-loop trip (if any) is currently Scheduled/In Transit/Delayed for this driver -
    // "Start Next Loop" only ever creates one at a time, so there's at most one to find.
    const activeLoopTrip = myTrips.find(t => t.kind === 'shuttle' && t.status !== 'Completed') || null;

    const updateTrip = (id, patch) => setAssignments(list => list.map(a => a.id === id ? { ...a, ...patch } : a));

    // Hands one real run of the recurring loop into the exact same trip machinery every one-off
    // dispatch already uses (geofencing, SOS, fuel, Complete) instead of a parallel, half-featured
    // "shuttle mode" - a genuine, temporary assignment for this driver/vehicle, tagged `kind: 'shuttle'`
    // purely so My Trips/Home/this screen can tell it apart from a real dispatch at a glance. Carries
    // the FULL ordered stop chain (`stops`) rather than collapsing to first-pickup -> destination -
    // that was the exact gap this redesign fixes. `route`/`startedAt`/`estimatedDurationMin` are kept
    // as an approximate first-stop -> last-stop fallback purely for the handful of generic, kind-
    // agnostic readers (e.g. the fuel-gauge km-driven estimate) that only ever know one flat leg -
    // every shuttle-aware screen uses the precise per-leg helpers (shuttleLegProgress/shuttleStopEta)
    // instead, never this fallback.
    const startShuttleLoop = (plan) => {
        if (hasActiveTrip) return;
        const id = uid('SHTTRIP');
        const stops = [...plan.origins, plan.destination];
        const totalDurationMin = stops.slice(0, -1).reduce((sum, _, i) => {
            const est = tripEstimate(`${stops[i]} -> ${stops[i + 1]}`);
            return sum + (est ? est.durationMin : 0);
        }, 0);
        const newTrip = {
            id, vehicleId: loggedIn.vehicleId, type: currentVehicleType || 'Minibus (20)', driver: loggedIn.name,
            vendorName: loggedIn.vendor, kind: 'shuttle', shuttlePlanId: plan.id, frequencyMinutes: plan.frequencyMinutes,
            stops, route: `${stops[0]} -> ${stops[stops.length - 1]}`, legIndex: null, legStartedAt: null,
            time: formatClockTime(new Date()), status: 'Scheduled', startedAt: null, estimatedDurationMin: totalDurationMin || null, progress: 0,
            stakeholder: 'Recurring Shuttle Loop', phase: 'upcoming', sos: false,
        };
        setAssignments(list => [newTrip, ...list]);
        setSelectedTripId(id);
    };

    const startTrip = (id) => {
        if (hasActiveTrip) return;
        // startedAt/estimatedDurationMin (fix-list items 65/66/68), not a hardcoded progress: 5 - this
        // is the one explicit moment a trip's clock actually starts, everything else (map marker,
        // progress bars, ETA) derives from it going forward. Falls back to the flat default duration
        // if this trip's route doesn't resolve to two known locations.
        const trip = assignments.find(a => a.id === id);
        updateTrip(id, { status: 'In Transit', startedAt: Date.now(), estimatedDurationMin: trip ? estimatedTripDurationMin(trip.route) : DEFAULT_TRIP_DURATION_MIN });
    };
    // The only thing that ever sets progress to 100 and status to Completed (fix-list item 67) -
    // derivedProgress caps at 99 on its own, a trip never silently finishes itself.
    const completeTrip = (id) => updateTrip(id, { status: 'Completed', progress: 100 });

    // The moment a shuttle loop actually begins - leg 0 (stops[0] -> stops[1]) starts running, same
    // "startedAt is the one true clock" idea startTrip already follows for a one-off trip.
    const startShuttleLeg = (id) => {
        if (hasActiveTrip) return;
        updateTrip(id, { status: 'In Transit', legIndex: 0, legStartedAt: Date.now(), startedAt: Date.now() });
    };
    // Either moves the loop on to its next leg (mid-route), or, when the stop just reached IS the
    // final one, finishes the whole loop - same one-mutator-does-both shape completeTrip has, just
    // resolved against this trip's own current legIndex instead of always meaning "the very end".
    // Also bridges the leg that just closed out to the admin app (reportCompletedShuttleLeg) - this
    // is the only moment a shuttle leg is ever known to be done, anywhere in this whole system, so
    // it's the only place that can report it.
    const advanceShuttleLeg = (id) => {
        const trip = assignments.find(a => a.id === id);
        if (!trip || trip.legIndex == null) return;
        const atFinalLeg = trip.legIndex === trip.stops.length - 2;
        const legOrigin = trip.stops[trip.legIndex], legDest = trip.stops[trip.legIndex + 1];
        reportCompletedShuttleLeg({
            id: uid('SHTLEG'), vehicleId: trip.vehicleId, vehicleType: trip.type, driverName: trip.driver, vendorName: trip.vendorName,
            route: `${legOrigin} -> ${legDest}`, routeFrom: LOCATION_COORDS[legOrigin], routeTo: LOCATION_COORDS[legDest],
            completedAt: Date.now(), shuttlePlanId: trip.shuttlePlanId,
        });
        setAssignments(list => list.map(a => {
            if (a.id !== id) return a;
            return atFinalLeg
                ? { ...a, status: 'Completed', progress: 100 }
                : { ...a, legIndex: a.legIndex + 1, legStartedAt: Date.now() };
        }));
    };

    // Runs one geo-fencing check against `targetName` and either performs it immediately (distance is
    // within GEOFENCE_RADIUS_KM) or leaves `geofenceCheck` set to whatever went wrong, for
    // GeofenceModal to show. `perform` is the actual state change to apply on success (start a one-off
    // trip, complete one, start a shuttle leg, advance/complete one) - generalized to accept any of
    // them, rather than the two hardcoded "start vs complete a single-leg trip" branches this used to
    // have, specifically so a shuttle loop's own multi-step actions could reuse the exact same check
    // instead of a parallel geofencing implementation. `onSuccess` only fires once the action has
    // actually gone through - callers use it for follow-up UI that should never happen for a blocked/
    // failed attempt (e.g. auto-expanding the route map after a trip that actually started).
    const runGeofenceCheck = async (trip, action, targetName, perform, onSuccess) => {
        const targetCoords = LOCATION_COORDS[targetName];
        setGeofenceCheck({ trip, action, targetName, perform, onSuccess, status: 'checking', locationName: targetName });
        try {
            // Demo mode reports the driver as exactly at the target point instead of asking the
            // device for its real GPS fix - same brief delay a real fix would take, so "Checking your
            // location..." still shows before it resolves, rather than snapping straight to success.
            const myCoords = simulateAtLocation
                ? await new Promise(resolve => setTimeout(() => resolve(targetCoords || [0, 0]), 900))
                : await getCurrentPositionAsync();
            const distanceKm = targetCoords ? haversineKm(myCoords, targetCoords) : 0;
            if (distanceKm <= GEOFENCE_RADIUS_KM) {
                setGeofenceCheck(null);
                perform();
                onSuccess && onSuccess();
            } else {
                setGeofenceCheck({ trip, action, targetName, perform, onSuccess, status: 'blocked', locationName: targetName, distanceKm });
            }
        } catch (err) {
            setGeofenceCheck({ trip, action, targetName, perform, onSuccess, status: 'error', locationName: targetName, message: err.message });
        }
    };

    // The gate every Start Trip / Mark Trip Complete button now goes through instead of calling
    // startTrip/completeTrip directly - skips straight to the real action when geo-fencing is off (the
    // admin panel's toggle), so turning it off genuinely removes the location requirement rather than
    // just hiding the modal on an already-passing check.
    const attemptStartTrip = (trip, onSuccess) => {
        const [originName] = trip.route.split(' -> ');
        const perform = () => startTrip(trip.id);
        if (!geoFencingEnabled) { perform(); onSuccess && onSuccess(); return; }
        runGeofenceCheck(trip, 'start', originName, perform, onSuccess);
    };
    const attemptCompleteTrip = (trip, onSuccess) => {
        const [, destName] = trip.route.split(' -> ');
        const perform = () => completeTrip(trip.id);
        if (!geoFencingEnabled) { perform(); onSuccess && onSuccess(); return; }
        runGeofenceCheck(trip, 'complete', destName, perform, onSuccess);
    };
    // Same gate, shuttle-flavored: "start" always checks against stops[0]; "arrive/complete" checks
    // against whichever stop is actually next, which is either an intermediate one (advance the leg)
    // or the final one (finish the whole loop) - GeofenceModal tells the two apart via `action`.
    const attemptStartShuttleLeg = (trip) => {
        const perform = () => startShuttleLeg(trip.id);
        if (!geoFencingEnabled) { perform(); return; }
        runGeofenceCheck(trip, 'start', trip.stops[0], perform);
    };
    const attemptAdvanceShuttleLeg = (trip) => {
        const nextStopIndex = trip.legIndex + 1;
        const isFinal = nextStopIndex === trip.stops.length - 1;
        const perform = () => advanceShuttleLeg(trip.id);
        if (!geoFencingEnabled) { perform(); return; }
        runGeofenceCheck(trip, isFinal ? 'completeLoop' : 'arrive', trip.stops[nextStopIndex], perform);
    };
    const retryGeofenceCheck = () => {
        if (!geofenceCheck) return;
        runGeofenceCheck(geofenceCheck.trip, geofenceCheck.action, geofenceCheck.targetName, geofenceCheck.perform, geofenceCheck.onSuccess);
    };
    const cancelGeofenceCheck = () => setGeofenceCheck(null);

    // Demo-only: stands in for "the admin just saved a different vehicle on this plan". In the real
    // system this would arrive as a push from the admin app; here it's a manual trigger so the flow
    // can be shown without a live backend connecting the two prototypes.
    const simulateReassignment = () => {
        const target = myTrips.find(t => !t.reassigned && (t.status === 'In Transit' || t.status === 'Delayed'))
            || myTrips.filter(t => !t.reassigned && t.status === 'Scheduled').sort((a, b) => a.time.localeCompare(b.time))[0];
        if (!target) { alert('No ongoing or upcoming trip to simulate a reassignment on.'); return; }
        updateTrip(target.id, { reassigned: true, acknowledged: false });
    };

    const acknowledgeReassignment = (id) => {
        updateTrip(id, { acknowledged: true });
        setSelectedTripId(curr => (curr === id ? null : curr));
    };

    // Demo-only: stands in for the admin swapping this driver onto a different physical vehicle (a
    // breakdown, a fleet reshuffle, etc.) - a distinct scenario from simulateReassignment above, which
    // moves one specific trip away from this driver entirely. Here the driver keeps every trip; only
    // which vehicle they're driving changes. Picks the next vehicle id in sequence off whichever
    // vehicle is currently effective, purely so the demo has a plausible "new" id to show.
    const simulateVehicleReassignment = () => {
        if (vehicleReassignment && !vehicleReassignment.acknowledged) {
            alert('There is already a pending vehicle reassignment notice to acknowledge.');
            return;
        }
        const currentVehicleId = loggedIn.vehicleId;
        const num = parseInt(currentVehicleId.replace(/\D/g, ''), 10) || 0;
        const prefix = currentVehicleId.replace(/\d+$/, '');
        const newVehicleId = `${prefix}${String(num + 1).padStart(4, '0')}`;
        // Same category/type either way - the admin is swapping the physical unit, not what kind of
        // vehicle this driver drives - so the modal can resolve both names off this one type.
        setVehicleReassignment({ fromVehicleId: currentVehicleId, toVehicleId: newVehicleId, vehicleType: currentVehicleType, acknowledged: false });
    };

    const acknowledgeVehicleReassignment = () => {
        if (!vehicleReassignment) return;
        const { toVehicleId } = vehicleReassignment;
        // Every trip of this driver's that hasn't already happened moves onto the new vehicle - a
        // Completed trip stays exactly as it was actually driven, since a reassignment can't rewrite
        // history.
        setAssignments(list => list.map(a =>
            a.driver === loggedIn.name && a.status !== 'Completed' ? { ...a, vehicleId: toVehicleId } : a
        ));
        setLoggedIn(d => ({ ...d, vehicleId: toVehicleId }));
        setVehicleReassignment(curr => curr ? { ...curr, acknowledged: true } : curr);
    };

    const openSos = (tripId) => { setSosTargetId(tripId); setSosModalOpen(true); };

    const submitSos = (message) => {
        const target = myTrips.find(t => t.id === sosTargetId);
        if (!target) return;
        const alertEntry = {
            id: uid('SOS'), assignmentId: target.id, vehicleId: target.vehicleId, driver: loggedIn.name,
            location: `En route - ${target.route}`,
            reportedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            message: message.trim() || 'Emergency reported by driver', status: 'Active',
        };
        if (!isOnline) {
            // Queued, not lost (fix-list item 78) - saved to localStorage and flushed automatically
            // by the effect above the moment connectivity returns. The trip itself isn't flagged
            // sos/Delayed until the report actually lands, same as it would with a real backend
            // queue - but it does get sosQueued, a distinct state from sos (fix-list item 78's own
            // follow-up: "help is on the way" is a claim about a report that's actually reached
            // someone, and saying that about one still sitting in a local queue would be dishonest).
            try {
                const queued = JSON.parse(localStorage.getItem(SOS_QUEUE_STORAGE_KEY) || '[]');
                localStorage.setItem(SOS_QUEUE_STORAGE_KEY, JSON.stringify([...queued, alertEntry]));
            } catch (e) { /* localStorage unavailable (private mode, quota) - nothing more to do here */ }
            updateTrip(target.id, { sosQueued: true });
            setSosModalOpen(false);
            alert("No connection right now - your SOS report is saved and will send automatically the moment you're back online.");
            return;
        }
        setSosAlerts(list => [alertEntry, ...list]);
        updateTrip(target.id, { sos: true, status: 'Delayed' });
        setSosModalOpen(false);
    };

    const resolveSos = (tripId) => {
        setSosAlerts(list => list.map(s => s.assignmentId === tripId ? { ...s, status: 'Resolved' } : s));
        updateTrip(tripId, { sos: false });
    };

    // Resets this vehicle's fuel depletion checkpoint to right now - identical model to the admin
    // prototype's own Log Refuel (see vehicleFuelProfile above). Tagged 'Driver App' since that's the
    // whole point of this screen: showing what it looks like when the driver, not an admin, is the one
    // logging it. Purely local to this app - there's no shared backend for it to reach the admin side.
    const logRefuel = (vehicleId) => {
        const today = new Date().toISOString().slice(0, 10);
        const checkpoint = vehicleTotalKmDriven(vehicleId, assignments);
        setFuelState(state => ({
            ...state,
            [vehicleId]: { fuelCheckpointKm: checkpoint, lastRefuelDate: today, lastRefuelSource: 'Driver App' },
        }));
        setRefuelEvents(list => [{ id: uid('RFL'), vehicleId, date: today, source: 'Driver App', odometerBasisKm: Math.round(checkpoint) }, ...list]);
    };

    const logout = () => { setLoggedIn(null); setActiveTab('home'); setSelectedTripId(null); setVehicleReassignment(null); setGeofenceCheck(null); };

    let screen, title;
    if (selectedTrip && selectedTrip.kind === 'shuttle') {
        title = 'Recurring Shuttle';
        screen = (
            <ShuttleTripScreen trip={selectedTrip} hasActiveTrip={hasActiveTrip} onStart={() => attemptStartShuttleLeg(selectedTrip)} onAdvance={() => attemptAdvanceShuttleLeg(selectedTrip)}
                onOpenSos={() => openSos(selectedTrip.id)} onResolveSos={() => resolveSos(selectedTrip.id)}
                fuelProfile={vehicleFuelProfile(selectedTrip, assignments, fuelState)} onLogRefuel={() => logRefuel(selectedTrip.vehicleId)} />
        );
    } else if (selectedTrip) {
        title = selectedTrip.reassigned ? 'Trip Reassigned' : 'Trip Details';
        screen = (
            <TripDetailScreen trip={selectedTrip} hasActiveTrip={hasActiveTrip} onStart={() => attemptStartTrip(selectedTrip)} onComplete={() => attemptCompleteTrip(selectedTrip)}
                onOpenSos={() => openSos(selectedTrip.id)} onResolveSos={() => resolveSos(selectedTrip.id)} onAcknowledge={() => acknowledgeReassignment(selectedTrip.id)}
                fuelProfile={vehicleFuelProfile(selectedTrip, assignments, fuelState)} onLogRefuel={() => logRefuel(selectedTrip.vehicleId)} />
        );
    } else if (activeTab === 'profile') {
        title = 'Profile';
        screen = <ProfileScreen driver={loggedIn} vehicleType={currentVehicleType} onLogout={logout} />;
    } else if (activeTab === 'trips') {
        title = 'My Trips';
        screen = <MyTripsScreen trips={myTrips} onSelect={setSelectedTripId} onStartTrip={attemptStartTrip} hasActiveTrip={hasActiveTrip} onAcknowledge={acknowledgeReassignment} />;
    } else if (activeTab === 'shuttle') {
        title = 'Recurring Shuttle';
        screen = <ShuttleScreen plan={myShuttlePlan} activeLoopTrip={activeLoopTrip} hasActiveTrip={hasActiveTrip} onStartLoop={startShuttleLoop} onSelect={setSelectedTripId} />;
    } else {
        title = 'Home';
        screen = <HomeScreen trips={myTrips} assignments={assignments} fuelState={fuelState} driver={loggedIn} vehicleType={currentVehicleType}
            shuttlePlan={myShuttlePlan} activeLoopTrip={activeLoopTrip} hasActiveTrip={hasActiveTrip}
            onAcknowledge={acknowledgeReassignment} onComplete={attemptCompleteTrip} onOpenSos={openSos} onResolveSos={resolveSos}
            onAdvanceShuttleLeg={attemptAdvanceShuttleLeg}
            onLogRefuel={logRefuel} onGoToTrips={() => setActiveTab('trips')} onGoToShuttle={() => setActiveTab('shuttle')} />;
    }

    return (
        // h-screen (not min-h-screen) on both wrappers - the phone frame needs to be pinned to exactly
        // the viewport height so the middle panel's flex-1/overflow-y-auto actually has a bounded
        // height to scroll within, leaving TopBar and BottomNav fixed in place above/below it. With
        // min-h-screen the frame was free to grow taller than the viewport instead (which it now
        // regularly does - the Home hero's map+content easily exceeds one screen), so the whole page
        // scrolled and BottomNav scrolled away with it instead of staying put.
        <div className="h-screen bg-bgLight flex justify-center overflow-hidden">
            <div className="w-full max-w-md bg-bgLight h-screen flex flex-col shadow-xl relative">
                <TopBar driver={loggedIn} title={title} onBack={selectedTrip ? () => setSelectedTripId(null) : null} onLogout={logout}
                    onSimulateReassignment={simulateReassignment} onSimulateVehicleReassignment={simulateVehicleReassignment}
                    simulateAtLocation={simulateAtLocation} onToggleSimulateLocation={() => setSimulateAtLocation(s => !s)}
                    isOnline={isOnline} onToggleSimulateOffline={() => setSimulateOffline(s => !s)}
                    onSimulateOnCallNudge={simulateIncomingOnCallNudge} />
                <div className="flex-1 overflow-y-auto pb-2">{screen}</div>
                {!selectedTrip && <BottomNav activeTab={activeTab} onChange={t => { setActiveTab(t); setSelectedTripId(null); }} />}
                <SosModal open={sosModalOpen} onClose={() => setSosModalOpen(false)} onSubmit={submitSos} />
                <VehicleReassignedModal reassignment={vehicleReassignment} onAcknowledge={acknowledgeVehicleReassignment} />
                <GeofenceModal check={geofenceCheck} onRetry={retryGeofenceCheck} onCancel={cancelGeofenceCheck} />
                <OnCallNudgeModal nudge={incomingNudge} onAccept={n => respondToNudge(n, 'Accepted')} onDecline={n => respondToNudge(n, 'Declined')} />
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
