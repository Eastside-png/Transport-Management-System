// Same distance-matrix approach as the admin prototype (same constants, same math) so an ETA shown
// here always agrees with the estimate an admin would see when planning the same route. No routing
// engine available in this prototype, so distance/duration are both estimated from straight-line
// distance rather than real road data.
const haversineKm = ([lat1, lng1], [lat2, lng2]) => {
    const R = 6371;
    const toRad = (deg) => deg * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
};

    let all = {};
    try { all = JSON.parse(localStorage.getItem(DRIVER_AVAILABILITY_STORAGE_KEY) || '{}'); } catch (e) { all = {}; }

// Wraps the browser's Geolocation API in a promise - rejects with a real Error either when the API
// isn't available at all (older browser, non-HTTPS/non-localhost origin) or when the browser's own
// callback reports one (permission denied, position unavailable, timed out).
const getCurrentPositionAsync = () => new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
        reject(new Error('Geolocation is not supported on this device or browser.'));
        return;
    }
    navigator.geolocation.getCurrentPosition(
        (pos) => resolve([pos.coords.latitude, pos.coords.longitude]),
        (err) => reject(new Error(err && err.message ? err.message : 'Unable to determine your current location.')),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
});

// this app has no shared backend with the admin panel, so a raw GPS fix has to be snapped to one of
// these named cities before it means anything on the admin side, whose proximity check only ever
// compares named cities, never raw coordinates.
const DRIVER_BASE_CITIES = [
    { name: 'New Delhi', lat: 28.6139, lng: 77.2090 },
    { name: 'Gurugram', lat: 28.4595, lng: 77.0266 },
    { name: 'Noida', lat: 28.5355, lng: 77.3910 },
    { name: 'Chandigarh', lat: 30.7333, lng: 76.7794 },
    { name: 'Jaipur', lat: 26.9124, lng: 75.7873 },
    { name: 'Lucknow', lat: 26.8467, lng: 80.9462 },
    { name: 'Dehradun', lat: 30.3165, lng: 78.0322 },
    { name: 'Bhopal', lat: 23.2599, lng: 77.4126 },
    { name: 'Guwahati', lat: 26.1445, lng: 91.7362 },
    { name: 'Shillong', lat: 25.5788, lng: 91.8933 },
];
// Nearest named city to a raw [lat, lng] fix - always returns one (there's no "too far to count" cutoff,
// a coarse city-level guess is already the level of precision this whole mechanism works at).
const nearestBaseCity = ([lat, lng]) => {
    let best = null, bestDist = Infinity;
    DRIVER_BASE_CITIES.forEach(c => {
        const d = haversineKm([lat, lng], [c.lat, c.lng]);
        if (d < bestDist) { bestDist = d; best = c.name; }
    });
    return best;
};

// right now (a shared kiosk device, or just testing multiple demo accounts in turn) - each driver's
// own last-reported location is stored separately, never overwritten by whoever happened to report
// most recently under a different id.
const DRIVER_LOCATIONS_STORAGE_KEY = 'kheloTechDriverLocations';
const LOCATION_REPORT_INTERVAL_MS = 5 * 60 * 1000; // re-report every 5 minutes while logged in
// Fix: a driver's admin-side location used to be either hand-typed (Base Location) or a manual
// override (Current Location) - neither is actually "where the driver is right now" unless someone
// remembers to update it. This reports the real thing, automatically, from the device this app is
// running on. Real GPS only - there's no "simulate" fallback the way runGeofenceCheck has one (that
// one fakes a position specifically to demo a location-gated action on demand); faking this one would
// undercut the entire point of it being a real, not hand-set, signal. Meaningfully seeing this
// resolve to somewhere other than "wherever the tester's own device actually is" therefore needs
// either a real device physically near one of DRIVER_BASE_CITIES, or the browser's location spoofed
// via devtools. Fails silently on purpose - a denied permission, an offline device, or an unsupported
// browser just means nothing gets reported this cycle, not an error the driver has to deal with; the
// admin side already treats "nothing reported" as "fall back to Base Location", never as a fault.
const reportMyLocation = async (driverId) => {
    if (!driverId) return;
    try {
        const coords = await getCurrentPositionAsync();
        const city = nearestBaseCity(coords);
        if (!city) return;
        let all = {};
        try { all = JSON.parse(localStorage.getItem(DRIVER_LOCATIONS_STORAGE_KEY) || '{}'); } catch (e) { all = {}; }
        all[driverId] = { city, updatedAt: Date.now() };
        localStorage.setItem(DRIVER_LOCATIONS_STORAGE_KEY, JSON.stringify(all));
    } catch (e) { /* silent - see this function's own comment */ }
};

// Callable again (fix-list items 51/52), not a one-shot IIFE - see the sync effect in App that calls
// this whenever ROAD_DISTANCE_FACTOR/AVG_ROAD_SPEED_KMH change.
let DISTANCE_MATRIX = {};
const rebuildDistanceMatrix = () => {
    const names = Object.keys(LOCATION_COORDS);
    const matrix = {};
    names.forEach(from => {
        matrix[from] = {};
        names.forEach(to => {
            if (from === to) { matrix[from][to] = { distanceKm: 0, durationMin: 0 }; return; }
            const roadKm = haversineKm(LOCATION_COORDS[from], LOCATION_COORDS[to]) * ROAD_DISTANCE_FACTOR;
            matrix[from][to] = {
                distanceKm: Math.round(roadKm * 10) / 10,
                durationMin: Math.round(roadKm / AVG_ROAD_SPEED_KMH * 60),
            };
        });
    });
    DISTANCE_MATRIX = matrix;
};
rebuildDistanceMatrix();

const lookupDistance = (origin, destination) => {
    if (!origin || !destination) return null;
    const row = DISTANCE_MATRIX[origin];
    return (row && row[destination]) || null;
};

// Total estimated duration for a "A -> B" route string.
const tripEstimate = (route) => {
    const [origin, destination] = route.split(' -> ');
    return lookupDistance(origin, destination);
};

const DEFAULT_TRIP_DURATION_MIN = 30;
const estimatedTripDurationMin = (route) => tripEstimate(route)?.durationMin || DEFAULT_TRIP_DURATION_MIN;

// A trip's live progress (fix-list items 65/66), derived fresh from a stored start timestamp and
// estimated duration rather than a ticked, stored counter - same approach and reasoning as the admin
// prototype's own window.derivedProgress (ACT Travel Prototype.html). Deterministic and immune to
// freezing when nothing's open to tick it. Caps at 99, not 100 - Mark Trip Complete (completeTrip in
// App) is what actually sets 100 and Completed, the same "waits for the driver" decision as the
// admin side (fix-list item 67), so a trip never silently finishes itself.
const derivedProgress = (trip) => {
    // A trip completeTrip already finalized always reads back its own stored 100 - once it's
    // Completed, its clock is done, not still running past what startedAt/estimatedDurationMin
    // would otherwise keep computing.
    if (trip.status === 'Completed' || !trip.startedAt || !trip.estimatedDurationMin) return trip.progress ?? 0;
    const elapsedMin = (Date.now() - trip.startedAt) / 60000;
    return Math.max(0, Math.min(99, Math.round((elapsedMin / trip.estimatedDurationMin) * 100)));
};

// Straight-line interpolation between two [lat, lng] points at `progress` (0-100) along the way -
// good enough for a demo "here's roughly where the vehicle is right now" marker without a real
// routing engine giving an actual road-following position.
const posAlongRoute = (origin, dest, progress) => {
    if (!origin || !dest) return null;
    const t = Math.max(0, Math.min(1, (progress || 0) / 100));
    return [origin[0] + (dest[0] - origin[0]) * t, origin[1] + (dest[1] - origin[1]) * t];
};

// Rough per-km fare estimate by vehicle category, purely for the Home screen's "Estimated Cost"
// figure - this prototype has no real fare/billing model, so these are flat placeholder rates rather
// than anything reflecting actual contracted pricing.
const VEHICLE_COST_PER_KM = { Sedan: 14, SUV: 18, Minibus: 25, Bus: 35 };
const tripCostEstimate = (trip) => {
    const est = tripEstimate(trip.route);
    const rate = VEHICLE_COST_PER_KM[vehicleCategoryFromType(trip.type)];
    if (!est || !rate) return null;
    return Math.round(est.distanceKm * rate);
};

// Same fuel-economy figures as the admin prototype's VEHICLE_CATEGORIES (avgConsumption,
// tankCapacity, refuelCycleKm) - kept here as a lightweight lookup by category name (parsed off an
// assignment's own "type" field, e.g. "Bus (40)" -> "Bus") rather than a full vehicle-categorization
// module, since a driver only ever needs their own one vehicle's numbers, not the whole fleet's.
const VEHICLE_FUEL_DEFAULTS = {
    Sedan: { avgConsumption: 15, tankCapacity: 45, refuelCycleKm: 500 },
    SUV: { avgConsumption: 12, tankCapacity: 55, refuelCycleKm: 500 },
    Minibus: { avgConsumption: 8, tankCapacity: 90, refuelCycleKm: 400 },
    Bus: { avgConsumption: 4, tankCapacity: 200, refuelCycleKm: 350 },
};
const vehicleCategoryFromType = (type) => (type || '').split(' ')[0]; // "Bus (40)" -> "Bus"

// Model names by category, mirroring the admin prototype's VEHICLE_CATEGORIES model lists so the two
// prototypes describe a believable, consistent fleet even without a shared backend. There's no
// per-vehicle fleet record here though (this file only ever sees a vehicleId + a "Bus (40)"-style type
// string on each assignment) - so a vehicle's specific model is picked deterministically off its own
// id's characters rather than stored anywhere. The same id always resolves to the same model,
// including a freshly-generated reassignment id like "VH-4402" that never existed in any seed data.
const VEHICLE_MODELS = {
    Sedan: ['Swift Dzire', 'Honda Amaze', 'Toyota Etios', 'Hyundai Aura', 'Honda City', 'Maruti Ciaz'],
    SUV: ['Toyota Innova Crysta', 'Mahindra XUV700', 'Toyota Fortuner', 'Mahindra Scorpio-N', 'Hyundai Creta', 'Tata Safari'],
    Minibus: ['Force Traveller', 'Tata Winger', 'Force Urbania', 'Mahindra Supro Van'],
    Bus: ['Ashok Leyland Viking', 'Tata Starbus Ultra', 'Eicher Skyline Pro', 'BharatBenz 1617'],
};
// The one place "how does a vehicle's name look" gets decided for a given type + id - model
// prominent, id secondary (e.g. "Toyota Innova Crysta · VH-3320") - every screen showing a vehicle to
// the driver should render it through this rather than showing the bare id on its own.
const vehicleNameFor = (type, vehicleId) => {
    const models = VEHICLE_MODELS[vehicleCategoryFromType(type)];
    if (!models || !vehicleId) return type || vehicleId || '—';
    const hash = [...vehicleId].reduce((a, c) => a + c.charCodeAt(0), 0);
    return models[hash % models.length];
};

// Same "STATE-DD-LETTERS-####" plate format the admin prototype's seed fleet uses (e.g.
// "DL-01-AB-4401"), and the same trick of ending in the vehicle id's own numeric suffix - so a plate
// shown here always looks like it plausibly belongs to that id. There's no stored registration record
// to look up (see VEHICLE_MODELS above for why), so the state/district/letters are picked
// deterministically off the id's characters, same as the model name.
const REG_STATE_CODES = ['DL', 'HR', 'UP', 'MH', 'KA'];
const REG_LETTER_PAIRS = ['AB', 'CD', 'EF', 'GH', 'JK', 'LM'];
const vehicleRegNoFor = (vehicleId) => {
    if (!vehicleId) return '—';
    const digits = vehicleId.replace(/\D/g, '').padStart(4, '0').slice(-4);
    const hash = [...vehicleId].reduce((a, c) => a + c.charCodeAt(0), 0);
    const state = REG_STATE_CODES[hash % REG_STATE_CODES.length];
    const district = String((hash % 40) + 1).padStart(2, '0');
    const letters = REG_LETTER_PAIRS[Math.floor(hash / REG_STATE_CODES.length) % REG_LETTER_PAIRS.length];
    return `${state}-${district}-${letters}-${digits}`;
};

// How far this vehicle has driven today, in km - a Completed trip counts in full, an In
// Transit/Delayed one counts for whatever share of its route it's already covered (progress%), a
// Scheduled one counts for nothing. Sums across every trip for this vehicleId, not just whichever one
// is currently open, since fuel doesn't reset between a driver's own back-to-back trips on the same
// vehicle (see DRV-001's three trips on VH-4401 in the seed data).
const vehicleTotalKmDriven = (vehicleId, assignments) =>
    assignments
        .filter(a => a.vehicleId === vehicleId)
        .reduce((sum, a) => {
            const est = tripEstimate(a.route);
            if (!est) return sum;
            if (a.status === 'Completed') return sum + est.distanceKm;
            if (a.status === 'In Transit' || a.status === 'Delayed') return sum + est.distanceKm * (derivedProgress(a) / 100);
            return sum;
        }, 0);

// A vehicle's live fuel picture - mirrors the admin prototype's window.vehicleFuelProfile exactly
// (same depletion model: fuelLevel is derived from kmSinceRefuel, never stored directly, so it only
// ever moves down as trips actually progress and only recovers when Log Refuel is tapped). `fuelState`
// is App's own local map of vehicleId -> { fuelCheckpointKm, lastRefuelDate, lastRefuelSource } - this
// prototype has no shared backend with the admin app, so a refuel logged here never reaches it and
// vice versa; each side just tells its own honest, internally-consistent version of the story.
// Same placeholder figure as the admin prototype's window.CRITICAL_FUEL_PERCENT (fix-list item 46) -
// not an Operations-approved number, just something real to build the "fuel critical" notification
// tier and this gauge's red band against instead of a bare hardcoded 20 in three different places.
const CRITICAL_FUEL_PERCENT = 15;

const vehicleFuelProfile = (trip, assignments, fuelState) => {
    const cat = VEHICLE_FUEL_DEFAULTS[vehicleCategoryFromType(trip.type)];
    if (!cat) return null;
    const state = fuelState[trip.vehicleId] || {};
    const kmSinceRefuel = Math.max(0, vehicleTotalKmDriven(trip.vehicleId, assignments) - (state.fuelCheckpointKm || 0));
    const litersUsed = kmSinceRefuel / cat.avgConsumption;
    const fuelLevel = Math.max(0, Math.min(100, Math.round(100 - (litersUsed / cat.tankCapacity) * 100)));
    return {
        fuelLevel,
        refuelCycleKm: cat.refuelCycleKm,
        kmSinceRefuel: Math.round(kmSinceRefuel * 10) / 10,
        dueForRefuel: kmSinceRefuel >= cat.refuelCycleKm,
        fuelCritical: fuelLevel <= CRITICAL_FUEL_PERCENT,
        lastRefuelDate: state.lastRefuelDate || null,
        lastRefuelSource: state.lastRefuelSource || null,
    };
};

// Every clock/date in both this app and the admin prototype runs in the browser's local system
// time with no timezone field or conversion anywhere (fix-list items 104/126) - a deliberate policy
// decision, not an oversight: NG 2027 is a single-timezone, India-hosted programme, so every
// date/time in the system is Indian Standard Time, full stop. The admin prototype's own header
// clock labels this explicitly ("... IST"); this app has no standing header clock to label the same
// way, hence the policy note living here instead.
const formatClockTime = (date) => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

// Live ETA for a trip already under way: total estimated duration minus however much of it
// progress% already covers, projected forward from right now - so it naturally counts down as
// progress ticks up from the simulated-GPS effect in App, without needing its own timer.
const liveEta = (trip) => {
    const est = tripEstimate(trip.route);
    if (!est) return null;
    const remainingMin = est.durationMin * (1 - derivedProgress(trip) / 100);
    return formatClockTime(new Date(Date.now() + remainingMin * 60000));
};

// The next scheduled departure clock-time for a recurring shuttle plan, stepped off its own
// startTime/frequencyMinutes rather than stored anywhere - "06:00, every 30 min" always resolves to
// the same next slot for a given moment, so there's nothing to keep in sync. Returns null once
// today's operating window (endTime) has already passed.
const nextShuttleDeparture = (plan) => {
    const [sh, sm] = plan.startTime.split(':').map(Number);
    const [eh, em] = plan.endTime.split(':').map(Number);
    const startMin = sh * 60 + sm, endMin = eh * 60 + em;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    if (nowMin < startMin) return { time: plan.startTime, inMin: startMin - nowMin };
    if (nowMin >= endMin) return null;
    const slotsElapsed = Math.ceil((nowMin - startMin) / plan.frequencyMinutes);
    const nextMin = startMin + slotsElapsed * plan.frequencyMinutes;
    if (nextMin >= endMin) return null;
    return { time: `${String(Math.floor(nextMin / 60)).padStart(2, '0')}:${String(nextMin % 60).padStart(2, '0')}`, inMin: nextMin - nowMin };
};

/* ------------------------------------------------------------------ */
/* Shuttle-trip progress/ETA math - a started shuttle trip (kind:      */
/* 'shuttle', see App's startShuttleLoop/advanceShuttleLeg) carries a  */
/* full ordered `stops` chain plus a `legIndex` for whichever leg is   */
/* currently being driven, rather than the flat single origin/         */
/* destination `route` a one-off assignment has - so it needs its own  */
/* progress/ETA helpers instead of reusing derivedProgress/liveEta,    */
/* which only ever know about one leg.                                 */
/* ------------------------------------------------------------------ */

// The distance/duration estimate for one specific leg of the chain (stops[i] -> stops[i+1]) - same
// underlying window.tripEstimate every one-off trip already uses, just fed one leg at a time.
const shuttleLegEstimate = (trip, i) => tripEstimate(`${trip.stops[i]} -> ${trip.stops[i + 1]}`);

// 0-100 progress along ONLY the leg currently under way (not the whole loop) - drives the live map
// marker's position on that one leg, the same way derivedProgress drives a one-off trip's marker.
const shuttleLegProgress = (trip) => {
    if (trip.status === 'Completed') return 100;
    if (trip.legIndex == null || !trip.legStartedAt) return 0;
    const est = shuttleLegEstimate(trip, trip.legIndex);
    if (!est) return 0;
    const elapsedMin = (Date.now() - trip.legStartedAt) / 60000;
    return Math.max(0, Math.min(99, Math.round((elapsedMin / est.durationMin) * 100)));
};

// done/current/upcoming for stop index `i` of the chain - the stop list's own status dot/highlight
// reads straight off this rather than re-deriving it inline in multiple places.
const shuttleStopStatus = (trip, i) => {
    if (trip.status === 'Completed') return 'done';
    if (trip.legIndex == null) return i === 0 ? 'current' : 'upcoming';
    if (i <= trip.legIndex) return 'done';
    if (i === trip.legIndex + 1) return 'current';
    return 'upcoming';
};

// A real clock-time ETA for stop index `i` (never called for i === 0, the starting point itself -
// that one just shows the scheduled/actual departure time instead). Before the loop has started,
// every stop's ETA stacks forward off the scheduled departure time; once under way, it stacks off
// right now plus however much of the CURRENT leg is actually still left, so an already-running
// loop's ETAs shift live the same way a one-off trip's liveEta does.
const shuttleStopEta = (trip, i) => {
    if (trip.status === 'Completed') return null;
    let baseTime, fromLeg;
    if (trip.legIndex == null) {
        const [h, m] = trip.time.split(':').map(Number);
        baseTime = new Date();
        baseTime.setHours(h, m, 0, 0);
        fromLeg = 0;
    } else {
        const est = shuttleLegEstimate(trip, trip.legIndex);
        const remainingMin = est ? est.durationMin * (1 - shuttleLegProgress(trip) / 100) : 0;
        baseTime = new Date(Date.now() + remainingMin * 60000);
        fromLeg = trip.legIndex + 1;
    }
    let addMin = 0;
    for (let leg = fromLeg; leg < i; leg++) {
        const est = shuttleLegEstimate(trip, leg);
        addMin += est ? est.durationMin : 0;
    }
    return formatClockTime(new Date(baseTime.getTime() + addMin * 60000));
};

// Last 10 digits only, so '+91 98220 11223', '9822011223', and '098220-11223' all resolve to the
// same driver regardless of how the phone number happens to be formatted or typed.
const normalizePhone = (phone) => (phone || '').replace(/\D/g, '').slice(-10);

// Phone + OTP look (fix-list item 76) - the real target flow, decided but not buildable here since
// there's no SMS provider or backend in this prototype: a driver enrolls with the phone number
// captured at vendor onboarding (Driver.phone), signs in with that number plus a one-time code sent
// to it, and stays signed in on that handset until an explicit sign-out or a long, rolling session
// expiry (a new device would need a fresh OTP). What's actually built here mocks step 2 only - any
// 6-digit code is accepted once a phone number matches a driver on file - clearly labeled as such
// rather than pretending to be a real verification. The old bare "pick any driver" dropdown stays
// one click away as an explicit demo shortcut, not the primary path anymore.
function LoginScreen({ drivers, onLogin }) {
    const [step, setStep] = useState('phone'); // 'phone' | 'otp' | 'demo'
    const [phone, setPhone] = useState('');
    const [otp, setOtp] = useState('');
    const [error, setError] = useState('');
    const [matchedDriver, setMatchedDriver] = useState(null);
    const [selectedId, setSelectedId] = useState(drivers[0]?.id || '');

    const sendCode = () => {
        const key = normalizePhone(phone);
        if (key.length !== 10) { setError('Enter a valid 10-digit phone number.'); return; }
        const driver = drivers.find(d => normalizePhone(d.phone) === key);
        if (!driver) { setError('No driver account found with this phone number.'); return; }
        setError('');
        setMatchedDriver(driver);
        setOtp('');
        setStep('otp');
    };

    const verifyCode = () => {
        // Mocked verification - any 6 digits pass once the phone number itself already matched a
        // real driver record above. There's no SMS provider here to actually send or check a code.
        if (!/^\d{6}$/.test(otp)) { setError('Enter the 6-digit code.'); return; }
        onLogin(matchedDriver);
    };

    const login = () => {
        const driver = drivers.find(d => d.id === selectedId);
        if (!driver) return alert('Select a driver account.');
        onLogin(driver);
    };

    return (
        <div className="min-h-screen bg-brandBlue flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-8">

}

// A dependency-free custom-HTML map pin, same technique (and same reasoning - no Map ID needed,
// unlike google.maps.marker.AdvancedMarkerElement) as the admin panel's own FleetMap. `label` sets a
// native title-attribute tooltip on hover as a lightweight stand-in for Leaflet's old click-to-open
// popup - not worth a full InfoWindow on a map this small.
function makeDotOverlayClass() {
    return class DotOverlay extends google.maps.OverlayView {
        constructor(position, color, size, label) {
            super();
            this.position = position;
            this.color = color;
            this.size = size;
            this.label = label;
            this.div = null;
        }
        onAdd() {
            this.div = document.createElement('div');
            this.div.style.position = 'absolute';
            this.div.style.width = `${this.size}px`;
            this.div.style.height = `${this.size}px`;
            this.div.style.borderRadius = '50%';
            this.div.style.background = this.color;
            this.div.style.border = '2px solid #fff';
            this.div.style.boxShadow = '0 1px 4px rgba(0,0,0,.4)';
            if (this.label) this.div.title = this.label;
            this.getPanes().overlayMouseTarget.appendChild(this.div);
        }
        draw() {
            const proj = this.getProjection();
            if (!proj || !this.div) return;
            const point = proj.fromLatLngToDivPixel(this.position);
            if (!point) return;
            const half = this.size / 2 + 2;
            this.div.style.left = `${point.x - half}px`;
            this.div.style.top = `${point.y - half}px`;
        }
        onRemove() { if (this.div) { this.div.remove(); this.div = null; } }
        setPosition(position) { this.position = position; this.draw(); }
    };
}

// `progress` (0-100, optional) adds a third marker interpolated along the route - the vehicle's live
// position - so a trip actually under way shows where the vehicle is right now, not just the two
// static endpoints. `heightClass`/`showZoomControl` let the same component serve both the small
// toggle-open map in a trip list row and the full-width hero map on Home (bigger, with zoom controls
// since it's the primary thing on screen there rather than an inline extra).
function RouteMap({ route, progress, heightClass = 'h-48', showZoomControl = false }) {
    const mapEl = useRef(null);
    const mapRef = useRef(null);
    const liveMarkerRef = useRef(null);
    // The Google Maps script tag loads before this app's own scripts run (see the <head> tag order),
    // so this is almost always already true on first render - polling here is just cheap insurance
    // against a slow network rather than something expected to matter in practice.
    const [mapsReady, setMapsReady] = useState(!!(window.google && window.google.maps));

    useEffect(() => {
        if (mapsReady) return;
        const id = setInterval(() => {
            if (window.google && window.google.maps) { setMapsReady(true); clearInterval(id); }
        }, 200);
        return () => clearInterval(id);
    }, [mapsReady]);

    useEffect(() => {
        if (!mapEl.current || !mapsReady) return;
        const [originName, destName] = route.split(' -> ');
        const origin = LOCATION_COORDS[originName];
        const dest = LOCATION_COORDS[destName];
        if (!origin || !dest) return;

        const DotOverlay = makeDotOverlayClass();
        const toLatLng = ([lat, lng]) => new google.maps.LatLng(lat, lng);

        // scrollWheelZoom:false on the old Leaflet map only blocked wheel-zoom while leaving drag-pan
        // alone; Google has no such granular flag, so the small inline previews (no zoom control) go
        // fully static instead - avoids hijacking the page's scroll the moment the cursor crosses one -
        // while the interactive Home hero map (zoom control shown) stays fully draggable/zoomable.
        const map = new google.maps.Map(mapEl.current, {
            center: toLatLng(origin), zoom: 12,
            disableDefaultUI: true, zoomControl: showZoomControl,
            gestureHandling: showZoomControl ? 'greedy' : 'none',
        });
        mapRef.current = map;

        new DotOverlay(toLatLng(origin), '#10B981', 12, originName).setMap(map);
        new DotOverlay(toLatLng(dest), '#EF4444', 12, destName).setMap(map);

        // Google has no direct dashArray equivalent - a repeating line-symbol icon over an otherwise
        // fully-transparent stroke is the documented way to fake one.
        new google.maps.Polyline({
            path: [toLatLng(origin), toLatLng(dest)],
            map, strokeColor: '#3B82F6', strokeOpacity: 0,
            icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 }, offset: '0', repeat: '10px' }],
        });

        if (progress != null) {
            const pos = posAlongRoute(origin, dest, progress);
            const liveDot = new DotOverlay(toLatLng(pos), '#3B82F6', 16, 'Vehicle - live position');
            liveDot.setMap(map);
            liveMarkerRef.current = liveDot;
        }

        const bounds = new google.maps.LatLngBounds();
        bounds.extend(toLatLng(origin));
        bounds.extend(toLatLng(dest));
        map.fitBounds(bounds, 28);

        return () => { mapRef.current = null; liveMarkerRef.current = null; };
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [route, showZoomControl, mapsReady]);

    // Progress ticks every couple seconds while a trip is under way (see App's simulated-GPS effect) -
    // sliding the existing marker rather than tearing down/rebuilding the whole map keeps the pan/zoom
    // state the driver may have set untouched.
    useEffect(() => {
        if (progress == null || !liveMarkerRef.current) return;
        const [originName, destName] = route.split(' -> ');
        const pos = posAlongRoute(LOCATION_COORDS[originName], LOCATION_COORDS[destName], progress);
        if (pos) liveMarkerRef.current.setPosition(new google.maps.LatLng(pos[0], pos[1]));
    }, [progress, route]);

    return <div ref={mapEl} className={`${heightClass} w-full border-t border-slate-100`} />;
}

// Multi-stop variant of RouteMap for a recurring shuttle's full ordered stop chain (not just two
// points) - every stop gets its own dot (green = first pickup, red = final destination, amber = any
// stop in between), one dashed polyline runs through all of them in order, and the live position
// marker (when `legIndex`/`legProgress` are given) interpolates along ONLY the leg currently under
// way, same straight-line-between-two-points approach RouteMap already uses for its one leg.
function ShuttleRouteMap({ stops, legIndex, legProgress, heightClass = 'h-60', showZoomControl = false }) {
    const mapEl = useRef(null);
    const mapRef = useRef(null);
    const liveMarkerRef = useRef(null);
    const [mapsReady, setMapsReady] = useState(!!(window.google && window.google.maps));
    const stopsKey = stops.join('|');

    useEffect(() => {
        if (mapsReady) return;
        const id = setInterval(() => {
            if (window.google && window.google.maps) { setMapsReady(true); clearInterval(id); }
        }, 200);
        return () => clearInterval(id);
    }, [mapsReady]);

    useEffect(() => {
        if (!mapEl.current || !mapsReady) return;
        const coords = stops.map(name => LOCATION_COORDS[name]).filter(Boolean);
        if (coords.length < 2) return;

        const DotOverlay = makeDotOverlayClass();
        const toLatLng = ([lat, lng]) => new google.maps.LatLng(lat, lng);

        const map = new google.maps.Map(mapEl.current, {
            center: toLatLng(coords[0]), zoom: 12,
            disableDefaultUI: true, zoomControl: showZoomControl,
            gestureHandling: showZoomControl ? 'greedy' : 'none',
        });
        mapRef.current = map;

        stops.forEach((name, i) => {
            const c = LOCATION_COORDS[name];
            if (!c) return;
            const color = i === 0 ? '#10B981' : i === stops.length - 1 ? '#EF4444' : '#F59E0B';
            new DotOverlay(toLatLng(c), color, 12, name).setMap(map);
        });

        // Same repeating-line-symbol dash trick RouteMap uses, just fed every stop's coordinate in
        // order instead of only two.
        new google.maps.Polyline({
            path: coords.map(toLatLng),
            map, strokeColor: '#3B82F6', strokeOpacity: 0,
            icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 }, offset: '0', repeat: '10px' }],
        });

        if (legIndex != null && legProgress != null) {
            const o = LOCATION_COORDS[stops[legIndex]], d = LOCATION_COORDS[stops[legIndex + 1]];
            if (o && d) {
                const liveDot = new DotOverlay(toLatLng(posAlongRoute(o, d, legProgress)), '#3B82F6', 16, 'Vehicle - live position');
                liveDot.setMap(map);
                liveMarkerRef.current = liveDot;
            }
        }

        const bounds = new google.maps.LatLngBounds();
        coords.forEach(c => bounds.extend(toLatLng(c)));
        map.fitBounds(bounds, 28);

        return () => { mapRef.current = null; liveMarkerRef.current = null; };
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [stopsKey, showZoomControl, mapsReady]);

    useEffect(() => {
        if (legIndex == null || legProgress == null || !liveMarkerRef.current) return;
        const o = LOCATION_COORDS[stops[legIndex]], d = LOCATION_COORDS[stops[legIndex + 1]];
        const pos = o && d ? posAlongRoute(o, d, legProgress) : null;
        if (pos) liveMarkerRef.current.setPosition(new google.maps.LatLng(pos[0], pos[1]));
    }, [legProgress, legIndex, stopsKey]);

    return <div ref={mapEl} className={`${heightClass} w-full border-t border-slate-100`} />;
}

// The full ordered stop timeline for a shuttle trip - each stop's own done/current/upcoming state
// (window.shuttleStopStatus) and, for anything after the very first, a live ETA
// (window.shuttleStopEta). Shared by every screen that shows a shuttle trip (ShuttleTripScreen,
// ShuttleTripCard's parent list) so none of them can ever show a different ETA for the same stop.
function ShuttleStopList({ trip }) {
    return (
        <div className="flex gap-3">
            <div className="flex flex-col items-center pt-1.5">
                {trip.stops.map((_, i) => {
                    const status = shuttleStopStatus(trip, i);
                    const dotColor = status === 'done' ? 'bg-emerald-500 ring-emerald-100' : status === 'current' ? 'bg-brandAccent ring-blue-100' : 'bg-slate-300 ring-slate-100';
                    return (
                        <React.Fragment key={i}>
                            <span className={`w-3 h-3 rounded-full ring-4 shrink-0 ${dotColor} ${status === 'current' ? 'sos-pulse' : ''}`} />
                            {i < trip.stops.length - 1 && <span className="w-0.5 flex-1 bg-slate-200 my-1" />}
                        </React.Fragment>
                    );
                })}
            </div>
            <div className="flex-1 min-w-0 space-y-3">
                {trip.stops.map((name, i) => {
                    const status = shuttleStopStatus(trip, i);
                    const eta = i > 0 ? shuttleStopEta(trip, i) : null;
                    return (
                        <div key={i} className="flex items-start justify-between gap-2">
                            <div className="min-w-0">
                                <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">
                                    {i === 0 ? 'Start' : i === trip.stops.length - 1 ? 'Final Stop' : `Stop ${i}`}
                                </p>
                                <p className={`text-sm font-semibold truncate ${status === 'upcoming' ? 'text-slate-500' : 'text-slate-800'}`}>{name}</p>
                            </div>
                            <p className={`text-xs font-medium shrink-0 ${status === 'current' ? 'text-brandAccent font-bold' : 'text-slate-400'}`}>
                                {i === 0 ? trip.time : (eta || '—')}
                            </p>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}
