// Same fixed named-location network the admin panel's own window.LOCATION_REGISTRY uses (same
// names/coordinates) - on-call pickup/drop-off is picked from this list, not free-text addresses,
// consistent with how distance/duration is computed everywhere else in this system, and it's also
// what RouteMap below resolves a route string's two ends against.
const LOCATION_REGISTRY = [
    { name: 'IGI Airport - Terminal 3', lat: 28.5562, lng: 77.1000 },
    { name: 'New Delhi Railway Station', lat: 28.6430, lng: 77.2194 },
    { name: 'Hotel Taj Palace', lat: 28.6001, lng: 77.1770 },
    { name: 'Hotel Grand Plaza', lat: 28.5355, lng: 77.1560 },
    { name: 'Hotel Lakeside Residency', lat: 28.5820, lng: 77.1210 },
    { name: 'Athletes Village - Block A', lat: 28.6127, lng: 77.2773 },
    { name: 'Athletes Village - Block C', lat: 28.6140, lng: 77.2790 },
    { name: 'Jawaharlal Nehru Stadium', lat: 28.5829, lng: 77.2340 },
    { name: 'Indira Gandhi Arena', lat: 28.6108, lng: 77.2373 },
    { name: 'Practice Arena 1', lat: 28.5860, lng: 77.2300 },
    { name: 'Dr. Karni Singh Shooting Range', lat: 28.5510, lng: 77.2990 },
    { name: 'Thyagaraj Sports Complex', lat: 28.5730, lng: 77.2270 },
    { name: 'Media Broadcasting Center', lat: 28.6139, lng: 77.2410 },
    { name: 'Protocol Office - Pragati Maidan', lat: 28.6139, lng: 77.2431 },
    { name: 'Major Dhyan Chand National Stadium', lat: 28.6117, lng: 77.2368 },
    { name: 'Yamuna Sports Complex', lat: 28.6680, lng: 77.2820 },
];
const LOCATION_COORDS = Object.fromEntries(LOCATION_REGISTRY.map(l => [l.name, [l.lat, l.lng]]));
const locationCoords = (name) => LOCATION_COORDS[name] || null;

// Same haversine + road-distance-factor approach every other distance estimate in this system
// already uses (ACT Travel Prototype.html's window.haversineKm/ROAD_DISTANCE_FACTOR).
const ROAD_DISTANCE_FACTOR = 1.35;
const AVG_ROAD_SPEED_KMH = 25;
const haversineKm = ([lat1, lng1], [lat2, lng2]) => {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
};
const roadKm = (a, b) => haversineKm(a, b) * ROAD_DISTANCE_FACTOR;
const roadDurationMin = (km) => Math.round(km / AVG_ROAD_SPEED_KMH * 60);
const tripEstimate = (route) => {
    const [origin, dest] = route.split(' -> ');
    const a = locationCoords(origin), b = locationCoords(dest);
    if (!a || !b) return null;
    const km = roadKm(a, b);
    return { distanceKm: Math.round(km * 10) / 10, durationMin: roadDurationMin(km) };
};

// Adds minutes to an "HH:MM" pickup time to get an estimated drop-off time - same approach as the
// admin panel's own window.addMinutesToTime (ACT Travel Prototype.html), a small independent copy
// rather than a cross-file import, same convention every other shared helper in this app follows.
const addMinutesToTime = (hhmm, minutes) => {
    if (!hhmm) return null;
    const [h, m] = hhmm.split(':').map(Number);
    const wrapped = ((h * 60 + m + minutes) % 1440 + 1440) % 1440;
    return `${String(Math.floor(wrapped / 60)).padStart(2, '0')}:${String(wrapped % 60).padStart(2, '0')}`;
};

// A real clock time ("HH:MM") from a timestamp - used to turn an on-call request's requestedAt +
// pickupEtaMin into an actual pickup time, the same shape a scheduled Route trip's own trip.time
// already is, so both render through the same pickup/est.-arrival card.
const formatClock = (ms) => {
    const d = new Date(ms);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};

// A trip's live progress, same derived-from-a-timestamp approach both other apps already use
// (ACT Travel Prototype.html's window.derivedProgress / ACT Driver Prototype.html's own copy) -
// computed fresh on every render from startedAt/estimatedDurationMin, never a ticked, stored counter.
// Caps at 99 - there's no "mark complete" action for a passenger the way there is for a driver, so a
// trip here just reads "Arriving..." once it's effectively there rather than snapping to 100.
const derivedProgress = (trip) => {
    if (!trip.startedAt || !trip.estimatedDurationMin) return 0;
    const elapsedMin = (Date.now() - trip.startedAt) / 60000;
    return Math.max(0, Math.min(99, Math.round((elapsedMin / trip.estimatedDurationMin) * 100)));
};
const posAlongRoute = (from, to, progress) => {
    const t = Math.max(0, Math.min(1, (progress || 0) / 100));
    return [from[0] + (to[0] - from[0]) * t, from[1] + (to[1] - from[1]) * t];
};
const liveEta = (trip) => {
    if (!trip.startedAt || !trip.estimatedDurationMin) return null;
    const remainingMin = Math.max(1, Math.round(trip.estimatedDurationMin * (1 - derivedProgress(trip) / 100)));
    return `${remainingMin} min`;
};

const normalizePhone = (phone) => (phone || '').replace(/\D/g, '').slice(-10);

// Bridges a resolved on-call match to the admin panel, read-only - same localStorage mechanism (and
// same same-origin caveat) as every other cross-app bridge in this system (e.g. the Driver App's own
// location-reporting bridge, ACT Travel Prototype.html's DRIVER_LOCATIONS_STORAGE_KEY). No approval
// step on the admin side - it's already matched by the time it shows up there, same as it already
// happened here.
const ON_CALL_STORAGE_KEY = 'kheloTechOnCallRequests';
// Upserts by id - a request is no longer write-once the way a plain "already matched" record used to
// be (see this file's own On-Call orchestration below): its bridge record is overwritten every time
// its lifecycle actually moves (a new nudge sent, one declined/timed out, escalated, assigned,
// cancelled), not just at creation. The admin's own window.OnCallTab (ACT Travel Prototype.html)
// mirrors whatever the latest snapshot says via its own mergeOnCallRequests.
const upsertOnCallRequest = (record) => {
    let all = [];
    try { all = JSON.parse(localStorage.getItem(ON_CALL_STORAGE_KEY) || '[]'); } catch (e) { all = []; }
    const next = [...all.filter(r => r.id !== record.id), record].slice(-50);
    try { localStorage.setItem(ON_CALL_STORAGE_KEY, JSON.stringify(next)); } catch (e) { /* storage unavailable - the local copy in this session still has it */ }
};

// The one genuinely bidirectional bridge in this whole system - must match the exact key both the
// Driver App and the admin's own manual-assign path (window.OnCallTab's sendOnCallNudge) use. This
// app creates one entry per driver actually nudged and reads its `status` back; only the Driver App
// (or, for an admin-initiated one, the admin panel's own settleAdminNudges) ever flips that status.
const ONCALL_NUDGE_STORAGE_KEY = 'kheloTechOnCallNudges';
const sendNudgeToDriver = (request, candidate, nudgeWindowSec) => {
    const nudge = {
        id: uid('NDG'), requestId: request.id, driverId: candidate.driver.id, driverName: candidate.driver.name,
        vehicleId: candidate.vehicle.id, vehicleType: `${candidate.vehicle.type} (${candidate.vehicle.capacity})`,
        vendorName: candidate.vehicle.vendorName, origin: request.origin, destination: request.destination,
        route: request.route, passengers: request.passengers,
        // Who the driver would be picking up. The Driver App shows only the name while this is still an
        // offer; the phone number is revealed on the trip once the driver has accepted it, so a driver
        // who declines never ends up holding a passenger's number.
        stakeholderName: request.stakeholderName, stakeholderPhone: request.stakeholderPhone || null,
        // The same driver-buffer ETA this app will promise the stakeholder (includes any time left on a
        // trip the driver is finishing), so both apps count down to the same pickup time.
        pickupEtaMin: candidatePickupEta(candidate, request.origin).etaMin,
        sentAt: Date.now(), expiresAt: Date.now() + nudgeWindowSec * 1000, status: 'Pending', initiatedBy: 'stakeholder',
        // "Why this driver" - shown as-is on the Driver App's own nudge modal (see OnCallNudgeModal
        // there), not re-derived: their vehicle type is one of the requesting stakeholder type's
        // eligible types (window.STAKEHOLDER_VEHICLE_MAP), and their base is within the admin's own
        // proximity radius (data.settings.oncallMaxProximityKm) - both already true by construction,
        // since buildOnCallCandidateQueue filtered on exactly these two things before this candidate
        // was ever reached.
        matchStakeholderType: request.stakeholderType,
        matchDistanceKm: candidate.distanceKm != null ? Math.round(candidate.distanceKm * 10) / 10 : null,
    };
    let all = [];
    try { all = JSON.parse(localStorage.getItem(ONCALL_NUDGE_STORAGE_KEY) || '[]'); } catch (e) { all = []; }
    try { localStorage.setItem(ONCALL_NUDGE_STORAGE_KEY, JSON.stringify([nudge, ...all].slice(0, 100))); } catch (e) { /* storage unavailable - no driver will see this nudge */ }
    return nudge;
};
const readNudgeStatus = (nudgeId) => {
    let all = [];
    try { all = JSON.parse(localStorage.getItem(ONCALL_NUDGE_STORAGE_KEY) || '[]'); } catch (e) { all = []; }
    return all.find(n => n.id === nudgeId) || null;
};

// The Driver App's own live busy/free broadcast (driver -> this app) - see driverAvailability below.
const DRIVER_AVAILABILITY_STORAGE_KEY = 'kheloTechDriverAvailability';

// Must match the exact key the admin panel writes to (window.ROUTE_PLAN_PUBLISH_STORAGE_KEY /
// RoutePlansTab's publishPlan, in ACT Travel Prototype.html) - the one bridge in this whole system
// that runs admin -> the two other apps instead of the other way. A Route Plan only shows up here

// myRouteTrips already follows for the statically-seeded trips, just fed a live record instead of one
// baked into STAKEHOLDER_APP_DATA. See App's mergePublishedPlans for how it's read/merged.
const ROUTE_PLAN_PUBLISH_STORAGE_KEY = 'kheloTechPublishedRoutePlans';

// syncPublishedShuttlesToBridge, ACT Travel Prototype.html). That panel rewrites the whole published
// set on every change, so for any shuttle id it contains, the bridge copy is the current truth -
// including a pause, or a vehicle taken off the loop. Before the admin panel has ever written it
// (null), this app falls back to its own seed rather than showing no shuttles at all.
// Number plates by fleet record id, mirroring each vehicle's regNo in the admin panel's inventory
// (ACT Travel Prototype.html). A stakeholder never sees the internal VH-#### id - that exists only for
// fleet records on the admin side - they see the plate they can actually read off the vehicle at the
// kerb. A published Route Plan carries its own regNo on the bridge record, which wins over this table,
// so a vehicle added in the admin panel after this snapshot still shows its real plate.
const VEHICLE_REG_NUMBERS = {
    'VH-4401': 'DL-01-AB-4401',
    'VH-4402': 'DL-01-AB-4402',
    'VH-4403': 'DL-01-AB-4403',
    'VH-2210': 'DL-01-CD-2210',
    'VH-2211': 'DL-01-CD-2211',
    'VH-2212': 'UP-03-EF-2212',
    'VH-3301': 'DL-01-EF-3301',
    'VH-1301': 'DL-01-GH-1301',

// The one shared "find an Available, capacity-fitting vehicle closest to the pickup point, with
// whichever driver is already paired to it" match - a locally-ported version of the same shape
// ACT Travel Prototype.html's window.resolveLegs/window.idleDriverForVehicle already use for the
// admin panel's own Auto-Assign, working off this app's own trimmed fleet snapshot's status fields
// directly rather than re-deriving compliance from an inspection history it doesn't carry a copy of.
// Not gated by stakeholder type in this pass - open to any logged-in stakeholder.
// Default/fallback only - the live, admin-editable copy is read off the bridge
// (window.STAKEHOLDER_VEHICLE_MAP_STORAGE_KEY, App's own settings-sync effect) and passed into
// buildOnCallCandidateQueue below; this is what a request falls back to before that first sync lands,
// or if the bridge is ever unavailable (same-origin caveat every bridge in this system shares).
const DEFAULT_STAKEHOLDER_VEHICLE_MAP = {
    'Athletes': ['Bus', 'Minibus'],
    'Technical Officials': ['SUV'],
    'Chef de Mission (CDM)': ['Sedan'],
    'Competition Manager (CM)': ['Sedan'],
    'Games Technical Conduct Committee (GTCC)': ['Sedan'],
    'Volunteers': ['Minibus'],
    'Host State Government / Sports Authority': ['Sedan'],
};

// A driver's current availability, from the Driver App's own live broadcast
// (window.DRIVER_AVAILABILITY_STORAGE_KEY) - null/stale/missing all read as "free". Stale (no report
// in the last 2 minutes) is treated as free rather than busy, same as this system's other "no live
// signal yet" fallbacks - a driver who hasn't opened the Driver App in a while shouldn't be permanently
// un-nudgeable because of it. dropLocation (the driver's current trip's own drop-off point, rides
// along on the same broadcast) is what candidatePickupEta below needs to compute a real pickup ETA for
// a busy driver - not just whether/when they'll be free.
const AVAILABILITY_STALE_AFTER_MS = 2 * 60 * 1000;
const driverAvailability = (driverId) => {
    let all = {};
    try { all = JSON.parse(localStorage.getItem(DRIVER_AVAILABILITY_STORAGE_KEY) || '{}'); } catch (e) { all = {}; }
    const entry = all[driverId];
    if (!entry || Date.now() - entry.updatedAt > AVAILABILITY_STALE_AFTER_MS) return { busyUntil: null, dropLocation: null };
    return { busyUntil: entry.busyUntil || null, dropLocation: entry.dropLocation || null };
};
// The driver buffer logic (mirrors ACT Travel Prototype.html's own window.driverPickupEta, ported here
// since this app has no shared runtime with that one) - a real answer to "when could this driver
// actually be at the pickup point," not a flat threshold or a guess from their static vehicle base.
// Free: the base-to-pickup estimate already on `candidate` (roadKm/roadDurationMin from the vehicle's
// own base). Busy: how long until their current trip ends (driverAvailability's own busyUntil), THEN
// drive time from wherever that trip actually drops them off (its own dropLocation, from the Driver
// App's live broadcast) to the new pickup - never the base-distance figure while they're genuinely out
// on another job. Falls back to base-distance-after-busy when the drop-off location isn't known yet
// (broadcast hasn't caught up), so ranking never silently breaks.
const candidatePickupEta = (candidate, originName) => {
    const availability = driverAvailability(candidate.driver.id);
    if (!availability.busyUntil) return { etaMin: candidate.pickupEtaMin, busy: false, etaKnown: true, remainingMin: 0, dropLocation: null };
    const remainingMin = Math.max(0, (availability.busyUntil - Date.now()) / 60000);
    const dropCoords = availability.dropLocation ? locationCoords(availability.dropLocation) : null;
    const originCoords = locationCoords(originName);
    if (dropCoords && originCoords) {
        const legDurationMin = roadDurationMin(roadKm(dropCoords, originCoords));
        return { etaMin: Math.round(remainingMin + legDurationMin), busy: true, etaKnown: true, remainingMin: Math.round(remainingMin), dropLocation: availability.dropLocation };
    }
    return { etaMin: Math.round(remainingMin + candidate.pickupEtaMin), busy: true, etaKnown: false, remainingMin: Math.round(remainingMin), dropLocation: availability.dropLocation };
};
// A candidate is nudge-eligible if they're free, or their active trip ends within the admin's own
// near-end-of-trip threshold (window.oncallNearEndThresholdMin) - never someone mid-trip with
// genuinely more time left than that. This is the simple yes/no eligibility gate; candidatePickupEta
// above is the separate, richer number used for ranking who to try first.
const isCandidateNudgeable = (candidate, nearEndThresholdMin) => {
    const { busyUntil } = driverAvailability(candidate.driver.id);
    if (!busyUntil) return true;
    const minutesLeft = (busyUntil - Date.now()) / 60000;
    return minutesLeft <= nearEndThresholdMin;
};

// Builds the ordered candidate queue for an on-call request - vehicle-type eligibility first (a CDM
// never even sees a Bus driver - the admin-configurable mapping this reads is the actual point of
// that rule), then ranked by the driver buffer logic (candidatePickupEta) - a driver currently
// finishing another trip is ranked by when they'd REALLY reach this pickup (their own trip's drop-off
// point, then the drive from there), not their static vehicle base, so a busy-but-almost-done driver
// two minutes from the pickup can rank ahead of an idle one who's actually much further away.
// Availability itself is deliberately NOT used to FILTER this list - only to rank it - since a driver
// who goes busy mid-search shouldn't have been baked out of the list before that was even true; see
// isCandidateNudgeable, checked separately, per candidate, as the orchestration steps through the
// queue in this same order.
// maxProximityKm - the driver buffer logic's own distance cap (admin-configurable,
// data.settings.oncallMaxProximityKm) - a vehicle whose base is further than this from the pickup is
// excluded from the queue entirely, never just ranked low, same "don't even offer a choice that isn't
// realistic" rule Route Plans' own Auto-Assign Distance Limit already applies on the admin side.
// Checked against `distanceKm` (base-to-pickup) rather than a busy candidate's real last-leg distance,
// since the queue is built once up front, before any candidate's live busy/free status is known - see
// this function's own header comment on why availability itself is deliberately not read here either.
const buildOnCallCandidateQueue = (originName, headcount, stakeholderType, vehicleMap, maxProximityKm) => {
    const origin = locationCoords(originName);
    if (!origin) return [];
    const eligibleTypes = (vehicleMap || DEFAULT_STAKEHOLDER_VEHICLE_MAP)[stakeholderType] || [];
    return STAKEHOLDER_APP_DATA.fleet
        .filter(v => eligibleTypes.includes(v.type) && v.capacity >= headcount)
        .map(v => {
            const driver = STAKEHOLDER_APP_DATA.drivers.find(d => d.vehicleId === v.id) || null;
            const distanceKm = roadKm(origin, [v.baseLat, v.baseLng]);
            return { vehicle: v, driver, distanceKm, pickupEtaMin: roadDurationMin(distanceKm) };
        })
        .filter(c => !!c.driver) // a vehicle with nobody paired to it can't be nudged
        .filter(c => !(maxProximityKm != null && c.distanceKm > maxProximityKm))
        .sort((a, b) => candidatePickupEta(a, originName).etaMin - candidatePickupEta(b, originName).etaMin);
};

/* ------------------------------------------------------------------ */
/* On-Call orchestration - pure functions, kept outside App() so the   */
/* interval effect that drives them (App's own tickAllOnCallRequests)  */
/* can sit safely before the early "not logged in" return the Rules   */
/* of Hooks require every hook to come before, without these needing   */
/* to be hooks themselves.                                             */
/* ------------------------------------------------------------------ */

// Converts a local on-call request object into the shape the admin bridge expects (see
// ACT Travel Prototype.html's window.mergeOnCallRequests, which destructures exactly these fields).
const toOnCallBridgeRecord = (request) => ({
    id: request.id, stakeholderName: request.stakeholderName, stakeholderType: request.stakeholderType,
    // Both contact numbers ride along on the request record, so whichever side resolves the ride -
    // this app's own matching, or an admin's manual assignment - can hand each party the other's
    // number. See finalizeOnCallAssignment and the admin panel's sendOnCallNudge/settleAdminNudges.
    stakeholderPhone: request.stakeholderPhone || null, assignedDriverPhone: request.driverPhone || null,
    origin: request.origin, destination: request.destination, route: request.route, passengers: request.passengers,
    requestedVehicleTypes: request.requestedVehicleTypes, status: request.status, requestedAt: request.requestedAt,
    currentNudge: request.currentNudgeId ? { driverId: request.currentNudgeDriverId, driverName: request.currentNudgeDriverName } : null,
    nudgeLog: request.nudgeLog,
    assignedAt: request.assignedAt || null, assignedDriverId: request.assignedDriverId || null, assignedDriverName: request.driverName || null,
    assignedVehicleId: request.vehicleId || null, assignedVehicleType: request.vehicleType || null, assignedVendorName: request.vendorName || null,
    routeFrom: locationCoords(request.origin), routeTo: locationCoords(request.destination), pickupEtaMin: request.pickupEtaMin || null,
    escalatedAt: request.escalatedAt || null, cancelledAt: request.cancelledAt || null,
});

// The first candidate from `fromIndex` onward who's actually nudge-eligible right now - skips (never
// permanently drops) anyone currently too busy, so they can still be reached on a later tick if
// nobody else is available meanwhile.
const pickNextEligibleIndex = (queue, fromIndex, nearEndThresholdMin) => {
    for (let i = fromIndex; i < queue.length; i++) {
        if (isCandidateNudgeable(queue[i], nearEndThresholdMin)) return i;
    }
    return -1;
};

const finalizeOnCallAssignment = (request, liveNudge) => {
    const candidate = request.candidateQueue.find(c => c.driver.id === liveNudge.driverId);
    // Re-run the driver buffer logic fresh at acceptance time, not the queue-build-time snapshot -
    // this driver may have been mid-trip when the queue was first built and free (or further along)
    // by the time they actually accept, so the pickup ETA shown for the resulting live trip should
    // reflect reality at the moment of acceptance, not a stale guess from search-start.
    const eta = candidate ? candidatePickupEta(candidate, request.origin) : null;
    const updated = {
        ...request, status: 'Assigned', assignedAt: Date.now(), assignedDriverId: liveNudge.driverId,
        vehicleId: liveNudge.vehicleId, vehicleType: liveNudge.vehicleType, driverName: liveNudge.driverName, vendorName: liveNudge.vendorName,
        // Only now, once a driver has actually accepted, does the stakeholder get a number to call -
        // never while candidates are merely being nudged.
        driverPhone: liveNudge.driverPhone || candidate?.driver.phone || null,
        pickupEtaMin: (eta && eta.etaKnown) ? eta.etaMin : (candidate?.pickupEtaMin ?? 10), startedAt: null, estimatedDurationMin: null, currentNudgeId: null,
    };
    upsertOnCallRequest(toOnCallBridgeRecord(updated));
    return updated;
};

// Demo shortcut for the real accept path above - lets a Searching/Escalated request resolve to
// Assigned without needing a second browser tab open on the Driver App to actually accept a nudge (the
// normal way this happens - see finalizeOnCallAssignment's own caller, tickOnCallOrchestration). Picks
// whoever's currently being nudged if a nudge is in flight, else falls back to the queue's own top
// (proximity-ranked) candidate, so the "matched" driver/vehicle shown afterward is always a real,
// eligible one from this request's own candidate queue - never fabricated.
const simulateMatchOnCallRequest = (request) => {
    const candidate = request.candidateQueue.find(c => c.driver.id === request.currentNudgeDriverId) || request.candidateQueue[0];
    if (!candidate) return request;
    const liveNudge = {
        driverId: candidate.driver.id, driverName: candidate.driver.name, driverPhone: candidate.driver.phone,
        vehicleId: candidate.vehicle.id, vehicleType: `${candidate.vehicle.type} (${candidate.vehicle.capacity})`,
        vendorName: candidate.vehicle.vendorName,
    };
    return finalizeOnCallAssignment(request, liveNudge);
};

const escalateOnCallRequest = (request) => {
    const updated = { ...request, status: 'Escalated', escalatedAt: Date.now(), currentNudgeId: null };
    upsertOnCallRequest(toOnCallBridgeRecord(updated));
    return updated;
};

const sendOnCallNudgeAt = (request, index, nudgeWindowSec, nudgeLog) => {
    const candidate = request.candidateQueue[index];
    const nudge = sendNudgeToDriver(request, candidate, nudgeWindowSec);
    const updated = {
        ...request, candidateIndex: index, currentNudgeId: nudge.id,
        currentNudgeDriverId: candidate.driver.id, currentNudgeDriverName: candidate.driver.name, nudgeLog,
    };
    upsertOnCallRequest(toOnCallBridgeRecord(updated));
    return updated;
};

// One orchestration step for a single Searching-or-Escalated request - checked every ~1.5s while any
// such request is open (App's own tickAllOnCallRequests interval). In order:
// 0) an admin's own manual assignment (ACT Travel Prototype.html's window.OnCallTab/settleAdminNudges)
//    can finalize this request from the OUTSIDE, entirely independent of whatever this orchestration
//    is doing on its own - always check the bridge's own current record first so an admin-side
//    resolution is adopted here too, rather than this side's own search running on forever oblivious
//    to it. This is the other half of the "lock the request" edge case: whichever side (this one, or
//    an admin's manual assign) resolves it first wins, and the other one notices and stops - admin's
//    own settleAdminNudges already guards the reverse direction (never overwrites a request this side
//    already finished). Checked for BOTH Searching and Escalated requests - an Escalated request is
//    exactly the case where the ONLY way forward is an admin's manual assign (see startOnCallSearch's
//    own noPossibleMatch comment and escalateOnCallRequest's own timedOut caller above), so this is the
//    one and only thing still worth polling for once escalated; skipping it for Escalated requests was
//    a real bug (fix) - "Assign vehicle from admin, but the stakeholder's own screen never left the
//    Escalated card" - the request just stopped being ticked at all the moment it escalated.
// 1) a late Accept (from THIS side's own nudge) always wins, checked next, even right at the timeout
//    boundary (edge case: accept-vs-timeout race - escalation never fires once a driver has actually
//    accepted). Only reachable while still Searching - an Escalated request has no nudge of its own in
//    flight (candidateQueue was empty by construction, see startOnCallSearch), so steps 1-4 below all
//    return early for it right after the bridge check.
// 2) the hard search timeout escalates regardless of what's still mid-flight.
// 3) a resolved (declined/timed-out/expired-with-no-response) nudge advances to the next AVAILABLE
//    candidate - a nudged driver going offline mid-window is indistinguishable from one who simply
//    never responded, so it's handled by this exact same path, no special-casing needed.
// 4) no nudge in flight yet - send one to the first available candidate.
const tickOnCallOrchestration = (request, settings) => {
    if (request.status !== 'Searching' && request.status !== 'Escalated') return request;

    let bridgeRequests = [];
    try { bridgeRequests = JSON.parse(localStorage.getItem(ON_CALL_STORAGE_KEY) || '[]'); } catch (e) { bridgeRequests = []; }
    const bridgeRecord = bridgeRequests.find(r => r.id === request.id);
    if (bridgeRecord?.status === 'Assigned') {
        return {
            ...request, status: 'Assigned', assignedAt: bridgeRecord.assignedAt || Date.now(),
            assignedDriverId: bridgeRecord.assignedDriverId, driverName: bridgeRecord.assignedDriverName,
            driverPhone: bridgeRecord.assignedDriverPhone || null,
            vehicleId: bridgeRecord.assignedVehicleId, vehicleType: bridgeRecord.assignedVehicleType, vendorName: bridgeRecord.assignedVendorName,
            pickupEtaMin: bridgeRecord.pickupEtaMin ?? 10, startedAt: null, estimatedDurationMin: null, currentNudgeId: null,
        };
    }

    // Nothing left for this function to do for an Escalated request beyond the bridge check above -
    // there's no candidate queue left to nudge (see startOnCallSearch), so it just stays Escalated
    // until an admin resolves it (caught on a later tick) or the stakeholder cancels.
    if (request.status === 'Escalated') return request;

    if (request.currentNudgeId) {
        const live = readNudgeStatus(request.currentNudgeId);
        if (live?.status === 'Accepted') return finalizeOnCallAssignment(request, live);
    }

    const timedOut = (Date.now() - request.requestedAt) >= (settings.oncallSearchTimeoutMin ?? 3) * 60000 + (settings.oncallSearchTimeoutSec ?? 0) * 1000;

    if (request.currentNudgeId) {
        const live = readNudgeStatus(request.currentNudgeId);
        const stillOpen = live?.status === 'Pending' && live.expiresAt > Date.now();
        if (stillOpen && !timedOut) return request;
        if (timedOut) return escalateOnCallRequest(request);
        const outcome = live?.status === 'Declined' ? 'Declined' : 'TimedOut';
        const nudgeLog = [...request.nudgeLog, {
            driverId: request.currentNudgeDriverId, driverName: request.currentNudgeDriverName,
            sentAt: live?.sentAt || null, respondedAt: Date.now(), outcome,
        }];
        const nextIndex = pickNextEligibleIndex(request.candidateQueue, request.candidateIndex + 1, settings.oncallNearEndThresholdMin ?? 5);
        if (nextIndex === -1) {
            const updated = { ...request, currentNudgeId: null, currentNudgeDriverId: null, currentNudgeDriverName: null, nudgeLog };
            upsertOnCallRequest(toOnCallBridgeRecord(updated));
            return updated;
        }
        return sendOnCallNudgeAt(request, nextIndex, settings.oncallNudgeWindowSec ?? 40, nudgeLog);
    }

    if (timedOut) return escalateOnCallRequest(request);
    const idx = pickNextEligibleIndex(request.candidateQueue, request.candidateIndex, settings.oncallNearEndThresholdMin ?? 5);
    if (idx === -1) return request;
    return sendOnCallNudgeAt(request, idx, settings.oncallNudgeWindowSec ?? 40, request.nudgeLog);
};

/* ------------------------------------------------------------------ */
/* RouteMap - a near-exact port of the Driver App's own RouteMap       */
/* (ACT Driver Prototype.html) - same custom dot-overlay class, same   */
/* dashed polyline, same live-position marker interpolated along the   */
/* route from `progress`. Ported rather than shared since these two    */
/* files have no build step / shared module system to import between.  */
/* ------------------------------------------------------------------ */
function makeDotOverlayClass() {
    return class DotOverlay extends google.maps.OverlayView {
        constructor(position, color, size, label) {
            super();
            this.position = position; this.color = color; this.size = size; this.label = label; this.div = null;
        }
        onAdd() {
            this.div = document.createElement('div');
            this.div.style.position = 'absolute';
            this.div.style.width = `${this.size}px`; this.div.style.height = `${this.size}px`;
            this.div.style.borderRadius = '50%'; this.div.style.background = this.color;
            this.div.style.border = '2px solid #fff'; this.div.style.boxShadow = '0 1px 4px rgba(0,0,0,.4)';
            if (this.label) this.div.title = this.label;
            this.getPanes().overlayMouseTarget.appendChild(this.div);
        }
        draw() {
            const proj = this.getProjection();
            if (!proj || !this.div) return;
            const point = proj.fromLatLngToDivPixel(this.position);
            if (!point) return;
            const half = this.size / 2 + 2;
            this.div.style.left = `${point.x - half}px`; this.div.style.top = `${point.y - half}px`;
        }
        onRemove() { if (this.div) { this.div.remove(); this.div = null; } }
        setPosition(position) { this.position = position; this.draw(); }
    };
}

function RouteMap({ route, progress, heightClass = 'h-56' }) {
    const mapEl = useRef(null);
    const mapRef = useRef(null);
    const liveMarkerRef = useRef(null);
    const [mapsReady, setMapsReady] = useState(!!(window.google && window.google.maps));

    useEffect(() => {
        if (mapsReady) return;
        const id = setInterval(() => {
            if (window.google && window.google.maps) { setMapsReady(true); clearInterval(id); }
        }, 200);
        return () => clearInterval(id);
    }, [mapsReady]);

    useEffect(() => {
        if (!mapEl.current || !mapsReady) return;
        const [originName, destName] = route.split(' -> ');
        const origin = LOCATION_COORDS[originName];
        const dest = LOCATION_COORDS[destName];
        if (!origin || !dest) return;

        const DotOverlay = makeDotOverlayClass();
        const toLatLng = ([lat, lng]) => new google.maps.LatLng(lat, lng);

        const map = new google.maps.Map(mapEl.current, {
            center: toLatLng(origin), zoom: 12, disableDefaultUI: true, zoomControl: true, gestureHandling: 'greedy',
        });
        mapRef.current = map;

        new DotOverlay(toLatLng(origin), '#10B981', 12, originName).setMap(map);
        new DotOverlay(toLatLng(dest), '#EF4444', 12, destName).setMap(map);

        new google.maps.Polyline({
            path: [toLatLng(origin), toLatLng(dest)],
            map, strokeColor: '#3B82F6', strokeOpacity: 0,
            icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 }, offset: '0', repeat: '10px' }],
        });

        if (progress != null) {
            const pos = posAlongRoute(origin, dest, progress);
            const liveDot = new DotOverlay(toLatLng(pos), '#3B82F6', 16, 'Your vehicle - live position');
            liveDot.setMap(map);
            liveMarkerRef.current = liveDot;
        }

        const bounds = new google.maps.LatLngBounds();
        bounds.extend(toLatLng(origin)); bounds.extend(toLatLng(dest));
        map.fitBounds(bounds, 28);

        return () => { mapRef.current = null; liveMarkerRef.current = null; };
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [route, mapsReady]);

    useEffect(() => {
        if (progress == null || !liveMarkerRef.current) return;
        const [originName, destName] = route.split(' -> ');
        const pos = posAlongRoute(LOCATION_COORDS[originName], LOCATION_COORDS[destName], progress);
        if (pos) liveMarkerRef.current.setPosition(new google.maps.LatLng(pos[0], pos[1]));
    }, [progress, route]);

    return <div ref={mapEl} className={`${heightClass} w-full`} />;
}

function RoutePath({ route }) {
    const [origin, destination] = route.split(' -> ');
    return (
        <div className="flex gap-3">

/* One shared detail renderer for ANY trip, started or not - used both for Home's own featured trip
   (embedded, no back button, that's just Home's content) and for opening any other trip's card
   (full navigation, back button via App's selectedTripId). Started shows the full map-first hero
   (map, then at-a-glance cards, then SOS) in the same layering order as the Driver App's own
   HomeOngoingHero; not-yet-started shows a static two-pin map (RouteMap with no `progress`, which it
   already supports) plus the same vehicle/driver/vendor facts and an inline Simulate action, so
   opening a pending trip's card is a real detail view, not just the same compact summary again. */
// When an on-call driver should reach the pickup: counted from the moment they accepted (the ETA was
// computed then), falling back to the request time for records from before assignedAt existed.
const onCallPickupAt = (trip) => {
    const from = trip.assignedAt || trip.requestedAt;
    return from && trip.pickupEtaMin != null ? from + trip.pickupEtaMin * 60000 : null;
};
const initialsOf = (name) => (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');

/* "Your driver is on the way" - what an accepted on-call ride shows before pickup. Leads with who is
   coming and how to reach them, then a live countdown to the pickup. If the driver accepted while
   still finishing another drop-off (allowed within the near-end threshold), it says so, using the
   Driver App's own live availability broadcast, so the stakeholder knows why the countdown is longer
   than the distance alone suggests. That note clears on its own once the driver's drop-off is done. */
function DriverArrivingCard({ trip }) {
    const [now, setNow] = useState(Date.now());
    useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 15000);
        return () => clearInterval(t);
    }, []);
    const pickupAt = onCallPickupAt(trip);
    const minsLeft = pickupAt ? Math.max(0, Math.round((pickupAt - now) / 60000)) : null;
    const vehicle = STAKEHOLDER_APP_DATA.fleet.find(v => v.id === trip.vehicleId);
    const finishing = trip.assignedDriverId ? driverAvailability(trip.assignedDriverId) : { busyUntil: null };
    const finishingMin = finishing.busyUntil ? Math.max(0, Math.round((finishing.busyUntil - now) / 60000)) : null;
    return (
        <div className="bg-white rounded-2xl border border-indigo-200 shadow-card overflow-hidden">
            <div className="bg-gradient-to-r from-indigo-600 to-brandAccent px-4 py-3 text-white flex items-center justify-between gap-3">
                <div className="min-w-0">
                    <p className="text-[11px] font-semibold uppercase tracking-wide text-white/75 flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse" />Your driver is on the way
                    </p>
                    <p className="text-lg font-bold leading-tight mt-0.5">
                        {minsLeft == null ? 'Arriving soon' : minsLeft === 0 ? 'Arriving now' : `Arriving in ~${minsLeft} min`}
                    </p>
                </div>
                {pickupAt && (
                    <div className="text-right shrink-0">
                        <p className="text-[10px] uppercase tracking-wide text-white/75">Pickup by</p>
                        <p className="text-lg font-bold leading-tight">{formatClock(pickupAt)}</p>
                    </div>
                )}
            </div>
            <div className="p-4 space-y-3">
                <div className="flex items-center gap-3">
                    <span className="w-11 h-11 rounded-full bg-gradient-to-br from-indigo-500 to-brandAccent text-white font-bold text-sm flex items-center justify-center shrink-0">
                        {initialsOf(trip.driverName)}
                    </span>
                    <div className="min-w-0 flex-1">
                        <p className="font-semibold text-slate-800 truncate">{trip.driverName || 'Driver assigned'}</p>
                        <span className="inline-block mt-1 font-mono text-[11px] font-bold tracking-wider text-slate-800 bg-amber-50 border border-slate-300 rounded px-1.5 py-0.5">{plateOf(trip)}</span>
                        <p className="text-xs text-slate-500 truncate">
                            {[vehicle?.model, trip.vehicleType].filter(Boolean).join(' · ')}
                        </p>
                        {trip.vendorName && <p className="text-[11px] text-slate-400 truncate">{trip.vendorName}</p>}
                    </div>
                </div>
                <div className="flex items-center justify-between gap-2 pt-3 border-t border-slate-100">
                    <p className="text-xs text-slate-500 min-w-0">
                        Meet them at <span className="font-semibold text-slate-700">{trip.origin || 'your pickup point'}</span>
                    </p>
                    <CallButton phone={trip.driverPhone} label="Call driver" />
                </div>
                {finishingMin != null && (
                    <div className="bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 flex gap-2">
                        <Icon name="clock" size={14} className="text-amber-600 shrink-0 mt-0.5" />
                        <p className="text-xs text-amber-800">
                            {trip.driverName ? trip.driverName.split(' ')[0] : 'Your driver'} is finishing a drop-off
                            {finishing.dropLocation ? ` at ${finishing.dropLocation}` : ''}
                            {finishingMin > 0 ? ` (about ${finishingMin} min left)` : ''} and heads to you straight after. This is already included in the time above.
                        </p>
                    </div>
                )}
            </div>
        </div>
    );
}

function TripDetailView({ trip, onOpenSos, onResolveSos, onCancelOnCallRequest, onSimulateMatch }) {
    // A Searching/Escalated on-call request has no vehicle/driver/map yet - a completely different,
    // much thinner view than a real trip's (started or not), reusing the exact same searching card
    // the On-Call tab shows embedded here so opening one of these from Home/its own summary card

    if (trip.kind === 'oncall' && (trip.status === 'Searching' || trip.status === 'Escalated')) {

    const est = tripEstimate(trip.route);
    const started = !!trip.startedAt;

    return (

                {!started && trip.kind === 'oncall' ? (

                ) : started ? (
                    <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4">

                            </div>

                        {(() => {
                            // A scheduled Route trip already has a fixed pickup time; an On-Call trip
                            // has no schedule, only "requested just now, vehicle is N min away" - so
                            // its own pickup time is derived (requestedAt + pickupEtaMin) rather than
                            // stored, same information, computed instead of typed in.
                            const pickup = trip.kind === 'oncall'
                                ? (onCallPickupAt(trip) ? formatClock(onCallPickupAt(trip)) : null)
                                : (trip.time || null);
                            const arrival = pickup && est ? addMinutesToTime(pickup, est.durationMin) : null;
                            if (!pickup) {
                                return <p className="text-sm font-medium text-slate-700">Waiting to be dispatched.</p>;
                            }
                            return (
                                <div className="flex items-start justify-between gap-3">
                                    <div>
                                        <p className="flex items-center gap-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wide">
                                            <Icon name="clock" size={11} />{trip.kind === 'oncall' ? 'Pickup ETA' : 'Scheduled Pickup'}
                                        </p>
                                        <p className="text-2xl font-bold text-slate-800 leading-tight mt-0.5">{pickup}</p>
                                        {trip.date && trip.kind !== 'oncall' && <p className="text-xs text-slate-400 mt-0.5">{trip.date}</p>}
                                    </div>
                                    {arrival && (
                                        <div className="text-right shrink-0">
                                            <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Est. Arrival</p>
                                            <p className="text-lg font-bold text-brandAccent leading-tight mt-0.5">{arrival}</p>
                                        </div>
                                    )}
                                </div>
                            );
                        })()}
                    </div>
                )}

                <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4">
                    <RoutePath route={trip.route} />
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-card p-4 grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="truck" size={11} />Vehicle</p>
                        <p className="font-medium text-slate-800 mt-0.5 font-mono tracking-wide">{plateOf(trip)}</p>
                        <p className="text-xs text-slate-500">{trip.vehicleType}</p>
                    </div>
                    <div>
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="building" size={11} />Vendor</p>
                        <p className="font-medium text-slate-800 mt-0.5">{trip.vendorName}</p>
                    </div>
                    <div className="col-span-2 pt-3 border-t border-slate-100">
                        <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="users" size={11} />Driver</p>
                        <div className="flex items-center justify-between gap-2 mt-0.5">
                            <p className="font-medium text-slate-800">{trip.driverName}</p>
                            <CallButton phone={trip.driverPhone} label="Call driver" />
                        </div>
                    </div>
                    {est && (
                        <div className="col-span-2 pt-3 border-t border-slate-100 flex items-center gap-1.5 text-xs text-slate-500">
                            <span className="font-semibold text-slate-700">{est.distanceKm} km</span>
                            <span className="text-slate-300">&middot;</span>
                            <span>~{est.durationMin} min estimated</span>
                        </div>
                    )}
                </div>

                {started && !trip.sos && (
                    <button onClick={onOpenSos}
                        className="w-full py-3.5 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700 active:scale-[0.99] transition flex items-center justify-center gap-2 shadow-sm">
                        <Icon name="alert" size={16} />Report Emergency / SOS
                    </button>
                )}
            </div>
        </div>
    );
}

function HomeScreen({ currentTrip, otherTrips, onOpenTrip, onOpenSos, onResolveSos, onCancelOnCallRequest, onGoToTab, onSimulateMatch, oncallAvailable = true }) {
    if (!currentTrip) {
        return (
            <div className="p-4 space-y-4">

                    <div className="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center mx-auto mb-3">
                        <Icon name="car" size={24} />
                    </div>
                    <p className="text-sm font-semibold">Nothing moving right now</p>
                    <p className="text-xs text-slate-300 mt-1 max-w-[260px] mx-auto">
                        {otherTrips.length > 0
                            ? "You've got upcoming trips lined up below - they'll take over this space once they start."
