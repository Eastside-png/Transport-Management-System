/* A compact, tappable row - "opens up" into TripDetailView via App's selectedTripId when clicked.
   Used on Home for anything that isn't the currently-featured trip, and on the On-Call screen's own
   Recent Requests list, so a trip card is never a dead end anywhere in this app. */
function TripSummaryCard({ trip, onClick }) {
    // A Searching/Escalated on-call request has no vehicle/driver yet - a distinctly thinner summary
    // row than a real trip's, same "nothing to show that doesn't exist yet" reasoning as
    // TripDetailView's own early branch for this.
    if (trip.kind === 'oncall' && (trip.status === 'Searching' || trip.status === 'Escalated')) {
        return (
            <button type="button" onClick={onClick}
                className="w-full text-left bg-white rounded-2xl border border-slate-200 shadow-sm p-4 hover:border-brandAccent transition">
                <div className="flex items-center justify-between gap-3">
                    <div className="min-w-0">
                        <p className="font-semibold text-slate-800 text-sm">{trip.route}</p>
                        <p className="text-xs text-slate-400 mt-0.5">{trip.status === 'Escalated' ? 'Escalated to fleet control' : 'Searching for a driver...'}</p>
                    </div>
                    <Badge status={trip.status} />
                </div>
            </button>
        );
    }

    // Same derived-vs-stored pickup time TripDetailView uses - a Route trip's is fixed (trip.time),
    // an On-Call trip's is computed from when it was requested.
    const pickupTime = trip.kind === 'oncall'
        ? (onCallPickupAt(trip) ? formatClock(onCallPickupAt(trip)) : null)
        : trip.time;
    // A container rather than one big button, so the driver's tap-to-call link can sit on the card
    // itself - a link nested inside a button is invalid HTML and would also open the trip on every tap.
    // The tappable body still opens the trip exactly as before.
    return (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm hover:border-brandAccent transition">
        <button type="button" onClick={onClick} className="w-full text-left p-4">
            <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                    <p className="font-semibold text-slate-800 text-sm">{trip.route}</p>
                    {(trip.date || pickupTime) && (
                        <p className="text-xs text-slate-400 mt-0.5 flex items-center gap-1">
                            {pickupTime && <Icon name="clock" size={10} className="text-slate-300 shrink-0" />}
                            {trip.date}{trip.date && pickupTime ? ' · ' : ''}{pickupTime}
                        </p>
                    )}
                </div>
                <Badge status={trip.startedAt ? 'On the way' : trip.kind === 'oncall' ? 'Arriving' : 'Scheduled'} />
            </div>
            <div className="mt-3 pt-3 border-t border-slate-100 flex items-center gap-3">
                <span className="w-9 h-9 rounded-lg bg-blue-50 text-brandAccent flex items-center justify-center shrink-0">
                    <Icon name="car" size={16} />
                </span>
                <div className="min-w-0 flex-1">
                    <p className="text-sm font-medium text-slate-700 truncate">{trip.vehicleType} &middot; {plateOf(trip)}</p>
                    <p className="text-xs text-slate-400 truncate">Driver: {trip.driverName} &middot; {trip.vendorName}</p>
                </div>
                <Icon name="back" size={14} className="text-slate-300 shrink-0 rotate-180" />
            </div>
        </button>
        {trip.driverPhone && (
            <div className="px-4 pb-3 flex items-center justify-between gap-2">
                <p className="text-[11px] text-slate-400">Need to reach your driver?</p>
                <CallButton phone={trip.driverPhone} label={`Call ${trip.driverName || 'driver'}`} />
            </div>
        )}
        </div>
    );
}

// Shared by MyTripsScreen/MyTripCard - the one place that turns a trip's raw lifecycle fields
// (status/startedAt/completedAt) into the single label the rest of the app already shows via Badge,
// so "Completed" and "Cancelled" read the same way here as "Searching"/"Escalated" do everywhere else.
function tripDisplayStatus(trip) {
    if (trip.kind === 'oncall' && (trip.status === 'Searching' || trip.status === 'Escalated' || trip.status === 'Cancelled')) return trip.status;
    if (trip.completedAt) return 'Completed';
    if (trip.startedAt) return 'On the way';
    return trip.kind === 'oncall' ? 'Arriving' : 'Scheduled';
}

/* ------------------------------------------------------------------ */
/* My Trips - every trip this person has, of either kind and any        */
/* status, as tap-to-expand cards - a distinct interaction from the     */
/* tap-to-navigate TripSummaryCard rows used on Home/On-Call: this is   */
/* the one place a completed or cancelled trip is still visible at all, */
/* since Home/On-Call both intentionally drop those once they're done.  */
/* ------------------------------------------------------------------ */
function MyTripsScreen({ trips }) {
    const [expandedId, setExpandedId] = useState(null);

    const sorted = useMemo(() => {
        return [...trips].sort((a, b) => (b.requestedAt || b.startedAt || 0) - (a.requestedAt || a.startedAt || 0));
    }, [trips]);

    if (sorted.length === 0) {
        return (
            <div className="p-4">
                <div className="bg-white border border-slate-200 rounded-2xl p-8 text-center">
                    <div className="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                        <Icon name="trips" size={20} />
                    </div>
                    <p className="text-sm font-medium text-slate-600">No trips yet</p>
                    <p className="text-xs text-slate-400 mt-1">Every scheduled and on-call ride you take will show up here, start to finish.</p>
                </div>
            </div>
        );
    }

    return (
        <div className="p-4 space-y-3">
            {sorted.map(trip => (
                <MyTripCard key={trip.id} trip={trip} expanded={expandedId === trip.id}
                    onToggle={() => setExpandedId(id => id === trip.id ? null : trip.id)} />
            ))}
        </div>
    );
}

function MyTripCard({ trip, expanded, onToggle }) {
    const status = tripDisplayStatus(trip);
    const isOnCall = trip.kind === 'oncall';
    const pickupTime = isOnCall
        ? (onCallPickupAt(trip) ? formatClock(onCallPickupAt(trip)) : null)
        : trip.time;
    const est = tripEstimate(trip.route);
    const hasAssignedFacts = trip.vehicleId && status !== 'Searching' && status !== 'Escalated' && status !== 'Cancelled';
    const timeline = [
        trip.requestedAt && { label: 'Requested', at: trip.requestedAt },
        trip.assignedAt && { label: 'Driver assigned', at: trip.assignedAt },
        trip.startedAt && { label: 'Started', at: trip.startedAt },
        trip.completedAt && { label: 'Completed', at: trip.completedAt },
        trip.cancelledAt && { label: 'Cancelled', at: trip.cancelledAt },
    ].filter(Boolean);

    return (
        <div className={`bg-white rounded-2xl border shadow-sm overflow-hidden transition ${expanded ? 'border-brandAccent/50 shadow-card' : 'border-slate-200'}`}>
            <button type="button" onClick={onToggle} className="w-full text-left p-4 flex items-center gap-3">
                <span className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${isOnCall ? 'bg-violet-50 text-violet-600' : 'bg-blue-50 text-brandAccent'}`}>
                    <Icon name={isOnCall ? 'phone' : 'car'} size={17} />
                </span>
                <div className="min-w-0 flex-1">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">{isOnCall ? 'On-Call Ride' : 'Scheduled Ride'}</p>
                    <p className="font-semibold text-slate-800 text-sm truncate">{trip.route}</p>
                    {(trip.date || pickupTime) && (
                        <p className="text-xs text-slate-400 mt-0.5">{trip.date}{trip.date && pickupTime ? ' · ' : ''}{pickupTime}</p>
                    )}
                </div>
                <Badge status={status} />
                <Icon name="chevronDown" size={16} className={`text-slate-300 shrink-0 transition-transform ${expanded ? 'rotate-180' : ''}`} />
            </button>
            {expanded && (
                <div className="px-4 pb-4 pt-1 border-t border-slate-100 space-y-3 animate-in">
                    <div className="bg-slate-50 rounded-xl p-3">
                        <RoutePath route={trip.route} />
                    </div>

                    {hasAssignedFacts ? (
                        <div className="grid grid-cols-2 gap-3 text-sm">
                            <div>
                                <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="truck" size={11} />Vehicle</p>
                                <p className="font-medium text-slate-800 mt-0.5 font-mono tracking-wide">{plateOf(trip)}</p>
                                <p className="text-xs text-slate-500">{trip.vehicleType}</p>
                            </div>
                            <div>
                                <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="building" size={11} />Vendor</p>
                                <p className="font-medium text-slate-800 mt-0.5">{trip.vendorName}</p>
                            </div>
                            <div className="col-span-2">
                                <p className="flex items-center gap-1 text-[10px] text-slate-400 uppercase tracking-wide"><Icon name="users" size={11} />Driver</p>
                                <div className="flex items-center justify-between gap-2 mt-0.5">
                                    <p className="font-medium text-slate-800">{trip.driverName}</p>
                                    <CallButton phone={trip.driverPhone} label="Call driver" />
                                </div>
                            </div>
                            {est && (
                                <div className="col-span-2 pt-2 border-t border-slate-100 flex items-center gap-1.5 text-xs text-slate-500">
                                    <span className="font-semibold text-slate-700">{est.distanceKm} km</span>
                                    <span className="text-slate-300">&middot;</span>
                                    <span>~{est.durationMin} min estimated</span>
                                </div>
                            )}
                        </div>
                    ) : (
                        <p className="text-xs text-slate-400">
                            {status === 'Cancelled' ? 'This request was cancelled before a driver was assigned.'
                                : status === 'Escalated' ? 'No driver accepted in time - this was handed to a fleet coordinator to assign directly.'
                                : 'No driver had been assigned yet when this request last updated.'}
                        </p>
                    )}

                    {timeline.length > 0 && (
                        <div className="pt-2 border-t border-slate-100 space-y-1">
                            {timeline.map((step, i) => (
                                <p key={i} className="text-xs text-slate-400 flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 rounded-full bg-slate-300 shrink-0" />
                                    {step.label} &middot; {new Date(step.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}
                                </p>
                            ))}
                        </div>
                    )}
                </div>
            )}
        </div>
    );
}

/* ------------------------------------------------------------------ */
/* Shuttles - informational schedule board, not live-tracked (see this */
/* file's own STAKEHOLDER_APP_DATA.shuttlePlans comment for why) - but  */
/* "informational" doesn't mean thin: one big card per loop with its    */
/* full stop chain, hours, vehicle count and a live countdown to the    */
/* next departure, the same level of detail the Driver App's own        */
/* ShuttleScreen already gives a driver rostered on one of these loops. */
/* ------------------------------------------------------------------ */
const shuttleFrequencyLabel = (mins) => (mins % 60 === 0 ? `Every ${mins / 60} hr${mins === 60 ? '' : 's'}` : `Every ${mins} min`);

// The next scheduled departure clock-time for a recurring shuttle plan, stepped off its own
// startTime/frequencyMinutes rather than stored anywhere - ported from the Driver App's own
// nextShuttleDeparture (ACT Driver Prototype.html), same "06:00, every 30 min always resolves to the
// same next slot" reasoning, just read here instead of re-derived differently. Returns null once
// today's operating window (endTime) has already passed.
const nextShuttleDeparture = (plan) => {
    const [sh, sm] = plan.startTime.split(':').map(Number);
    const [eh, em] = plan.endTime.split(':').map(Number);
    const startMin = sh * 60 + sm, endMin = eh * 60 + em;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    if (nowMin < startMin) return { time: plan.startTime, inMin: startMin - nowMin };
    if (nowMin >= endMin) return null;
    const slotsElapsed = Math.ceil((nowMin - startMin) / plan.frequencyMinutes);
    const nextMin = startMin + slotsElapsed * plan.frequencyMinutes;
    if (nextMin >= endMin) return null;
    return { time: `${String(Math.floor(nextMin / 60)).padStart(2, '0')}:${String(nextMin % 60).padStart(2, '0')}`, inMin: nextMin - nowMin };
};

// The loop's full ordered stop chain as a vertical stepper (origins, then destination) instead of the
// old single wrapped line of arrows - each stop, including the first, gets its own real clock-time ETA
// (not just a relative "N min from departure"), anchored off `baseTime` (ShuttlePlanCard's own next
// departure, or the day's own start time once service has ended) and stacked forward leg by leg via
// tripEstimate, the same estimator every other route in this app already uses - so a rider glancing at
// their own stop gets an actual time to be there, not just a rough offset to do the math on themselves.
function ShuttleStopTimeline({ stops, baseTime }) {
    let cumulative = 0;
    return (
        <div>
            {stops.map((stop, i) => {
                if (i > 0) {
                    const leg = tripEstimate(`${stops[i - 1]} -> ${stop}`);
                    if (leg) cumulative += Math.max(0, leg.durationMin);
                }
                const isLast = i === stops.length - 1;
                const eta = baseTime ? addMinutesToTime(baseTime, cumulative) : null;
                return (
                    <div key={i} className="flex gap-3">
                        <div className="flex flex-col items-center">
                            <span className={`w-2.5 h-2.5 rounded-full shrink-0 mt-1 ${i === 0 ? 'bg-brandAccent' : isLast ? 'bg-emerald-500' : 'bg-slate-300'}`} />
                            {!isLast && <span className="w-px flex-1 bg-slate-200" />}
                        </div>
                        <div className={`flex-1 min-w-0 flex items-start justify-between gap-3 ${isLast ? 'pb-0.5' : 'pb-4'}`}>
                            <div className="min-w-0">
                                <p className="text-sm font-semibold text-slate-800 truncate">{stop}</p>
                                <p className="text-xs text-slate-400 mt-0.5">{i === 0 ? 'Loop start' : `~${cumulative} min from departure`}</p>
                            </div>
                            {eta && <p className="text-sm font-semibold text-brandAccent shrink-0">{eta}</p>}
                        </div>
                    </div>
                );
            })}
        </div>
    );
}

// One big card per loop - re-ticks every 20s (a countdown measured in minutes doesn't need anything
// faster) purely so "Next departure in ~N min" stays honest the longer a rider leaves this screen open,
// same idea as every other live countdown in this app (OnCallSearchingCard's own elapsed timer, etc).
function ShuttlePlanCard({ plan }) {
    const [, tick] = useState(0);
    useEffect(() => {
        const id = setInterval(() => tick(t => t + 1), 20000);
        return () => clearInterval(id);
    }, []);
    const stops = [...plan.origins, plan.destination];
    const next = nextShuttleDeparture(plan);
    const totalEst = tripEstimate(`${plan.origins[0]} -> ${plan.destination}`);

    return (
        <div className="bg-white rounded-3xl border border-slate-200 shadow-card overflow-hidden">
            <div className="bg-gradient-to-br from-brandBlue to-slate-800 text-white p-5">
                <div className="flex items-center justify-between">
                    <span className="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                        <Icon name="truck" size={20} />
                    </span>
                    <Badge status={plan.status || 'Active'} />
                </div>
                <p className="text-xs font-semibold text-white/60 uppercase tracking-wide mt-3">Recurring Shuttle</p>
                <p className="text-base font-bold mt-0.5">{plan.origins[0]} &rarr; {plan.destination}</p>
                {plan.vehicles?.length > 0 && (
                    <p className="text-xs text-white/70 mt-1">{plan.vehicles.length} vehicle{plan.vehicles.length === 1 ? '' : 's'} covering this loop{totalEst ? ` · ~${totalEst.durationMin} min end to end` : ''}</p>
                )}
            </div>

            <div className="p-5 space-y-4">
                {next ? (
                    <div className="bg-blue-50 border border-blue-100 rounded-2xl px-4 py-3 flex items-center justify-between">
                        <p className="flex items-center gap-1.5 text-[11px] font-semibold text-brandAccent uppercase tracking-wide">
                            <Icon name="clock" size={12} />Next Departure
                        </p>
                        <p className="text-xl font-bold text-brandAccent">{next.time} <span className="text-xs font-medium text-slate-400">(~{next.inMin} min)</span></p>
                    </div>
                ) : (
                    <div className="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-center">
                        <p className="text-sm font-medium text-slate-500">Service has ended for today</p>
                        <p className="text-xs text-slate-400 mt-0.5">Resumes tomorrow at {plan.startTime}</p>
                    </div>
                )}

                <div className="grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <p className="text-[10px] text-slate-400 uppercase tracking-wide">Frequency</p>
                        <p className="font-medium text-slate-800 mt-0.5">{shuttleFrequencyLabel(plan.frequencyMinutes)}</p>
                    </div>
                    <div>
                        <p className="text-[10px] text-slate-400 uppercase tracking-wide">Operating Hours</p>
                        <p className="font-medium text-slate-800 mt-0.5">{plan.startTime} - {plan.endTime}</p>
                    </div>
                </div>

                <div className="pt-1">
                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-2">Route &amp; Stops</p>
                    <ShuttleStopTimeline stops={stops} baseTime={next ? next.time : plan.startTime} />
                </div>
            </div>
        </div>
    );
}

function ShuttlesScreen() {
    const [publishedShuttles, setPublishedShuttles] = useState(readPublishedShuttles);
    useEffect(() => {
        const onStorage = (e) => { if (e.key === SHUTTLE_PUBLISH_STORAGE_KEY) setPublishedShuttles(readPublishedShuttles()); };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
    }, []);
    // Only loops actually running - a Paused loop, or one with no vehicle left on it (Draft), would
    // otherwise sit here with a live "next departure" countdown for a shuttle that is not coming.
    const plans = mergeShuttlePlans(STAKEHOLDER_APP_DATA.shuttlePlans, publishedShuttles).filter(s => s.status === 'Active');
    if (plans.length === 0) {
        return (
            <div className="p-4">
                <div className="bg-white border border-slate-200 rounded-2xl p-8 text-center">
                    <div className="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                        <Icon name="truck" size={22} />
                    </div>
                    <p className="text-sm font-medium text-slate-600">No recurring shuttles yet</p>
                    <p className="text-xs text-slate-400 mt-1">Any fixed-route shuttle loop near you will show up here.</p>
                </div>
            </div>
        );
    }
    return (
        <div className="p-4 space-y-4">
            {plans.map(s => <ShuttlePlanCard key={s.id} plan={s} />)}
        </div>
    );
}

/* ------------------------------------------------------------------ */
/* On-Call - real ride-hailing-style matching now: vehicle-type        */
/* eligibility (buildOnCallCandidateQueue), proximity-ranked           */
/* sequential driver nudging with accept/decline/timeout fallback,     */
/* and a hard search timeout that escalates to the admin/fleet         */
/* coordinator. The request becomes this person's pending/live trip on */
/* Home too, not just a line in this screen's own history - handled by */
/* the parent App via startOnCallSearch/tickOnCallOrchestration.       */
/* ------------------------------------------------------------------ */
// The live "searching for a driver" state - pickup/drop, an elapsed mm:ss counter (ticking every
// second, same idea as every other live-progress tick in this app), and a Cancel action. Persists
// until a driver's accepted, the search times out and escalates (same card, different message - the
// stakeholder is never dropped onto a bare "still searching" screen with no update once that happens,
// per this feature's own spec), or the stakeholder cancels.
function OnCallSearchingCard({ request, onCancel, onSimulateMatch }) {
    const [, tick] = useState(0);
    useEffect(() => {
        const id = setInterval(() => tick(t => t + 1), 1000);
        return () => clearInterval(id);
    }, []);
    const escalated = request.status === 'Escalated';
    const elapsedSec = Math.max(0, Math.floor((Date.now() - request.requestedAt) / 1000));
    const mm = Math.floor(elapsedSec / 60), ss = elapsedSec % 60;

    return (
        <div className={`rounded-2xl p-4 shadow-sm animate-in border ${escalated ? 'bg-violet-50 border-violet-200' : 'bg-white border-slate-200'}`}>
            <div className="flex items-center gap-3 mb-3">
                {escalated ? (
                    <span className="w-10 h-10 rounded-full bg-violet-100 text-violet-600 flex items-center justify-center shrink-0">
                        <Icon name="alert" size={18} />
                    </span>
                ) : (
                    <div className="w-10 h-10 rounded-full border-[3px] border-slate-200 border-t-brandAccent animate-spin shrink-0" />
                )}
                <div className="min-w-0">
                    <p className={`text-sm font-semibold ${escalated ? 'text-violet-700' : 'text-slate-800'}`}>
                        {escalated ? 'Being handled by our team' : 'Searching for a driver...'}
                    </p>
                    <p className="text-xs text-slate-400 font-mono">{mm}:{String(ss).padStart(2, '0')} elapsed</p>
                </div>
            </div>
            <div className="bg-slate-50 rounded-xl p-3 mb-3">
                <RoutePath route={request.route} />
            </div>
            {escalated && (
                <p className="text-xs text-violet-700 mb-3">
                    No driver accepted in time - a fleet coordinator has been notified and will assign one directly. You don't need to do anything else.
                </p>
            )}
            {onSimulateMatch && request.candidateQueue?.length > 0 && (
                <button onClick={() => onSimulateMatch(request)}
                    className="w-full mb-2 py-2.5 rounded-lg bg-emerald-500 text-white text-sm font-semibold hover:bg-emerald-600 transition flex items-center justify-center gap-1.5"
                    title="Demo only: simulate a driver accepting this request right now">
                    <Icon name="check" size={14} />Simulate: Match Driver
                </button>
            )}
            <button onClick={() => onCancel(request)}
                className="w-full py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 transition">
                Cancel Request
            </button>
        </div>
    );
}

function OnCallScreen({ requests, onRequestRide, onCancelRequest, onOpenTrip, hasActiveTrip, onSimulateMatch }) {
    const [origin, setOrigin] = useState('');
    const [destination, setDestination] = useState('');
    const [headcount, setHeadcount] = useState(1);

    // At most one request actively in flight at a time - the form itself is disabled while one is,
    // same as a real ride-hailing app not letting you fire off a second request before the first
    // resolves. hasActiveTrip (a trip already started and not yet ended, scheduled or on-call) is the
    // other reason the form's disabled - a stakeholder physically can't be in two vehicles at once, so
    // there's no point letting them start a second search while one ride is already under way.
    const activeRequest = requests.find(r => r.status === 'Searching' || r.status === 'Escalated') || null;
    const pastRequests = requests.filter(r => r !== activeRequest);
    const blocked = !!activeRequest || hasActiveTrip;

    const requestRide = () => {
        if (!origin || !destination || origin === destination || blocked) return;
        onRequestRide(origin, destination, Number(headcount) || 1);
        setOrigin(''); setDestination(''); setHeadcount(1);
    };

    return (
        <div className="p-4 space-y-4">
            <div className="bg-gradient-to-br from-violet-600 to-brandBlue rounded-2xl p-4 text-white shadow-card flex items-center gap-3">
                <span className="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                    <Icon name="phone" size={20} />
                </span>
                <div className="min-w-0">
                    <p className="font-semibold text-sm">On-Call Ride</p>
                    <p className="text-xs text-white/70 mt-0.5">A vehicle matched to your category is dispatched on request - no schedule needed.</p>
                </div>
            </div>

            {activeRequest && <OnCallSearchingCard request={activeRequest} onCancel={onCancelRequest} onSimulateMatch={onSimulateMatch} />}

            {!activeRequest && hasActiveTrip && (
                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex items-start gap-3">
                    <span className="w-9 h-9 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center shrink-0">
                        <Icon name="alert" size={16} />
                    </span>
                    <div className="min-w-0">
                        <p className="text-sm font-semibold text-amber-800">You're already on a trip</p>
                        <p className="text-xs text-amber-700 mt-0.5">Finish or end your current ride before requesting another one - see Home for its live status.</p>
                    </div>
                </div>
            )}

            <div className={`bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3 transition ${blocked ? 'opacity-50 pointer-events-none' : ''}`}>
                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide">New Request</p>
                <div>
                    <label className="flex items-center gap-1 text-xs font-medium text-slate-500 mb-1"><Icon name="pin" size={11} />Pickup</label>
                    <select value={origin} onChange={e => setOrigin(e.target.value)}
                        className="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-brandAccent/30 focus:outline-none">
                        <option value="">Select pickup point...</option>
                        {LOCATION_REGISTRY.map(l => <option key={l.name} value={l.name}>{l.name}</option>)}
                    </select>
                </div>
                <div>
                    <label className="flex items-center gap-1 text-xs font-medium text-slate-500 mb-1"><Icon name="pin" size={11} />Drop-off</label>
                    <select value={destination} onChange={e => setDestination(e.target.value)}
                        className="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-brandAccent/30 focus:outline-none">
                        <option value="">Select drop-off point...</option>
                        {LOCATION_REGISTRY.filter(l => l.name !== origin).map(l => <option key={l.name} value={l.name}>{l.name}</option>)}
                    </select>
                </div>
                <div>
                    <label className="flex items-center gap-1 text-xs font-medium text-slate-500 mb-1"><Icon name="users" size={11} />Passengers</label>
                    <input type="number" min="1" max="20" value={headcount} onChange={e => setHeadcount(e.target.value)}
                        className="w-24 px-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-brandAccent/30 focus:outline-none" />
                </div>
                <button onClick={requestRide} disabled={!origin || !destination || origin === destination || blocked}
                    className="w-full py-2.5 rounded-lg bg-brandBlue text-white text-sm font-semibold hover:bg-slate-800 transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-1.5">
                    <Icon name="phone" size={14} />Request Ride
                </button>
            </div>

            {pastRequests.length > 0 && (
                <div className="space-y-2">
                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide px-1">Recent Requests</p>
                    <div className="space-y-2">
                        {pastRequests.map(r => <TripSummaryCard key={r.id} trip={r} onClick={() => onOpenTrip(r.id)} />)}
                    </div>
                </div>
            )}
        </div>
    );
}

/* ------------------------------------------------------------------ */
/* Calendar - full-view port of the admin panel's own Upcoming Events  */
/* card content (window.UpcomingEventsCard/CALENDAR_TYPE_META), but    */
/* fixtures only - arrival/departure entries are internal fleet-ops    */
/* logistics (delegation wave planning), not something a stakeholder   */
/* needs on their own events calendar.                                 */
/* ------------------------------------------------------------------ */
function CalendarScreen() {
    const events = useMemo(() => {
        return STAKEHOLDER_APP_DATA.calendarEvents
            .filter(e => e.type === 'fixture' && e.phase !== 'past')
            .sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
    }, []);

    return (
        <div className="p-4">
            <div className="bg-white border border-slate-200 rounded-2xl divide-y divide-slate-100">
                {events.length === 0 && <p className="px-4 py-8 text-center text-sm text-slate-400">No upcoming events right now.</p>}
                {events.map(evt => {
                    const meta = CALENDAR_TYPE_META[evt.type] || { icon: 'calendar', bg: 'bg-slate-100', text: 'text-slate-500' };
                    return (
                        <div key={evt.id} className="px-4 py-3 flex items-center gap-3">
                            <span className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 ${meta.bg} ${meta.text}`}>
                                <Icon name={meta.icon} size={15} className={meta.rotate ? 'rotate-180' : ''} />
                            </span>
                            <div className="min-w-0 flex-1">
                                <p className="font-medium text-slate-800 text-sm truncate">{evt.title}</p>
                                <p className="text-xs text-slate-400 mt-0.5 truncate">
                                    {new Date(evt.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} &middot; {evt.time} &middot; {evt.location}
                                </p>
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

function App() {
    const [person, setPerson] = useState(null);
    const [activeTab, setActiveTab] = useState('home');
    // The logged-in person's own Route Plan trip(s), mutable so Simulate: Start Trip can stamp
    // startedAt/estimatedDurationMin onto one - starts from the static seed's Assigned-but-not-
    // dispatched state.
    const [routeTrips, setRouteTrips] = useState(() => STAKEHOLDER_APP_DATA.routePlans.map(p => ({ ...p, kind: 'route' })));
    // On-call requests this person has made this session - one entry per request, present from the
    // moment it starts Searching all the way through Assigned/Escalated/Cancelled (startOnCallSearch/
    // tickOnCallOrchestration keep it updated in place, never replace it). Simulate: Start Trip stamps
    // startedAt onto the current one the same way it does for a scheduled trip, once it's Assigned.
    const [onCallTrips, setOnCallTrips] = useState([]);
    const [sosOpen, setSosOpen] = useState(false);
    // Which trip's own detail view is open (from a tapped card on Home or On-Call) - null means no
    // detail view is open and the active bottom-nav tab's own screen shows instead.
    const [selectedTripId, setSelectedTripId] = useState(null);

    // The admin-configurable On-Call matching rules/thresholds, live from the bridge (App's own
    // settings-sync effect below) - defaults match window.ModuleSettingsTab's own INITIAL_DATA.settings
    // defaults (ACT Travel Prototype.html), used until that first sync actually lands.
    const [stakeholderVehicleMap, setStakeholderVehicleMap] = useState(DEFAULT_STAKEHOLDER_VEHICLE_MAP);
    const [oncallNudgeWindowSec, setOncallNudgeWindowSec] = useState(40);
    const [oncallSearchTimeoutMin, setOncallSearchTimeoutMin] = useState(3);
    // Sub-minute precision for the search timeout (e.g. 2 min 30 sec) - kept as its own field rather
    // than folded into oncallSearchTimeoutMin as a decimal, so both this app and the admin panel's own
    // window.OnCallTab read the exact same two numbers the same way (Min*60000 + Sec*1000).
    const [oncallSearchTimeoutSec, setOncallSearchTimeoutSec] = useState(0);
    const [oncallNearEndThresholdMin, setOncallNearEndThresholdMin] = useState(5);
    // The driver buffer logic's own distance cap (candidatePickupEta/buildOnCallCandidateQueue) - a
    // driver whose real last-leg drive to the pickup exceeds this is never even offered as a candidate.
    // Matches ACT Travel Prototype.html's own INITIAL_DATA.settings.oncallMaxProximityKm default - see
    // that field's own comment for why 25, not a tighter number, given where the seed fleet's bases
    // actually sit relative to a pickup like Athletes Village.
    const [oncallMaxProximityKm, setOncallMaxProximityKm] = useState(25);
    // Which stakeholder categories can use On-Call at all (window.OnCallTab's own Matching Rules
    // toggle) - a coarser switch than stakeholderVehicleMap above, which assumes on-call is available
    // and only decides which vehicle fits. Defaults to every type enabled, matching the admin's own
    // default before this switch existed. See oncallAvailableForMe below for where this actually gates
    // anything (BottomNav's own On-Call tab, Home's quick action, startOnCallSearch's own guard).
    const [oncallEnabledStakeholderTypes, setOncallEnabledStakeholderTypes] = useState([
        'Athletes', 'Technical Officials', 'Chef de Mission (CDM)', 'Competition Manager (CM)',
        'Games Technical Conduct Committee (GTCC)', 'Volunteers', 'Host State Government / Sports Authority',
    ]);
    // Must match the exact keys the admin panel writes to (window.ModuleSettingsTab's
    // STAKEHOLDER_APP_BRIDGE_KEYS / window.OnCallTab's own STAKEHOLDER_VEHICLE_MAP_STORAGE_KEY, in
    // ACT Travel Prototype.html) - same one-way admin -> app settings bridge every Driver App numeric
    // setting already uses (that file's own DRIVER_APP_BRIDGE_KEYS comment), just read here instead.
    const ONCALL_NUDGE_WINDOW_STORAGE_KEY = 'kheloTechOncallNudgeWindowSec';
    const ONCALL_SEARCH_TIMEOUT_STORAGE_KEY = 'kheloTechOncallSearchTimeoutMin';
    const ONCALL_SEARCH_TIMEOUT_SEC_STORAGE_KEY = 'kheloTechOncallSearchTimeoutSec';
    const ONCALL_NEAR_END_THRESHOLD_STORAGE_KEY = 'kheloTechOncallNearEndThresholdMin';
    const ONCALL_MAX_PROXIMITY_STORAGE_KEY = 'kheloTechOncallMaxProximityKm';
    const ONCALL_ENABLED_TYPES_STORAGE_KEY = 'kheloTechOncallEnabledStakeholderTypes';
    const STAKEHOLDER_VEHICLE_MAP_STORAGE_KEY = 'kheloTechStakeholderVehicleMap';
    useEffect(() => {
        // null when the admin panel has never written this setting, NOT 0. Number(null) is 0, and
        // several of these settings legitimately accept 0, so reading a missing key straight through
        // Number() used to turn "never configured" into "configured to zero": the search timeout
        // became 0 minutes and every On-Call request escalated on its first tick, before a single
        // driver was nudged. A missing or unparseable value now leaves the built-in default alone.
        const readStoredNumber = (key) => {
            const raw = localStorage.getItem(key);
            if (raw === null || raw.trim() === '') return null;
            const n = Number(raw);
            return Number.isFinite(n) ? n : null;
        };
        const sync = () => {
            try {
                const w = readStoredNumber(ONCALL_NUDGE_WINDOW_STORAGE_KEY);
                if (w !== null && w > 0) setOncallNudgeWindowSec(w);
            } catch (e) { /* storage unavailable - stays on the built-in default */ }
            try {
                const t = readStoredNumber(ONCALL_SEARCH_TIMEOUT_STORAGE_KEY);
                if (t !== null && t >= 0) setOncallSearchTimeoutMin(t);
            } catch (e) { /* storage unavailable - stays on the built-in default */ }
            try {
                const ts = readStoredNumber(ONCALL_SEARCH_TIMEOUT_SEC_STORAGE_KEY);
                if (ts !== null && ts >= 0) setOncallSearchTimeoutSec(ts);
            } catch (e) { /* storage unavailable - stays on the built-in default */ }
            try {
                const n = readStoredNumber(ONCALL_NEAR_END_THRESHOLD_STORAGE_KEY);
                if (n !== null && n >= 0) setOncallNearEndThresholdMin(n);
            } catch (e) { /* storage unavailable - stays on the built-in default */ }
            try {
                const p = readStoredNumber(ONCALL_MAX_PROXIMITY_STORAGE_KEY);
                if (p !== null && p > 0) setOncallMaxProximityKm(p);
            } catch (e) { /* storage unavailable - stays on the built-in default */ }
            try {
                const raw = localStorage.getItem(STAKEHOLDER_VEHICLE_MAP_STORAGE_KEY);
                if (raw) setStakeholderVehicleMap(JSON.parse(raw));
            } catch (e) { /* storage unavailable - stays on the built-in default */ }
            try {
                const raw = localStorage.getItem(ONCALL_ENABLED_TYPES_STORAGE_KEY);
                if (raw) setOncallEnabledStakeholderTypes(JSON.parse(raw));
            } catch (e) { /* storage unavailable - stays on the built-in default */ }
        };
        sync();
        const onStorage = (e) => {
            if ([ONCALL_NUDGE_WINDOW_STORAGE_KEY, ONCALL_SEARCH_TIMEOUT_STORAGE_KEY, ONCALL_SEARCH_TIMEOUT_SEC_STORAGE_KEY, ONCALL_NEAR_END_THRESHOLD_STORAGE_KEY, ONCALL_MAX_PROXIMITY_STORAGE_KEY, ONCALL_ENABLED_TYPES_STORAGE_KEY, STAKEHOLDER_VEHICLE_MAP_STORAGE_KEY].includes(e.key)) sync();
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, []);

    // Drives every open Searching-or-Escalated request's own orchestration forward
    // (tickOnCallOrchestration's own comment) - a flat 1.5s tick is plenty for windows measured in tens
    // of seconds/minutes. Escalated stays in this list (fix - see that function's own comment on why)
    // purely so an admin's later manual assignment still gets picked up here; it does no further
    // nudging of its own once escalated. Recreated whenever the admin-configurable thresholds actually
    // change, so a live edit takes effect on the very next tick rather than needing a stale closure
    // workaround.
    useEffect(() => {
        const id = setInterval(() => {
            setOnCallTrips(list => list.map(r => (r.status === 'Searching' || r.status === 'Escalated')
                ? tickOnCallOrchestration(r, { oncallNudgeWindowSec, oncallSearchTimeoutMin, oncallSearchTimeoutSec, oncallNearEndThresholdMin })
                : r));
        }, 1500);
        return () => clearInterval(id);
    }, [oncallNudgeWindowSec, oncallSearchTimeoutMin, oncallSearchTimeoutSec, oncallNearEndThresholdMin]);

    // The moment the most recently created on-call request actually becomes Assigned, switch off the
    // On-Call tab's own Searching screen straight to Home - "switch the stakeholder app from the
    // searching state to the live trip view... as already defined for the homepage" - Home already
    // knows how to feature this trip (it's just the newest pending/started trip), this just makes sure
    // the stakeholder isn't left looking at a stale On-Call tab once it's resolved.
    const latestOnCallStatus = onCallTrips[0]?.status;
    useEffect(() => {
        if (latestOnCallStatus === 'Assigned' && activeTab === 'oncall') setActiveTab('home');
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [latestOnCallStatus]);

    // If an admin turns On-Call off for this person's own stakeholder category while they're already
    // sitting on that tab (a live setting change, not just something checked once at login), bounce
    // them back to Home rather than leaving a now-inaccessible tab open with no way back to it from
    // BottomNav (which hides the On-Call entry entirely once this is false - see its own call site).
    // Kept above the `if (!person)` early return below, same as every other hook in this component -
    // person is guaranteed non-null by the time this can meaningfully fire regardless.
    const oncallAvailableForLoggedInPerson = person ? oncallEnabledStakeholderTypes.includes(person.stakeholderType) : true;
    useEffect(() => {
        if (!oncallAvailableForLoggedInPerson && activeTab === 'oncall') setActiveTab('home');
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [oncallAvailableForLoggedInPerson]);

    // Picks up any Route Plan the admin panel has Published for one of this person's own manifests
    // (matched by manualPlanId, see ROUTE_PLAN_PUBLISH_STORAGE_KEY's own comment) - merges each one
    // straight into `routeTrips` the first time it's seen, then this app tracks it exactly like
    // anything else locally from there. Called with `person` as an argument rather than reading it
    // from the closure so it stays usable both from the effect below (which must be declared before
    // the early "not logged in" return, per the Rules of Hooks) and, if ever needed, elsewhere.
    // Re-publishing (e.g. after a vehicle reassignment) only overwrites a copy that hasn't been
    // started here yet, never a live/completed one.
    const mergePublishedPlans = (forPerson) => {
        if (!forPerson) return;
        let published = [];
        try { published = JSON.parse(localStorage.getItem(ROUTE_PLAN_PUBLISH_STORAGE_KEY) || '[]'); } catch (e) { published = []; }
        const myManifestIds = STAKEHOLDER_APP_DATA.manifests.filter(m => m.personId === forPerson.id).map(m => m.id);
        const mine = published.filter(r => r.manualPlanId && myManifestIds.includes(r.manualPlanId));
        if (mine.length === 0) return;
        setRouteTrips(list => {
            let changed = false;
            let next = list;
            mine.forEach(r => {
                const idx = next.findIndex(t => t.id === r.id);
                const shaped = {
                    id: r.id, kind: 'route', route: r.route, date: r.date, time: r.time || '', status: 'Assigned',
                    vehicleId: r.vehicleId, regNo: r.regNo || null, vehicleType: r.vehicleType, driverName: r.driverName, vendorName: r.vendorName,
                    manualPlanId: r.manualPlanId, publishedAt: r.publishedAt,
                };
                if (idx === -1) {
                    next = [...next, shaped];
                    changed = true;
                } else if (!next[idx].startedAt && next[idx].publishedAt !== r.publishedAt) {
                    next = next.map((t, i) => i === idx ? { ...t, ...shaped } : t);
                    changed = true;
                }
            });
            return changed ? next : list;
        });
    };
    useEffect(() => {
        mergePublishedPlans(person);
        const onStorage = (e) => { if (e.key === ROUTE_PLAN_PUBLISH_STORAGE_KEY) mergePublishedPlans(person); };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [person?.id]);

    if (!person) return <LoginScreen onLogin={setPerson} />;

    // My scheduled trip(s) - resolved through the same manifest -> linkedRouteIds chain the admin
    // panel's own reverse-link (fix-list item 31) already established, just followed here instead of
    // there - plus anything bridged straight in by manualPlanId above, which has no seeded
    // linkedRouteIds entry to match against.
    const manifest = STAKEHOLDER_APP_DATA.manifests.find(m => m.personId === person.id);
    const myManifestIds = STAKEHOLDER_APP_DATA.manifests.filter(m => m.personId === person.id).map(m => m.id);
    const myRouteTrips = routeTrips.filter(t =>
        (manifest && (manifest.linkedRouteIds || []).includes(t.id)) || (t.manualPlanId && myManifestIds.includes(t.manualPlanId))
    );
    const allMyTrips = [...myRouteTrips, ...onCallTrips];

    // Current = an already-started, not-yet-ended trip if one exists; otherwise a live On-Call ride
    // (searching, escalated, or matched and on its way), newest first; otherwise the next scheduled
    // trip. On-Call leads over a scheduled trip because it is, by definition, something happening
    // now - someone standing at a pickup point waiting for a driver needs that ride and its call
    // button in front of them, not tomorrow's scheduled transfer. The old ordering listed scheduled
    // trips first, so a matched on-call ride was pushed down into "other trips" whenever the person
    // also had anything scheduled. A trip that's been ended (simulateEnd's own completedAt) drops out
    // of both - it's done, and stops cluttering "other trips" the way a real completed ride would.
    const started = allMyTrips.find(t => t.startedAt && !t.completedAt);
    const isLiveOnCall = t => t.kind === 'oncall' && ['Searching', 'Escalated', 'Assigned'].includes(t.status);
    const notYetStarted = allMyTrips.filter(t => !t.startedAt && !t.completedAt);
    const pending = [...notYetStarted.filter(isLiveOnCall), ...notYetStarted.filter(t => !isLiveOnCall(t))];
    const currentTrip = started || pending[0] || null;
    const otherTrips = pending.filter(t => t !== currentTrip);
    const selectedTrip = selectedTripId ? allMyTrips.find(t => t.id === selectedTripId) || null : null;
    // Whichever trip is actually on screen right now - the one open in detail, or (nothing open)
    // Home's own featured trip - is what Simulate/SOS act on and what the top-nav Simulate pill targets.
    const focusedTrip = selectedTrip || currentTrip;
    // A real person can only physically be in one vehicle at a time - true here the same way it's true
    // for a driver (ACT Driver Prototype.html's own hasActiveTrip). Gates On-Call's Request Ride the
    // same way a driver's own active trip blocks Start Trip on a second one.
    const hasActiveTrip = allMyTrips.some(t => t.startedAt && !t.completedAt);
    // Whether this person's own stakeholder category has On-Call turned on at all (window.OnCallTab's
    // own Matching Rules toggle, ACT Travel Prototype.html) - a coarser gate than
    // stakeholderVehicleMap, which assumes the feature is available and only narrows vehicle type.
    // When false: BottomNav hides the On-Call tab entirely and Home's own quick-action tile drops it,
    // rather than leaving a dead-end screen up for a feature this stakeholder was never meant to see -
    // same "don't offer a choice that isn't real" rule this whole on-call engine already follows for
    // vehicle-type/proximity eligibility. startOnCallSearch's own guard below is the defensive second
    // check, same shape as hasActiveTrip's.
    const oncallAvailableForMe = oncallEnabledStakeholderTypes.includes(person.stakeholderType);

    const patchTrip = (trip, patch) => {
        if (trip.kind === 'route') setRouteTrips(list => list.map(t => t.id === trip.id ? { ...t, ...patch } : t));
        else setOnCallTrips(list => list.map(t => t.id === trip.id ? { ...t, ...patch } : t));
    };

    const simulateStart = (trip = focusedTrip) => {
        if (!trip || trip.startedAt || hasActiveTrip) return;
        const est = tripEstimate(trip.route) || { durationMin: 30 };
        patchTrip(trip, { startedAt: Date.now(), estimatedDurationMin: est.durationMin });
    };
    // The other half of the demo lifecycle Simulate: Start Trip already had - closes out whichever
    // trip is actually on screen (completedAt), which is what lets hasActiveTrip above go false again
    // and frees the stakeholder up to request a new on-call ride.
    const simulateEnd = (trip = focusedTrip) => {
        if (!trip || !trip.startedAt || trip.completedAt) return;
        patchTrip(trip, { completedAt: Date.now() });
    };

    // Kicks off a real search instead of the old single-shot instant match: builds the eligible,
    // proximity-ranked candidate queue up front (buildOnCallCandidateQueue), then hands the actual
    // nudging over to the ticking orchestration effect above. Escalates immediately, before ever
    // sending a nudge, when there's genuinely no possible match (edge case 3) - either the
    // stakeholder's own category has no eligible vehicle type mapped at all, or none of this app's own
    // fleet snapshot currently has a vehicle of an eligible type/capacity. Refuses to even start a
    // search while hasActiveTrip - same "one person, one vehicle at a time" reasoning as simulateStart's
    // own guard; the On-Call screen itself disables the button before this is ever reachable, this is
    // just the defensive second check.
    const startOnCallSearch = (origin, destination, passengers) => {
        if (hasActiveTrip || !oncallAvailableForMe) return;
        const requestedVehicleTypes = stakeholderVehicleMap[person.stakeholderType] || [];
        const candidateQueue = buildOnCallCandidateQueue(origin, passengers, person.stakeholderType, stakeholderVehicleMap, oncallMaxProximityKm);
        const requestedAt = Date.now();
        const base = {
            id: uid('OC'), kind: 'oncall', status: 'Searching', origin, destination, route: `${origin} -> ${destination}`,
            passengers, stakeholderType: person.stakeholderType, stakeholderName: person.name, stakeholderPhone: person.phone,
            requestedVehicleTypes, requestedAt, candidateQueue, candidateIndex: 0,
            currentNudgeId: null, currentNudgeDriverId: null, currentNudgeDriverName: null, nudgeLog: [],
            startedAt: null, estimatedDurationMin: null,
        };
        const noPossibleMatch = requestedVehicleTypes.length === 0 || candidateQueue.length === 0;
        const initial = noPossibleMatch ? { ...base, status: 'Escalated', escalatedAt: requestedAt } : base;
        upsertOnCallRequest(toOnCallBridgeRecord(initial));
        setOnCallTrips(list => [initial, ...list]);
    };

    // A stakeholder can give up while still Searching or already Escalated (per the spec's own
    // "until... the user cancels") - not once a driver's actually been found, at which point it's a
    // real trip like any other, not a search to abandon.
    const cancelOnCallRequest = (request) => {
        if (request.status !== 'Searching' && request.status !== 'Escalated') return;
        const updated = { ...request, status: 'Cancelled', cancelledAt: Date.now(), currentNudgeId: null };
        upsertOnCallRequest(toOnCallBridgeRecord(updated));
        setOnCallTrips(list => list.map(r => r.id === request.id ? updated : r));
    };

    // Demo-only shortcut (OnCallSearchingCard's own "Simulate: Match Driver" button) - skips straight
    // to a real Assigned outcome without needing the Driver App open in a second tab to actually accept
    // a nudge, same idea as Simulate: Start/End Trip elsewhere in this app. Re-checks status before
    // acting so it's a no-op if the request already resolved (accepted/admin-assigned/cancelled)
    // between the button rendering and being clicked.
    const simulateMatchOnCall = (request) => {
        setOnCallTrips(list => list.map(r => r.id === request.id && (r.status === 'Searching' || r.status === 'Escalated')
            ? simulateMatchOnCallRequest(r) : r));
    };

    const submitSos = () => {
        setSosOpen(false);
        if (!focusedTrip) return;
        patchTrip(focusedTrip, { sos: true });
    };
    const resolveSos = () => {
        if (!focusedTrip) return;
        patchTrip(focusedTrip, { sos: false });
    };

    const titles = { home: 'Home', trips: 'My Trips', shuttles: 'Recurring Shuttles', oncall: 'On-Call Ride', calendar: 'Events Calendar' };
    let screen;
    if (activeTab === 'home') screen = <HomeScreen currentTrip={currentTrip} otherTrips={otherTrips} onOpenTrip={setSelectedTripId} onOpenSos={() => setSosOpen(true)} onResolveSos={resolveSos} onCancelOnCallRequest={cancelOnCallRequest} onGoToTab={setActiveTab} onSimulateMatch={simulateMatchOnCall} oncallAvailable={oncallAvailableForMe} />;
    else if (activeTab === 'trips') screen = <MyTripsScreen trips={allMyTrips} />;
    else if (activeTab === 'shuttles') screen = <ShuttlesScreen />;
    else if (activeTab === 'oncall') screen = <OnCallScreen requests={onCallTrips} onRequestRide={startOnCallSearch} onCancelRequest={cancelOnCallRequest} onOpenTrip={setSelectedTripId} hasActiveTrip={hasActiveTrip} onSimulateMatch={simulateMatchOnCall} />;
    else screen = <CalendarScreen />;

    if (selectedTrip) {
        screen = <TripDetailView trip={selectedTrip} onOpenSos={() => setSosOpen(true)} onResolveSos={resolveSos} onCancelOnCallRequest={cancelOnCallRequest} onSimulateMatch={simulateMatchOnCall} />;
    }

    // TopBar's Simulate pill targets whichever trip is actually on screen (focusedTrip) - 'start' while
    // it hasn't begun yet, 'end' once it has but hasn't been marked complete, nothing once it's done or
    // there's nothing focused at all (e.g. My Trips/Shuttles/Calendar, or Home's own empty state).
    const simMode = !focusedTrip || focusedTrip.completedAt ? null : focusedTrip.startedAt ? 'end' : 'start';
    // My Trips' own small red nav badge - anything that needs the stakeholder's attention right now
    // (an on-call request that's been escalated to fleet control) counts toward it, the same "don't
    // make them go hunting for it" reasoning BottomNav's badge slot already exists for.
    const attentionCount = onCallTrips.filter(r => r.status === 'Escalated').length;

    return (
        <div className="min-h-screen bg-bgLight flex justify-center">
            <div className="w-full max-w-md bg-bgLight min-h-screen flex flex-col shadow-xl relative">
                <TopBar person={person} title={selectedTrip ? 'Trip Details' : titles[activeTab]}
                    onBack={selectedTrip ? () => setSelectedTripId(null) : null} onLogout={() => setPerson(null)}
                    simMode={selectedTrip || activeTab === 'home' ? simMode : null} onSimulateStart={simulateStart} onSimulateEnd={simulateEnd} />
                <div className="flex-1 overflow-y-auto pb-2">{screen}</div>
                {!selectedTrip && <BottomNav activeTab={activeTab} onChange={setActiveTab} alertCount={attentionCount} oncallAvailable={oncallAvailableForMe} />}
                <SosModal open={sosOpen} onClose={() => setSosOpen(false)} onSubmit={submitSos} />
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
